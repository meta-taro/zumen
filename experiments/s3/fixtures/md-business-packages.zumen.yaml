version: 1
title: md-business のパッケージ構成

# 基準の図 その 2。**実在の構成**（`apps/*/package.json` と `packages/*/package.json` の
# @md-business/* 依存を読んで起こしたもの）。架空の綺麗な例で測らない（Issue 003）。
#
# その 1（zumen）より 1 段大きい図を置くのは、**規模で指標が壊れないか**を見るため。

groups:
  - id: apps
    label: apps
  - id: packages
    label: packages

nodes:
  - id: desktop
    type: app
    label: desktop
    group: apps

  - id: chrome-extension
    type: app
    label: chrome-extension
    group: apps

  - id: google-workspace-addon
    type: app
    label: google-workspace-addon
    group: apps

  - id: core
    type: package
    label: core
    group: packages

  - id: data-tree
    type: package
    label: data-tree
    group: packages

  - id: mcp-server
    type: package
    label: mcp-server
    group: packages

  - id: renderer-pdf
    type: package
    label: renderer-pdf
    group: packages

  - id: schema-api-spec
    type: package
    label: schema-api-spec
    group: packages

  - id: schema-db-spec
    type: package
    label: schema-db-spec
    group: packages

  - id: schema-investigation
    type: package
    label: schema-investigation
    group: packages

  - id: schema-invoice
    type: package
    label: schema-invoice
    group: packages

  - id: schema-nosql-db-spec
