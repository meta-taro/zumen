    label: 殻（Tauri / Rust）
  - id: ui
    label: 画面（WebView）
  - id: core
    label: 中核（TypeScript）
nodes:
  - id: tauri-shell
    type: server
    label: Tauri 殻（Rust）
    group: shell
  - id: cmd-read
    type: generic
    label: read_document コマンド
    group: shell
  - id: cmd-write
    type: generic
    label: write_document コマンド
    group: shell
  - id: dialog-plugin
    type: generic
    label: dialog プラグイン（ファイル選択）
    group: shell
  - id: webview
    type: generic
    label: WebView
    group: ui
  - id: svelte-app
    type: generic
    label: Svelte 画面
    group: ui
  - id: vite
    type: generic
    label: Vite（バンドル）
    group: ui
  - id: doc-io
    type: generic
    label: 正本の読み書き
    group: core
  - id: layout
    type: generic
    label: 自動レイアウト（elkjs）
    group: core
  - id: render
    type: generic
    label: SVG 描画
    group: core
  - id: merge
    type: generic
    label: マージ
    group: core
  - id: validate
    type: generic
    label: 検証
    group: core
