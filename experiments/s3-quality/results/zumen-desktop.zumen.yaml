    to: layout
    label: 呼び出し
  - from: svelte-app
    to: render
    label: 呼び出し
  - from: svelte-app
    to: merge
    label: 呼び出し
  - from: svelte-app
    to: validate
    label: 呼び出し
  - from: doc-io
    to: cmd-read
    label: 読み込み要求
  - from: doc-io
    to: cmd-write
    label: 書き込み要求
  - from: svelte-app
    to: dialog-plugin
    label: ファイル選択
