version: 1
title: 本番構成

# 人が直した分。AI はこの節を書かない。
# S1 では、これが再生成で消えないかを測る。
pins:
  db:
    position: { x: 660, y: 300 }
    appearance: primary
  monitor:
    position: { x: 260, y: 90 }
    label: 監視（Zabbix）
  web01:
    position: { x: 460, y: 200 }
  internet:
    position: { x: 80, y: 300 }
  lb:
    position: { x: 260, y: 300 }
  web02:
    position: { x: 460, y: 400 }
  cache:
    position: { x: 660, y: 90 }
  replica:
    position: { x: 860, y: 300 }
  backup:
    position: { x: 1060, y: 300 }

groups:
  - id: vpc
    label: Production VPC

nodes:
  - id: internet
    type: internet
    label: Internet

  - id: lb
    type: load-balancer
    label: Load Balancer
    group: vpc

  - id: web01
    type: server
    label: Web 01
    technology: Apache
    group: vpc

  - id: web02
    type: server
    label: Web 02
    technology: Apache
    group: vpc

  # 監視は本番と同じ VPC に置く。外へ出すと踏み台が要る。
  - id: monitor
    type: server
    label: Monitoring
    group: vpc

  # キャッシュは Web と同じ VPC 内。外から直接触らせない。
  - id: cache
    type: cache
    label: Redis
    technology: Redis
    group: vpc

  - id: db
    type: database
    label: MariaDB
    group: vpc

  - id: replica
    type: database
    label: MariaDB Replica
    group: vpc

  - id: backup
    type: storage
    label: Backup Storage

edges:
  - from: internet
    to: lb
    protocol: HTTPS

  - from: lb
    to: web01

  - from: lb
    to: web02

  - from: web01
    to: cache

  - from: web02
    to: cache

  - from: web01
    to: db

  - from: web02
    to: db

  - from: db
    to: replica
    label: replication

  - from: replica
    to: backup

  - from: monitor
    to: web01
