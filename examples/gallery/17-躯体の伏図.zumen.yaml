version: 1
kind: placement
title: 2 階 床伏図（RC 造）
# **伏図は「上から見下ろして、その階の床を描く」図。**
# 2 階床伏図なら、**描いてあるのは 1 階と 2 階の間**にある梁と柱。
# 見えている床板ではなく、その下の骨を描く。
#
# ## 柱の符号は、階をまたいで同じ
#
# C1 は 1 階も 2 階も C1。**通し番号ではなく種類の名前**なので、
# 同じ断面の柱はどこにあっても同じ符号になる。
#
# ## 大梁と小梁を分けて描く
#
# 大梁（G）は柱と柱をつなぎ、小梁（B）は大梁と大梁をつなぐ。
# **荷重の行き先が違う**ので、同じ「梁」でも別の記号にする。
# 1 px = 20 mm。柱芯の間隔 180px が 1 スパン 3,600mm になる。
# **柱・梁の幅も同じ縮尺で描く**（C1 700 = 35px、G 400 = 20px、B1 300 = 15px）。
# 2026-09-29 まで柱を 1,120mm 角で描いていて、表の 700×700 と合っていなかった。
#
# X2 の小梁 B1 は、北の G1 と南の G1 をつなぐ（大梁から大梁へ）。
# ここに柱を立てると、B1 は柱に取り付く梁＝大梁になり、上の定義と食い違う
# ので、X2 の南に置いていた柱 C2 を外した（南の G1 は X1〜X3 の 1 本）。
