# **The access aisle is not spare tarmac.** It is where the ramp comes down,
# which is why it is striped, kept clear, and drawn at a size —— 5 ft beside a
# stall, 8 ft if the van space is the 8 ft kind.
#
# Accessible stalls go **on the shortest accessible route to the door**, and a
# pair can share one aisle, which is why they are drawn together.
#
# Counts and dimensions follow the 2010 ADA Standards; the lot is fictional.
