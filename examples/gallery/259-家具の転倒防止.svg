<g data-name="why2"><text x="480" y="834" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">重い本を下へ入れるだけで、1.5 倍粘る。</text><text x="480" y="848" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">震度 5 強がだいたい 250〜400 gal、震度 6 強で 600〜1,000 gal ——</text><text x="480" y="862" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">どのみち固定しないと足りない。</text></g>
<g data-name="why3"><text x="1030" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">石膏ボードにビスを打っても、地震では抜ける。</text><text x="1030" y="460" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">下地センサーで間柱を探し、そこへ届く長さのビスを使う。</text><text x="1030" y="474" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">金具は家具 1 点につき両端に 2 個以上。</text></g>
<g data-name="why4"><text x="1030" y="710" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">上下の家具は、まず互いを連結する。 そのうえで上を壁へ。</text><text x="1030" y="724" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">どちらか片方だけを留めると、留めていない側が動いて、</text><text x="1030" y="738" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">結局まとまって倒れる。</text></g>
<g data-name="eq"><text x="460" y="604" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">倒れ始めるのは　m·a·h ＞ m·g·(d/2)　のとき。両辺の m が消えるので、</text><text x="460" y="618" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">重さは関係ない。 a / g ＝ (d ÷ 2) ÷ h —— 奥行と重心の高さだけで決まる。</text></g>
<g data-name="r1"><text x="150" y="913" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">倒れ始める条件に、重さは入りません（①）。両辺の m が消えるので、奥行と重心の高さだけで決まります。</text></g>
<g data-name="r2"><text x="150" y="937" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">a / g ＝ (奥行 ÷ 2) ÷ 重心の高さ。 浅くて高い家具ほど、小さな揺れで倒れます。</text></g>
<g data-name="r3"><text x="150" y="961" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">奥行 300mm・重心 900mm の本棚は 163 gal で倒れ始めます（②）。震度 5 強で、もう届きます。</text></g>
<g data-name="r4"><text x="150" y="985" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">重い本を下へ入れるだけで 237 gal まで粘ります。 1.5 倍ですが、震度 6 強には届きません。</text></g>
<g data-name="r5"><text x="150" y="1009" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">だから、どのみち固定が要ります。 中身の置き方は、固定の代わりにはなりません。</text></g>
<g data-name="r6"><text x="150" y="1033" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">留める先は壁板ではなく下地です（③）。石膏ボードにビスを打っても、地震では抜けます。間柱の間隔は 455mm が基本です。</text></g>
<g data-name="r7"><text x="150" y="1057" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">上下に分かれた家具は、まず互いを連結します（④）。上だけ留めると、下がずれて前へ出ます。</text></g>
<g data-name="h694"><text x="480" y="710" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">3 段（300 / 900 / 1,500mm）に何を置くか</text></g>
<g data-name="t1"><text x="150" y="164" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">① 倒れ始める条件は、てこで決まる</text></g>
<g data-name="t2"><text x="150" y="674" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">② 奥行 300mm の本棚（高さ 1,800）で、中身を入れ替える</text></g>
<g data-name="h546"><text x="1030" y="562" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">効かない留め方</text></g>
<g data-name="ngN"><text x="1020" y="355" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">ここはボードだけ。効かない</text></g>
<g data-name="t3"><text x="820" y="164" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">③ 留める先は、壁板ではなく下地</text></g>
<g data-name="t4"><text x="820" y="530" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">④ 留めたつもりになりやすい所</text></g>
<g data-name="y718"><text x="446" y="734" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">重心 900mm → 163 gal で倒れ始める</text></g>
<g data-name="y742"><text x="446" y="758" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">重心 620mm → 237 gal</text></g>
<g data-name="y766"><text x="446" y="782" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">重心 1,180mm → 125 gal</text></g>
<g data-name="pitchN"><text x="1020" y="399" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">間柱の間隔 455mm（尺モジュール）</text></g>
<g data-name="y570"><text x="996" y="586" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">上だけ留めると、下がずれて前へ出る</text></g>
<g data-name="y594"><text x="996" y="610" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">片側だけだと、そこを軸に回る</text></g>
<g data-name="y618"><text x="996" y="634" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">下地まで届かず、ボードごと抜ける</text></g>
<g data-name="y642"><text x="996" y="658" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">天井が弱いと、天井を壊して外れる</text></g>
<g data-name="x718"><text x="320" y="734" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">均等　20 / 20 / 20 kg</text></g>
<g data-name="x742"><text x="320" y="758" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">下へ寄せる　36 / 16 / 8</text></g>
