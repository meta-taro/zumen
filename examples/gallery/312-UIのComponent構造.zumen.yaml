version: 1
direction: down
wrap: false
title: UI の Component 構造（木ではなく、網になる）
# **画面ごとに木を描くと、同じ Component が何度も出てくる。**
# 実際には 1 つの Component が**複数の画面から使われる**ので、
# 構造は**木ではなく網**（同じ節に、親が何本も刺さる）。
# ここを木として描くと、**どれが共通でどれが専用かが図から消える。**
#
# **共通か専用かは、親の数を数えれば分かる。**
# 親が 2 本以上刺さっている節が共通の Component ——
# 直すと**刺さっている画面ぜんぶに効く**ので、直す前にここを見る。
# 親が 1 本だけなら、その画面だけの都合で変えてよい。
#
# **これが「完成 UI ではなく構造を残す」ということ**（`.claude/rules/UIワイヤーフレームの方針.md` §11）。
# 見た目は何度でも作り直されるが、**画面と Component と、その関係は残る。**
# この図を正として「React / Vue / Flutter で実装してください」と渡せる。
#
# **Responsive で変わるのは、この図の形ではない。**
# Sidebar が Drawer になっても、**使っている Component は同じ** ——
# 変わるのは**置き方**で、それは見本 76（管理画面のレスポンシブ構造）の側の話。
#
# **見本 74・75・76・85・86・87・88 と対。** あちらは画面の絵、こちらは部品の関係。
