title: 外来の流れ
# **外来の図で見るのは、患者が何回「待つ」か。**
# 受付 → 待合 → 診察 → 検査 → 待合 → 会計。
# **待合に戻る回数**が、体感の待ち時間を決める。
#
# ## 電子カルテは動線ではない
#
# 患者は動かないが、情報だけが先に動く。
# **人の動線と情報の流れを重ねて描く**と、「カルテが届いていないから呼べない」が見える。
#
# ## 処方せんで外へ出る
#
# 院外薬局は建物の外なので、**そこから先は病院の動線ではない。**
# 図の終わりをどこにするかは、責任の切れ目をどこに置くかと同じ。
