title: 土俵（数はどれも、体の大きさから出ている）
# **勝負俵は直径 4.55m（15 尺）、16 俵で組む。**
# その外側、**一辺 6.7m（22 尺）の正方形**に土を盛ったものが土俵で、
# **地面から俵の上まで 60cm。** 落ちれば土俵下 —— 高さそのものが勝負の一部。
#
# **徳俵だけが、外へ出ている。** 東西南北に 1 俵ずつ、俵 1 本ぶん外へずらしてあり、
# **そこに足がかかっても残れる。**
#
# **俵の数は決まっている。** 勝負俵 16・徳俵 4・角俵は各辺 7 で計 28・
# あげ俵は四隅に 1 ずつで 4・踏み俵は東西南に 3 ずつと北に 1 で計 10・
# 水桶俵は南西と南東に計 4。
#
# **蛇の目は、判定の道具。** 勝負俵のまわりに円く撒いた砂で、
# **足が出たかどうかを足跡で見る。**
#
# **仕切り線は幅 6cm・長さ 90cm が 2 本、間隔 70cm。**
#
# **四色の房は、方角の目印。** 吊り屋根から下がる 4 本で、
# **青房＝東・青龍、赤房＝南・朱雀、白房＝西・白虎、黒房＝北・玄武。**
# 房は長さ 2.3m・太さ 70cm・重さ 25kg。水引幕は紫。
#
# 図は方角で描いた（上が北）。正面は南側。
