version: 1
kind: placement
arrows: true
title: 電子レンジの構造（加熱ムラの間隔は 6.1cm）
# **加熱ムラの間隔は、波長の半分 ＝ 6.1cm。箱の作りでは消せない。**
# 30 万 km/s ÷ 2,450MHz ＝ 波長 12.2cm。その半分が、腹と腹の間隔。
# だから**食品のほうを動かす** —— ターンテーブル、または電波をかき混ぜる撹拌翼。
#
# **電波はまっすぐ入れない。** マグネトロンから導波管を回して入れる
# （まっすぐ向けると、はね返った電波がマグネトロンを壊す）。
#
# **覗けるのに電波が出てこないのは、穴の大きさ。**
# 1〜2mm の穴は、波長 12.2cm の波にとっては**つながった金属の板**。
# 可視光は波長 0.0005mm 前後なので通れる。
#
# **温まるのは水。** 極が偏った分子が 1 秒に 24.5 億回向きを変えようとして、
# 隣とこすれる。器が熱いのは中身から伝わったから。
