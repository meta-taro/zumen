    retrieved: 2026-10-06
  - name: "国土交通省「鉄道に関する技術上の基準を定める省令の解釈基準」Ⅲ－1・Ⅲ－3・Ⅲ－4・Ⅲ－5・Ⅲ－10（Internet Archive 2023 年の写しで閲覧）"
