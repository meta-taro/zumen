# **線路は、上から レール → まくらぎ → 道床（バラスト） → 路盤 の 4 層。**
# 2 本のレールの間隔（軌間）が、JR の在来線は 1,067mm、新幹線は 1,435mm。
# 曲線では外側のレールを上げ（カント）、車体を内へ傾けて遠心力と釣り合わせる。
#
# ## 何のための図か
#
# 理解のための図。線路の断面の名前と、軌間とカントの数がどの決まりから来ているかを 1 枚で読む。
#
# ## 決まりの出どころ
#
# - **省令は性能で書いてある。** 軌間は「車両の安全な走行及び安定した走行を確保することができるもの」（第 12 条）、
#   カントは「車両の転覆の危険が生じないよう、軌間、曲線半径、運転速度等に応じた」もの（第 15 条）。数は書いていない
# - **数は解釈基準が示す。** 普通鉄道の軌間は 0.762・1.067・1.372・1.435m、新幹線は 1.435m（Ⅲ－1）。
#   カントは C＝GV²／127R を標準とし、C＝G²／6H 以下（Ⅲ－4）
# - 軌間の測り方は省令の定義どおり：**軌道中心線が直線の区間で、レール頭部間の最短距離**（第 2 条 4 号）。
#   だから寸法線はレール頭部の内側どうしに引いた
#
# ## 計算した所
#
# - 1,435 − 1,067 ＝ 368mm。中心をそろえると片側 184mm
# - カント：G＝1,067、V＝80km/h、R＝600m → 1,067×6,400／76,200 ＝ 89.6mm ≒ 90mm
# - 傾き：sin θ ＝ 90／1,067 → θ ≒ 4.8°（② はこの角度で、内軌の頭頂を中心に回して描いた）
# - 施工基面の拡大：y＝α·C ＝ 3.35×90 ≒ 302mm（1,067mm の α＝3.35）
#
# ## 描き方
#
# - 縮尺 1px＝6mm。**数で描いたのは軌間とカントだけ。** レールの形・まくらぎの長さと厚さ・道床と路盤の厚さ・
#   道床の肩幅と法勾配は、軌道構造の設計標準（解釈基準Ⅲ－12 が「鉄道構造物等設計標準（軌道構造）」に委ねている）を
#   読めていないので**模式**。図にも「模式」と書いた
# - 道床（砕石）は点、路盤は斜線、まくらぎとレールは塗り潰し（見本 43 の舗装構成と同じ割り当て）
# - 軌道中心線は一点鎖線
#
# ## 描かなかったもの
#
# - **スラブ軌道・直結軌道。** 新幹線に多いが、どの線区が何かを一次資料で確かめていない。① の 1,435mm もバラスト軌道で描いた
# - **建築限界・車両限界の輪郭。** 解釈基準の図表にあるが、輪郭の座標を読み取れていない
# - **レールの種類（50kgN・60kg など）とまくらぎの間隔。** 設計標準の数を確かめていない
# - **緩和曲線でのカントの逓減。** 断面では表せない（平面と縦断の話）
#
# 出典：鉄道に関する技術上の基準を定める省令（e-Gov、2026-10-06 取得）。同 解釈基準（国土交通省。原本の URL は 2026-10-06 に 404 で、
# Internet Archive の 2023 年の写しを読んだ）。
