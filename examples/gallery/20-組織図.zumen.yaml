version: 1
direction: down
title: 組織図（2026 年度）
# **組織図が示しているのは、指揮系統であって仕事の流れではない。**
# 線は「誰が誰に指示できるか」で、**仕事は線を無視して横に流れる。**
#
# ## 直轄には意味がある
#
# 監査室が代表取締役の直轄なのは、**監査される側の下に置けない**から。
# 内部監査は、指揮系統から外れていることが成立の条件になる。
#
# ## 並び順も情報
#
# 左から事業本部・管理本部と並べるのは慣習だが、
# **同じ段に並べた部署は対等**という意味になる。段をずらすと序列が生まれる。
#
# ## ただし、本部の中の左右は決められない
#
# この図は自動配置（`direction: down`）なので、**本部の中で部署がどの順に並ぶかは
# 機械が決める。** 正本の書き順（D-10 → D-20 → D-30）でも、辺の書き順でも変わらない
# （2026-09-24。`qa/品質100周` 第 23 周で、辺の順を逆にして実際に確かめた）。
#
# だから **開発部 → 営業部 → 製造部 という左右の並びに意味は無い。**
# 番号（D-10 / D-20 / D-30）が順序を持つ側で、**線の繋がりが親子を持つ側**。
# 意味のある並びが要るなら、`kind: placement` で座標を書く。
