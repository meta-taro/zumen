version: 1
kind: placement
arrows: true
title: 給湯器の号数（流量ではなく、熱量）
# **号数は「流量」ではなく「熱量」。**
# 1 号 ＝ **水温を 25℃ 上げた湯を、毎分 1L 出せる能力**
# ＝ 1 × 25 × 4.186 ÷ 60 ＝ **1.744 kW**（約 1,500 kcal/h）。
# 24 号なら 41.9 kW —— 家の中でいちばん大きな火。
#
# **出せる湯量 ＝ 号数 × 25 ÷ 上げ幅。**
# 同じ 24 号でも、夏（25→40℃）は 40L/分、冬（5→40℃）は 17.1L/分で、
# **2 倍以上ちがう。**
#
# **冬は 24 号でも同時使用がぎりぎり。** 水温 5℃ から 42℃ なら 16.2L/分で、
# シャワー 11 ＋ 台所 6 ＝ 17 には足りない。
#
# 春秋（15→40℃）の欄が、そのまま号数の数字になる ——
# 上げ幅がちょうど 25℃ だから。**号数の決め方そのもの。**
#
# 「給湯」と「追いだき」は別の回路。号数が効くのは給湯のほう。
