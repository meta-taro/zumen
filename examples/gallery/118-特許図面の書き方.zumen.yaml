version: 1
kind: placement
arrows: true
title: 特許図面の書き方（様式第 30／架空の「蓋付き容器」）
scale: { mm: 0.5 }
# **図面そのものに決まりがある図面。**
#
# ## 決まりは形ではなく、書き方にかかる
#
# **作図領域は横 170 mm × 縦 255 mm 以内**（A4 に収まる大きさ）。
# **黒色で鮮明に。着色してはいけない。**
# 実線は約 0.4 mm、引出線は約 0.2 mm、点線・鎖線は約 0.2 mm。
#
# ## 符号は明細書と結び付く
#
# 符号は**アラビア数字**で、大きさは**約 5 mm 平方**、**引出線を引いて付ける。**
# **同じ部分には同じ符号。** 用語は**明細書・特許請求の範囲と同じ語**を使う。
#
# **文字は、図中のいずれの線にも掛からないように書く。**
#
# ## 切断面
#
# **平行斜線を引く。** 異なる部分には、方向を変えた平行斜線を引く
# （それができないときは間隔を変える）。
