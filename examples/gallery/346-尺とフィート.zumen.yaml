version: 1
kind: placement
arrows: false
title: 尺とフィート（ほぼ同じだが、違う）
scale: { mm: 1.2 }
# **1 尺 ＝ 303.03mm、1 フィート ＝ 304.80mm。差は 1.77mm（0.58%）。**
#
# どちらも「だいたい 30cm」だが、**同じではない**。
# 1 本だけ見ても分からず、**並べて端をそろえると、反対側がずれる。**
#
# ## 両方とも、法で 1 つの数に決まっている
#
# | | |
# |---|---|
# | 1 インチ | **25.4mm ちょうど**（1959 年 国際ヤード・ポンド協定）|
# | 1 フィート | 12 インチ ＝ **304.8mm ちょうど** |
# | 1 ヤード | 3 フィート ＝ 914.4mm ちょうど |
# | **1 尺** | **10/33 m ちょうど**（計量法）＝ 303.0303…mm |
#
# **尺は割り切れない。** メートルを 33 で割った 10 倍という決め方なので、
# 小数では終わらない。フィートのほうは 25.4 の 12 倍で、ちょうど終わる。
#
# ## 積むと効いてくる
#
# 0.58% は 1 本なら 1.77mm だが、**10 本で 17.7mm、30 本で 53mm**。
# 京間の畳の長辺は 6 尺 3 寸（1,909.1mm）—— これをフィートで測ると 6.26 フィート。
#
# この図は **1px ＝ 0.833mm の実寸**（`scale`）。定規を当てれば確かめられる。
