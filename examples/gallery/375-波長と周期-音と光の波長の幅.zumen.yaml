# **波の 4 つの量 —— 波長・振幅・周期・振動数 —— と、その関係 v ＝ fλ を 1 枚で。** 下半分で、**音と光の波長を同じ物差し**に載せる。
# **何のための図か：** 中学・高校の理科で混ざりやすい所（振幅を山から谷で測る、波形のグラフと揺れのグラフを取り違える）を、絵の上で分けて見せる。
#
# ## 2 つのグラフを並べた理由
#
# ① は**ある瞬間に波全体を写した形**（y–x）、② は**ある 1 点が時間とともに揺れる様子**（y–t）。
# 同じ正弦の形をしているが、① の横幅は**長さ**で波長が、② の横幅は**時間**で周期が読める。
# 高校物理の教科書も、この 2 つを並べて区別させている。
#
# ## 数の確かめ（計算）
#
# - 20℃ の空気の音速 343 m/s。λ ＝ v ÷ f で 20 Hz → 17.2 m、440 Hz → 0.780 m、20,000 Hz → 17.2 mm
# - 光の速さは定義で 299,792,458 m/s。550 nm → 545 THz、750 nm → 400 THz、380 nm → 789 THz
# - 17.15 mm ÷ 750 nm ＝ 22,867 → 「約 2 万 3 千倍」
# - ④ は 1 けた ＝ 120px の対数目盛り。帯の端は log10 で置いた
#
# ## 照らした決まり
#
# - **振幅は中心から山まで**（OpenStax §13.2「resting position と maximum displacement の距離」）。山から谷は 2A
# - **波長は隣り合う同じ位相の点の間**（山〜山・谷〜谷）
# - 可視光の端は資料によって 380〜750、380〜780、360〜830 と違う。ここは引いた資料の **380〜750 nm** を使い、「色の境目は決まっていない」と表に書いた
# - マルハナバチの長い側の限りは約 590 nm（Skorupski & Chittka 2010 を引く en.wikipedia「Visible spectrum」）。短い側は紫外まで見えるが、何 nm までかはこの図では数で書いていない
#
# ## 描かなかったもの（理由）
#
# - **縦波の疎密の絵**: 音は空気の縦波だが、グラフは変位を縦にとって描くのが決まり。疎密の絵は別の図にする
# - **電磁波の全体（電波・X 線）**: 音と光の比べに絞った。物差しを伸ばすと帯が細くなって読めない
# - **色の境目の数**: 何 nm から何色かは決まった値が無いので、紫と赤の向きだけ書いた
# - **光の帯の色**: 帯は 1 色で塗った。波長ごとの色を塗ると、画面や印刷で色がずれて「その色」と誤読される
#
# 出典（2026-10-06 取得）：
#   OpenStax Physics §13.2（振幅・振動数・周期・波長・v ＝ fλ の定義）
#   en.wikipedia「Speed of sound」「Hearing range」「Visible spectrum」
#   Skorupski P., Chittka L. (2010) PLOS ONE 5(8): e12049
