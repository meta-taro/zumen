title: 特許の手続（出願から登録まで、期限つき）
# **特許の手続は、期限の並びでできている。**
# どの箱も「次に何をするか」ではなく**「いつまでに何をしないと終わるか」**で決まる ——
# 期限を落とすと、内容がどれだけ良くても権利にならない。
#
# **出願しただけでは審査されない。** 出願から **3 年以内に審査請求**をしないと、
# その出願は**取り下げたものとみなされる**（出願しっぱなしは、放棄と同じ）。
#
# **出願から 1 年 6 か月で公開される。** 審査請求をしていなくても、
# 権利になっていなくても、**中身は世の中に出る** ——
# 「出願したが権利にならなかった」発明も、公開公報として残る。
#
# **拒絶理由通知は、終わりではなく往復の始まり。**
# 指定された期間内に**意見書**（反論）と**補正書**（請求項の書き直し）を出せる。
# ここで決着しなければ**拒絶査定**になるが、そこからさらに
# **拒絶査定不服審判**を、謄本の送達から **3 か月以内**に請求できる（特許法 121 条 1 項）。
#
# **特許査定は、まだ権利ではない。**
# 謄本の送達から **30 日以内**に第 1 年から第 3 年分の特許料を**一時に納付**して、
# **設定登録**されて初めて特許権が発生する ——
# 納めなければ出願は却下され、**査定を受け取ったのに権利にならない。**
#
# **分割出願は、この図の抜け道。** 最初の拒絶理由通知から **3 か月**（2020 年の改正で
# 30 日から広がった）、特許査定の謄本送達から **30 日**のあいだに、
# 中身を分けて別の出願にできる。
