title: ドーム公演の PA 断面（ラインアレイの開き角と、音が届く範囲）
sources:
  - name: "株式会社東京ドーム「東京ドームについて」（施設概要）"
    url: "https://www.tokyo-dome.co.jp/dome/about/"
    retrieved: 2026-10-06
  - name: "JIS C 5532:2014 音響システム用スピーカ（附属書 C「柱（線）状スピーカシステム」・20.1 特性感度）"
# **縦に切ると、PA は「どこへ向けるか」の図になる。**
#
# 平面の PA 配置図（見本 101）は、スピーカーの位置と遅らせる量を言った。
# この図は**断面**で、ラインアレイの箱 1 台ずつの向きと、それが床のどこへ届くかを言う。
# 照明の仕込図（見本 369）と**同じ公演・同じ会場**（ステージ端から本塁まで 88m、FOH はステージ端から 35m）。
#
# ## ラインアレイ
#
# JIS C 5532:2014 は「柱（線）状スピーカシステム」を「指向性をもつように、複数個のスピーカを直線状に配置した
# スピーカシステム」と定めている。箱は前の角どうしを留め、後ろの開きで角度を付ける。
# **下の箱ほど下を向くので、列は客席に向かって凸の曲線になる**（下の端は奥へ巻く）。
#
# 箱の角度（水平から下向き）は 12・12.5・13・14・15・16・17.5・19・21・23・26・29・33・38・44・52°。
# 1 番の軸は 87.6m 先、16 番は 8.8m 先で耳の高さ（1.2m）に届く（計算）。
#
# ## 落ち方
#
# 点音源は距離が 2 倍で −6dB（20 log 2）。線音源は近い所で −3dB（10 log 2）。
# ラインアレイが遠くまで揃って届くのはこのため —— ただし「近い所」の範囲は周波数と列の長さで変わる。
# 特性感度は 1W・1m の音圧で決める（JIS C 5532:2014 の 20.1）。この図は**差だけ**を書き、dB の絶対値は書いていない。
#
# ## ディレイ
#
# 遅らせる量 ＝ メインの中心（ステージ端の 0.9m 奥・+17.5m）からディレイの前面（51.0m・+7.25m）までの距離 52.9m ÷ 343.5m/s ＝ 154ms。
# 音速は c ＝ 331.5 ＋ 0.6 × 気温（℃）、20℃ で 343.5m/s。
# 先に届いたほうから聞こえるので、計算値に少し足す話は見本 101。
#
# ## 会場
#
# 屋根の最高部はグラウンド面から 61.690m（公表値）。屋根は空気膜構造。
# 屋根の形・スタンドの形は公表されていないので描いていない（最高部の高さだけを線で示した）。
#
# ## 架空のところ
#
# 公演・ステージの大きさ・吊り高さ・箱の数と角度・ディレイの位置は**架空**。
# メイン L・R は CL の左右に吊るので、この断面（CL で切った）には**投影**して描いた。
# 吊りの塔も左右にあり、断面には描いていない。
#
# ## 描かなかったもの
#
# - 製品名・型番と、dB の絶対値 —— 機種で変わり、架空の数字は害になる
# - 周波数ごとの指向性 —— 低音ほど広がる。1 枚の扇では言えない
# - 屋根からの反射の時間 —— 膜の形が分からないので計算できない
# - 吊り荷重 —— 構造の計算が要る
#
# 平面の PA 配置は見本 101、照明は見本 369、ホールの反射は見本 205、ミキサーは見本 343。
