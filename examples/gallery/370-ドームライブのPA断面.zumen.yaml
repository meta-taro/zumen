  - id: n0
    label: "PA の断面は、スピーカーがどこを向き、どこまで届くかを決める図。平面（見本 101）では高さが言えない。"
    marker: none
    align: left
    at: { x: 1100, y: 640 }
    size: { w: 880, h: 18 }
  - id: n1
    label: "ラインアレイは箱を縦に吊り、箱ごとに下向きの角度を変える。上の箱は遠く、下の箱は手前を受け持つ。"
    marker: none
    align: left
    at: { x: 1100, y: 666 }
    size: { w: 880, h: 18 }
  - id: n2
    label: "1 台の箱（点音源）は距離が 2 倍で −6dB。縦に並べた列（線音源）は、近い所では −3dB で済む。"
    marker: none
    align: left
    at: { x: 1100, y: 692 }
    size: { w: 880, h: 18 }
  - id: n3
    label: "それでも後ろは足りない。だから途中にディレイを立て、メインが届いた時刻に合わせて遅らせて鳴らす。"
    marker: none
    align: left
    at: { x: 1100, y: 718 }
    size: { w: 880, h: 18 }
  - id: n4
    label: "遅らせる量 ＝ メインからディレイまでの距離 ÷ 音速。52.9m ÷ 343.5m/s（20℃）＝ 154ms。"
    marker: none
    align: left
    at: { x: 1100, y: 744 }
    size: { w: 880, h: 18 }
  - id: n5
    label: "上の箱を上へ向けすぎると、膜の屋根で返った音が遅れて届く。いちばん上の箱も床（本塁）に向けた。"
    marker: none
    align: left
    at: { x: 1100, y: 770 }
    size: { w: 880, h: 18 }
  - id: n6
    label: "ステージの縁で、メインの真下は抜ける。そこをフロントフィルが埋める。モニターは演者の方を向く。"
    marker: none
    align: left
    at: { x: 1100, y: 796 }
    size: { w: 880, h: 18 }
  - id: n7
    label: "FOH はメインが届く範囲の中に置く —— 混ぜる人は、客と同じ音を聞いて決める。"
    marker: none
    align: left
    at: { x: 1100, y: 822 }
    size: { w: 880, h: 18 }
