kind: placement
arrows: true
title: ピアノのアクション（脱進）
# **ハンマーは、最後は誰も押していない。**
#
# 弦に当たる直前にジャックが外れ（脱進）、**ハンマーは自由に飛んで弦を打つ**。
# だから押し続けても弦に押し付けられず、**指が決められるのはハンマーの速さだけ**。
#
# 外れるのは弦の 2〜3mm 手前（レットオフ）。ここが狂うと、音が出ないか二度打ちする。
# 寸法と比は模式。
