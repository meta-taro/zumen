title: 災害対策本部と、報告の経路
# **大きいものは、県と国へ同時に出す。**
#
# ふだんは 現場 → 市町村 → 都道府県 → 消防庁 だが、
# **直接即報基準に当たるものは県と国へ同時**（中継を待つと遅れるため）。
# **第一報は覚知から 30 分以内が目安** —— 分かっていることだけ出し、続報で足す。
#
# **指揮は 1 本、情報は 1 か所。**
# 1 人が 2 か所から指示を受けると、どちらを先にするかを現場が決めることになる。
# 情報がばらばらだと、同じ現場へ 2 隊出す。
#
# 班の編成は自治体ごとに違う（この図は例）。
