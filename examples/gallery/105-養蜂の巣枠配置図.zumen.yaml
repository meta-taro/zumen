version: 1
kind: placement
arrows: false
scale: { mm: 1 }
title: 養蜂の巣枠配置図（ラングストロス式・標準枠 10 枚）
# 1 px = 1 mm。**どの枠に何が入っているか**の図。内検のたびに書き換える。
#
# ## 並べ替えてはいけない
#
# **中央が育児、外が貯蜜。** 蜂は真ん中を温めているので、
# 枠を並べ替えると**育児が冷える。** 抜いて見たら、元の場所へ戻す。
#
# ## 隔王板がなぜ要るか
#
# **女王は通れず、働き蜂は通れる。** 継箱に卵が産まれないので、
# 採蜜のときに幼虫を潰さずに済む。
#
# ## 王台は分蜂の合図
#
# 見つけたら**群の半分が出ていく準備**が始まっている。
# 10 枚のうち 8 枚が埋まったら継箱を足す —— 混むと分蜂する。
