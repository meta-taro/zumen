version: 1
kind: placement
arrows: true
title: 分子の形（VSEPR ——電子対は離れたがる）
# **中心の原子のまわりの電子対が、できるだけ離れようとする。それだけで形が決まる。**
# 原子価殻電子対反発則（VSEPR）。結合に使っている電子対と、
# **使っていない電子対（孤立電子対）を同じように数える**のがこの規則の要。
#
# ## 同じ四面体の骨組みから、3 つの形が出る
#
# **CH4 は 109.5°、NH3 は 107°、H2O は 104.5°。**
# どれも電子対は 4 つで、骨組みは同じ四面体。違うのは
# **そのうち何個が結合で、何個が孤立電子対か**だけ。
#
# ## なぜ孤立電子対があると狭くなるか
#
# **孤立電子対は、中心原子の正の電荷に近いところにある。**
# だから反発が強い —— 孤立－孤立 ＞ 孤立－結合 ＞ 結合－結合。
# **強いほうが弱いほうを押す**ので、結合どうしの角は理想値より狭くなる。
# 109.5° → 107° → 104.5° の 2.5° と 2.5° が、押された分。
#
# ## 形の名前は「原子の位置」で呼ぶ
#
# NH3 を三角錐形と呼ぶのは、**孤立電子対を形の頂点に数えないから。**
# 電子対の並びは四面体だが、**見える形（原子の並び）は錐**になる。
# H2O も同じで、電子対は四面体、原子は折れ線。
#
# 周期表の形と電子配置は見本 233。
