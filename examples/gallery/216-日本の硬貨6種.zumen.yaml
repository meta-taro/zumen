version: 1
kind: placement
arrows: true
title: 日本の通常貨幣 6 種 —— 大きさ・穴・ギザ
scale: { mm: 200 }
# **大きさの順と、額面の順は一致しない**（1 < 50 < 5 < 100 < 10 < 500）。
#
# 手で見分ける順は「穴 → ギザ → 大きさ・重さ」。
# 穴があるのは 5 円と 50 円だけで、その 2 つはギザで分かれる。
#
# 素材・直径・量目は財務省「通常貨幣一覧」。
# **ギザの数は公表されていない**（偽造防止のため。造幣局）。
#
# **同じ題材で、見本 300 もある。** こちらは素材・直径・量目と「手で見分ける順」、
# 300 は「価値・大きさ・重さの 3 つの順番が、どれも一致しない」ことを扱う。

