    at: { x: 790, y: 990 }
    size: { w: 200, h: 34 }
  - id: a1
    label: "1 円（1.00g）"
    at: { x: 790, y: 1030 }
    size: { w: 200, h: 34 }
  - id: a10
    label: "10 円（4.50g）"
    at: { x: 790, y: 1070 }
    size: { w: 200, h: 34 }
  - id: r1
    label: "日本の硬貨は、手で見分けられるように作られています。 穴・ギザ・大きさ・重さの組み合わせです。"
    marker: none
    align: left
    at: { x: 150, y: 1126 }
    size: { w: 1000, h: 18 }
  - id: r2
    label: "大きさの順と、額面の順は一致しません（1 < 50 < 5 < 100 < 10 < 500）—— 大きさだけでは決まりません。"
    marker: none
    align: left
    at: { x: 150, y: 1149 }
    size: { w: 1000, h: 18 }
  - id: r3
    label: "先に効くのは穴です。 穴があるのは 5 円と 50 円の 2 つだけで、その 2 つはギザで分かれます（50 円にギザ）。"
    marker: none
    align: left
    at: { x: 150, y: 1172 }
    size: { w: 1000, h: 18 }
  - id: r4
    label: "次がギザ。 穴がなくギザがあるのは 100 円と 500 円で、この 2 つは 3.9mm も違います（22.6 と 26.5）。"
    marker: none
    align: left
    at: { x: 150, y: 1195 }
    size: { w: 1000, h: 18 }
  - id: r5
    label: "残った 1 円と 10 円は、重さが 4.5 倍違います（1.00g と 4.50g）—— 大きさの差 3.5mm より、手には分かりやすい。"
    marker: none
    align: left
    at: { x: 150, y: 1218 }
    size: { w: 1000, h: 18 }
  - id: r6
    label: "ギザの数は公表されていません。 偽造防止のためです（造幣局）。500 円の「異形斜めギザ」も同じ目的です。"
    marker: none
    align: left
    at: { x: 150, y: 1241 }
    size: { w: 1000, h: 18 }
  - id: r7
    label: "10 円は昭和 26〜33 年のものにギザがあります（「ギザ十」）。いま作られているものは平滑です。"
    marker: none
    align: left
    at: { x: 150, y: 1264 }
    size: { w: 1000, h: 18 }
