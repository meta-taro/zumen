version: 1
kind: placement
arrows: true
title: 下水処理の流れ（標準活性汚泥法）
# **汚れを消しているのではない。微生物に食べさせて、沈めて、別の場所へ運んでいる。**
#
# ## 水の道は 6 つ
#
# 管渠・ポンプ場 → 沈砂池（砂と大きなごみ）→ 最初沈殿池（沈む有機物）→
# **反応タンク（曝気。6〜8 時間）**→ 最終沈殿池（活性汚泥を沈める）→ 消毒して放流。
#
# ## 1 本だけ戻る線がある
#
# **返送汚泥。** 最終沈殿池で沈めた活性汚泥を、反応タンクへ戻す。
# **微生物そのものが装置**なので、捨てずに戻さないと次の水を処理できない。
# 増えた分だけが**余剰汚泥**として抜かれ、汚泥の道
# （濃縮 → 消化 → 脱水 → 焼却・溶融・炭化）へ入る。
#
# ## この図を構成図で描こうとして、やめた
#
# **戻る線が、機械の並べ方を壊した**（決まり 33）。
# 最終沈殿池が反応タンクより前の段へ引かれ、
# **水の道が沈砂池 → 最初沈殿池 → 濃縮（汚泥の道）と読める絵**になった。
# 折り返しても、groups を外しても直らない。
# **戻る線が主役の図は、置き場所を自分で書くほうが速い。**
#
# ## 合流式と分流式
#
# **合流式**は雨水と汚水を同じ管で流す。工費が安く、雨で管の中が自然に洗われるが、
# 晴れた日は流れが遅くて沈殿物がたまり、大雨のときは処理しきれない分を
# 未処理または簡易処理のまま放流する（**合流式下水道越流水 ＝ CSO**）。
# **分流式**は別の管に分ける。流量も水質も安定するが、
# 汚水管は細いので**人が入れず、清掃や点検がしにくい。**
#
# ## 数
#
# 令和 6 年度末の**下水道処理人口普及率は 81.8%**。
# 浄化槽なども足した汚水処理人口普及率は 94.0%
# （下水道 82.2%・浄化槽 9.5%・農業集落排水など 2.2%）。
#
# 上水の側は見本 306。
