<g data-name="h"><text x="260" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">被相続人　甲野太郎</text><text x="260" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f0f13">出生 昭和 24 年 3 月 5 日／死亡 令和 8 年 4 月 1 日</text></g>
<g data-name="c3"><text x="890" y="325" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">二男　甲野三郎　（被代襲者）</text><text x="890" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a0a0ab">出生 昭和 57 年 11 月 3 日／死亡 令和 6 年 9 月 8 日</text></g>
<g data-name="w"><text x="710" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">妻　甲野花子　（相続）</text><text x="710" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a0a0ab">出生 昭和 27 年 8 月 12 日</text></g>
<g data-name="c1"><text x="200" y="325" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">長男　甲野一郎　（分割）</text><text x="200" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a0a0ab">出生 昭和 52 年 1 月 9 日</text></g>
<g data-name="c2"><text x="510" y="325" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">長女　乙川夏子　（相続放棄）</text><text x="510" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a0a0ab">出生 昭和 54 年 6 月 20 日</text></g>
<g data-name="note"><text x="60" y="740" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">相続を証する書面は別に添える。この図は関係を示すもので、これだけでは登記できない。</text></g>
<g data-name="g"><text x="890" y="485" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">孫　甲野孫太　（代襲者・相続）</text><text x="890" y="500" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a0a0ab">出生 平成 22 年 2 月 14 日</text></g>
<g data-name="lg3"><text x="60" y="682" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・（被代襲者）（代襲者）＝子が先に死亡した場合。被代襲者の死亡年月日を必ず書く</text></g>
<g data-name="lg2"><text x="60" y="656" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・（相続放棄）＝放棄した人も省かない。省くと相続人の範囲が戸籍と合わない</text></g>
<g data-name="t_koseki"><text x="60" y="76" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">最後の本籍　東京都千代田区霞が関一丁目 1 番地</text></g>
<g data-name="t_jusho"><text x="60" y="102" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">最後の住所　東京都千代田区霞が関一丁目 1 番 1 号</text></g>
<g data-name="t_toki"><text x="60" y="128" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">登記簿上の住所　東京都千代田区霞が関一丁目 1 番 1 号</text></g>
<g data-name="lg1"><text x="60" y="630" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・（相続）（分割）＝この人が不動産を取る。書かないと補正になる</text></g>
<g data-name="w_j"><text x="750" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">住所　東京都千代田区霞が関一丁目 1 番 1 号</text></g>
<g data-name="lg4"><text x="60" y="708" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・氏名・生年月日・住所・本籍は、戸籍と一字一句同じにする</text></g>
<g data-name="g_a"><text x="920" y="448" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">住所　埼玉県さいたま市浦和区高砂三丁目 6 番 7 号</text></g>
<g data-name="lg0"><text x="60" y="604" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・二重線＝婚姻。親子は単線（線そのものが記法）</text></g>
<g data-name="c1_a"><text x="210" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">住所　神奈川県横浜市中区本町一丁目 2 番 3 号</text></g>
<g data-name="c2_a"><text x="540" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">住所　千葉県千葉市中央区中央二丁目 4 番 5 号</text></g>
<g data-name="lg_t"><text x="60" y="576" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">この図の決まり</text></g>
