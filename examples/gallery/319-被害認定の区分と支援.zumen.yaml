title: 被害認定の区分は、支援の境目（罹災証明書）
# **全壊・半壊は、壊れ方の名前ではない。損害割合という 1 本の物差しの、区間の名前。**
#
# ## 上の 5 つは 10% きざみ、半分から上は全部「全壊」
#
# 一部損壊 10% 未満／準半壊 10〜20%／半壊 20〜30%／中規模半壊 30〜40%／
# 大規模半壊 40〜50%／**全壊 50% 以上。**
# **50% から 100% までは、どれだけ壊れていても同じ「全壊」**である。
#
# ## 切れ目は、支援の境目として引かれている
#
# **災害救助法の応急修理**が届くのは準半壊（10%）から、
# **被災者生活再建支援法**が届くのは中規模半壊（30%）から。
# どちらも、はじめからその位置にあったわけではない。
#
# ## だから、切れ目は動いてきた
#
# 2001 年の運用指針（内閣府）で全壊・半壊が定まり、**2020 年に準半壊**、
# **2021 年に中規模半壊**が生まれた。
# 中規模半壊は「半壊なのに支援が届かない」を埋めるために作られた区分で、
# **壊れ方が増えたのではなく、線を 1 本足した**という話である。
#
# 調べる主体も出す主体も市町村。出てくるのは罹災証明書 1 枚だが、後ろにはこの物差しがある。
#
# **同じ物差しを、別の向きから見た図が見本 224。**
# あちらは「どこから測るか」—— 水害では浸水深がそのまま区分になり、
# 床が地面より高い家と低い家で判定が変わる、という話。
# こちらは「その区間の名前が、何のために切ってあるか」。
#
# 数値は令和 3 年（2021 年）改定の損害判定基準による。
