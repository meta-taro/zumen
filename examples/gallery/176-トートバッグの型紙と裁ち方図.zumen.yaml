version: 1
kind: placement
arrows: true
title: トートバッグの型紙と裁ち方図（架空）
# **型紙は「どう裁つか」、裁ち方図は「生地のどこへ置くか」。**
#
# 実線が出来上がり線（縫う線）、破線が縫い代線（裁つ線）。
# **底は「わ」** —— 布を二つ折りにして折り山へ合わせるので、型紙は半分しか無い。
# 角の 6×6cm を切り落とすと、縫ったときに**マチ 12cm** になる。
# 地の目の矢印は布のたて地。**回して置くと伸びが変わって形が狂う。**
#
# **型紙と裁ち方図で縮尺が違う**（実物もそう）。だから \`scale\` は書かず、
# 寸法はすべて数字で書く。用尺は裁ち方図の置き方から計算した。
