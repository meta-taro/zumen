# 環状線なので **輪を閉じて描く**（close: true）。順序は内回り（東京 → 神田 → …）。
# 位置はおおよその方角に合わせてある（上野が北東、池袋が北西、品川が南）。
#
# 色は実在の路線色（うぐいす色 #9ACD32）。**この色は白地に対して 1.88:1 で、
# zumen の下限 3:1 を割る**ので検証器が color-faint を出す —— それは正しい。
# 実物も、白黒に落ちたら色では読めない。だから駅ナンバリング（JY01〜JY30）と
# 駅名の両方が出ている。**色だけに頼っていないことが、実物でも守られている。**
#
# 駅名・乗換は事実。図そのものは zumen で描いたもので、どの事業者の図の写しでもない。
