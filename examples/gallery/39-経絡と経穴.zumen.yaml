version: 1
kind: placement
title: 手の太陰肺経・手の陽明大腸経（WHO/ISO 標準経穴部位）
# **経穴の位置は、国際規格で決まっている**（WHO/ISO 標準経穴部位）。
# 361 穴の名前・記号・位置が定義されていて、**LU（肺経）・LI（大腸経）**のように
# 経絡ごとの記号と番号で呼ぶ。
#
# ## 流注（るちゅう）の向きに意味がある
#
# **肺経は胸から手へ、大腸経は手から顔へ。**
# 向きが逆の 2 本が手の先でつながっていて、これを**表裏の関係**という。
# 図で矢印の向きを描くのは、そこが治療の組み立てに効くから。
#
# ## 位置は骨で測る
#
# 経穴は「肘から何センチ」ではなく、**骨の目印の間を等分した比（骨度）**で決める。
# 体の大きさが違っても同じ所になるように作られている。
