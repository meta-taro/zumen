version: 1
kind: placement
arrows: true
title: 家具の転倒防止（倒れやすさに、重さは関係ない）
# **倒れ始める条件に、重さは入らない。**
# m·a·h ＞ m·g·(d/2) の両辺から m が消えるので、
# **a / g ＝ (奥行 ÷ 2) ÷ 重心の高さ** —— 奥行と重心の高さだけで決まる。
# **浅くて高い家具ほど、小さな揺れで倒れる。**
#
# 奥行 300mm・高さ 1,800 の本棚なら、中身が均等（重心 900mm）で **163 gal**。
# **震度 5 強（250〜400 gal）で、もう届く。**
# 重い本を下へ寄せれば重心 620mm で 237 gal まで粘るが、
# **震度 6 強（600〜1,000 gal）には届かない** —— 中身の置き方は固定の代わりにならない。
#
# **留める先は壁板ではなく下地。** 石膏ボードにビスを打っても地震では抜ける。
# **間柱の間隔は 455mm**（尺モジュール）が基本で、下地センサーで探して、
# そこへ届く長さのビスを使う。金具は家具 1 点につき両端に 2 個以上。
#
# **上下に分かれた家具は、まず互いを連結する。** 上だけ留めると、下がずれて前へ出る。
