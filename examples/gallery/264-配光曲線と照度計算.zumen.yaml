version: 1
kind: placement
arrows: true
title: 配光曲線と照度計算（lm は器具の話、lx は机の上の話）
# **配光曲線は、方向ごとの光度（cd）を、下向きに開いた極座標で読む図。**
# 同じ「40W 相当」でも、**集光は真下 2,500cd・60° で 39cd**、
# **拡散は真下 1,000cd・60° でも 500cd** —— 全部足した量（lm）が同じでも、
# 机の上の明るさは別物になる。
#
# **単位が 4 つあるのは、測る場所が違うから。** 光束 lm は器具から出ていく総量、
# 光度 cd はある向きへの強さ、照度 lx は面が受け取った量、輝度 cd/m² は目に見えるまぶしさ。
# **買うときに見るのは lm、設計で要るのは lx** —— 配光曲線は、その 2 つをつなぐ唯一の資料。
#
# **逐点法。** `E ＝ I × cosθ ÷ R²` —— 高さ 2.5m の集光器具なら、
# 真下 400lx が **1.4m 横へずれただけで 110lx**（4 分の 1）。
# 落ちる原因は、距離の 2 乗と、斜めに当たる cos の 2 つ。
#
# **光束法。** `E ＝ F × N × U × M ÷ A` —— 5,000lm のシーリング 1 台で 12 畳（20m²）なら
# **120lx**。U（照明率）と M（保守率）で、**出した光の半分は着く前に消える。**
#
# **要る明るさは、部屋ではなく作業で決まる。**
# **JIS Z 9110 は 2024 年の改正で総則だけになり、屋内の数値は JIS Z 9125:2023 へ移った** ——
# 古い早見表は「JIS Z 9110 の表」として同じ数字を載せているが、いまの出どころは Z 9125。
# 事務室 750lx・会議室 500lx に対して、**居間の全般は 50lx** —— 団らん 200lx、読書 500lx。
# **手元だけ 500lx にして部屋は暗いままにする**のがタスク・アンビエントで、
# 1 灯で部屋ぜんぶを明るくする方法では、この差を作れない。
