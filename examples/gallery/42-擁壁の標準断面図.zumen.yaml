version: 1
kind: placement
title: L 型擁壁 標準断面図（H=3.0m・盛土部・水抜管 φ75 @3m²）
# **擁壁を倒すのは土ではなく、水。**
# 裏に水がたまると水圧が加わり、土だけのときより何倍も押される。
# **水抜管（φ75 @3m²）は飾りではなく、構造の一部。**
#
# ## 裏込砕石は、水を集めて逃がす層
#
# 土をそのまま背面に接させると、水が抜けずに溜まる。
# 砕石を入れて**水の道を作り、水抜管へ導く。**
#
# ## L 型は、自分の上に載った土で踏ん張る
#
# 底版は**背面（土の側）へ伸ばす**。その上に載った土の重さが、そのまま抵抗になる。
# **底版を長くするのは、土を多く載せるため** —— 壁の厚みではなく、足の長さで持つ。
# （底版が前面へ出ている形は逆 L 型。敷地の境界に寄せたいときに使う別の型。）
#
# 根入れは 450mm（H の 15/100）。宅地造成及び特定盛土等規制法施行令 第 10 条第 4 号の
# 練積み造の決まり（15/100 以上かつ 35cm 以上）を目安にした。鉄筋コンクリート造は構造計算で決める。
# 寸法は架空の例。
# 1 px = 10 mm。断面なので y は高さ（上が高い）
