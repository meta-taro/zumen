version: 1
kind: placement
arrows: true
title: たんぱく質のトポロジー図（TOPS）—— 長さを捨てて、畳み方だけを残す
# **TOPS 図は、たんぱく質の畳み方を 2 次元に落とした図。**
# **ヘリックスは丸、ストランドは三角**で描き、
# 二次構造の並び（N 末端から C 末端へ）・シートの上での相対の位置・
# おおよその向きだけを残す。
#
# **線がどこに入るかで、向きが決まる。**
# **記号の中心まで引いた線は「上（手前）につながる」、縁で止めた線は「下（奥）」。**
# N 側が縁で C 側が中心なら**上向き**（三角も上向きに描く）、
# N 側が中心で C 側が縁なら**下向き**（三角も下向き）。
#
# **長さは描かない。** 残基が何個あるか、ループが何残基かは出ない ——
# だから**大きさの違うたんぱく質が、同じ TOPS 図になる。**
# 図そのものを鍵にして、畳み方を検索できる。
#
# **ロスマンフォールド。** 6 本の平行ストランドが、シートの上では
# **321456 の順**に並ぶ（左から β3・β2・β1・β4・β5・β6）。
# β-α-β-α-β の単位が 2 つで、**α / β / α の三層サンドイッチ**。
# **β3 から β4 へ、シートの反対側へ渡る**（crossover）のがこの畳み方の印で、
# 順に並べるだけではこの形にならない。
#
# いちばんよく保たれるのは**最初の β-α-β**（Gly-x-Gly が急な折り返しを許す）で、
# そこが **FAD・NAD(P) の ADP の燐酸**に触れる。
