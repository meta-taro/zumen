version: 1
kind: placement
arrows: true
title: オーケストラの配置（配置そのものが、音量の調整）
# **弦は、客席から見て左から高音の順。**
# **第 1 ヴァイオリン → 第 2 ヴァイオリン → ヴィオラ → チェロ**と並び、
# **コントラバスはチェロの後方。** これが現代配置。
# **コンサートマスターは、第 1 ヴァイオリンの最前列・客席側**に座る。
#
# **後ろへ行くほど、音の大きい楽器。**
# 前列が弦、その後ろに**木管が 2 列**、さらに後ろに**金管**、
# いちばん後ろ（または舞台左奥）に**打楽器。**
# **距離で音量を揃えている** —— 配置そのものが、音量の調整になっている。
#
# **対向配置（両翼配置）は、第 1 と第 2 ヴァイオリンを左右に分ける置き方。**
# 20 世紀の前半から半ばにかけて一般的だった。
# 第 1 と第 2 が向かい合うので、**受け渡しが左右に聞こえる。**
#
# **「何管編成」は、木管の本数の呼び名。**
# **二管編成**はフルート・オーボエ・クラリネット・ファゴットが**各 2 本。**
# **三管編成**はそれぞれ 2 本に**持ち替えの 1 本**（ピッコロ・コーラングレ・
# バスクラリネット・コントラファゴット）が加わる。
# **四管編成**はそれぞれ 3 本に持ち替えの 1 本。
# **弦や金管の数ではなく、木管が何本ずつかで編成を言う** —— 曲を選ぶと、必要な人数が決まる。
#
# 図は模式で、寸法は持たない（席の間隔は確かめていない）。
