# **最大波は、予想の引き上げより先に来た。**
#
# 2011 年 3 月 11 日 14 時 46 分 18.1 秒、三陸沖で M9.0（モーメントマグニチュード）。
# 気象庁は 3 分後の 14 時 49 分に大津波警報を出した。**そのとき岩手県に予想した高さは 3m。**
# 地震の規模を M7.9 と小さく見積もっていたからで、M9.0 に落ち着いたのは 3 月 13 日。
#
# | 予報区 | 14:49 | 15:14 | 15:30 |
# |---|---|---|---|
# | 岩手県 | 3m | 6m | **10m 以上** |
# | 宮城県 | 6m | **10m 以上** | |
# | 福島県 | 3m | 6m | **10m 以上** |
#
# 岩手の予想が 10m 以上になった 15:30 には、**大船渡 15:18（8.0m 以上）・釜石 15:21（4.2m 以上）・
# 宮古 15:26（8.5m 以上）の最大波はもう来ていた。**
#
# ## 「以上」の意味
#
# 観測値に「以上」が付いているのは、**計器が壊れたか、振り切れたか、データが途中で途切れた**所。
# 本当の高さはもっと上。①ではそれを斜線の棒にした —— **塗りの棒は「そこまで」、斜線は「少なくともそこまで」。**
# 相馬の 9.3m 以上がこの表の最大だが、これは検潮所の値で、**陸を駆け上がった高さ（遡上高）ではない。**
#
# 釜石・大船渡・石巻市鮎川・相馬は、**第 1 波が 14 時台に始まったが、揺れによる潮位の乱れで時刻を特定できなかった**
# （報告書の注 *6）。①では 14:46〜15:00 の斜線の帯にした。
# 岩手県〜千葉県の沿岸は地震で 1.2m〜0.1m 沈んでいて、高さにはその沈みが含まれている可能性がある（同じ報告書の注）。
#
# ## その後
#
# 第 1 報の「3m」が避難の遅れにつながったと考えられ、**2013 年 3 月 7 日から、M8 を超える巨大地震の第 1 報は
# 高さを数字で出さず「巨大」「高い」と言う**ようになった。予想される高さは 1m・3m・5m・10m・10m 超の 5 段階。
#
# ## 描かなかったもの
#
# - **地図。** 観測点の位置は北から南への順だけで表した（位置の正確さを、地図の描き方で損ねないため）
# - **犠牲者の数。** この図は「いつ、どれだけの高さが来たか」と「何が予想されていたか」だけを描く
# - **遡上高**（最大 40m 級）。検潮所の値とは測っているものが違うので、混ぜない
#
# 出典: 気象庁「災害時地震・津波速報 平成 23 年（2011 年）東北地方太平洋沖地震」（2011 年）
# 1. 地震・津波概要 —— 表 1-4-1 日本国内の津波観測施設で観測された津波の観測値、図 1-3-1 津波警報等の発表状況。
# 報告書にも「値は後日変更される場合がある」とある。
# 気象庁「津波警報の改善のポイント」、内閣府「特集 新しい津波警報」（2013 年 3 月 7 日の運用開始）。
