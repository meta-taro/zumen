version: 1
kind: placement
arrows: true
title: 地の目とバイアス（布が 45° だけ伸びる理由）
# **伸びているのは糸ではない。織り目の角が倒れている。**
#
# 耳と平行が**たて地**、直角が**よこ地**、45° が**正バイアス**。
# 正方形の織り目が、糸の長さを変えないままひし形へ倒れるので、
# **45° だけがよく伸びる**（頂角 120° で長さ +22.5%）。
#
# **伸びと同時に幅が縮む**（同 −29.3%）。縮むほうが大きい ——
# バイアス裁ちのスカートの裾が下がるのは、これ。
#
# バイアステープを 45° で裁つのは、曲線に沿わせるため。
# **継ぎ目だけは 90° ずらす**ので、そこはたて地になって伸びない。
