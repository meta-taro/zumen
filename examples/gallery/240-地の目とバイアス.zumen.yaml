    label: "バイアスで裁ったスカートの裾が下がるのは、これです。 自重で倒れて、長くなり、細くなる。だから吊るしてから裾を決めます。"
    marker: none
    align: left
    at: { x: 150, y: 1222 }
    size: { w: 1090, h: 18 }
  - id: r5
    label: "型紙の地の目線は、かならず耳と平行に置きます（①）。回して置くと、同じ服の左右で伸び方が変わってしまいます。"
    marker: none
    align: left
    at: { x: 150, y: 1246 }
    size: { w: 1090, h: 18 }
  - id: r6
    label: "バイアステープは 45° で裁ちます（③）。伸びる向きだから、襟ぐりや袖ぐりの曲線を一周できます。"
    marker: none
    align: left
    at: { x: 150, y: 1270 }
    size: { w: 1090, h: 18 }
  - id: r7
    label: "継ぎ目だけは 90° ずらします。 継いだ線がたて地の向きになり、そこだけ伸びない —— 伸びる布を、伸びない糸で留めています。"
    marker: none
    align: left
    at: { x: 150, y: 1294 }
    size: { w: 1090, h: 18 }
