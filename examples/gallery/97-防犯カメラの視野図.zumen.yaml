title: 防犯カメラ配置・視野図（コンビニ 20 × 12m・DORI つき）
# 1 px = 25 mm。**視野の扇形が図の中身。** どこが写り、どこが写らないか。
#
# ## 「写っている」と「誰か分かる」は別
#
# DORI（IEC/EN 62676-4）は **1m あたり何ピクセルで写るか**で段階を分ける。
# 識別 250 / 認識 125 / 観察 62 / 検知 25 px/m。
# **同じカメラでも、距離が伸びると段階が下がる。**
#
# 距離は 画素数 ÷（2 × 距離 × tan(画角/2)）から出る ——
# **画角を広げるほど、識別できる距離は縮む。**
#
# ## 扇形は「向きと画角」、距離の段階は表
#
# 扇形が示すのは**どちらを向いて、どれだけ広く写るか**。
# **その距離で誰と分かるかは、右の表**（DORI）で読む。
# 同じ扇の中でも、遠いほど段階は下がる。
#
# 描き方は、**自分自身への辺に `via` を並べて `close: true`**（道具は足していない）。
# 破線なのは、**視野は物ではない**から（実線は物の輪郭）。
#
# ## 視野どうしが交差しているのは、そのほうがよいから
#
# 重なりが無い置き方は、**その隙間が死角**になる。
#
# ## 壁で切る
#
# **視野は壁を抜けない。** 扇の点を部屋の矩形へ収めてある ——
# はみ出したまま描くと、**壁の向こうまで写るように読める。**
#
# 店名・配置は架空。
