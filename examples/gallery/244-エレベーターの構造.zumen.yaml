    size: { w: 440, h: 78 }
  - id: r1
    label: "釣合おもりは、重さを消すためではなく、差を半分にするためにあります（②）。かご自重 ＋ 定格積載の半分に決まっているのは、そのためです。"
    marker: none
    align: left
    at: { x: 150, y: 1042 }
    size: { w: 1090, h: 18 }
  - id: r2
    label: "だからモーターは、定格積載の半分ぶんでよい。 満載で 2,300kg 吊っていても、持ち上げているのは 650kg です。"
    marker: none
    align: left
    at: { x: 150, y: 1066 }
    size: { w: 1090, h: 18 }
  - id: r3
    label: "空で下りるときと、満載で下るときは、荷のほうがモーターを回します（回生）。エレベーターが止まる寸前に音が変わるのは、これです。"
