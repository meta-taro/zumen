    marker: none
    align: left
    at: { x: 150, y: 1138 }
    size: { w: 1090, h: 18 }
  - id: r6
    label: "オーバーヘッドとピットは、空きではなく装置の場所です（①）。上には綱車とそらせ車、下には緩衝器と張り車が要ります。"
    marker: none
    align: left
    at: { x: 150, y: 1162 }
    size: { w: 1090, h: 18 }
  - id: r7
    label: "2009 年に 2 つ足されました（⑤）。戸開走行保護装置と地震時管制運転装置 —— どちらも、起きた事故のあとに書かれた条文です。"
    marker: none
    align: left
    at: { x: 150, y: 1186 }
    size: { w: 1090, h: 18 }
