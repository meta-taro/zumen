version: 1
kind: placement
arrows: true
title: ロープ式エレベーターの構造（機械室あり）
# **釣合おもりは、重さを消すためではなく、差を半分にするためにある。**
#
# 釣合おもり ＝ **かご自重 ＋ 定格積載の半分**。
# かご 1,000kg・定格 1,300kg なら 1,650kg で、
# 空でも満載でも差は 650kg —— **モーターは定格積載の半分ぶんでよい。**
#
# **止め方は階段になっている。** 定格速度の 1.3 倍を超える前に調速機が動力を切り、
# 1.4 倍を超える前に非常止めがレールを掴み、それでも届いたら緩衝器が受ける
# （建設省告示第 1423 号）。
#
# **オーバーヘッドとピットは空きではない。** 上に綱車とそらせ車、下に緩衝器が入る。
#
# 2009 年 9 月 28 日から、**戸開走行保護装置**と**地震時管制運転装置**が義務
# （令第 129 条の 10 第 3 項第 1 号・第 2 号。平成 20 年政令第 290 号）。
