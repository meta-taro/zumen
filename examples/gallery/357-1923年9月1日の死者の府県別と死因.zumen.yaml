# **10 万 5 千人のうち、9 万 2 千人は火災で亡くなった。**
#
# 1923 年（大正 12 年）9 月 1 日、正午 2 分前（11 時 58 分）、関東地震（M7.9）。
# 土曜の昼で、台所では昼食の支度に火を使っていた。**火元は台所の裸火など**で、
# **日本海（金沢の西の海上）にあった台風の強風に煽られ、数時間で大規模な延焼**になった
# （台風の位置は気象庁「関東大震災から100年」特設サイト：9 月 1 日 6 時に金沢の西海上、18 時に三陸海岸へ。取得 2026-09-29）。
#
# | 死因 | 人 | % |
# |---|---|---|
# | 住家全潰 | 11,086 | 10.5 |
# | **火災** | **91,781** | **87.1** |
# | 流失埋没 | 1,013 | 1.0 |
# | 工場等の被害 | 1,505 | 1.4 |
# | 合計（行方不明者を含む） | 105,385 | |
#
# ## 揺れと死者の場所がずれている
#
# 全潰した住家は**神奈川県 63,577 棟、東京府 24,469 棟**（神奈川が 2.6 倍）。
# 焼失した住家は**東京府 176,505 棟、神奈川県 35,412 棟**（東京が 5.0 倍）。
# 震源に近い神奈川が強く揺れ、死者は人の多い東京で火に呑まれた。
# 東京市の死者 68,660 人のうち 65,902 人（96.0%）が火災。
#
# **1995 年（見本 356）は 77.0% が窒息・圧死、1923 年は 87.1% が火災。** 同じ「大地震」でも、
# 昼と夜明け前、木造密集と強風で、人が亡くなる形がまるで違う。
#
# ## 数が資料ごとに違う
#
# 報告書自身が「資料によって被害実数がまちまちである」と断っている（調査の主体・方法・単位・時期が違う）。
# この図は報告書が引く 1 つの集計（諸井・武村 2004）だけで描いた。
# **検索で出てきた要約には「流失埋没 1,010・工場等 1,006」とあったが、表の本体は 1,013・1,505。** 一次資料で直した。
#
# ## 描かなかったもの
#
# - **地図。** 焼失域・震度の分布は地図の精度で描く手段がこの図に無い
# - **個人・場所の逸話**（被服廠跡など）。数表に無い話は描かない
# - 震災後の混乱の中で起きた事件。この図は数表から言えることだけを描く
#
# 出典: 中央防災会議 災害教訓の継承に関する専門調査会「1923 関東大震災 報告書 第 1 編」（2006 年）
