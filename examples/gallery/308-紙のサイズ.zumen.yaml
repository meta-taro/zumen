title: 紙のサイズ（寸法表ではなく、2 つの決めごと）
# **A 列は、2 つの決めごとから全部が出る。**
# **A0 の面積がちょうど 1m²**、**縦横の比が √2** —— それだけ。
# 実際、**841 × 1,189 ＝ 0.9999m²**、**1,189 ÷ 841 ＝ 1.4138**（√2 ＝ 1.4142）。
#
# **半分にすると、次の番号になる。**
# A0 → A1 → A2 … と長辺を半分にしていくと、
# **841 × 1,189 → 594 × 841 → 420 × 594 → 297 × 420 → 210 × 297**。
#
# **√2 以外では、折るたびに形が変わる。**
# 縦横比を r とすると、半分にした紙の比は **2 ÷ r** になる。
# **r ＝ 2 ÷ r を満たすのは r ＝ √2 だけ** —— だから何回折っても相似のまま。
# 拡大縮小のコピーが倍率 1 つで済む（A4 → A3 は 141%、A3 → A4 は 71%）のも、これのおかげ。
#
# **B 列は 2 つある。**
# **JIS の B0 は 1,030 × 1,456**（**1,030 × 1,456 ＝ 1,499,680mm² ＝ 1.4997m²**）。
# **A0 の 1.5 倍**をねらった寸法で、実際は **1.4998 倍**（A0 が 999,949mm² なので、
# 1.5 倍なら 1,499,923mm²。寸法を mm の整数に丸めたぶんだけずれる）。
# **ISO の B0 は 1,000 × 1,414**（**√2 m²**）。
# **同じ「B4」でも、日本の規格と国際規格で寸法が違う。**
# B4（JIS）は 257 × 364mm。
#
# 数はすべて計算で確かめた（面積・比・半分にしたときの寸法）。
