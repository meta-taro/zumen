# **箏の 13 本の糸の高さは、柱（じ）の位置で決める。**
# 柱を龍角から離すほど、弾く長さが長くなって低くなる。だから調子（調弦）を変えるとは、
# 柱を動かすこと —— **調子の名前は、柱の並びの名前**でもある。
#
# 糸は奏者の向こう側から 一・二・三 … 十・斗・為・巾。二から巾へは手前ほど高い。
# **一だけが例外**で、五と同じ高さ —— 二・三・四より高い。
#
# ## 柱の位置は計算の目安
#
# 弦の長さと振動数は反比例する（同じ糸・同じ張りなら、と仮定した。13 本が同じ太さかは出典で確かめていない）。半音 s 上がると長さは 2^(−s/12) 倍。
# 一の弾く長さを 1 として、龍角から各柱までを比で描いた。**平調子の柱の並びを描いた
# 一次資料は見つけていない** —— 実物は糸の張りが揃わないので、耳と調子笛で合わせる。
# 絵の柱の位置は「並びの形」を見るためのもので、物差しで写す寸法ではない。
#
# 平調子の半音（一から）：一 0・二 −7・三 −5・四 −4・五 0・六 +1・七 +5・八 +7・九 +8・
# 十 +12・斗 +13・為 +17・巾 +19。**一の絶対の高さは決まっていない**ので、表は一を D にとった例。
#
# 寸法は描いていない（箏の長さは山田流で約 182cm、生田流の本間で約 190cm と流派で違う）。
