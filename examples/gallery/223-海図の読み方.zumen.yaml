version: 1
kind: placement
arrows: true
title: 海図の読み方 —— 基準面・距離・灯質・浮標式
scale: { mm: 100 }
# **1 枚の海図に、基準面が 3 つある。**
#
# 水深は**最低水面**から、橋の桁下高と海岸線は**最高水面**から、
# 灯台の高さは**平均水面**から。深さと高さを別の面から測るのは、
# **それぞれ「いちばん危ないとき」を取る**ため。
#
# **距離は縦（緯度）の目盛りで測る** —— 緯度 1 分 ＝ 1 海里 ＝ 1852m。
# メルカトル図法なので、経度 1 分は緯度が高いほど短くなる。
#
# **入港するとき右が赤**（日本は IALA-B）。欧州の A 方式とは左右が逆。
