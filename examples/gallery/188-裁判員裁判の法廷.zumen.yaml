title: 裁判員裁判の法廷（平面）
scale: { mm: 16.7 }
palette:
  出入口: "#8f6f3f"
# **誰もが見たことがあるのに、左右がどちらか言えない図。**
#
# 検察官は**裁判官から見て右**。平面図は上が法壇なので、**図では左**に来る。
# 明文の規則ではなく**慣行**で、逆のこともある（勾留中の被告人が使う扉の位置など）。
# だから席の名前の下に、**両方の見え方**を書いた。
#
# 法壇が**アーク型**なのは、端の裁判員も証言台の声を聞き取りやすくするため、
# そして 9 人が互いの顔を見て話せるようにするため。高さ **35cm**（従来より 10cm 低い）。
