version: 1
kind: placement
arrows: true
title: データセンターの電力系統（単線結線図・2N）
# **2N とは、二重にすることではない。**
# 受電からサーバーの口まで、**2 本の道が一度も交わらない**こと。
# 1 か所でも合流していれば、そこが単一障害点になる。
#
# **UPS は長時間の電源ではない。** 電池が持つのは 5〜15 分で、
# 仕事は**発電機が立ち上がるまでの 10 秒を埋めること**
# （NFPA 110 の Type 10 ＝ 10 秒以内）。
#
# **Tier III と IV の差は時間ではない。** III は止めずに保守でき、
# IV は 1 か所壊れても止まらない。
#
# **PUE は比**（ISO/IEC 30134-2）。全施設の電力 ÷ IT 機器の電力。
# 2025 年の加重平均は 1.54 ＝ IT が使えるのは全体の 65%。
#
# **ISO/IEC 30134-2 の版は確かめていない**（-2 は部の番号で、版ではない）。

