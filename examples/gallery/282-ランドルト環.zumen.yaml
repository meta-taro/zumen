version: 1
kind: placement
arrows: true
title: ランドルト環（1.0 は大きさではなく、角度の約束）
# **「視力 1.0」は、切れ目が視角 1 分に見える大きさ。**
# 環ぜんたいが視角 **5 分**、切れ目が **1 分**（JIS T 7309:2002 は角度で決め、検査距離は 5m±0.05m）。
# 5m で測るときの**慣用の寸法**は
# **外径 7.5mm・線の太さ 1.5mm・切れ目 1.5mm。**
# **1.0 は大きさではなく、角度の約束**なので、
# **5m 用と 3m 用では印刷する環の大きさが違う**（角度が同じになるように作る）。
# 視力の値は、**見分けられた最小の視角（分）の逆数。**
#
# **視力が半分なら、環は 2 倍。** 0.1 は外径 75mm・切れ目 15mm、
# 0.2 は 37.5mm・7.5mm、0.5 は 15mm・3mm、2.0 は 3.75mm・0.75mm ——
# 視力表がいちばん上だけ大きいのは、**足し算ではなく割り算で並んでいる**から。
# 0.1 と 0.2 の差（37.5mm）は、1.0 と 2.0 の差（3.75mm）の 10 倍。
#
# **7.5mm は、丸めた数。** 5m での理論値は 1 分が **5000 × tan(1/60°) ＝ 1.454mm**、
# 5 分で **7.272mm** —— よく見る 1.5mm / 7.5mm は、それを丸めた慣用の値。
# **JIS T 7309:2002 自体は mm を書かず、角度（5′・1′）と距離で決めている**（kikakurui.com の JIS T 7309:2002 本文、取得 2026-09-29）。
# 差の 0.046mm は、紙と印刷の精度に埋もれる。
#
# **いちばん上が見えないときは、距離を縮めて測る。**
# 視力は角度なので、近づけば同じ環が大きく見える ——
# **2.5m で 0.1 の指標が見えれば、0.1 × 2.5 ÷ 5 ＝ 視力 0.05。**
# 0.05 の指標を作るより、2.5m まで近づくほうが早い。
