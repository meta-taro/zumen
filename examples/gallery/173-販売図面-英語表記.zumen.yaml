# **同じ間取りでも、売り場が違えば別の図になる。**
#
# 見本 166 は色で用途を分けた版（買う人の下見）。こちらは**無彩色の英語表記**で、
# 高級賃貸のリーシング図面・海外向けの資料に使われる形。
#
# 効いているのは 4 つ。
# **壁を面で見せる**（太さ 2 段：外壁 150mm・間仕切 100mm）、
# **部屋は白のまま**（面を敷くのは Living だけ）、
# **家具を描かない**（置き家具は買う人が決める。描くと間取りの話でなくなる）、
# **面積を㎡・帖（J）・坪（T）の 3 つで言う**。
#
# 色は無彩色 2 つだけ。線に \`color\`（Wall・Fixture）、面に \`fill\`（Living）。
# 1 px = 20 mm。間取り・面積・物件は架空。
palette:
  Wall: "#6b6b72"
  Fixture: "#8f8f97"
  Living: "#8f8f97"
