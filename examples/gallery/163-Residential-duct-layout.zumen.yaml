version: 1
kind: placement
arrows: true
title: "Residential duct layout (fictional)"
scale: { in: 1 }
# **A duct is not sized by the room. It is sized by a pressure budget.**
#
# Take what the blower is rated to produce, subtract the things that are not
# duct - coil, filter, registers, damper - and what is left is the budget.
# Divide it by the longest run, fittings included, and that is the **friction
# rate**: one number that every duct in the house is then sized against.
#
# **The rooms only decide how the air is split.** A room that is 30 percent of
# the load gets 30 percent of the air, whatever its floor area.
#
# Two things get forgotten. **Fittings are most of the length** (an elbow can be
# 15 to 35 ft of equivalent length), and **the air has to get back**: a closed
# door with no undercut or transfer grille pressurises the room and chokes the
# supply it was sized for.
#
# 1 px = 1 in. Loads, sizes and the house are fictional.
