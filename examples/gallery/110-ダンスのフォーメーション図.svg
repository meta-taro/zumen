<g data-name="n1"><text x="70" y="678" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・センターを 0 として、上手側 +1 +2、下手側 −1 −2 と番号を振る。</text></g>
<g data-name="n0"><text x="70" y="652" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・上手＝客席から見て右、下手＝左。舞台に立つと左右が逆になる。</text></g>
<g data-name="tc0_3"><text x="775" y="524" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">顔と人数を見せる</text></g>
<g data-name="tc1_3"><text x="775" y="552" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">センターを立てる</text></g>
<g data-name="tc2_3"><text x="775" y="580" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">奥行きを出す</text></g>
<g data-name="tc3_3"><text x="775" y="608" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">いちばん強く見える線に乗せる</text></g>
<g data-name="n2"><text x="70" y="704" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・上手奥から下手前へのナナメの線が、いちばん強く見える。</text></g>
<g data-name="n3"><text x="70" y="730" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・移動は最短でなくてよい。客席からどう見えるかで決める。</text></g>
<g data-name="n4"><text x="70" y="756" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・奇数人数は十字やＶ字が組みやすい（センターが決まる）。</text></g>
<g data-name="th3"><text x="775" y="497" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">狙い</text></g>
<g data-name="n5"><text x="70" y="782" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・止まる形だけでなく、どのカウントで着くかを書く。</text></g>
<g data-name="kami_n"><text x="585" y="426" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">上手＝客席から見て右。舞台に立つと左</text></g>
<g data-name="tb_t"><text x="220" y="468" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">移動（誰が、どこへ）</text></g>
<g data-name="a_c"><text x="210" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">カウント 1 — 横一列（前）</text></g>
<g data-name="b_c"><text x="530" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">カウント 9 — V 字</text></g>
<g data-name="c_c"><text x="850" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">カウント 17 — 縦 2 列</text></g>
<g data-name="d_c"><text x="1170" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">カウント 25 — ナナメ（上手奥 → 下手前）</text></g>
<g data-name="tc0_2"><text x="495" y="524" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">—</text></g>
