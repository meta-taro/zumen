title: 車いすの基本寸法（通れることと、向きを変えられることは別）
# **通れることと、向きを変えられることは別の話。**
# 幅 700 の車いすは 800 の出入口を通れるが、**その先で向きを変えられるとはかぎらない** ——
# **通路には 1,400 角（転回 180°）、個室には φ1,500（回転 360°）** が要り、
# 大型の電動車いすでは **φ1,800** で考える。
#
# **車いすの大きさは JIS で「これ以下」と決まっている** ——
# **全幅 700mm 以下・全長 1,200mm 以下・全高 1,090mm 以下**（フットサポート高は 50mm 以上）。
# 建物側は**上限いっぱいの車いすが来ても通れるように**作るので、
# 「うちの車いすは細いから」では施設の設計はできない。
#
# **まっすぐ通れる幅と、人とすれ違える幅は倍ちがう。**
# 出入口は **800mm 以上**、廊下は **850mm 以上**、**すれ違いには 1,800mm 以上** ——
# 850 は「1 台が通れる」幅で、人が来たら片方が下がることになる。
# 通路には**50m 以内ごとに転回できる場所**を置く。
#
# **段差を消すと、長さが要る。** 勾配 **1/12** は高さ 1 に対して長さ 12 なので、
# 玄関の 1 段（15cm）をスロープにすると**1.8m の助走路**が要る ——
# **「段差をなくす」は、場所を用意するということ。**
# （勾配 1/12 以下で高さ 16cm 未満なら、手すりは免除される。）
