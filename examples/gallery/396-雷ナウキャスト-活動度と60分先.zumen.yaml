# **雷ナウキャストは、雷の激しさを格子で塗った地図。** いまの解析と、10 分ごと 60 分先までの予測がある。
#
# 決まり（気象庁「雷ナウキャストとは」・講習資料）——
# - 1km の格子で解析、10 分ごとに更新、60 分先まで予測
# - 活動度 4 激しい雷（落雷が多数発生）／3 やや激しい雷（落雷がある）／2 雷あり（雷光・雷鳴。落雷の可能性が高い）／
#   1 雷可能性あり（いまは無いが、今後落雷の可能性）
# - 想定される対応：活動度 2〜4 は屋外の人は建物や車の中へ、1 は今後の雷ナウキャストや空に注意
# - 色は配色指針 表 1-2：4 は 200,0,255、3 は 255,40,0、2 は 255,170,0、1 は 250,245,0
#
# **テレビの「発雷確率（%）」は、気象庁の一般向けの発表物には無い**（局や民間の予想）。
# 気象庁の雷の情報で描ける形として、雷ナウキャストを描いた。
#
# この図は格子を 5km に粗くした（1km では 1 枚 7 万マスを超える）。同じ活動度の格子をつないで輪にし、
# 低い活動度から順に塗った（全マスで色違い 0 を確かめてある。見本 394 と同じ作り方）。
# 雷雲と活動度は架空。陸と県の線は Natural Earth（パブリックドメイン）。テレビ局の様式は写していない。
palette:
  陸: "#d4e6c3"
  活動度1: "#faf500"
  活動度2: "#ffaa00"
  活動度3: "#ff2800"
  活動度4: "#c800ff"
