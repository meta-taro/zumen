version: 1
wrap: true
title: 石油が製品に分かれるまで（分けるだけでは、足りない）
# **蒸留は「分ける」工程で、「作る」工程ではない。**
# 原油に入っている軽い油の量は決まっているのに、世の中が欲しがる量はそれより多い ——
# だから**重いものを壊して、軽いものを作る。**
#
# ## まず分ける
#
# **常圧蒸留装置**が、沸点の違いで原油を分ける。
# 上から**LP ガス・ナフサ・灯油・軽油**、そして**塔の底に常圧残渣油（重油の留分）**が残る。
# （A 重油は留分の名前ではなく、軽油に重い油を少し混ぜて作る製品。）
#
# 残渣油はさらに**減圧蒸留装置**へ。**圧を下げると低い温度で沸く**ので、
# そのままでは分解してしまう重い油からも**減圧軽油**を搾れる。
#
# ## 足りない分は、壊して作る
#
# **流動接触分解（FCC）**は減圧軽油などを壊して、**分解ガソリン（ガソリンの基材）**・LP ガス・分解軽油にする。
# **水素化分解**は水素を加えながら壊して、ナフサ・灯油・軽油にする。
# **熱分解（コーカー）**は減圧残渣油から、ガス・ナフサ・軽油の留分と**石油コークス**を作る。
#
# **分解装置は、需要の形に合わせて分子の大きさを変える装置**である。
#
# ## 最後に整える
#
# **水素化精製**で硫黄などの不純物を除き、**接触改質**でガソリンのオクタン価を上げる。
# 改質に回すナフサも、先に水素化精製で硫黄を除く（改質の触媒が硫黄で効かなくなるため）。
# **分ける → 壊す → 整える**の 3 段で、ようやく製品になる。
#
# 出典：石油連盟「製油所の精製工程」https://www.paj.gr.jp/statis/faq/67
# （蒸留・脱硫・分解・改質の 4 工程と留分の名前。2026-10-02 照合）。
# 各分解装置が出す製品の内訳は装置と運転で変わる —— ここに書いたのは主なものだけ。
#
# 鉄の側は見本 323、下水は見本 321。
