version: 1
kind: placement
arrows: false
title: "Restorative chart — Universal numbering (fictional)"
# **One loop of 32.** #1 is the upper right third molar, #16 the upper left,
# #17 the lower left, #32 the lower right —— the numbering walks the arch and
# comes back, so **a single number fixes a tooth without saying the quadrant.**
#
# Surfaces are the other half of the address: **M O D** (mesial, occlusal,
# distal) with B/F and L completing the five. "#19 MOD composite" tells any
# reader exactly what exists and where.
#
# **色だけに頼らない。** 実務では赤が要処置・青が既存だが、ここは hatch で書く
# —— 白黒で複写しても残る（日本語の見本 72（歯周チャート）と対）。
#
# Patient, findings and numbers are fictional.
