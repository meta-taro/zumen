version: 1
kind: placement
arrows: true
title: 引き出しのスライドレール（幅を決めるのはレールの厚み）
# **レールの厚みが、引き出しの幅を決めてしまう。**
# 側面付けなら左右に **12.7mm ずつ**取られるので、
# 開口 500mm の家具に入る箱の外幅は **500 − 12.7 × 2 ＝ 474.6mm**。
# **レールを決めてから箱を作る。** 逆にすると、必ず入らない。
#
# **2 段引き（3/4）は、奥の 1/4 が残る。** 奥行 500mm なら 125mm は手が届かない。
# 書類や工具のように奥まで使うものは、3 段引き（フルエクステンション）にする。
#
# 中身はベアリング —— **すべり摩擦を、ころがり摩擦に変えているだけ。**
# 重いものほど効きが大きい。
#
# **耐荷重は「ペア」で書いてある**（45kgf／ペア ＝ 左右 2 本で 45kg）。
# カタログの値は静かに載せたときの値で、
# 開けた所に手をついたぶんは入っていない。
#
# 底付けとアンダーマウントは幅を削らないが、下の隙間が要る。
