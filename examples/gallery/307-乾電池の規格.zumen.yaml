title: 乾電池の規格（番号の順は、大きさの順ではない）
# **背の順は、番号の順ではない。**
# 単 3 形（R6）は **50.5mm**、単 2 形（R14）は **50.0mm** —— **単 3 のほうが 0.5mm 高い。**
# 単 5 形（R1）は直径 **12.0mm** で、単 4 形（R03）の **10.5mm** より**太い**（背は低い）。
#
# | 呼び名 | IEC | 直径 × 高さ |
# |---|---|---|
# | 単 1 形 | R20 | 34.2 × 61.5mm |
# | 単 2 形 | R14 | 26.2 × 50.0mm |
# | 単 3 形 | R6 | 14.5 × 50.5mm |
# | 単 4 形 | R03 | 10.5 × 44.5mm |
# | 単 5 形 | R1 | 12.0 × 30.2mm |
# | 9V 形 | F22（006P） | 13.5 × 48.5mm |
#
# **どれも公称 1.5V。** 大きさが変わっても電圧は同じで、変わるのは
# **取り出せる電流と、持つ時間** —— **単 1 は「強い電池」ではなく「長い電池」。**
#
# **9V 形だけ、中が違う。** **1.5V の素電池 6 個を直列**につないだ箱で、
# 1.5 × 6 ＝ 9V。**円筒でないのは、6 個を詰めるため。**
#
# **ボタン電池の型番は、そのまま寸法。**
# **CR2032** は「**C**（リチウム）・**R**（円形）・**20**（直径 20.0mm）・**32**（高さ 3.2mm）」——
# 数字は型の番号ではなく、寸法そのもの。
#
# **マンガンとアルカリは、向いている使い方が違う。**
# マンガンは小さい電流向きで、**電流を止めると起電力が一時的に回復する。**
# アルカリは大きい電流でも電圧が安定する。
# **強い電池が、いつも良い電池ではない** —— 時計やリモコンにはマンガンが合う。
