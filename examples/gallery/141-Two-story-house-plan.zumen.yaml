version: 1
kind: placement
title: "Two-story house, first and second floor (fictional)"
# **A US floor plan, dimensioned in feet and inches.**
#
# `scale: { in: 1.5 }` makes 1 px = 1.5 in, and **the dimensions come out as
# `20'-0"` / `44'-0"`** —— the unit follows the scale, not the locale.
# Walls are 4 in inside and 8 in outside (`wall: { in: 4, outer: 8 }`).
#
# ## OPEN TO BELOW
#
# The hatched rooms on the first floor (FOYER and GREAT ROOM) are two storeys
# tall. **The same area on the second floor is marked OPEN TO BELOW** and lines
# up with them —— that pair is how a two-storey volume is written on a set of
# plans. `views` で 2 面を 1 枚に置き、通り芯を両方へ同じ位置で付けてある。
#
# 16 risers at about 7 9/16 in (9 ft ceiling + floor framing) need 15 treads
# at 10 in = 12'-6" of run, so the stair box is 100 px (12'-6") long.
#
# Stairs follow IRC R311.7: 36 in min clear width, 7 3/4 in max riser,
# 10 in min tread, 6 ft 8 in min headroom.
#
# 1 px ＝ 1.5 in。寸法・間取りはすべて架空。
# 1 px = 1.5 in. House 44'-0" x 28'-0" (fictional).
scale: { in: 1.5 }
wall: { in: 4, outer: 8 }
north: up
views:
  - id: f1
    title: FIRST FLOOR
    at: { x: 60, y: 60 }
    size: { w: 352, h: 224 }
    grid:
      x:
        - { id: X1, at: 60 }
        - { id: X2, at: 220 }
        - { id: X3, at: 308 }
        - { id: X4, at: 412 }
      y:
        - { id: Y1, at: 60 }
        - { id: Y2, at: 148 }
        - { id: Y3, at: 220 }
        - { id: Y4, at: 284 }
  - id: f2
    title: SECOND FLOOR
    at: { x: 680, y: 60 }
    size: { w: 352, h: 224 }
    grid:
      x:
        - { id: X1, at: 680 }
        - { id: X2, at: 840 }
        - { id: X3, at: 928 }
        - { id: X4, at: 1032 }
      y:
        - { id: Y1, at: 60 }
        - { id: Y2, at: 148 }
        - { id: Y3, at: 220 }
        - { id: Y4, at: 284 }
