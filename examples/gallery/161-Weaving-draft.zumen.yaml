version: 1
kind: placement
arrows: false
title: "Weaving draft - 2/2 twill on four shafts"
# **Three small grids decide the fourth.**
#
# A draft has four parts: **threading** (which shaft each warp end passes
# through), **tie-up** (which shafts each treadle lifts), **treadling** (the
# order the treadles are pressed) and the **drawdown** - the cloth.
#
# **Nobody draws the drawdown.** It is worked out: take a pick, read its
# treadle, the tie-up says which shafts lift, the threading says which ends
# are on those shafts, and those ends are on top. Fill those squares.
#
# So a draft is an instruction and the cloth is its output. Change one grid and
# the cloth changes - the same threading treadled 1 2 3 4 3 2 zigzags instead.
# **That is why weavers exchange drafts rather than swatches**, and why the loom
# is the ancestor of the programmed machine.
#
# The drawdown on this sheet was computed from the other three.
