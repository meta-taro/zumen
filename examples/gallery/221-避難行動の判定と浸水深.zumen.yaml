    marker: none
    align: left
    at: { x: 150, y: 1042 }
    size: { w: 1120, h: 18 }
  - id: r6
    label: "だから地図の色は「何 m か」ではなく、「自分の家の何階まで来るか」として読めます。ここが分かると、判定が自分の話になります。"
    marker: none
    align: left
    at: { x: 150, y: 1066 }
    size: { w: 1120, h: 18 }
  - id: r7
    label: "避難はレベル 4 までに終えます。 レベル 5 の「緊急安全確保」は、すでに安全な避難ができない状態 —— 間に合わなかったときの言葉です。"
    marker: none
    align: left
    at: { x: 150, y: 1090 }
    size: { w: 1120, h: 18 }
  - id: r8
    label: "1 回決めておけば、その日は思い出すだけで済みます。 決めていないと、雨の音を聞きながらゼロから考えることになります。"
    marker: none
    align: left
