version: 1
kind: placement
arrows: true
title: 避難行動の判定フローと、浸水深の読み方
# **わからない人が、自分の家の場合を先に決めておくための図。**
#
# 決めるのは、強い避難先を作ることではない。
# ハザードマップを 1 回見て、5 つの問いに答えるだけ。
# **ほとんどの道は「立退き避難」に行く** —— 家に留まれるのは例外のほう。
#
# **浸水深の色分けは、家の階に合わせて切ってある**
# （0.5m ＝ 1 階の床、3.0m ＝ 2 階の床、5.0m ＝ 2 階が水没）。
# だから地図の色は「自分の家の何階まで来るか」として読める。
