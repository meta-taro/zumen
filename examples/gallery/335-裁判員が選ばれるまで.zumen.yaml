title: 裁判員が選ばれるまで（過半数だけでは決まらない）
# **9 人のうち 6 人が裁判員、3 人が裁判官**（原則。公訴事実に争いがない事件は
# 裁判官 1・裁判員 4 の合議体もある —— 裁判員法 2 条 3 項）。決め方はそこから先が肝心で、
# **過半数の賛成だけでは足りない。**
#
# ## 評決の要件は 2 つある
#
# **合議体の過半数の賛成**が要る。**そのうえで、裁判員と裁判官のそれぞれ 1 名は
# 賛成しなければならない。**
#
# つまり**裁判員 6 人が全員賛成しても、裁判官が 1 人も賛成していなければ決まらない。**
# 逆に**裁判官 3 人が全員賛成しても、裁判員が 1 人も賛成していなければ決まらない。**
# 多数決の形をしているが、**片方だけでは動かない仕組み**になっている。
#
# ## 選ばれるまで
#
# **市町村の選挙管理委員会が選挙人名簿からくじで候補予定者を選び、
# 地方裁判所がそれをもとに裁判員候補者名簿を作る**（毎年）。
# 事件ごとにそこからくじを引き、**呼出状と質問票**を送り、**選任手続期日**で決める。
#
# ## 多くの人は、ここまで来ない
#
# 制度が始まった平成 21 年（5 月 21 日施行〜12 月末）の実績では、選定された候補者 13,423 人のうち
# **選任手続期日の前に辞退が認められた人が 6,552 人（48.8%）。**
# **期日当日に辞退を申し出た 708 人のうち、認められたのは 582 人（82.2%）。**
# 出典：最高裁判所「平成21年における裁判員裁判の実施状況等に関する資料」
# （https://www.moj.go.jp/content/000059422.pdf）。評決と対象は裁判員法 2 条・67 条
# （e-Gov 法令検索）。2026-10-02 照合。
#
# ## 対象
#
# **死刑又は無期拘禁刑に当たる罪**などの重大な事件。
#
# 法廷の配置は見本 188、三審制は見本 284。
