title: 裁判員が選ばれるまで（過半数だけでは決まらない）
# **9 人のうち 6 人が裁判員、3 人が裁判官。** 決め方はそこから先が肝心で、
# **過半数の賛成だけでは足りない。**
#
# ## 評決の要件は 2 つある
#
# **合議体の過半数の賛成**が要る。**そのうえで、裁判員と裁判官のそれぞれ 1 名は
# 賛成しなければならない。**
#
# つまり**裁判員 6 人が全員賛成しても、裁判官が 1 人も賛成していなければ決まらない。**
# 逆に**裁判官 3 人が全員賛成しても、裁判員が 1 人も賛成していなければ決まらない。**
# 多数決の形をしているが、**片方だけでは動かない仕組み**になっている。
#
# ## 選ばれるまで
#
# **選挙人名簿から、くじで裁判員候補者名簿を作る**（毎年）。
# 事件ごとにそこからくじを引き、**呼出状と質問票**を送り、**選任手続期日**で決める。
#
# ## 多くの人は、ここまで来ない
#
# 平成 21 年度の対象事件では、**選任手続期日の前の段階で辞退が認められた人が 48.8%。**
# **期日当日に辞退を申し出た人のうち、認められたのは 82.2%。**
#
# ## 対象
#
# **死刑又は無期拘禁刑に当たる罪**などの重大な事件。
#
# 法廷の配置は見本 188、三審制は見本 284。
