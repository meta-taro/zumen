version: 1
kind: placement
arrows: true
title: 食洗機の水の道（同じ水を、何度も回す）
# **手洗いは、使った水をその場で捨てる。** 食洗機は溜めた水を循環ポンプで回し続ける
# —— **10L を 20 回まわせば、食器に当たった水は 200L ぶん。**
# 減るのは「捨てる水」だけ。
#
# 1 回に使う水は、**手洗い 約 75L に対して 約 9.9L**（メーカー公表の例）。
# 7.6 分の 1 で、1 日 2 回なら年 47.5m³ の差になる。
#
# **手では触れない温度で洗う。** 洗浄 約 52℃、最終すすぎ 約 67℃ ——
# 手洗いは 40℃ 前後が上限（手が入っているから）。
# **油は温度で落ちる。** 人が入らない箱だから温度を上げられる。
#
# **噴いた水が当たらない所は、洗われない。**
# こすって落とす工程が無いので、当たるかどうかがそのまま結果になる。
# 残菜フィルタが詰まると水が回らず、この仕組みそのものが止まる。
