<g data-node="s1" data-pinned="false" data-shape="rect"><text x="135" y="106" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">1　線分 AB を引く。与えられたものはこれだけ（長さを 1 とする）</text></g>
<g data-node="s2" data-pinned="false" data-shape="rect"><text x="135" y="126" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">2　B を中心に円を描き、AB を切った 2 点から同じ半径の円 → 交点 H</text></g>
<g data-node="s3" data-pinned="false" data-shape="rect"><text x="135" y="146" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">3　B と H を結ぶ。これが AB への垂線（分度器を使わない）</text></g>
<g data-node="s4" data-pinned="false" data-shape="rect"><text x="135" y="166" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">4　垂線上に BC ＝ AB / 2 を取る。すると AC ＝ √5 / 2</text></g>
<g data-node="s5" data-pinned="false" data-shape="rect"><text x="135" y="186" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">5　C を中心に半径 BC の円 → AC 上に D。AD ＝（√5 − 1）/ 2</text></g>
<g data-node="s6" data-pinned="false" data-shape="rect"><text x="135" y="206" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">6　A を中心に半径 AD の円 → AB 上に E。ここで AB : AE ＝ φ : 1</text></g>
<g data-node="n0" data-pinned="false" data-shape="rect"><text x="875" y="571" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・破線の円はコンパスの跡。作図図では消さない —— 消すと、どう作ったかが読めなくなる</text></g>
<g data-node="n1" data-pinned="false" data-shape="rect"><text x="875" y="593" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・分度器を使わない。137.508° も、φ が出ていれば円と直線だけで取れる</text></g>
<g data-node="n2" data-pinned="false" data-shape="rect"><text x="875" y="615" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・R を変えれば全部が比を保ったまま動く。決めるのは R ひとつ</text></g>
<g data-node="n3" data-pinned="false" data-shape="rect"><text x="875" y="637" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・色を持たせていない。白黒で刷っても、形と比はそのまま残る</text></g>
<g data-node="t_t" data-pinned="false" data-shape="rect"><rect x="135" y="530" width="340" height="26" fill="#22222a" stroke="#ffffff" stroke-width="1"/><rect x="135" y="530" width="340" height="26" fill="#ffffff" fill-opacity="0.82"/><text x="305" y="547" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">φ の階段（決めるのは R ひとつ）</text></g>
<g data-node="g_t" data-pinned="false" data-shape="rect"><rect x="505" y="530" width="340" height="26" fill="#22222a" stroke="#ffffff" stroke-width="1"/><rect x="505" y="530" width="340" height="26" fill="#ffffff" fill-opacity="0.82"/><text x="675" y="547" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">手引書に載せる下限</text></g>
