<g data-node="mn2" data-pinned="false" data-shape="rect"><text x="865" y="246" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">置く角は 黄金角 360° / φ² ＝ 137.508° ずつ</text></g>
