version: 1
kind: placement
title: 展示会の会場（1 マス = 1800mm を 30px として）
# **展示会の会場図は、区画を売るための図。**
# 1 小間（ブース）の寸法が決まっていて、**主通路に面した区画ほど値が高い。**
# だから通路の引き方が、そのまま売上の設計になる。
#
# ## 通路の幅は、逃げるために決まる
#
# 見栄えではなく、**避難のときに人が流れる幅**として決める。
# 非常口の位置が先にあって、そこへ届く通路を引き、残りを区画にする。
#
# ## ステージの正面は区画にしない
#
# 人がたまる場所なので、区画を置くと通路が詰まる。
# **空けてあることに意味がある場所**は、図で見えていないと守られない。
