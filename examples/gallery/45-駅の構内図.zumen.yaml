version: 1
kind: placement
title: 駅 構内図（1F 改札階・B1F ホーム階）
# 1 px = 100 mm。
#
# **2026-09-15 に直した。** それまで scale を書いていなかった ——
# 1 枚に 2 つの図があるのに寸法系が 1 組しかなく、通しで測ると
# **「2 階を合わせた全長 36m＋36m」という意味のない数字**が出たため。
# 通り芯も 2 階分を貫いた。scale が無いので壁の厚みも効かなかった。
#
# **views（D35）で図ごとの寸法系を持てるようになった**ので、
# 階を囲み（groups）ではなく図（views）にして、寸法と通り芯を入れ直した。
# 通り芯の符号 X1〜X4・Y1〜Y5 は**両方の階で同じ**（同じ建物の芯なので当然）。
# それでも寸法は図ごとに測られる —— そこが views の役目。
scale: { mm: 100 }
wall: { mm: 150, outer: 250 }
views:
  - id: f1
    title: 1F 改札階（GL±0）
    at: { x: 0, y: 0 }
    size: { w: 360, h: 200 }
    scale: { mm: 100 }
    grid:
      x:
        - { id: X1, at: 0 }
        - { id: X2, at: 110 }
        - { id: X3, at: 250 }
        - { id: X4, at: 360 }
      y:
        - { id: Y1, at: 0 }
        - { id: Y2, at: 60 }
        - { id: Y3, at: 140 }
        - { id: Y4, at: 200 }
  - id: b1
    title: B1F ホーム階（GL−6,000）
    at: { x: 700, y: 0 }
    size: { w: 360, h: 260 }
    scale: { mm: 100 }
