version: 1
kind: placement
arrows: true
title: ゼーゲルコーン（温度ではなく、熱量を読む）
# **窯の中に立てる三角錐。倒れ方で、焼けたかどうかを読む。**
# 三角形の底を持つ角錐で、**8° に傾けて取り付ける。**
# 熱が入るにつれて先が曲がっていき、**先が台と同じ高さまで倒れたら、その番号に達した。**
#
# ## 温度計ではない
#
# コーンが測っているのは温度ではなく、**熱量（heat work）** —— **温度と時間の組み合わせ。**
# だから表に出るのは温度そのものではなく「**相当温度**」で、
# **昇温の速さと窯の雰囲気が変われば、同じ番号でも倒れる温度が変わる。**
#
# 下の数字は**毎時 60℃ で昇温したとき**の相当温度 ——
# コーン 022 が 590℃、06 が 998℃、04 が 1,063℃、6 が 1,222℃、10 が 1,285℃。
#
# **同じ 1,200℃ でも、長く置けば焼き物の変化は進む。**
# 熱電対はそのときの温度しか読まないので、この 2 つは別のことを見ている。
#
# ## 大きさと番号の体系
#
# 高さは **大コーン 6.35cm（自立型も同じ）** と **小コーン 2.86cm** の 2 通り。
# 番号の体系は **Orton（米）** と **ゼーゲル／SK（欧。1886 年、ヘルマン・ゼーゲルが作った）** の 2 つ。
#
# 幅はこの図では模式（出典に寸法が無い）。
# 窯詰めの棚組みは見本 218、製麹のように温度を時間で追う図は見本 292。
