<svg xmlns="http://www.w3.org/2000/svg" width="997" height="562" viewBox="0 0 997 562">
<title>治験の三つの相（人数ではなく、「誰に試すか」で分かれている）</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63636e"/></marker></defs>
<rect data-paper="1" x="0" y="0" width="997" height="562" fill="#ffffff"/>
<g data-edge="kiso&gt;hirinsho" data-pinned="false"><path d="M 104 182 L 104 238" fill="none" stroke="#63636e" stroke-width="1" marker-end="url(#arrow)"/></g>
<g data-edge="hirinsho&gt;p1" data-pinned="false"><path d="M 104 314 L 104 446 L 204 446 L 204 40 L 364 40 L 364 106" fill="none" stroke="#63636e" stroke-width="1" marker-end="url(#arrow)"/><rect data-edge-label="1" x="170" y="315" width="68" height="14" fill="#ffffff"/><text x="204" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">ここから人</text></g>
<g data-edge="p1&gt;p2" data-pinned="false"><path d="M 364 182 L 364 238" fill="none" stroke="#63636e" stroke-width="1" marker-end="url(#arrow)"/><rect data-edge-label="1" x="294" y="193" width="140" height="14" fill="#ffffff"/><text x="364" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">薬物動態と安全性を検討</text></g>
<g data-edge="p2&gt;p3" data-pinned="false"><path d="M 364 314 L 364 446 L 523 446 L 523 40 L 635 40 L 635 106" fill="none" stroke="#63636e" stroke-width="1" marker-end="url(#arrow)"/><rect data-edge-label="1" x="459" y="195" width="128" height="14" fill="#ffffff"/><text x="523" y="206" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">有効性・安全性を検討</text></g>
<g data-edge="p3&gt;shinsa" data-pinned="false"><path d="M 635 182 L 635 246" fill="none" stroke="#63636e" stroke-width="1" marker-end="url(#arrow)"/><rect data-edge-label="1" x="529" y="220" width="212" height="14" fill="#ffffff"/><text x="635" y="231" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">有効性を検証（数百例以上・多施設）</text></g>
<g data-edge="shinsa&gt;shihan" data-pinned="false"><path d="M 635 306 L 635 370" fill="none" stroke="#63636e" stroke-width="1" marker-end="url(#arrow)"/></g>
<g data-edge="shihan&gt;ato" data-pinned="false"><path d="M 635 436 L 635 502 L 746 502 L 746 40 L 870 40 L 870 106" fill="none" stroke="#63636e" stroke-width="1" marker-end="url(#arrow)"/></g>
<g data-node="kiso" data-pinned="false" data-shape="rect"><rect x="24" y="106" width="160" height="76" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-node="hirinsho" data-pinned="false" data-shape="rect"><rect x="24" y="238" width="160" height="76" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-node="p1" data-pinned="false" data-shape="rect"><rect x="225" y="106" width="278" height="76" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-node="p2" data-pinned="false" data-shape="rect"><rect x="267" y="238" width="194" height="76" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-node="p3" data-pinned="false" data-shape="rect"><rect x="544" y="106" width="182" height="76" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-node="shinsa" data-pinned="false" data-shape="rect"><rect x="553" y="246" width="164" height="60" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-node="shihan" data-pinned="false" data-shape="stacked"><rect x="558" y="370" width="160" height="60" rx="4" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/><rect x="552" y="376" width="160" height="60" rx="4" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-node="ato" data-pinned="false" data-shape="rect"><rect x="767" y="106" width="206" height="76" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-name="kiso"><text x="104" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">基礎研究</text><text x="104" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">化合物を見つける</text></g>
<g data-name="hirinsho"><text x="104" y="274" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">非臨床試験</text><text x="104" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">人に試す前</text></g>
<g data-name="p1"><text x="364" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">第 I 相</text><text x="364" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">志願した健常成人（抗がん剤などは患者）</text></g>
<g data-name="p2"><text x="364" y="274" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">第 II 相</text><text x="364" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">比較的軽度な少数例の患者</text></g>
<g data-name="p3"><text x="635" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">第 III 相</text><text x="635" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">実際に使うであろう患者</text></g>
<g data-name="shinsa"><text x="635" y="281" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">承認申請・審査</text></g>
<g data-name="shihan"><text x="635" y="411" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">市販</text></g>
<g data-name="ato"><text x="870" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">市販後も見続ける</text><text x="870" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">使う人の数が桁違いに増える</text></g>

<g data-name="sources"><text x="20" y="541" font-family="sans-serif" font-size="10" fill="#63636e">出典：厚生労働省「治験」ホームページ（治験の 3 つの段階）（2026-10-02 取得）</text><text x="20" y="555" font-family="sans-serif" font-size="10" fill="#63636e">出典：厚生省「新医薬品の臨床評価に関する一般指針について」（平成 4 年 6 月 29 日 薬新薬第 43 号）（2026-10-02 取得）</text></g>
</svg>