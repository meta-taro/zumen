    size: { w: 320, h: 224 }
  - id: ridge
    label: ""
    hatch: solid
    at: { x: 172, y: 169.5 }
    size: { w: 96, h: 5 }
  # Hip ends: jack rafters run from the end wall into the hips, 16 in o.c.,
