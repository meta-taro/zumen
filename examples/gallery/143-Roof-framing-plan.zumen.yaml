# **In plan a rafter is a line, so the plan is mostly lines.**
#
# The ridge board runs the length minus the width (a hip roof), the four hips
# run out to the corners at 45 degrees in plan, and **every rafter outside the
# ridge is a jack** that dies into a hip.
#
# **日本語の見本 17（躯体の伏図）と対**。あちらは通り芯と符号で梁を、
# こちらは o.c. と span で垂木を書く。
#
# 1 px = 1.5 in. Spans, sizes and the building are fictional.
