<svg xmlns="http://www.w3.org/2000/svg" width="913" height="526" viewBox="0 0 913 526">
<title>治験の三つの相（人数ではなく、「誰に試すか」で分かれている）</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a0a0ab"/></marker></defs>
<rect data-paper="1" x="0" y="0" width="913" height="526" fill="#0f0f13"/>
<g data-edge="kiso&gt;hirinsho" data-pinned="false"><path d="M 104 182 L 104 238" fill="none" stroke="#a0a0ab" stroke-width="1" marker-end="url(#arrow)"/></g>
<g data-edge="hirinsho&gt;p1" data-pinned="false"><path d="M 104 314 L 104 446 L 204 446 L 204 40 L 322 40 L 322 106" fill="none" stroke="#a0a0ab" stroke-width="1" marker-end="url(#arrow)"/><rect data-edge-label="1" x="170" y="332" width="68" height="14" fill="#0f0f13"/><text x="204" y="343" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">ここから人</text></g>
<g data-edge="p1&gt;p2" data-pinned="false"><path d="M 322 182 L 322 238" fill="none" stroke="#a0a0ab" stroke-width="1" marker-end="url(#arrow)"/><rect data-edge-label="1" x="252" y="193" width="140" height="14" fill="#0f0f13"/><text x="322" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">薬物動態と安全性を検討</text></g>
<g data-edge="p2&gt;p3" data-pinned="false"><path d="M 322 314 L 322 446 L 439 446 L 439 40 L 551 40 L 551 106" fill="none" stroke="#a0a0ab" stroke-width="1" marker-end="url(#arrow)"/><rect data-edge-label="1" x="375" y="345" width="128" height="14" fill="#0f0f13"/><text x="439" y="356" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">有効性・安全性を検討</text></g>
<g data-edge="p3&gt;shinsa" data-pinned="false"><path d="M 551 182 L 551 246" fill="none" stroke="#a0a0ab" stroke-width="1" marker-end="url(#arrow)"/><rect data-edge-label="1" x="445" y="197" width="212" height="14" fill="#0f0f13"/><text x="551" y="208" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">有効性を検証（数百例以上・多施設）</text></g>
<g data-edge="shinsa&gt;shihan" data-pinned="false"><path d="M 551 306 L 551 370" fill="none" stroke="#a0a0ab" stroke-width="1" marker-end="url(#arrow)"/></g>
<g data-edge="shihan&gt;ato" data-pinned="false"><path d="M 551 436 L 551 502 L 662 502 L 662 40 L 786 40 L 786 106" fill="none" stroke="#a0a0ab" stroke-width="1" marker-end="url(#arrow)"/></g>
<g data-node="kiso" data-pinned="false" data-shape="rect"><rect x="24" y="106" width="160" height="76" rx="6" fill="#22222a" stroke="#ffffff" stroke-width="1"/></g>
<g data-node="hirinsho" data-pinned="false" data-shape="rect"><rect x="24" y="238" width="160" height="76" rx="6" fill="#22222a" stroke="#ffffff" stroke-width="1"/></g>
<g data-node="p1" data-pinned="false" data-shape="rect"><rect x="242" y="106" width="160" height="76" rx="6" fill="#22222a" stroke="#ffffff" stroke-width="1"/></g>
<g data-node="p2" data-pinned="false" data-shape="rect"><rect x="225" y="238" width="194" height="76" rx="6" fill="#22222a" stroke="#ffffff" stroke-width="1"/></g>
<g data-node="p3" data-pinned="false" data-shape="rect"><rect x="460" y="106" width="182" height="76" rx="6" fill="#22222a" stroke="#ffffff" stroke-width="1"/></g>
<g data-node="shinsa" data-pinned="false" data-shape="rect"><rect x="469" y="246" width="164" height="60" rx="6" fill="#22222a" stroke="#ffffff" stroke-width="1"/></g>
<g data-node="shihan" data-pinned="false" data-shape="stacked"><rect x="474" y="370" width="160" height="60" rx="4" fill="#22222a" stroke="#ffffff" stroke-width="1"/><rect x="468" y="376" width="160" height="60" rx="4" fill="#22222a" stroke="#ffffff" stroke-width="1"/></g>
<g data-node="ato" data-pinned="false" data-shape="rect"><rect x="683" y="106" width="206" height="76" rx="6" fill="#22222a" stroke="#ffffff" stroke-width="1"/></g>
<g data-name="kiso"><text x="104" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">基礎研究</text><text x="104" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">化合物を見つける</text></g>
<g data-name="hirinsho"><text x="104" y="274" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">非臨床試験</text><text x="104" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">人に試す前</text></g>
<g data-name="p1"><text x="322" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">第 I 相</text><text x="322" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">志願した健常成人</text></g>
<g data-name="p2"><text x="322" y="274" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">第 II 相</text><text x="322" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">比較的軽度な少数例の患者</text></g>
<g data-name="p3"><text x="551" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">第 III 相</text><text x="551" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">実際に使うであろう患者</text></g>
<g data-name="shinsa"><text x="551" y="281" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">承認申請・審査</text></g>
<g data-name="shihan"><text x="551" y="411" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">市販</text></g>
<g data-name="ato"><text x="786" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">市販後も見続ける</text><text x="786" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">使う人の数が桁違いに増える</text></g>

</svg>