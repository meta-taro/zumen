<g data-name="why3"><text x="1070" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">種類の名前が、そのまま役目。</text><text x="1070" y="378" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">案内は教える、警戒は知らせる、</text><text x="1070" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">規制は禁じる・命じる、指示は示す ——</text><text x="1070" y="406" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">4 つの動詞が、4 つの色になっている。</text></g>
<g data-name="why4"><text x="1070" y="627" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">日本の警戒標識だけ、菱形。</text><text x="1070" y="641" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">条約の原則は三角だが、日本は菱形を採った ——</text><text x="1070" y="655" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">形が違っても、色（黄）と役目は同じ。</text></g>
<g data-name="why5"><text x="1070" y="876" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">本標識は、条件を持たない。</text><text x="1070" y="890" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">「駐車禁止」は駐車禁止としか言えないので、</text><text x="1070" y="904" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">いつ・どこで・誰に効くかは、下の板が持つ ——</text><text x="1070" y="918" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">組み合わせで意味を作っている。</text></g>
<g data-name="r1"><text x="140" y="961" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">形と色で、読む前に種類が分かります（①③）。文字が読めない距離でも、黄色い菱形が見えた時点で「注意」と分かります。</text></g>
<g data-name="r2"><text x="140" y="985" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">警戒標識の一辺は 45cm です（①）。ウィーン標識条約の原則は三角ですが、日本は菱形を採りました。</text></g>
<g data-name="r3"><text x="140" y="1009" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">案内標識だけが 2 色あります（②）。一般道は青、高速道路は緑です。</text></g>
<g data-name="r4"><text x="140" y="1033" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">本標識は条件を持ちません（⑤）。いつ・どこで・誰に効くかは、下に付ける補助標識が持ちます。</text></g>
<g data-name="t1"><text x="140" y="164" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">① 形と色で、読む前に種類が分かる</text></g>
<g data-name="t2"><text x="140" y="444" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">② 青と緑は、指示と案内</text></g>
<g data-name="cap1"><text x="470" y="405" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">警戒標識の一辺は 45cm。 文字が読めない距離でも、黄色い菱形が見えた時点で「注意」と分かる。</text></g>
<g data-name="cap2"><text x="470" y="613" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">案内標識だけが 2 色ある。 一般道は青、高速道路は緑 —— 同じ「案内」でも、走っている道が違う。</text></g>
<g data-name="h860_186"><text x="1070" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">形と色</text></g>
<g data-name="h860_466"><text x="1070" y="482" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">ウィーン標識条約の原則</text></g>
<g data-name="h860_722"><text x="1070" y="738" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">本標識に付け足すもの</text></g>
<g data-name="t3"><text x="860" y="164" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">③ 本標識の 4 種類</text></g>
<g data-name="t4"><text x="860" y="450" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">④ 形が先に届く</text></g>
<g data-name="t5"><text x="860" y="706" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">⑤ 補助標識</text></g>
<g data-name="shiji2n"><text x="310" y="571" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">指示標識</text><text x="310" y="585" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">青地に白・五角形や正方形</text></g>
<g data-name="annai_an"><text x="520" y="571" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">案内標識（一般道）</text><text x="520" y="585" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">青地に白</text></g>
<g data-name="annai_mn"><text x="740" y="571" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">案内標識（高速道路）</text><text x="740" y="585" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">緑地に白</text></g>
<g data-name="y860_210"><text x="986" y="226" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">青地または緑地に白</text></g>
<g data-name="y860_234"><text x="986" y="250" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">黄地に黒・菱形（一辺 45cm）</text></g>
<g data-name="y860_258"><text x="986" y="274" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">赤地に青・白、または青地に白</text></g>
<g data-name="y860_282"><text x="986" y="298" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">青地に白・五角形や正方形</text></g>
<g data-name="y860_306"><text x="986" y="322" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">本標識に付ける</text></g>
<g data-name="y860_490"><text x="986" y="506" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">警告（白か黄の地）</text></g>
<g data-name="y860_514"><text x="986" y="530" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">禁止</text></g>
<g data-name="y860_538"><text x="986" y="554" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">菱形（三角ではない）</text></g>
<g data-name="y860_562"><text x="986" y="578" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">逆三角形</text></g>
<g data-name="y860_746"><text x="986" y="762" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">ここから 100m、この先など</text></g>
<g data-name="y860_770"><text x="986" y="786" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">8-20 時など</text></g>
<g data-name="y860_794"><text x="986" y="810" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">大型貨物など</text></g>
<g data-name="y860_818"><text x="986" y="834" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">矢印で向きを足す</text></g>
<g data-name="keikain"><text x="250" y="355" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">警戒標識</text></g>
<g data-name="keikaic"><text x="250" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">黄地に黒・菱形</text></g>
<g data-name="kisein"><text x="470" y="355" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">規制標識</text></g>
<g data-name="kiseic"><text x="470" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">赤地に白・円形</text></g>
<g data-name="ichijin"><text x="690" y="355" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">一時停止</text></g>
<g data-name="ichijic"><text x="690" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">赤地に白・逆三角</text></g>
<g data-name="x860_210"><text x="920" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">案内標識</text></g>
<g data-name="x860_234"><text x="920" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">警戒標識</text></g>
<g data-name="x860_258"><text x="920" y="274" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">規制標識</text></g>
<g data-name="x860_282"><text x="920" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">指示標識</text></g>
<g data-name="x860_306"><text x="920" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">補助標識</text></g>
<g data-name="x860_490"><text x="920" y="506" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">三角</text></g>
<g data-name="x860_514"><text x="920" y="530" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">丸・赤い周囲</text></g>
<g data-name="x860_538"><text x="920" y="554" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">日本の警戒標識</text></g>
<g data-name="x860_562"><text x="920" y="578" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">一時停止</text></g>
<g data-name="x860_746"><text x="920" y="762" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">距離・区域</text></g>
<g data-name="x860_770"><text x="920" y="786" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">時間</text></g>
<g data-name="x860_794"><text x="920" y="810" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">車両の種類</text></g>
<g data-name="x860_818"><text x="920" y="834" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">方向</text></g>
</svg>