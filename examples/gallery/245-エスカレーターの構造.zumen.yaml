version: 1
kind: placement
arrows: true
title: エスカレーターの構造（トラスの側面図）
# **踏面はいつも水平。** 階段になったり平らになったりするのは、
# **前輪と後輪が別のレールを走り、その間隔が変わる**から。
# 2 本が揃う区間が乗降口の「水平部」で、そこで段差が消える。
#
# **勾配 30° なら、斜め長は揚程のちょうど 2 倍**（sin30° ＝ 0.5）。
# 水平長は 1.73 倍。踏面 400mm なら蹴上は 400 × tan30° ＝ 231mm で、
# 家の階段より 3cm 高い段が 0.5m/s で動いている。
#
# 建築基準法施行令 第 129 条の 12 —— 勾配 30° 以下、
# **手すりは踏段と同一方向・同一速度**、踏段の幅 1.1m 以下、
# 手すり上端部の中心まで 25cm 以下、積載荷重 P ＝ 2,600A。
#
# **第六号「地震で脱落しないこと」は、東日本大震災のあとに足された。**
# トラスは上下階の梁に掛けてあるだけなので、揺れると外れた。
