    label: "運べる数は、速さでは決まりません（⑤）。1 分に通るのは 75 段で、そこに何人乗るかのほうが効きます。"
    marker: none
    align: left
    at: { x: 150, y: 1332 }
    size: { w: 1090, h: 18 }
  - id: r7
    label: "乗降口のコムプレートは、踏段の溝に櫛を差し込んでいます（①）。靴や荷物が乗り上げないように、溝と櫛をかみ合わせて段差を消しています。"
    marker: none
    align: left
    at: { x: 150, y: 1356 }
    size: { w: 1090, h: 18 }
  - id: r8
    label: "「地震で脱落しないこと」は 2011 年のあとに足された条文です（④第六号）。トラスは梁に掛けてあるだけなので、揺れると外れました。"
    marker: none
    align: left
    at: { x: 150, y: 1380 }
    size: { w: 1090, h: 18 }
