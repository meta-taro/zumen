version: 1
kind: placement
arrows: false
scale: { mm: 5 }
title: パレット積付図（T11・4 つの積み方を並べて比べる）
# 1 px = 5 mm。**同じ箱を、どう並べるかだけの図。** それで荷崩れが変わる。
#
# ## 段ごとに向きを変えると強くなる
#
# ブロック積みは並べるだけなので速いが、**段の目地が縦に揃うので横の力に弱い。**
# 段ごとに 90° 回す（交互列）か、段の中で向きを混ぜる（れんが）と、
# 目地がずれて崩れにくくなる。
#
# ## 効率と安定は、ときどきぶつかる
#
# 風車（ピンホイール）積みはいちばん安定するが、**真ん中が空く**（88.7%）。
# ①②③ が 100% なのは、**段ボールを T11 で割り切れる寸法で作ってある**から。
# 寸法が合わない箱を無理に載せると、はみ出しになる。
#
# ## はみ出しは厳禁
#
# **わずかでも下段の圧縮強度が落ち、重心が外へ出る。**
# 隙間は外へ逃がさず、内側へ寄せる。
