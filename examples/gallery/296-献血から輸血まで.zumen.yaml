title: 献血から輸血まで（保ちの違う 3 つの製剤）
# **献血から、保存の条件がまるで違う 3 つの製剤ができる。**
# 全血献血は遠心分離で**赤血球と血漿**に、**血小板は主に成分献血**（アフェレーシス）で採る。
# **赤血球は低温で 28 日、血小板は室温で 6 日、血漿は凍結して 1 年**（融解後は 24 時間）。
# 血小板の有効期間は、以前は採血後 4 日だった（いまの添付文書は 6 日）。
#
# **だから、在庫の作り方が製剤ごとに違う。**
# 血漿は凍らせて貯められるが、**血小板は 6 日しかもたない** ——
# 貯めておくことができないので、**必要な量を、毎日集め続けるしかない。**
# 「献血が足りない」という言い方が指しているのは、たいていここ。
#
# **検査は、集めたあとにする。**
# 感染症（HIV・B 型肝炎・C 型肝炎・梅毒・**核酸増幅検査 NAT**）、
# 血液型（**ABO 式と Rh 式**）、**不規則抗体**のスクリーニング ——
# 陽性なら抗体パネルで詳しく調べる。
#
# **献血には 2 つのやり方がある。**
# **全血献血**は血をそのまま採り、あとから遠心分離で成分に分ける。
# **成分献血**はアフェレーシスで、血漿や血小板だけをその場で採って残りを返す。
#
# **単位の大きさは国で違う。** 日本は **1 単位 ＝ 200mL**、海外は **450mL** が標準。
# 同じ「2 単位」でも量が違うので、文献を読むときは単位の定義から確かめる。
#
# **病院側でもう一度照合する。** 血液センターから届いた**赤血球製剤**は、
# そのまま使わずに**交差適合試験**（患者の血と混ぜて反応を見る）を通す ——
# **検査は 1 回では終わらない。** 血小板と血漿は交差適合試験を省き、ABO 型の適合を確かめて使う。
#
# 出典：日本赤十字社 医薬品情報「血小板製剤」https://www.jrc.or.jp/mr/blood_product/about/platelet/ （有効期間 採血後 6 日間）、
# 長野県赤十字血液センター「献血の種類」（血小板は主に成分献血から）、
# 厚生労働省「輸血療法の実施に関する指針」（交差適合試験・新鮮凍結血漿の融解後の扱い）。取得 2026-10-02
