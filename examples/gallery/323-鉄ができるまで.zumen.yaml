title: 鉄ができるまで（炭素を入れて、また抜く）
# **鉄をつくる工程の半分は、炭素を入れる仕事。残りの半分は、それを抜く仕事。**
#
# ## 入れる —— 高炉
#
# 鉄鉱石は酸素とくっついた形（酸化鉄）で採れる。**その酸素を取るために炭素を使う。**
# 高炉は上から鉄鉱石とコークスを入れ、下から熱風を吹き込む炉で、
# 炉の中を下りながら、温度の上がる順に段階を踏んで還元が進む。
# 出てくる溶けた鉄（溶銑・銑鉄）は、**炭素を 4〜5%** 含んでいる。
#
# ## 抜く —— 転炉
#
# **銑鉄は硬いが、もろい。** だから構造材には使えない。
# 転炉に**少量の鉄スクラップ**と溶銑を入れて酸素を吹き込み、炭素を燃やして減らすと鋼になる
# （鋼は炭素がおおむね 2% 以下。構造用の鋼材はさらにずっと少ない）。
# **入れた炭素を、次の工程で抜いている。**
#
# ## 抜かない道もある
#
# 成分を調整して鋳型へ流し込めば**鋳鉄**になる。
# 急冷すると主成分がセメンタイトの**白銑鉄**。
# 「もろい」は欠点ではなく、**用途が違う**という話。
#
# ## 鉄鉱石から始めない道
#
# **電炉法**はスクラップを電気炉で溶かす。鉄鉱石も高炉もコークスも要らない。
# いまの鉄鋼製品は、**高炉法と電炉法の 2 つ**で大半がつくられている。
#
# 高炉の還元の温度帯は一次資料で確かめられなかったので、図には数を書いていない。
#
# 出典：日本鉄鋼連盟「鋼をつくる」https://www.jisf.or.jp/knowledge/manufacture/tenro.html
# （銑鉄の炭素 4〜5%、転炉に少量のスクラップを入れること。2026-10-02 照合）。
