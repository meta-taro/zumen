version: 1
kind: placement
arrows: true
title: QR コードの作り（先に見つけるものの大きさが、一定）
# **バージョン 1 は 21 × 21 モジュール。** 1 つ上がるごとに 4 増え、
# **バージョン 40 で 177 × 177** になる。
#
# **大きくなっても、切り出しシンボルは 7 × 7 のまま。**
# 21 × 21 でも 177 × 177 でも 3 隅に同じ大きさで入っているので、
# **型番を知らなくても読み始められる** —— 先に見つけるものの大きさが一定であることが、
# この記号の設計の要。
#
# **切り出しシンボルの白黒比は 1 : 1 : 3 : 1 : 1。**
# **縦でも横でも斜めでも同じ比**になるので、**向きが分からないまま探せる。**
# 読み取りが速いのはこのため。
#
# **タイミングパターン**（6 行目・6 列目）はモジュールの刻みを数えるためのもの。
# **形式情報**には誤り訂正レベルと、どのマスクを使ったかが書いてある。
# **クワイエットゾーン**は外周 4 モジュールの余白で、地と区別するために要る。
#
# **誤り訂正は 4 段階。** L が約 7%、M が約 15%、Q が約 25%、H が約 30% まで復元できる。
# **強くすると、入る字が減る** —— 同じ型番なら、復元できる割合が上がるほど
# データに使える符号語が減る。
#
# **マスクは、模様を散らすため。** 黒か白が固まると読み取りにくいので、
# **8 種類の型で白黒を反転させて、いちばん散る型を選ぶ。**
#
# 図はバージョン 1 の割り付けで、符号語（データと誤り訂正）の中身は描いていない。
