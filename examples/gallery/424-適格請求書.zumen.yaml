title: "適格請求書（インボイス）の記載事項 6 つ（消費税額の端数処理は税率ごとに 1 回）"
# 出典：
#   国税庁「適格請求書等保存方式の概要－インボイス制度の理解のために－」https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keigenzeiritsu/pdf/0026004-099-02.pdf（取得 2026-11-11）
#     記載事項①〜⑥・適格簡易請求書との違い・様式は法令又は通達等で定められていない・端数処理（P7）
#   国税庁「インボイス記載事項チェックシート」令和 6 年 2 月（3 月改訂）https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keigenzeiritsu/pdf/0024002-057_a.pdf（取得 2026-11-11）
#     書類の名称は自由・「※は軽減税率対象」の書き方・簡易インボイスは宛名不要
#   国税庁「消費税の仕入税額控除制度における適格請求書等保存方式に関するＱ＆Ａ」https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keigenzeiritsu/pdf/0026004-099-04.pdf（取得 2026-11-11）
#     登録番号の構成：法人番号を有する課税事業者は「Ｔ」＋法人番号（数字 13 桁）
# **インボイスは様式ではなく、載せる事項で決まる。** 様式は法令・通達で定められていない（概要パンフレット）。
# だから請求書の形は例で、①〜⑥の 6 つが載っていることだけが要件。番号は概要パンフレットの順。
# 端数処理：一の適格請求書につき税率ごとに 1 回。個々の商品ごとに端数処理して合計したものは記載事項にできない（同）。
# 登録番号：法人番号を持つ法人は「T」＋法人番号 13 桁（Q&A）。
#
# 座標は mm で考えて px に直した（1px = 25.4/96 mm。paper の margin: 0 で、紙の左上が原点）。
# 決まりではないもの：A4 縦・欄の並び・「御中」・請求金額の欄・税抜で計算したこと・切り捨てを選んだこと（端数の方法は任意）。
# 架空：宛名・発行者・住所・品名・金額・登録番号はすべて架空。登録番号 T1234567890123 は法人番号の検査用数字に合わない（実在しない）数字にした。
# 描かなかったもの：振込先（口座の欄）。記載事項ではないので省いた。
