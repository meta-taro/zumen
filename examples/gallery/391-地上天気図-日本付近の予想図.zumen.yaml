# **地上天気図は、気圧の地形図。** 等圧線は気圧が同じところを結んだ線で、混んでいるところほど風が強い。
#
# 決まり（気象庁「実況天気図の解説」）——
# - 等圧線は 4hPa ごとの細い実線、**20hPa ごと（1000・1020）は太い実線**
# - 高気圧は中心に × と**青の「高」**、低気圧は × と**赤の「低」**。数字は中心気圧（hPa）
# - 前線は 4 種。寒冷＝**青の三角**、温暖＝**赤の半円**、停滞＝青の三角と赤の半円が反対側、閉塞＝**紫**の三角と半円が同じ側
# - **「前線上のマークのない側からマークのある側へ移動」**。寒冷前線は寒気側→暖気側、温暖前線は暖気側→寒気側
#
# 等圧線は手で引かず、**気圧の場（高・低の山と谷の和）から 4hPa ごとに等値線を取った**。
# 前線に沿って気圧の谷を入れてあるので、**等圧線は前線のところで V 字に折れる** —— 実物の天気図と同じ。
# 前線の記号は線に沿って 34px おきに置き、進む向きの側へ向けた（寒冷は南東、温暖は北、閉塞は東）。
#
# 地図は北極を中心とする平射図法（気象庁の天気図と同じ系統。緯線が弧になる）、中心経線 140°E。
# 陸は Natural Earth 1:50m（パブリックドメイン）を 0.9px で間引いた。**国境は描いていない**（陸と海だけ）。
#
# 前線の青は #1f5bff。気象庁の配色指針の青（#0041ff）は暗い地で 3:1 を割るので、白地・暗い地の両方で 3:1 を超える青に寄せた。
# 気圧配置は架空（秋に多い形）。テレビ局の様式は写していない。
palette:
  陸: "#d4e6c3"
  高: "#1f5bff"
  低: "#ff2800"
  寒冷前線: "#1f5bff"
  温暖前線: "#ff2800"
  閉塞前線: "#b400c8"
