version: 1
kind: placement
paper: { size: Naga3, margin: 0 }
title: "長形 3 号封筒の表（定形郵便物の大きさの上限ちょうど。郵便番号の枠は上端から 12mm・右端から 8mm）"
palette:
  朱色: "#e8382a"
# **長形 3 号は、定形郵便物の上限ちょうどの封筒。** 郵便番号の枠の位置は、はがきと同じ（定形郵便物の図）。
#
# 座標は mm で考えて px に直した（1px = 25.4/96 mm。paper の margin: 0 で、封筒の左上が原点）。
# 出典：
#   日本郵便「JIS S5502:2010「封筒」に適合する封筒の条件」（呼称と寸法：長形 3 号 120×235mm）
#   https://www.post.japanpost.jp/service/create/guideline/13.html（取得 2026-11-10）
#   日本郵便「定形郵便物・はがきの基本条件」（定形郵便物：長さ 14〜23.5cm・幅 9〜12cm・50g 以下）
#   https://www.post.japanpost.jp/service/create/guideline/01.html（取得 2026-11-10）
#   日本郵便「郵便番号・バーコードマニュアル 郵便番号枠」〔定形郵便物〕の図（上端から 12.0±1.5mm・右端から 8.0±1.5mm、
#   枠 5.7×8.0mm・間隔 7.0mm・全幅 47.7mm。上 3 けたとハイフン 0.4〜0.6mm・下 4 けた 0.2〜0.4mm。朱色又は金赤色）
#   https://www.post.japanpost.jp/service/search/zipcode/zipmanual/p05.html（取得 2026-11-10）
#   寸法は枠線の内側から測る ―― 描いた線は線の太さの半分だけ外へ出し、内側が 5.7×8.0mm になるようにした。
#   日本郵便「手紙（定形郵便物・定形外郵便物）」（定形郵便物：厚さ 1cm まで・重さ 50g まで）
#   https://www.post.japanpost.jp/send/domestic/charge/list/one_two.html（取得 2026-11-20）
#   内国郵便約款 第 42 条第 4 項（郵便切手は表面の左上部（横長は右上部）にはり付ける）・別記 1「郵便番号を記載する方法」
#   （(1)ア(ｵ) 郵便番号記入枠とあて名との間は 10mm 以上あける。例 1 の図：あて名の範囲は枠の 10mm 下から、右端から 15mm・左端から 10mm 内側。
#   封筒の場合の枠の図は上の〔定形郵便物〕の図と同じ寸法）
#   https://www.post.japanpost.jp/assets/docs/about/disclosure/yakkan/1-3.pdf ／ 1-1.pdf（取得 2026-11-20）
# 枠の下 10mm は「空白とします」（別記 1 (1)ア(ｵ)）、JIS S 5502:2010 6.4 は上端から 35mm 以内に文字・模様を印刷しないとする。
# だから説明の文字（「郵便番号の枠は朱色」）を枠の下に置かず、下の注記へまとめた。
# 題は「いちばん大きい封筒」と言わない（同じ 120×235mm の洋長 3 号もある。洋長 3 号は JIS S 5502:2010 の表 1 には無い呼び名）。
# 架空：住所・氏名。例：切手の大きさ（位置は約款 42 条 4 項の左上部）。
# 描かなかったもの：裏面（差出人・封じ目）。紙 1 枚に 1 面なので、表だけ。
