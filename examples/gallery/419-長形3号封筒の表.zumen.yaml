version: 1
kind: placement
paper: { size: Naga3, margin: 0 }
title: "長形 3 号封筒の表（定形郵便物のいちばん大きい封筒。郵便番号の枠は上端から 12mm・右端から 8mm）"
palette:
  朱色: "#e8382a"
# **長形 3 号は、定形郵便物の上限ちょうどの封筒。** 郵便番号の枠の位置は、はがきと同じ（定形郵便物の図）。
#
# 座標は mm で考えて px に直した（1px = 25.4/96 mm。paper の margin: 0 で、封筒の左上が原点）。
# 出典：
#   日本郵便「JIS S5502:2010「封筒」に適合する封筒の条件」（呼称と寸法：長形 3 号 120×235mm）
#   https://www.post.japanpost.jp/service/create/guideline/13.html（取得 2026-11-10）
#   日本郵便「定形郵便物・はがきの基本条件」（定形郵便物：長さ 14〜23.5cm・幅 9〜12cm・50g 以下）
#   https://www.post.japanpost.jp/service/create/guideline/01.html（取得 2026-11-10）
#   日本郵便「郵便番号・バーコードマニュアル 郵便番号枠」〔定形郵便物〕の図（上端から 12.0±1.5mm・右端から 8.0±1.5mm、
#   枠 5.7×8.0mm・間隔 7.0mm・全幅 47.7mm。上 3 けたとハイフン 0.4〜0.6mm・下 4 けた 0.2〜0.4mm。朱色又は金赤色）
#   https://www.post.japanpost.jp/service/search/zipcode/zipmanual/p05.html（取得 2026-11-10）
# 架空：住所・氏名。例：切手の位置と大きさ（封筒の切手の位置は、確かめた一次資料に書いていない。慣行の左上に置いた）。
# 描かなかったもの：裏面（差出人・封じ目）。紙 1 枚に 1 面なので、表だけ。
