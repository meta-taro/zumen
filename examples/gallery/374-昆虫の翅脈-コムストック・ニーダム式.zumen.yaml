# **昆虫の翅の脈には、どの目（もく）にも通じる名前がある。** 前縁から後ろへ C・Sc・R・M・Cu・A。
# コムストックとニーダムが 1898 年にまとめた呼び方で、**今も昆虫の検索表（見分け方の表）と記載論文の共通語**になっている。
# **何のための図か：** 標本や写真の翅を見て、脈に名前を当てられるようにする。翅室の名前は「前側の脈の名前を借りる」という 1 つの決まりで読める。
#
# ## 決まり（照らしたもの）
#
# - 縦脈は前から C（前縁脈）・Sc（亜前縁脈）・R（径脈）・M（中脈）・Cu（肘脈）・A（臀脈）
# - **枝には前から番号を振る**（Sc₁・Sc₂、R₁…）。R は R₁ と径分脈 Rs に分かれ、Rs は 2 回分かれて R₂〜R₅
# - M は 2 回分かれて M₁〜M₄。Cu は Cu₁ と Cu₂（Cu₁ がさらに分かれるとする説もあるが、この図では分けていない）。A は 1A・2A・3A で、ふつう枝分かれしない
# - 横脈は**つなぐ 2 本の頭文字**で呼ぶ（r-m、m-cu）。名前を持つ横脈に h（肩）・s（Rs の枝どうし）がある
# - **翅室は前側の脈の名前で呼ぶ**。横脈で 2 つに割れたら付け根側から第 1・第 2（R₁ 室が r で割れて第 1 R₁・第 2 R₁）
# - 前側が分かれ目になっている室は、**後ろの枝の名前**を使う（R₂ と R₃ の分かれ目の後ろなら R₃ 室）
#
# ## 描き方
#
# 翅は**一般化した模式**（どの種にもそのままは当たらない）。脈の数は C–N 式で最も多い形にした。
# 色は系統ごと（C 赤・Sc 茶・R 黒・M 緑・Cu 青・A 紫）で、教科書の模式図でよく使われる塗り分け。**色だけでは読ませない**ため、全部の脈の先に名前を書いた。
# 翅の輪郭は Catmull-Rom で刻んだ折れ線、脈の先は輪郭の上の点に吸わせた。
#
# ## 描かなかったもの（理由）
#
# - **実在の種の翅**: トンボは横脈が網の目、ハエは脈が大きく減る。種ごとの翅は別の見本にする（1 枚に混ぜると、どれが模式か分からなくなる）
# - **ほかの流儀**: 現在の研究では Cu を CuA・CuP と呼ぶなど、C–N 式とは違う当て方がある。Snodgrass は、ハチ・トビケラ・チョウの Cu₂ を C–N 式は 1A と取り違えたと書いている。表に 1 行だけ
# - **腋板（翅の付け根の小さな骨片）**: 動かす仕組みの話で、名前の図とは別
# - **脈の凸凹**: 脈は山折りと谷折りの位置に交互に並ぶ（凸脈・凹脈）。平面の図では描けない
#
# 出典（2026-10-06 取得）：
#   Comstock & Needham (1898) The Wings of Insects, The American Naturalist 32（原典は読んでいない。下の 3 つが引く内容で描いた）
#   en.wikipedia「Comstock–Needham system」（翅室の呼び方）
#   J.R. Meyer, ENT 425 External Anatomy: WINGS（NC State University。縦脈の順と横脈の呼び方）
#   en.wikipedia「Insect wing」（Snodgrass の横脈 h・r・s・m・m-cu）
