version: 1
kind: placement
arrows: true
title: ビリヤードのダイヤモンドシステム（スリークッション）
scale: { mm: 5 }
# **台のふちのダイヤは飾りではない。目盛りである。**
#
# 長い辺を **8 等分**（ダイヤ 7 個）、短い辺を **4 等分**（3 個）。
# この目盛りに数字を当てて、**A − B ＝ C** で道筋を決める。
#
# | | |
# |---|---|
# | A | 手玉の位置（左の目盛り。1 1/2 から **1/2 きざみ**）|
# | B | 狙う点（右のクッション。**1 きざみ**）|
# | C | 到達点（左の目盛り。**1 きざみ**）|
#
# **同じダイヤに 2 通りの数字が付いている**のが肝。この図の例は **4 − 1 ＝ 3**。
#
# **ただし、ぴったりではない。** 入射角と反射角は等しくならず、
# 球の位置と撞き方（撞点・速さ・ヒネリ）でずれる。
# **数字は当たりを付けるためのもので、当てるのは腕。**
#
# 1 px ＝ 5 mm。台はキャロムの内寸 2,840 × 1,420 mm。
# 出どころ —— ダイヤモンドシステムの解説（Polster & Ross）。球と撞き方は架空。
