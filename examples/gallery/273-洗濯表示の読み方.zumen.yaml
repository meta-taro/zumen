title: 洗濯表示の読み方（形が処理、付ける印が条件）
# **基本記号は 5 つだけ。** 桶は**洗濯**、三角は**漂白**、四角は**乾燥**、
# アイロンの形は**アイロン**、丸は**商業クリーニング** ——
# **残りは全部、この 5 つに付ける印。**
# 2016 年 12 月に国際規格へそろえて（JIS L 0001）**22 種類から 41 種類**に増え、
# **2024 年 8 月にさらに足された。**
#
# **付ける印は 4 つ。** **数字は温度の上限**（30 / 40 / 50 / 60 / 70 / 95）、
# **下の線 1 本はより弱く・2 本はさらに弱く**、**点は温度**（多いほど高い）、**× は禁止。**
# **数字は「上限」であって「その温度で洗え」ではない** —— 40 なら 40℃ 以下ならよい。
# **旧表示は「40℃を限度」と日本語で書いてあった**ので読めたが、新表示は記号だけ。
#
# **同じ四角でも、中の線 1 本で干し方が変わる。** 中に丸なら**タンブル乾燥**、
# **縦線はつり干し・横線は平干し**（線が 2 本ならぬれ干し）、**左上の斜線は日陰。**
# 編み物を吊るすと伸びるので、平干しの指定がある。
#
# **点は数えるもので、濃さではない。** アイロンは**点 1 つで 120℃、2 つで 160℃、
# 3 つで 210℃** まで（底面温度の上限）。タンブル乾燥は**点 1 つで 60℃、2 つで 80℃。**
#
# **2024 年 8 月 20 日に、また変わった**（JIS L 0001 の改正）。
# **30℃ の手洗い**と**スチームなしのアイロン**の記号が足され、
# **アイロンの上限温度が 10℃ 上がり**（110/150/200 → 120/160/210）、
# 手の形と禁止の × の位置が直された。旧表示は 2025 年 8 月 19 日まで出荷できた ——
# **記号は同じ形のまま、意味だけが変わったので、買った時期で意味が違う。**
#
# **丸の中の文字は、店への指示。** **P** はパークロロエチレン等、**F** は石油系溶剤、
# **W** はウエットクリーニング。**自分に関わるのは ×（禁止）だけ** ——
# 「クリーニング禁止」の服は、家で洗うしかない。
#
# **JIS L 0001 は 2016 年と 2024 年の改正をまたいで指しているので、版を付けていない**（版は確かめていない）。

