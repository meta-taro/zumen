# **1 枚に縮尺が 2 つある。**
#
# 突起 12mm の詳細（①）と、ホーム 6.5m の敷き方（②）は、同じ縮尺には載らない。
# だから views を 2 つ置き、**図ごとに scale を書いた**
# —— 全体図の横に詳細図を置く、ふつうの図面の作法。
#
# 中身は 2 つ。**ブロックは点状と線状の 2 種類しかない**こと（高さはどちらも 5〜6mm）と、
# ホームの縁だけに入る**内方線**が「**こちらがホームの内側**」を教えていること。
# 点だけでは、足の裏で線路側が分からない。
