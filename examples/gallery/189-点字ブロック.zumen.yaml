version: 1
kind: placement
arrows: true
title: 点字ブロックの形と並べ方（JIS T 9251:2014）
scale: { mm: 2.5 }
# **毎日踏んでいるのに、2 種類しかないことも、内方線の意味も知られていない。**
#
# 点状は「注意」、線状は「この向きへ」。突起の高さはどちらも 5.0〜6.0mm。
# ホームの縁だけが 3 つめで、点のほかに**線が 1 本**入る（内方線）——
# **その線がある側がホームの内側。** 点だけでは、足の裏で線路側が分からない。
#
# ① は実寸（突起の径・中心間距離まで JIS の値）。
# ②③ は並べ方の模式で、1 枚 300mm 角の升として描いた。
