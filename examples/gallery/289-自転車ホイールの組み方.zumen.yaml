    label: "バルブ穴の横から"
    align: left
    at: { x: 910, y: 538 }
    size: { w: 320, h: 24 }
  - id: why4
    label: "穴は左右で半ピッチずれている。\nリムの穴が左右のフランジへ交互に向かうので、\n片側のスポークはリムの穴を 1 つ飛ばしで使う ——\nずれていないと、スポークが真横を向く。"
    at: { x: 760, y: 576 }
    size: { w: 470, h: 74 }
  - id: t5
    label: "⑤ 後輪だけの事情"
    marker: none
    align: left
    at: { x: 760, y: 668 }
    size: { w: 470, h: 20 }
  - id: h760_698
    label: "オチョコ（オフセット）"
    hatch: solid
    at: { x: 760, y: 698 }
    size: { w: 470, h: 24 }
  - id: x760_722
    label: "フリー側"
    at: { x: 760, y: 722 }
    size: { w: 150, h: 24 }
  - id: y760_722
    label: "スプロケットが付く側。スポークが短い"
    align: left
    at: { x: 910, y: 722 }
    size: { w: 320, h: 24 }
  - id: x760_746
    label: "反フリー側"
    at: { x: 760, y: 746 }
    size: { w: 150, h: 24 }
  - id: y760_746
    label: "長い"
    align: left
    at: { x: 910, y: 746 }
    size: { w: 320, h: 24 }
  - id: x760_770
    label: "なぜ"
    at: { x: 760, y: 770 }
    size: { w: 150, h: 24 }
  - id: y760_770
    label: "リムの中心を車体の中心に合わせるため"
    align: left
    at: { x: 910, y: 770 }
    size: { w: 320, h: 24 }
  - id: why5
    label: "後輪は左右対称に組めない。\nスプロケットの厚みぶんハブが片寄るので、\nリムを真ん中へ戻すとフリー側だけ角度が立つ ——\n張力も左右で変わる。"
    at: { x: 760, y: 808 }
    size: { w: 470, h: 74 }
  - id: r1
    label: "スポークは、ハブとリムを結ぶ線ではなく、交差のしかたそのものが名前になっています（①③）。"
    marker: none
    align: left
    at: { x: 140, y: 1074 }
    size: { w: 1090, h: 18 }
  - id: r2
    label: "6 本組は 3 クロスです。 基準の 1 本から数えて 6 本目と交わるので 6 本組、交差が 3 つなので 3 クロス —— 同じものです。"
    marker: none
    align: left
    at: { x: 140, y: 1098 }
    size: { w: 1090, h: 18 }
  - id: r3
    label: "穴は左右のフランジで半ピッチずれています（④）。だから片側のスポークは、リムの穴を 1 つ飛ばしで使います。"
    marker: none
    align: left
    at: { x: 140, y: 1122 }
    size: { w: 1090, h: 18 }
  - id: r4
    label: "JIS とイタリアンは、その半ピッチをどちらへずらすかの違いです（②）。裏返して向きが変わらないのが JIS です。"
    marker: none
    align: left
    at: { x: 140, y: 1146 }
    size: { w: 1090, h: 18 }
  - id: r5
    label: "後輪は左右対称に組めません（⑤）。スプロケットの厚みぶんハブが片寄るので、フリー側だけスポークが短く、角度が立ちます。"
    marker: none
    align: left
    at: { x: 140, y: 1170 }
    size: { w: 1090, h: 18 }
