version: 1
kind: placement
arrows: false
title: 自転車ホイールの組み方（交差のしかたが、そのまま名前になる）
# **スポークは、ハブとリムを結ぶ線ではない。**
# 何本目と交差させるかで呼び名が変わり、**交差のしかたそのものが組み方の名前**になる。
#
# **交差させないのがラジアル組**、交差させるのがタンジェント組。
# タンジェント組は交差の数で **4 本組（2 クロス）・6 本組（3 クロス）・8 本組（4 クロス）**。
# **「6 本組」と「3 クロス」は同じもの** —— 基準の 1 本から数えて 6 本目と交わるので 6 本組、
# 交差そのものは 3 つなので 3 クロス。数え方が違うだけ。
#
# **穴は左右のフランジで半ピッチずれている。**
# リムの穴が左右のフランジへ交互に向かうので、**片側のスポークはリムの穴を 1 つ飛ばしで使う。**
# 32H なら片側 16 穴で 6 本組がふつう、36H なら片側 18 穴で 6 本組か 8 本組。
#
# **JIS 組とイタリアン組は、その半ピッチをどちらへずらすかの違い。**
# ハブを正面から見て、上のフランジを外側から通したスポークに対し、
# 下のフランジを内側から通すスポークを**半ピッチ右へ通すと JIS、左へ通すとイタリアン。**
# **裏返しても向きが変わらないのが JIS、逆になるのがイタリアン。**
#
# **後輪は左右対称に組めない。** スプロケットの厚みぶんハブが片寄るので、
# リムの中心を車体の中心へ戻すと**フリー側だけ角度が立つ**（オチョコ／オフセット）。
# フリー側のスポークが短く、反フリー側が長い。張力も左右で変わる。
#
# 組み始めは**バルブ穴の横から** —— 空気入れが差し込める隙間を残すため。
#
# 図は 32H・6 本組。スポーク 32 本をすべて描いてある（実線が手前のフランジ、破線が奥）。
