version: 1
kind: placement
arrows: false
title: 麻雀の配牌（サイコロが決めること）
scale: { mm: 2 }
# **サイコロは運試しではない。どこを開けるかを決める道具である。**
#
# 親が 2 個振り、出目を **2 回**使う ——
# **親を 1 として数えて何番目の山か**、**その山の右端から何幢目で区切るか**。
# この図は 2 ＋ 3 ＝ 5 なので、東家の山を、右から 5 幢目で区切る。
#
# **区切りの右は取らない。** 7 幢 ＝ **14 枚が王牌**で、足りないぶんは隣の山から続ける。
# **ドラ表示牌は区切りから右へ 3 枚目**、嶺上牌は王牌の端の 4 枚。
#
# 配牌は区切りの左から、**東 → 南 → 西 → 北**の順に **2 幢 4 枚 × 3 回**。
# 最後に親が 2 枚（チョンチョン）、子が 1 枚 —— **親 14 枚・子 13 枚**。
#
# 山は **17 幢 × 2 段 × 4 人 ＝ 136 枚**。牌の全部が卓の上に積まれている。
#
# 1 px ＝ 2 mm（牌の幅 26 mm、卓 900 mm）。出目と配置は一例。
