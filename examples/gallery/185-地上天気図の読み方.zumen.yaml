version: 1
kind: placement
arrows: true
title: 地上天気図の読み方（等圧線と前線記号・架空の気圧配置）
# **等圧線は 4hPa ごと。混んでいるところは風が強い。**
#
# 前線は 4 種類で、記号が違う ——
# **寒冷は三角**（寒気が暖気の下へ潜り込む）、**温暖は半円**（暖気が寒気の上へ這い上がる）、
# **停滞は三角と半円が交互に反対側**、**閉塞は同じ側**（寒冷が温暖に追いついた）。
# 記号は**前線が進む向きの側**に付くので、記号を見ればどちらへ動くかが分かる。
#
# 低気圧が発達すると、寒冷前線が温暖前線に追いついて閉塞前線ができる。3 本は 1 点（閉塞点）で
# つながり、閉塞前線は低気圧の中心から閉塞点まで延びる。北半球では温暖前線は北東へ、
# 寒冷前線は東〜南東へ進むので、半円は温暖前線の北側、三角は寒冷前線の東側に付く。
# 記号の決まりは気象庁の地上天気図の表記による。
# 気圧配置は架空。海岸線は描いていない（記号の図）。
