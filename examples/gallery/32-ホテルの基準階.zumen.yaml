version: 1
kind: placement
title: ビジネスホテル 基準階 平面図（客室 11 室・直通階段 2）
# **基準階は「同じ階を何枚も刷る」ための図。**
# 5〜9 階がまったく同じなので、1 枚描けば 5 層ぶんになる。
# **基準階が決まると、建物の幅も柱の間隔も決まる。**
#
# ## 客室の幅は、ベッドと通路で決まる
#
# シングル 20.4 m²（3,400 × 6,000。壁心）は、ベッド幅 ＋ サイドの通路 ＋ 水まわりの積み上げ。
# **狭くできないのはベッドではなく、車椅子が通らない通路のほう。**
#
# ## 内廊下は、両側に部屋を取るため
#
# 片側廊下より廊下 1 本ぶん得をするが、**窓が無いので機械換気と排煙が要る。**
# 図で廊下の位置を決めることは、設備の要る量を決めることでもある。
# ## 階段は 2 つ要る（2026-09-29 に直した）
#
# 宿泊室の床面積の合計がその階で 200 m²（耐火・準耐火）を超えると、**直通階段が 2 以上**要る
# （建築基準法施行令 第 121 条第 1 項第 5 号・第 2 項）。前は階段 1 つで客室 12 室（合計 264 m²）、
# しかも**その階段の扉が 512 号室の中に開いていた**。西の端の 1 室を 2 つ目の階段（EX-2）にし、
# EX-1 の扉は EV ホールから入るようにした。扉は階段室へ向かって開く ＝ **避難の方向**（令 第 123 条第 1 項第 6 号）。
# 5 階以上へ通じる直通階段は**避難階段**（令 第 122 条）。前は「特別避難階段」と書いていたが、
# 特別避難階段は**付室かバルコニーを通って入る**もので（令 第 123 条第 3 項第 1 号）、この図には付室が無い。
# 面積も、前は 13.6 m² と書いていたが寸法（3,400 × 6,000）と合わなかったので、寸法を正として直した。
# 出典 e-Gov 法令検索 https://laws.e-gov.go.jp/law/325CO0000000338 （取得 2026-09-29）
