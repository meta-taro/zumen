    openings:
      # 玄関ドアは**外開き**（靴を脱ぐ土間があるので、日本の住宅は外へ開く）。
      # zumen の扉はいつも箱の内側へ開くので、壁は `open` で抜き、扉は外側の見えない箱（genkan_out）に付けている。
      - { kind: open, side: top, at: 0.55, width: 36 }
      - { kind: door, side: right, at: 0.2, width: 34 }
