version: 1
kind: placement
arrows: true
title: マンションの販売図面（3LDK・架空）
scale: { mm: 20 }
# **面の色**（`fill`）。線の色（`color`）とは別で、**面だけ**を薄く敷く。
# 実物の販売図面も、居室・水まわり・収納を淡く塗り分けている。
# 鍵は「色分け」の凡例に文字で出してある（色を落としても読める）。
palette:
  LDK: "#e8903d"
  洋室: "#d8b53c"
  水まわり: "#3d9ae8"
  収納: "#8b7f6b"
  バルコニー: "#5aa86a"
wall: { mm: 120, outer: 180 }
north: up
# **同じ部屋でも、目的が変われば別の図になる。**
#
# 見本 14 は**平面詳細図** —— 作るための図で、通り芯と実寸が入っている。
# こちらは**販売図面** —— **決めるための図**で、買う人が見る。
# だから寸法は書かず、**帖数と面積**で言い、**家具と設備を描く**。
#
# **線の太さが 3 段ある。** 外壁がいちばん太く、間仕切がその次、
# **家具と設備はいちばん細い** —— 同じ太さで描くと、
# 備え付けなのか置き家具なのかが読めなくなる。
# 細い輪郭は、閉じた辺（`close: true`）で描いている（記号は足していない）。
#
# 決まりごと。**1 帖は 1.62 m² 以上**（不動産の表示規約 第 18 条）。
# **LDK と名乗れるのは、居室 2 部屋以上なら 10 帖以上**（1 部屋なら 8 帖以上）。
# 面積は**壁芯** —— 壁の真ん中で測るので、部屋を足した広さより大きく出る。
#
# **そして、描かれないものがある。** 天井の高さ、窓の高さと形、梁の出っ張り、
# 下がり天井の下端。**間取り図は、何が描いていないかを知って読む図。**
#
# 1 px = 20 mm。帖数はこの図の面積から計算した。間取り・面積・物件は架空。
