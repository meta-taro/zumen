version: 1
kind: placement
arrows: true
title: マンションの販売図面（3LDK＋S・架空）
sources:
  - name: "首都圏不動産公正取引協議会「不動産の表示に関する公正競争規約」"
    url: "https://www.sfkoutori.or.jp/webkanri/kanri/wp-content/uploads/2019/01/kiyak_zenbun.pdf"
    retrieved: 2026-09-29
scale: { mm: 20 }
# **面の色**（`fill`）。線の色（`color`）とは別で、**面だけ**を薄く敷く。
# 実物の販売図面も、居室・水まわり・収納を淡く塗り分けている。
# 鍵は「色分け」の凡例に文字で出してある（色を落としても読める）。
palette:
  LDK: "#e8903d"
  洋室: "#d8b53c"
  水まわり: "#3d9ae8"
  収納: "#8b7f6b"
  バルコニー: "#5aa86a"
wall: { mm: 120, outer: 180 }
north: up
# **同じ部屋でも、目的が変われば別の図になる。**
#
# 見本 14 は**平面詳細図** —— 作るための図で、通り芯と実寸が入っている。
# こちらは**販売図面** —— **決めるための図**で、買う人が見る。
# だから寸法は書かず、**帖数と面積**で言い、**家具と設備を描く**。
#
# **線の太さが 3 段ある。** 外壁がいちばん太く、間仕切がその次、
# **家具と設備はいちばん細い** —— 同じ太さで描くと、
# 備え付けなのか置き家具なのかが読めなくなる。
# 細い輪郭は、閉じた辺（`close: true`）で描いている（記号は足していない）。
#
# 決まりごと。**1 帖は 1.62 m² 以上**（不動産の表示に関する公正競争規約施行規則 第 9 条第 16 号。
# 2026-09-29 まで「表示規約 第 18 条」と書いていたが、条番号が違っていた）。
# **帖数は切り捨てる。** 四捨五入すると 1 帖あたりが 1.62 m² を割る —— 洋室 3 は 7.54 m² で、
# 4.7 帖だと 1.604 m²/帖になり規約に合わない（4.6 帖に直した。LDK も 14.7 → 14.6）。
# 洋室 1 は PS・MB（1.05 m²）を部屋の広さから除いた（3.0 × 3.3 ＝ 9.90 − 1.05 ＝ 8.85 m² ＝ 5.4 帖）。専有面積も同じく
# 外形 10.0 × 8.9 ＝ 89.00 m² から PS・MB を除いて 87.95 m²。
# 2026-10-02 に、洋室 2・WC・洋室 1 へ行く廊下（幅 900）を足して奥行きを 8.0 → 8.9m にした。
# 前は洋室 2 の戸が UB の中へ、WC の戸が洋室 2 の中へ、WIC が WC の中へ開いていて、
# **UB を通らないと洋室 2 に入れなかった。** 廊下の下端にあった物入も、LDK への通り道を塞いでいたので、
# 使われていなかった西の区画（SIC の下）へ移した。
# 出典 https://www.sfkoutori.or.jp/webkanri/kanri/wp-content/uploads/2019/01/kiyak_zenbun.pdf （取得 2026-09-29）
# **LDK と名乗れるのは、居室 2 部屋以上なら 10 帖以上**（1 部屋なら 8 帖以上）。
# 面積は**壁芯** —— 壁の真ん中で測るので、部屋を足した広さより大きく出る。
#
# **そして、描かれないものがある。** 天井の高さ、窓の高さと形、梁の出っ張り、
# 下がり天井の下端。**間取り図は、何が描いていないかを知って読む図。**
#
# 1 px = 20 mm。帖数はこの図の面積から計算した。間取り・面積・物件は架空。
