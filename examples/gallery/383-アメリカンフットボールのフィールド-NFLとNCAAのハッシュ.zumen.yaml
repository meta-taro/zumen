scale: { in: 6 }
title: アメリカンフットボールのフィールド（NFL と NCAA はハッシュの位置が違う）
sources:
  - name: "NFL「2026 Official Playing Rules of the National Football League」Rule 1 Sections 1–3、Field Markings 10"
    url: https://operations.nfl.com/the-rules/nfl-rulebook/
    retrieved: 2026-10-06
  - name: "NCAA「2023 and 2024 Football Rules and Interpretations」Rule 1-2-1・1-2-5・1-2-6、Rule 8-3-2"
    url: https://www.ncaapublications.com/productdownloads/FR23.pdf
    retrieved: 2026-10-06
# **ハッシュ（インバウンズライン）の位置が、NFL と NCAA でいちばん違う。**
# NFL はサイドラインから 70'9"、NCAA は 60 ft（どちらも内側を向いた縁まで）。
# 幅 160 ft から引くと、ハッシュの間は **NFL 18'6"・NCAA 40 ft。**
# **NFL の 18'6" は、ゴールポストの内のり 18'6" と同じ。** ハッシュに置かれた球も、
# ポストの内のりを延ばした線の上にある。NCAA のハッシュは、その延長より 10'9" 外。
#
# **何のための図か。** 審判・施設の担当が、ラインを引く前に「どこに何があるか」を
# 規則書の数で確かめるための図。試合の作戦（隊形・プレー）は描かない。
#
# **描いたもの。** 全長 360 ft × 幅 160 ft、両端 10 yd のエンドゾーン、5 yd ごとのヤード線、
# 1 yd ごとのハッシュ（インバウンズの 2 列とサイドラインぞいの 2 列）、ゴールラインの幅 8 in、
# 10 yd ごとの数字（下端が 12 yd）、トライの線（2 yd・長さ 1 yd）、ゴールポストのクロスバー（18'6"）、パイロン。
#
# **描かなかったもの（理由）。**
# - 数字の脇の矢印・チームエリア・コーチの線・ベンチ —— 線を引く寸法は規則にあるが、本題（ハッシュ）から外れる
# - NFL の支柱がエンドラインからどれだけ下がるか —— 規則に数が無い（offset とだけある）。支柱は模式の長さ
# - NFL のエンドラインのパイロン（各 2 本）の位置 —— 規則は「エンドライン上に 2 本」としか言わない。隅に描いた
# - NCAA の全長・幅 —— 本文ではなく Appendix D の図で与えている。図は NFL の 360 ft × 160 ft で描いた
# - ロゴ・装飾 —— 規則が「ラインを隠さない」条件で認めているだけで、寸法は無い
#
# **1 px ＝ 6 in（1 ft ＝ 2 px）。** ハッシュは長さ 2 ft ＝ 4 px、幅は 1 px で描いた（実物の 4 in は 0.67 px）。
# 数字は線をはさんで 1 字ずつ置いた（実物も線が 2 字の間を通る）。「下端が 12 yd」の下端はサイドライン側と読み、
# 12〜14 yd の帯に置いた（数字の字の大きさは見やすさのため帯より少し大きい）。
# 出典（取得 2026-10-06）：NFL 2026 Official Playing Rules Rule 1 Section 1 Article 1（360 × 160 ft、ゴールラインはエンドラインから 10 yd、
# サイドゾーンは 70'9"）、Section 2 Article 1〜4（ヤード線・ハッシュ 2 ft・ゴールライン 8 in・数字・トライの線 2 yd）、
# Section 3（クロスバー 18'6"・上面 10 ft・支柱はクロスバーの上 35 ft・金色・1 本柱でオフセット）、Field Markings 10（NFL 70'9"／カレッジ 60'）、
# Rule 11 Section 3 Article 1（トライはキック 15 yd・パスとラン 2 yd）。
# NCAA 2023 and 2024 Football Rules and Interpretations Rule 1-2-1-i・k（数字の上端 9 yd・ハッシュ 60 ft・24 in）、1-2-2（内側の縁から測る）、
# 1-2-5（2 本の柱・地面から 30 ft 以上・内のり 18'6"・クロスバー 10 ft）、1-2-6（パイロン 8 か所 ＋ ハッシュの延長に 3 ft 離して 4）、
# 8-3-2-c（トライは相手の 3 yd 線、ハッシュの中間）。NCAA の 2025 年以降の版は有料のため、無料で読める最新の 2023-24 年版で照らした。
