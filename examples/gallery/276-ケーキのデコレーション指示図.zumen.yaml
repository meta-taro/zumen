title: ケーキのデコレーション指示図（飾りの数は、切る数で決まる）
# **飾りの数は「見た目」ではなく、切る数で決まる。**
# 8 人で分けるなら 8 等分にし、**いちごは等分線の上ではなく、あいだに置く** ——
# 線の上に置くと切るときに刃が割って、**どちらの皿にも半分ずつ乗る。**
#
# **号数は直径（1 号 ＝ 1 寸 ＝ 約 3cm）だが、量は面積で増える。**
# 4 号 12cm・113cm²／5 号 15cm・177cm²／6 号 18cm・254cm²／
# 7 号 21cm・346cm²／8 号 24cm・452cm²。
# **5 号 → 6 号は直径で 1.2 倍でも、面積は 1.44 倍**（15² → 18²）——
# 「1 号上げる」は「2 割大きくする」ではなく「**4 割増やす**」。
#
# **切り分けは中心角で決まる。** 6 号（円周 56.5cm）なら
# 6 等分で 60°・外周 9.4cm、8 等分で 45°・7.1cm、12 等分で 30°・4.7cm。
# **外周が 5cm を切ると、先が細くなって切り口が崩れる** ——
# 人数が増えたら等分を増やすのではなく、**号数を上げる。**
#
# **上から見た図だけでは、側面が決まらない。**
# 同じ上面でも、側面がナッペか絞りかで見た目は別物になる。
# プレートの向き（文字の天地）も、**箱を開けた人がどちらから見るか**を別に書かないと伝わらない。
