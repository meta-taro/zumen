title: "出生届（戸籍届書の標準様式 別紙 1。令和 8 年 4 月から。右に出生証明書・下に個人番号カードの申請欄）"
# **役所の窓口や病院で受け取って手で書く様式。** 左が届出人（父母など）の欄、右上が出生証明書（医師・助産師などが書く）、
# 右下の点線枠が個人番号カード交付申請書 兼 電子証明書発行申請書、中央の文は欄ごとの注意。
#
# 罫線は様式の PDF（A3 横）から拾い、字は PDF から位置ごと取り出した。受理・通知の欄の字だけは図形なので絵から読んだ。
# 字の大きさが固定なので、様式を 1.25 倍で描いて A3 へ縮めて収める（紙の上で字は約 2.5mm）。
# 申請欄の（注）は原文が 6pt ほどの細字で、固定の字では原文の行に収まらないため要約した（図の中にもそう書いた）。
# 出典：
#   法務省民事局長通達「戸籍届書の標準様式の全部改正について」令和 8 年 2 月 26 日 法務省民一第 394 号（別紙 1〜35。令和 8 年 4 月 1 日施行、
#   従前の様式の用紙も当分の間使える）別紙 1。内閣府 地方分権改革の提案募集の資料に収録
#   https://www.cao.go.jp/bunken-suishin/teianbosyu/doc/r07/tb_r7fu_08moj_106_1.pdf（取得 2026-11-10）
#   戸籍法 第 49 条（出生の届出は 14 日以内・出生証明書を添付）
# 架空：なし（何も書き込んでいない白紙の様式）。
