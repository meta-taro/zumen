# **日本の電気は、東が 50Hz、西が 60Hz。** 境をまたいで電気を送るには、いったん直流にして周波数を変える。
#
# 決まり・値 ——
#
# | 変換所 | 所在地 | 容量 | 運転開始 | 出典 |
# |---|---|---|---|---|
# | 佐久間 | 静岡県浜松市天竜区佐久間町 | 30 万 kW | 1965 年 10 月（わが国初の 50・60Hz 連系） | 送配電網協議会、ATOMICA |
# | 新信濃 | 長野県朝日村 | 60 万 kW | 1977 年 12 月、1992 年 5 月に増設 | 同上 |
# | 東清水 | 静岡県静岡市 | 30 万 kW | 2006 年 3 月 | 同上 |
# | 飛騨信濃 | 岐阜県高山市（飛騨変換所）― 長野県朝日村（新信濃） | 90 万 kW | 2021 年 3 月 | 送配電網協議会、広域機関 |
#
# - 計 **210 万 kW**（2021 年。それまでは 120 万 kW）。**2027 年度に 300 万 kW**（佐久間地点に 30 万 kW、東清水に 60 万 kW。
#   広域機関「東京中部間連系設備に係る広域系統整備計画」の工事概要）
# - 増強の目的は「大規模事故・災害発生時に供給力が大幅に喪失した際の、50Hz/60Hz 地域間での安定供給確保」（同）
# - 東西で違うわけ：明治初期に東京はドイツ製の 50Hz、大阪はアメリカ製の 60Hz の発電機を採った（ATOMICA）
# - 記号 ▶◀ は、広域機関の資料の凡例で「周波数変換所、BTB」（同じ敷地で交流 → 直流 → 交流）
#
# ## 描き方
#
# 都道府県の輪のうち、**50Hz の県と 60Hz の県が点を共有している辺**をつないで境の線にした（糸魚川の西から山梨・静岡の県境まで）。
# 静岡は**富士川**で切り、東を 50Hz にした（川は 3 点で大づかみ。内房の地名で中ほどを取った）。
# 塗りは半透明なので、静岡は重ねて塗らず、川の東と西に切り分けてから塗った。
#
# **境は本当は県境ではなく、電力会社の供給区域の境。** この図は県と富士川で丸めている。
# 変換所の位置は町の位置（OpenStreetMap で引いた）で、変電所そのものの位置ではない。
#
# ## 描かなかったもの
#
# - 北海道と本州の間の直流連系（周波数はどちらも 50Hz。容量の推移を一次資料で確かめきれなかった）
# - 沖縄（60Hz）。各エリアの地域間連系線（交流）
# - 送電線の経路・電圧（飛騨信濃の直流送電線は、2 つの変換所を直線で結んだだけ）
