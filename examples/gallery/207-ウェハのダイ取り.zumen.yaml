version: 1
kind: placement
arrows: true
title: ウェハのダイ取り（300mm）
scale: { mm: 1 }
# **円に四角を詰めるので、端は必ず捨てる。**
#
# しかも**大きいダイほど、捨てる割合が増える** ——
# 同じ 300mm ウェハで、20mm 角なら 148 個・端の捨て 28.8%、
# 40mm 角なら 32 個・同 46.7%。
#
# 外周 3mm は端の除外で、そもそも使わない（破線の内側だけが有効）。
# 枡の数は、この図を作るときに実際に数えた。
