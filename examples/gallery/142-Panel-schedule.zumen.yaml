version: 1
kind: placement
arrows: false
title: "Panel schedule — LP-1 (fictional)"
# **The schedule is shaped like the panel.**
#
# Odd circuits run down the left, even down the right, exactly as the breakers
# sit in the enclosure. **Phase alternates every row**, so a two-pole breaker
# picks up A and B and balances itself.
#
# A printed copy lives inside the panel door — **NEC 408.4(A)** asks for a
# circuit directory in which every circuit is distinguishable from every other.
# The VA figures here are connected load; **demand factors (NEC Article 220)**
# are applied before sizing the feeder.
#
# **日本語の見本 19（受変電の結線）と対**。あちらは単線結線で系統を、
# こちらは回路表で分岐を書く。
#
# Circuits, loads and the panel are fictional.
