version: 1
kind: placement
title: 物流倉庫 ロケーション図（中量棚 2 列・パレットラック 1 列・リーチフォーク）
# **ロケーション図は、棚を置く図ではなく「通路を取る図」。**
# リーチフォークの旋回に要る幅が先にあって、残りが棚になる。
# **通路を削ると、フォークが回れずに棚へ入れられない。**
#
# ## 有効高さ 5,000 と床荷重が、段数を決める
#
# 棚の段数は高さで決まり、載せられる重さは床荷重（15kN/m²）で決まる。
# **どちらか先に効いたほうが上限。**
#
# ## 基幹通路は、火災のときの道でもある
#
# スプリンクラーの散水を遮らないよう、**棚の天端と天井の間も空ける。**
# 積みすぎると水が届かなくなるので、高さ制限は消防の都合でもある。
# 1 px = 25 mm。中量棚 W1800×D600、パレットラック D1,000、フォーク通路 有効 2,800
#
# ## 2026-09-29 専門家レビューで直したこと
#
# - **番地の数を棚の長さに合わせた。** 列の長さは 15,000。W1800 の棚は 8 連しか入らないのに
#   A-01〜A-16 と書いていた（16 連なら 28.8 m 要る）。A・B は 01〜08 にした。
# - **中量棚は手で出し入れする棚**で、フォークは入れない。フォーク通路（2,800）が要るのは
#   パレットラック（C 列）の前だけ。A・B の間は台車の通路（2,400）にした。
# - **パレットラックの奥行を 1,000 にした**（以前は中量棚と同じ 600。1,100 のパレットが載らない）。
# - **トラックバースの開口を両開き戸の記号から、開口だけにした。** バースはシャッター
#   （または オーバーヘッドドア）で、平面表示記号の両開き戸ではない。zumen にシャッターの記号が
#   まだ無いので、開口として描き、説明にシャッターと書く。開口 2,500、中心間 4,250。
# - C 列（パレットラック）は 1 間口に 1,100 のパレット 2 枚で約 2,700。15,000 に 5 間口。
