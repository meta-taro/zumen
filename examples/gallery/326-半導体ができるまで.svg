<g data-name="ingot"><text x="237" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">シリコンのインゴット</text><text x="237" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">単結晶を引き上げる</text></g>
<g data-name="wafer"><text x="509" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">ウェハ</text><text x="509" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">薄く切って鏡面に磨く</text></g>
<g data-name="film"><text x="804" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">洗浄・成膜</text><text x="804" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">この先の 3 つを、層の数だけ繰り返す</text></g>
<g data-name="litho"><text x="217" y="206" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">フォトリソグラフィ</text><text x="217" y="224" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">塗布 → プリベーク → 露光 → 現像</text></g>
<g data-name="etch"><text x="509" y="299" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">エッチング</text><text x="509" y="317" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">要らない所を取り除く</text></g>
<g data-name="imp"><text x="509" y="193" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">イオン注入</text><text x="509" y="211" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">不純物を打ち込む</text></g>
<g data-name="wire"><text x="795" y="206" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">配線</text><text x="795" y="224" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">金属スパッタ。何層も重ねる</text></g>
<g data-name="wtest"><text x="1070" y="206" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">ウェハテスト</text><text x="1070" y="224" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">ここまでが前工程</text></g>
<g data-name="dice"><text x="217" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">ダイシング・ボンディング</text><text x="217" y="434" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">切り離してパッケージに載せる</text></g>
<g data-name="seal"><text x="509" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">封止・最終テスト</text><text x="509" y="434" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">衝撃と水分から守ってから見る</text></g>

</svg>