<g data-node="imp" data-pinned="false" data-shape="rect"><rect x="429" y="40" width="160" height="76" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-node="wire" data-pinned="false" data-shape="rect"><rect x="674" y="53" width="218" height="76" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-node="wtest" data-pinned="false" data-shape="rect"><rect x="998" y="40" width="160" height="76" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
