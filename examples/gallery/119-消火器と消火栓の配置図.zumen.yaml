version: 1
kind: placement
arrows: true
title: 消火器と屋内消火栓の配置図（歩行距離と水平距離／架空のビル）
scale: { mm: 50 }
# **同じ階の図に、測り方が 2 つ同時に載る。**
#
# ## 消火器は歩行距離、消火栓は水平距離
#
# **消火器**は、あらゆる部分から**歩行距離 20 m 以下**。
# 壁を回り込んだ「**歩く道のり**」で測る。
#
# **屋内消火栓（1 号）**は、各部分からホース接続口までの**水平距離 25 m 以下**。
# **壁を無視した直線**で測るので、図では円で描く。
#
# **取り違えると、届かない所ができる。**
#
# ## 消火器の置き方
#
# **各階ごとに置く**（上の階から借りてこられない）。
# **床面から 1.5 m 以下**、通行と避難の邪魔にならない場所。
# **見やすい位置に「消火器」の標識**を付ける。高温多湿を避ける。
