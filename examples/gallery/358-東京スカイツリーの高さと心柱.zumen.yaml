version: 1
kind: placement
arrows: false
title: 東京スカイツリーの高さと心柱 —— 634m を実寸の比で（天望デッキ・天望回廊・東京タワーとの比較。非公式）
# **634m を、1m ＝ 1px の実寸の比で。** 展望台・心柱・ゲイン塔が、どの高さにあるか。
#
# 東京スカイツリーは 2012 年開業の自立式電波塔。高さ 634m。
# 同じ縮尺に東京タワー（333m・1958 年）を並べると、**東京タワーの先端は天望デッキ（フロア 350）より 17m 低い。**
#
# ## 公式に出ている数（この図はこれだけで描いた）
#
# | | |
# |---|---|
# | 天望デッキ | フロア 340・345・350（3 層） |
# | 天望回廊 | 445m から最高到達点 451.2m へ、スロープを約 110m 歩く |
# | 心柱 | 鉄筋コンクリートの円筒。直径 8m・高さ 375m。壁の厚さは 100m まで 40cm、100〜375m は 60cm |
# | 足元 | 一辺 約 68m の正三角形。**315m から上は円** |
# | ゲイン塔 | アンテナの鉄塔、約 140m |
# | エレベーター | 地上〜天望デッキ 4 基・分速 600m・約 50 秒、天望デッキ〜天望回廊 2 基・分速 240m・約 30 秒 |
#
# ## 心柱制振
#
# 心柱と外側の塔体は**構造として分けてあり**、あいだを心柱の 125m から上でオイルダンパーがつなぐ。
# 2 つが違う周期で揺れて打ち消し合い、**揺れを最大 50% 減らす**（公式）。五重塔の心柱になぞらえた名前。
#
# ## 計算してみた所
#
# 350m ÷ 分速 600m ＝ 35 秒。公式の「約 50 秒」との差 15 秒は、**加速と減速のぶん**
# （速さの数字は「いちばん速いとき」の値）。これは図の中で「計算」と分かるように書いた。
#
# ## 描かなかったもの
#
# - **塔体の輪郭（そり・むくり）。** 公式に寸法が出ているのは足元の一辺と「315m で円」だけで、途中の幅は無い。
#   推測の曲線を描くと、実物の図のふりをする。だから中心線と、寸法のある所だけ
# - **公式の案内図・ロゴ。** この図は公開されている数から描き直した非公式の図
# - **エレベーターの事故などの報道。** 公式の報告が出ていないものは描かない
#
# 出典: 東京スカイツリー公式サイト「アウトライン」「02 東京スカイツリーの構造（2）各部紹介・（4）塔体のしくみ」、
# 「天望デッキ」「天望回廊」。東京タワー公式サイト（メインデッキ 150m・トップデッキ 250m）。
