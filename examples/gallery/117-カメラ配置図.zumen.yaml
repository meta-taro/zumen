version: 1
kind: placement
arrows: true
title: Camera Plot（会話シーンのカメラ配置とイマジナリーライン）
# **カメラをどこに置くかは、好みではなく決まりごと。**
#
# ## イマジナリーライン
#
# 話す二人を結ぶ**仮想の線**。人物や車の**進行方向**にも引く。
#
# **カメラは、線の片側 180 度の半円の中だけに置く**（180 度の原則）。
# 越えて撮ると、**画面の左右が入れ替わって視線が合わなくなる。**
#
# ## 越えたいとき
#
# - **カットの切り替わりで越えない**
# - **同じカットの中で、カメラが動いて越えるのはよい**（観客が移動を見ている）
# - **人物が動けば、線は引き直される**
# - **引きのニュートラルショットを 1 つ挟む**
#
# ## 寄る順番
#
# 最初のロングで位置関係を見せてから寄る。
# **寄っても左右は変えない** —— A は画面の左、B は右を向き続ける。
