  エコー: "#a33a3a"
# **「遅れ」は、距離の差そのもの。**
#
# 反射音の経路 − 直接音の経路 を 340m/s で割れば ms になる。**1ms ＝ 0.34m。**
#
# 20〜35ms は「よい初期反射」、**50ms を超えると別の音（エコー）**。
# 残響は T ＝ 0.161 V / A（セイビン）。**人も吸音材**なので、満席と空席では別のホールになる。
