version: 1
kind: placement
arrows: true
title: "Marching band drill chart (fictional)"
# **A drill chart carries no dimensions. The field is the ruler.**
#
# Every position is written as steps from the nearest yard line and the nearest
# hash: "4.0 steps inside the 35 yd ln, side 1 / 8.0 steps behind the front
# hash". That sentence is what a marcher copies into a dot book.
#
# **8 to 5** means eight steps to five yards, so one step is 22.5 in and the
# yard lines land on whole steps. **The hashes do not.** On a high school field
# the hash sits 53 ft 4 in from the sideline, which is 28.4 steps; on a college
# field it is 60 ft, which is exactly 32. **The same drill lands 3.6 steps off**
# on the other field - so the chart has to say which hash it was written to.
#
# 1 px = 0.5 ft. The show, the dots and the counts are fictional.
