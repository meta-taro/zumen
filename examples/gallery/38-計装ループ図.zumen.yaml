version: 1
wrap: true
title: 計装ループ図（TIC-101・熱交換器の出口温度制御）
# **ループ図は、1 つの制御ループだけを描く。**
# P&ID がプラント全体なら、ループ図は**その中の 1 本を最後まで**追う図。
#
# ## TIC-101 は、名前ではなく組み立て
#
# 変量の文字（T ＝ 温度）＋機能の文字（I ＝ 指示、C ＝ 調節）＋個別番号。
# **JIS Z 8204** は、これを直径 10mm の丸の中へ、
# 上に文字記号・下に個別番号と決めている。
#
# ## 4〜20mA なのは、0 を空けておくため
#
# 0mA を「測定値ゼロ」に使わない。**0 は断線**。
# 下限を 4mA にしてあるので、線が切れたことと、値が下がったことを区別できる。
#
# ## 安全計装は、制御系と別に測る
#
# 同じ発信器から取ると、**それが壊れたときに両方とも効かない。**
# 温度スイッチが独立して測温しているのは、そのため。
