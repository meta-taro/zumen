title: 架空電鉄 中央駅 配線略図（2 面 4 線・待避可能／引上線 1 本）
# 駅の線路のつながりを描いた図。**線が主役**で、駅の形ではない。
# 左が港町方（上り）、右が海浜公園方（下り）。上下の並びは**番線**であって、
# 実際の高さや距離ではない（略図なので縮尺を持たない）。
#
# 1・4 番線が本線、2・3 番線が待避線。両端の分岐器で出入りする。
# 分岐器の番号（11・12・21・22）と信号機の識別は、実物と同じく図の中に書く。
#
# **信号機の図記号は JIS E 3012（鉄道信号用図記号）で決まっているが、まだ持っていない。**
# ここでは丸と識別名で代用している（凡例で対応を言う）。
# なお「配線略図.net」などで使われている記号は作者独自のもので、業界標準ではない。
