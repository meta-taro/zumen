version: 1
kind: placement
arrows: false
title: 一般配置図（499 総トン型 内航貨物船／架空の船）
# General Arrangement（GA）。**造船で最初に描かれ、最後まで参照される 1 枚。**
#
# 実物の GA は「甲板ごとの平面図を縦に積み、いちばん上に側面図を置く」形をしている。
# **1 枚の紙に図が 5 つ 6 つ載る**ので、寸法系は図ごとに要る（D35。views）。
#
# 横の基準は**肋骨番号（フレームナンバー）**。FR.0 を船尾垂線 A.P. に置き、
# 船首へ向かって増やす —— **番号の向きは造船所で違う**ので、図に断る必要がある。
# 肋骨心距（フレームスペース）はこの船で 600 mm（1 万トン級でも 600〜800 mm）。
#
# 縦の基準は**レベル**（基線 B.L. からの高さ）。側面図では通り芯ではなくこちらを使う。
#
# 区画の記号は JIS F 0053:2000（造船－船舶一般配置図記号）に、隔壁・甲板設備・階段・
# ハッチとカバー・衛生設備など 9 分類が定められている。
#
# 1 px = 60 mm。ただし**操舵室の詳細だけ 1 px = 30 mm**（実物の GA も詳細は倍尺で置く）。
scale: { mm: 60 }
views:
  - id: profile
    title: 側面図（Profile）
    at: { x: 60, y: 40 }
    size: { w: 1033, h: 210 }
    scale: { mm: 60 }
    grid:
      x:
        - { id: FR.0, at: 100 }
        - { id: FR.20, at: 300 }
        - { id: FR.40, at: 500 }
        - { id: FR.60, at: 700 }
        - { id: FR.80, at: 900 }
        - { id: FR.95, at: 1050 }
      y:
        - { id: "航海船橋甲板 10,400", at: 70, mark: level }
        - { id: "上甲板 5,200", at: 156, mark: level }
        - { id: "満載喫水 4,000", at: 176, mark: level }
        - { id: "基線 B.L.±0", at: 243, mark: level }
  # **側面図の右端にもレベル名が出る**（符号は左右の両方に出るのが図面の作法）。
  # 最初は側面図の真横へ置いていて、**その名前がこの図に乗っていた** ——
  # 数の検査は 0 のままで、ブラウザで開くまで気づかなかった。高さをずらして逃がす。
  - id: bridge
    title: 航海船橋甲板（詳細　1 px ＝ 30 mm）
    at: { x: 1160, y: 420 }
    size: { w: 420, h: 190 }
    scale: { mm: 30 }
    grid:
      x:
        - { id: FR.6, at: 1160 }
        - { id: FR.12, at: 1340 }
        - { id: FR.18, at: 1520 }
  # **上甲板には肋骨番号を書かない。** 上の側面図と縦に揃えてあるので、
  # 実物の一般配置図でも番号は側面図といちばん下の図にしか入らない。
  - id: upper
    title: 上甲板（Upper Deck）
    at: { x: 60, y: 420 }
    size: { w: 1033, h: 167 }
  - id: tanktop
    title: 二重底・タンク配置（Tank Top）
    at: { x: 60, y: 660 }
    size: { w: 1033, h: 167 }
    scale: { mm: 60 }
    grid:
      x:
        - { id: FR.0, at: 100 }
        - { id: FR.40, at: 500 }
        - { id: FR.80, at: 900 }
        - { id: FR.95, at: 1050 }
