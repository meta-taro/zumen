title: 空気清浄機の中身（「8 畳」は 8 畳用という意味ではない）
# **プレフィルタは必ずいちばん前。** この図はプレ（大きなゴミ）→ 集じん（HEPA）→ 脱臭 → ファン（集じんと脱臭の順は機種で違う）。
# **プレで大きなゴミを止めないと、HEPA が数か月で詰まる。**
# プレは洗えるが **HEPA は洗えない**（繊維の隙間が壊れて性能が落ちる）——
# **だから、洗えるプレを前に置いて、洗えない HEPA を守る。**
#
# **「8 畳」は「8 畳用」ではなく「8 畳を 30 分で」の意味**（JEM 1467。JEMA Q&A の説明）。
# 天井高 2.4m の部屋で、粉じん **1.25 mg/m³** を **0.15 mg/m³**（ビル管法の基準）まで
# **30 分**で下げられる広さを、適用床面積と呼んでいる。
# だから **清浄時間 ＝ 30 分 × （部屋の広さ ÷ 適用床面積）** ——
# 8 畳の部屋に 24 畳の機械なら **10 分**。**実際の畳数の 2〜3 倍を選ぶのが定番**なのはそのため。
#
# **HEPA は素材でも形でもなく「この試験に通った」という印**（JIS）。
# 定格風量で **0.3μm の粒子を 99.97% 以上**捕集し、**初期圧力損失 245Pa 以下**。
# 0.3μm が基準なのは**いちばん捕りにくい大きさ（0.1〜0.3μm あたり）に近い**から ——
# **0.3μm で 99.97% なら、大きい粒はそれ以上に捕れる**（いちばん捕りにくい点は 0.3μm より少し小さいことが多い）。
#
# **245Pa は「初期」の値。** 使ううちにほこりが詰まって圧力損失が上がり、
# 同じファンでも風量が落ちて**清浄時間が延びる** ——
# 捕集率は落ちない（目詰まりでむしろ上がる）ので、
# **性能が落ちたことは音でも風でも分かりにくい。**
#
# **置き方で、同じ機械が別の性能になる。** 適用床面積は
# **空気が機械を通ること**を前提にした数字で、隅に置いて吹出が壁を向いていると
# **同じ空気を何度も吸って、部屋の反対側は動かない。**
#
# 出典：JEMA「JEM 1467 家庭用空気清浄機」（1995-03-17 制定、最新改正 2026-03-19）https://www.jema-net.or.jp/engineering/JEM_JEM-TR/JEM1467.html 、
# JEMA Q&A（適用床面積＝30 分で清浄できる広さ）https://www.jema-net.or.jp/living/kuusei/qa.html 、
# HEPA の定義は JIS Z 8122（ニッタ株式会社 FAQ で文言を確認）。取得 2026-09-29。
# JEM 1467 の改正年月（2026-03-19）は JEMA の頁で確かめた（2026-10-04）。本文は会員限定で、2026 年版で適用床面積の
# 算定条件が変わっていないかは読めていない。JEMA Q&A で確かめられたのは「30 分で清浄できる広さ」まで。
# 1.25→0.15 mg/m³・天井高 2.4m はメーカーのカタログ注記で広く使われる数字で、規格本文では確かめていない。JIS Z 8122 の版も確かめていない。
# JEM 1467・JIS Z 8122 の**版は確かめていない**。

