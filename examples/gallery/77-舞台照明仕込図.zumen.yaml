version: 1
kind: placement
arrows: false
title: 架空ホール 中ホール 舞台照明仕込図（Light Plot ＋ Channel Hookup）
# 実物の仕込図は **図 1 枚では完結しない** —— 平面の Light Plot と、
# チャンネル一覧（Channel Hookup）の 2 点で運用される。ここでも同じ形にした。
#
# 上が舞台奥（ホリゾント）、下が客席。縦の一点鎖線がセンターライン。
# 器具の種類は **印と模様の組み合わせ**で示す（USITT の器具記号は持っていないため、
# 凡例で対応を言う）。器具の中の数字が Ch。
# 器具は各バトンにセンターライン（CL）を挟んで左右対称に吊る。
grid:
  x:
    - { id: "CL", at: 360, mark: tick }
parts:
  # 器具は種類ごとに部品（parts）にした。形（印と模様）は部品の 1 か所で決め、
  # 置くたびに変わる Ch（tag）だけを set に書く。器具の中の名前は f1.body のようになる。
  # パーライト
  parlight:
    nodes:
      - { id: body, label: "", marker: ellipse, hatch: dots, at: { x: 0, y: 0 }, size: { w: 26, h: 26 } }
  # フレネル
  fresnel:
    nodes:
      - { id: body, label: "", marker: circle, hatch: cross, at: { x: 0, y: 0 }, size: { w: 26, h: 26 } }
  # エリプソ
  ellipsoidal:
    nodes:
      - { id: body, label: "", marker: box, hatch: lines, at: { x: 0, y: 0 }, size: { w: 26, h: 26 } }
  # ホリゾント
  cyc:
    nodes:
      - { id: body, label: "", marker: bar, hatch: solid, at: { x: 0, y: 0 }, size: { w: 26, h: 26 } }
place:
  - { part: parlight, as: f1, at: { x: 107, y: 137 }, set: { body: { tag: 1 } } }
  - { part: parlight, as: f2, at: { x: 227, y: 137 }, set: { body: { tag: 2 } } }
  - { part: parlight, as: f3, at: { x: 347, y: 137 }, set: { body: { tag: 3 } } }
  - { part: parlight, as: f4, at: { x: 467, y: 137 }, set: { body: { tag: 4 } } }
  - { part: parlight, as: f5, at: { x: 587, y: 137 }, set: { body: { tag: 5 } } }
  - { part: fresnel, as: f11, at: { x: 107, y: 201 }, set: { body: { tag: 11 } } }
  - { part: fresnel, as: f12, at: { x: 227, y: 201 }, set: { body: { tag: 12 } } }
  - { part: fresnel, as: f13, at: { x: 347, y: 201 }, set: { body: { tag: 13 } } }
  - { part: fresnel, as: f14, at: { x: 467, y: 201 }, set: { body: { tag: 14 } } }
  - { part: fresnel, as: f15, at: { x: 587, y: 201 }, set: { body: { tag: 15 } } }
  - { part: ellipsoidal, as: f21, at: { x: 107, y: 265 }, set: { body: { tag: 21 } } }
  - { part: ellipsoidal, as: f22, at: { x: 227, y: 265 }, set: { body: { tag: 22 } } }
  - { part: ellipsoidal, as: f23, at: { x: 347, y: 265 }, set: { body: { tag: 23 } } }
