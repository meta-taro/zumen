version: 1
kind: placement
arrows: false
title: 網点 —— 点の大きさで濃さを出す（線数・点の形・角度）
# **印刷は、濃い薄いを作れない。** インクを置くか置かないかの 2 つしかない。
# 中間の濃さは、**点の大きさを変えて目に混ぜさせる**ことで作る。これが網点。
#
# ## 網点 % は面積の割合
#
# 「50% の網点」は、**点が升目の半分を覆っている**ということ。
# 升目に丸を描くと、面積 **78.5%** でちょうど隣と触れる。
# 刷ると点は太る（**ドットゲイン**）ので、紙の上では **70% あたりで繋がる。**
#
# ## 繋がる % が、点の形で変わる
#
# 繋がった瞬間、そこだけ急に濃くなる（**トーンジャンプ**）。
#
# | 点の形 | 繋がる % | どうしてそれを使うか |
# |---|---|---|
# | 丸（ラウンド）| 約 70% | いちばん安定。ただし 70% で一段濃くなる |
# | 角（スクエア）| 50% | **ちょうど中間**で繋がるので、飛びが目に付く |
# | 楕円（エリプティカル）| 約 **40% と 60%** の 2 回 | 繋がりを 2 回に分け、1 回ぶんを小さくする |
#
# ## 線数（スクリーン線数・lpi）
#
# | どこで使うか | 線数 lpi | 1mm あたり |
# |---|---|---|
# | 新聞 | 85 | 約 3.3 本 |
# | 雑誌・カタログ | 150 | 約 5.9 本 |
# | 商業印刷 | 175 | 約 6.9 本 |
# | 美術印刷 | 300 | 約 11.8 本 |
#
# **新聞が 85 なのは、紙が吸ってにじむから。** 上げても潰れて損をする。
#
# ## 角度をずらす理由
#
# 同じ模様を 2 枚重ねると、必ず**うなり（モアレ）**が出る。
# 角度が近いほどうなりの周期が長く、目に付く大きな縞になる。
#
# | 色 | 角度 | なぜ |
# |---|---|---|
# | 黒 K | **45°** | 人の目がいちばん鈍い向き。いちばん濃い色をここへ置く |
# | マゼンタ M | 75° | K から 30° |
# | シアン C | 15° | K から 30°、M から 60° |
# | イエロー Y | 0° | 目立たないので、残った隙間へ |
#
# 網点は **90° で元へ戻る**ので、15° と 105° は同じもの。
# **この組み合わせは唯一の標準ではない。** C と M を入れ替える流儀（C 75°・M 15°）、
# Y を 90° や 30° と書く資料もある。**動かないのは「K を 45°」「濃い 3 色は 30° ずつ」の 2 つ。**
# 濃い 3 色を 30° ずつ離し、いちばん薄い黄を 15° の隙間へ押し込む ——
# **うなりを消すのではなく、目に障らないうなりを選んでいる。**
# 4 色が重なって出る花模様（ロゼット）が、その「選んだうなり」である。
#
# ## この図の作り方
#
# **点はインク、地は紙。** 暗い画面では色が入れ替わるので、
# 「白い」「黒い」ではなく「インク」「紙」で書いてある（見た目の明暗は画面の側で逆になる）。
#
# ①の球は**計算して置いた。** 法線と光の向きの内積（ランバート）で濃さを出し、
# **点の面積がその濃さに等しくなる**ように半径を `√(濃さ/π) × 間隔` にしてある。
# 3 枚は**同じ式で、間隔だけが違う。**
#
# 見本 337（露出と EV）、見本 170（レゴのモザイク割り付け）も、
# 連続した濃さを離散の粒へ落とす話。
