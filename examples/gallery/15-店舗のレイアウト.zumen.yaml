version: 1
kind: placement
title: コンビニの売場（1 マス = 900mm を 30px として）
# **コンビニの売場は、店の奥へ歩かせるように並べてある。**
# 入口の正面に雑誌、いちばん奥に飲料の冷蔵ケース ——
# **よく買うものを遠くに置く**のは、その道すがらを見せるため。
#
# ## レジは入口の近く
#
# 出口で会計するので、動線は「入口 → 奥 → 戻ってレジ」の輪になる。
# 図で確かめるのは、**その輪が途中で切れていないか。**
#
# ## バックヤードから冷蔵ケースへ直結する
#
# 冷蔵ケースは裏から補充する（ウォークイン）。
# だから**売場の動線と補充の動線が交わらない。** 交わる店は、補充のたびに客が止まる。
