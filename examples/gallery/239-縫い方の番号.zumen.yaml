version: 1
kind: placement
arrows: true
title: 縫い方には番号がある（JIS L 0120 / L 0121）
# **縫い方は、言葉ではなく番号で指定する。**
# 「本縫いで」ではなく「301 で」—— 国が違っても、同じ番号は同じ縫い方。
#
# **ステッチは 3 けた**（第 1 けたがクラス 100〜600、残り 2 けたが細分）、
# **シームは 5 けた**（クラス 1〜8 ／ 布の構成 ／ 針の位置と布の状態）。
#
# **ステッチとシームは別の規格**（ISO 4915 と 4916）——
# 糸の絡み方と布の重ね方は別々に決められるので、番号も別。
# 縫製仕様書は「301 で、1.01 のシーム」と組で書く。
