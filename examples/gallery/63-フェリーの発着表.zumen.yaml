# 待合所に貼ってある発着表。上が航路、下が便ごとの表。
# 車両航送の可否と運航日は、便ごとに違う（フェリーはここが要る）。
# 航路は直線ではないので curve: smooth で通している。
#
# **時刻だけの表にできないのが、フェリーの発着表。**
# 同じ航路でも便ごとに**車両を載せられるかどうかと運航日が違う** ——
# 時刻が合っていても、車で行く人はその便に乗れないことがある。
#
# **改正日を必ず入れる。** 待合所には前の版が貼られたままのことがあり、
# **どちらが新しいかは日付でしか分からない。**
