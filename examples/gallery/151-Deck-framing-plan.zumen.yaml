# **A deck is a load path.** Boards to joists, joists to the ledger and the
# beam, beam to posts, posts to footings —— seven parts, and leaving one out
# means the load has nowhere to go.
#
# The ledger is the half that fails quietly: **it is bolted to someone else's
# building**, so it is the one connection the deck does not own.
#
# Sizes and spans are fictional; span tables decide them in practice
# (IRC R507 / AWC DCA 6).
