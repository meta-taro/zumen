version: 1
kind: placement
arrows: false
title: "Plain Bob Minor - the work of one lead"
# **A method is not a tune. It is a path through a grid.**
#
# Six bells strike once each, in order: that is a row. In the next row every
# bell moves **one place, or stays** - never two, because a bell cannot jump.
# What a method does is say which bells stay, change by change.
#
# Plain Bob Minor writes that as **-16-16-16,12**: X means every pair swaps,
# 16 means the 1st and 6th stay, 12 means the 1st and 2nd stay. Twelve changes
# make a lead; **five leads bring the bells back to rounds** (60 changes).
#
# **Nobody reads the numbers while ringing.** They ring the line - the shape
# drawn through the grid - and the numbers are the proof that the line is right.
# That is why the diagram carries both on the same grid.
