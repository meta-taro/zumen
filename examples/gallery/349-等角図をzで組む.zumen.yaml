version: 1
kind: placement
arrows: false
projection: isometric
title: 等角図を、座標に z を書いて組む
# **この正本には、紙の座標が 1 つも無い。** 書いてあるのは立体の **x・y・z** だけで、
# 紙へ落とすのは機械（`projection: isometric`）。
#
# ## 等角図の約束
#
# **軸のあいだは 120°、2 本は水平から 30°。** だから 3 方向を同じ物差しで測れる。
#
# | 立体で 100 動かすと | 紙では |
# |---|---|
# | x（間口）| 右へ 86.6・下へ 50（cos30°・sin30°）|
# | y（奥行き）| 左へ 86.6・下へ 50 |
# | z（高さ）| 真上へ 100 |
#
# ## 見本 197 との違い
#
# 197（等角図と三面図）は、この掛け算を**人が電卓で出して 104 点を手打ち**している
# （`399 + 100 × cos30° = 485.6`）。**ここは z を書くだけ。**
#
# ## 箱は落ちない（いまの限界）
#
# **`projection` が落とすのは点の位置だけ。** `size: { w, h }` の箱は紙の上で
# 軸に平行な長方形のままなので、**立体の面にはならない。**
# だから立体は**点と線で組む** —— 197 も同じ描き方をしている。
#
# 面を塗りたくなったら、そのとき `box` を平行四辺形へ落とす話をする。
# **いまは当たっていないので足さない。**
#
# ## 隠れ線
#
# 実物の図面は、奥の物に隠れた辺を**破線**にする。**機械は判定しない**
# （どれが隠れるかは意味の判断）—— 書いた人が `line: dashed` で書く。
# ここでは奥の 3 本をそうしてある。
