title: 中古車 査定図（外板価値減点・展開図／架空の車両）
# 査定士が車の周りを回りながら、**その場所に記号を書き込む**紙。
# 中央が上から見た面、左右が側面、上下が前後。**書く位置が車体の位置**そのもの。
#
# 記号は JAAI（日本自動車査定協会）の基準に基づくもの。
# A＝キズ、E＝エクボ、U＝凹凸・ズレ、W＝補修、S＝サビ、C＝腐食、
# Y＝ワレ・ビス穴、X＝要交換、XX＝交換済み。数字 1〜3 が程度（3 が重い）。
#
# **外板の減点と修復歴は別の話。** 修復歴は骨格部位（ピラー・メンバー・フロア等）の
# 修正・交換を指すので、下の欄で別に見る。
