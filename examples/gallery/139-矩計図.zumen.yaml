title: 矩計図（木造軸組・平屋の外壁まわり／架空）
# **矩計図（かなばかりず）は、建物を垂直に切って基礎から軒まで通しで見る図。**
# 縮尺は 1/50〜1/20（住宅は 1/30 が多い）。
#
# ## この図で 7 つの高さが決まる
#
# 基礎の深さ／立上り／土台上端／1FL／2FL／軒桁の高さ／最高高さ ——
# **施工の基準はここで決まる。** だから `mark: level` で書く。
#
# ## 外壁は順番で書く
#
# **外装仕上げ → 通気層 → 構造用面材 → 断熱材 → 内装下地 → 内装仕上げ。**
# 縮尺 1/30 では層ごとに線を引けないので、**厚みは表で言う**（実物もそうする）。
#
# ## 法令が寸法を決めている
#
# | | |
# |---|---|
# | 令 22 条 | 最下階の木造の居室の床は、直下の地面から**床上面まで 450 以上** |
# | 令 22 条 | 床下換気は**壁の長さ 5 m 以下ごとに 300 cm² 以上**（ねずみの侵入を防ぐ） |
# | 令 21 条 | 居室の**天井高 2,100 以上** |
# | 告示 1347 号 | 基礎の**立上りは地盤面から 300 以上** |
#
# 1 px ＝ 10 mm。寸法・仕様はすべて架空。
scale: { mm: 10 }
