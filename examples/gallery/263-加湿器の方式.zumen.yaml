title: 加湿器の方式と適用畳数（熱をどこから取るか）
# **方式の違いは、蒸発させる熱をどこから取るかの違い。**
# スチーム式は電気から（300〜500W）、気化式は部屋から（10〜20W）——
# **気化式が省エネに見えるのは、熱を部屋に払わせているから。**
# 打ち水と同じで、気化式を使うと室温は下がる。
#
# **スチーム式だけ桁が違う理由は、計算で出る。** 水の蒸発潜熱は **2,257 kJ/L ＝ 627 Wh/L**。
# 500mL/h なら 314W、20℃ から 100℃ まで温める分が 46W で、**合計 約 360W**。
# 温度を上げる熱より、**蒸発させる熱のほうがずっと大きい。**
#
# **超音波式だけ、出てくるものが違う。** 水蒸気は目に見えない ——
# **白い霧は、まだ蒸発していない水の粒。** 粒には水道水のミネラル（乾くと白い粉）も、
# タンクで増えた菌も乗ったまま出る。
#
# **適用畳数が 2 つ書いてあるのは、どちらか一方では嘘になるから。**
# 同じ 500mL/h で**木造和室 6 畳／プレハブ洋室 10 畳**（JEM 1426、室温 20℃・湿度 30% で測る）。
# 木造は隙間が多く、畳・障子・土壁が水分を吸う。
#
# **要る量は、外の乾いた空気が決める。** 8 畳（32m³）・換気 0.5 回/h なら
# 室内 8.65 g/m³ と外気 3.4 g/m³ の差 5.25 g/m³ × 16m³ ＝ **約 84 g/h**。
# **部屋の広さより、隙間の多さで決まる。**
#
# **上げすぎると、窓が受け止める。** 20℃・湿度 50% の露点は約 9℃ で、
# 単板ガラスの表面は外 0℃ のとき約 8℃ —— **上げたぶんが窓で水に戻り、部屋は湿らない。**
