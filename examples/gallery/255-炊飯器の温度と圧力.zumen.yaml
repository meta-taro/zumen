version: 1
kind: placement
arrows: true
title: 炊飯器の温度と圧力（足されているのは弁ひとつ）
# **水は、沸いている間は温度が上がらない。** ふつうの鍋では 100℃ が上限で、
# それ以上の熱は入れられない。**圧を上げると沸点が上がり、その上限が動く**
# —— 1.2 気圧で約 105℃。圧力 IH に足されているのは、**弁ひとつ。**
#
# **IH のコイルは 1 つではない。** 底だけだと上が炊けないので、
# 側面からも入れて**釜そのものを発熱させる**（IH は釜が発熱体）。
#
# 炊飯は 4 つの工程 —— **浸水**（30〜60 分。米が水を吸うのは、まだ冷たいうち）、
# **昇温**（10〜12 分）、**沸騰維持**（約 20 分。ここでデンプンが糊化する）、
# **蒸らし**（10〜15 分）。
#
# **減圧は、かき混ぜる代わり。** 炊飯中はふたを開けられないので、
# 圧を抜いて中の水を一気に沸かせ、米を動かしてムラを減らす。
