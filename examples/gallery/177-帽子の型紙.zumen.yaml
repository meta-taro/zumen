version: 1
kind: placement
arrows: true
title: 帽子の型紙（クラウンとブリムの展開・架空）
# **帽子の側面は円錐台。展開すると扇になる。**
#
# 高さ 12cm の側面が、展開すると**半径 49.71cm の扇**になる ——
# 外半径 R ＝ 斜辺 × 下周 ÷（下周 − 上周）で、上下の周が近いほど扇は大きい。
#
# ブリムはドーナツ型。**内周が頭囲と同じ**になるように、内半径を 周 ÷ 2π で決める。
# 帽子のサイズは**スベリ（かぶり口の内側）の内周**で、かぶる人の頭囲と同じ長さ。
#
# 実線が出来上がり線、破線が縫い代線（1cm）。寸法はすべて計算した値。
