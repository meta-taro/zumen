  - id: th181
    label: "コード表の読み方"
    marker: box
    at: { x: 60, y: 500 }
    size: { w: 1000, h: 24 }
  - id: ta182
    label: "向き（縦向き）"
    marker: box
    at: { x: 60, y: 524 }
    size: { w: 200, h: 24 }
  - id: tb183
    label: "ギターを立てて正面から見た向き。縦の線が弦で、左端が 6 弦（低い E）、右端が 1 弦（高い e）。横の線がフレット"
    marker: box
    align: left
    at: { x: 260, y: 524 }
    size: { w: 800, h: 24 }
  - id: ta184
    label: "向き（横向き）"
    marker: box
    at: { x: 60, y: 548 }
    size: { w: 200, h: 24 }
  - id: tb185
    label: "日本の教本・歌本には、横向きの表も多い。ナットが左、1 弦が上で、TAB 譜と同じ向き。フレットの番号は下に書く"
    marker: box
    align: left
    at: { x: 260, y: 548 }
    size: { w: 800, h: 24 }
  - id: ta186
    label: "いちばん上の太い線"
    marker: box
    at: { x: 60, y: 572 }
    size: { w: 200, h: 24 }
  - id: tb187
    label: "ナット（弦の端）。太い線があれば 1 フレットから。無ければ、横の「2fr」が最初の段のフレットの番号"
    marker: box
    align: left
    at: { x: 260, y: 572 }
    size: { w: 800, h: 24 }
  - id: ta188
    label: "× と ○"
    marker: box
    at: { x: 60, y: 596 }
    size: { w: 200, h: 24 }
  - id: tb189
    label: "× はその弦を弾かない、○ は押さえずに弾く（開放弦）。どちらも書いていない弦は、黒丸の所を押さえる"
    marker: box
    align: left
    at: { x: 260, y: 596 }
    size: { w: 800, h: 24 }
  - id: ta190
    label: "黒丸と下の数字"
    marker: box
    at: { x: 60, y: 620 }
    size: { w: 200, h: 24 }
  - id: tb191
    label: "黒丸が押さえる所（フレットとフレットの間）。下の数字が使う指で、1 人差し指・2 中指・3 薬指・4 小指"
    marker: box
    align: left
    at: { x: 260, y: 620 }
    size: { w: 800, h: 24 }
  - id: ta192
    label: "横に長い丸"
    marker: box
    at: { x: 60, y: 644 }
    size: { w: 200, h: 24 }
  - id: tb193
    label: "セーハ。1 本の指（ふつう人差し指）で、何本もの弦をまとめて押さえる。F は 6 本とも、Bm は 5 弦から 1 弦まで"
    marker: box
    align: left
    at: { x: 260, y: 644 }
    size: { w: 800, h: 24 }
  - id: th194
    label: "TAB 譜の読み方"
    marker: box
    at: { x: 60, y: 688 }
    size: { w: 1000, h: 24 }
  - id: ta195
    label: "向き"
    marker: box
    at: { x: 60, y: 712 }
    size: { w: 200, h: 24 }
  - id: tb196
    label: "6 本の線が弦で、いちばん上が 1 弦（高い e）。縦向きのコード表と並びが逆になる。左に弦の名前を書いて、向きを示す"
    marker: box
    align: left
    at: { x: 260, y: 712 }
    size: { w: 800, h: 24 }
  - id: ta197
    label: "数字"
    marker: box
    at: { x: 60, y: 736 }
    size: { w: 200, h: 24 }
  - id: tb198
    label: "押さえるフレットの番号。0 は開放弦。縦に並んだ数字は同時に弾き、左から右へ順に弾く"
    marker: box
    align: left
    at: { x: 260, y: 736 }
    size: { w: 800, h: 24 }
  - id: ta199
    label: "音の長さ"
    marker: box
    at: { x: 60, y: 760 }
    size: { w: 200, h: 24 }
  - id: tb200
    label: "TAB 譜だけでは決まらない。リズムは五線譜を上に添えるか、数字に符尾を付けて書く"
    marker: box
    align: left
    at: { x: 260, y: 760 }
    size: { w: 800, h: 24 }
  - id: ta201
    label: "h と p"
    marker: box
    at: { x: 60, y: 784 }
    size: { w: 200, h: 24 }
  - id: tb202
    label: "h はハンマリング・オン（弾かずに指で叩いて鳴らす）、p はプリング・オフ（指をはじいて離して鳴らす）"
    marker: box
    align: left
    at: { x: 260, y: 784 }
    size: { w: 800, h: 24 }
  - id: ta203
    label: "/ と b"
    marker: box
    at: { x: 60, y: 808 }
    size: { w: 200, h: 24 }
  - id: tb204
    label: "/ はスライド（押さえたまま滑らせる）。7b9 は 7 フレットで弦を押し上げ、9 フレットの高さ（1 音）まで上げるチョーキング"
    marker: box
    align: left
    at: { x: 260, y: 808 }
    size: { w: 800, h: 24 }
  - id: th205
    label: "描かなかったもの（理由）"
    marker: box
    at: { x: 60, y: 852 }
    size: { w: 1000, h: 24 }
  - id: ta206
    label: "リズム"
    marker: box
    at: { x: 60, y: 876 }
    size: { w: 200, h: 24 }
  - id: tb207
    label: "音の長さは TAB 譜の数字に書けない。コードの押さえ方を見せるのが目的なので、五線譜は付けなかった"
    marker: box
    align: left
    at: { x: 260, y: 876 }
    size: { w: 800, h: 24 }
  - id: ta208
    label: "ほかの押さえ方"
    marker: box
    at: { x: 60, y: 900 }
    size: { w: 200, h: 24 }
  - id: tb209
    label: "G は 3 本の指で押さえる形（2・1・3）にした。4 本の指で押さえる形などもあり、本によって違う"
    marker: box
    align: left
    at: { x: 260, y: 900 }
    size: { w: 800, h: 24 }
  - id: ta210
    label: "曲"
    marker: box
    at: { x: 60, y: 924 }
    size: { w: 200, h: 24 }
  - id: tb211
    label: "実在の曲の TAB 譜は写さない（著作権）。並べたのは、どの教本にも載っている基本のコードだけ"
    marker: box
    align: left
    at: { x: 260, y: 924 }
    size: { w: 800, h: 24 }
  - id: n212
    label: "ギターのコード表と TAB 譜を、決まりどおりに描いた図です。同じ押さえ方を、上下に縦をそろえて並べています。"
    marker: none
    align: left
    at: { x: 60, y: 968 }
    size: { w: 1000, h: 18 }
  - id: n213
    label: "縦向きのコード表は 6 弦が左、TAB 譜は 1 弦が上で、並びの向きが逆です。弦の名前や番号を添えて、向きを示します。"
    marker: none
    align: left
    at: { x: 60, y: 990 }
    size: { w: 1000, h: 18 }
  - id: n214
    label: "弦・フレット・音符の代わりの数字も、zumen の共通の部品（細い帯・楕円・文字）だけで描いています。"
    marker: none
    align: left
    at: { x: 60, y: 1012 }
    size: { w: 1000, h: 18 }
