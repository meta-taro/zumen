# **同じ押さえ方を、向きの違う 2 つの書き方で。** コード表は 6 弦が左、TAB 譜は 1 弦が上。
#
# 決まり（取得 2026-10-24）——
# コード表：縦が弦（左が 6 弦）、横がフレット、太い線がナット。上に × と ○、下に指の番号（1 人差し指〜4 小指）。
# ナットが無い所から始まるときは、最初の段の横に「2fr」のようにフレットの番号を書く。
# TAB 譜：線が弦で、いちばん上が 1 弦（高い e）。数字はフレット、0 は開放。並びは決まっていないので、左に弦の名前を書く。
