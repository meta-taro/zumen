title: 1995 年 1 月 17 日の死者 —— いつ、何で亡くなったか（厚生省 人口動態統計）
# **ほとんどの人は、夜明け前の数時間に、家の中で亡くなった。**
#
# 1995 年 1 月 17 日 午前 5 時 46 分、兵庫県南部地震（M7.3）。
# 厚生省の人口動態統計（1995 年 1〜6 月の死亡届のうち「震災による死亡」）で 5,488 人。
#
# | | 人 | % |
# |---|---|---|
# | 1 月 17 日 午前 | 4,461 | 81.3 |
# | 17 日 全体 | 5,175 | 94.3 |
# | 窒息・圧死 | 4,224 | 77.0 |
#
# 内閣府の教訓資料集は、神戸市の監察医の検案から「**9 割以上は死亡推定時刻が当日 6 時まで**で、
# ほとんどが即死状態だった」と書いている。**救助が間に合う時間は、ほとんど無かった。**
# だからこの地震の教訓は「早く助ける」より先に、**「家と家具が倒れない」**になった。
#
# ## 挫滅症候群だけが、遅れて出る
#
# ③の表で、挫滅症候群（クラッシュ症候群）の 15 人は**全員が 19 日以降**。
# 長く挟まれた手足の筋肉が壊れ、**助け出されて血が戻ったときに**、その毒が全身に回る。
# 助け出された人が、あとで亡くなる。**表の空欄の並びが、病気の仕組みと合っている。**
# （救出の直後に心停止する例もあるので「当日には起きない」とは言えない。言えるのは、この統計では 19 日より前が 0 人だということ。）
#
# ## 死者の数が 3 つある理由
#
# 6,434 人（全体・震災関連死を含む）、6,402 人（兵庫県・直接死 5,483 ＋ 関連死 919）、5,488 人（人口動態統計）。
# **どれも正しく、数えているものが違う。** この図は死因と日時の内訳がある 5,488 人で描いた。
#
# ## 描かなかったもの
#
# - **個人。** 名前も、場所も、写真も。数だけ
# - **地図。** 震度 7 の帯は、地図の精度を損ねずに描く手段がこの図に無い
# - **「こうしていれば助かった」。** 統計から言えることだけを書く
#
# 出典: 厚生省大臣官房統計情報部「人口動態統計からみた阪神・淡路大震災による死亡の状況」（1995 年）
# 表 3 年齢階級・死因別死亡数及び構成割合、表 4 死亡日時・死因別死亡数。
# 内閣府「阪神・淡路大震災教訓情報資料集【02】人的被害」。
# 兵庫県「阪神・淡路大震災の死者にかかる調査について」（2005 年 12 月 22 日記者発表）。
