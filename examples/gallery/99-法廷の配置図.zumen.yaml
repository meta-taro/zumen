title: 法廷の配置図（刑事・裁判員裁判／12.0 × 14.0m）
# 1 px = 20 mm。**誰がどこに座るかが、そのまま役割の図。**
#
# ## 向きに気をつける
#
# **「右陪席」「左陪席」は裁判長から見た向き。**
# この図は傍聴席から見ているので、**左右が入れ替わって見える** ——
# 図の左側に座っているのが右陪席。
#
# ## 決まっていないところもある
#
# **検察官席と弁護人席の左右は、法律で決まっていない。**
# 裁判所によって違う。ここでは「証言台から法壇を向いて左が検察官」で描いた。
#
# ## 裁判員は法壇に座る
#
# 傍聴席側ではなく、**陪席裁判官のさらに外側**に、左右 3 名ずつ。
# 補充裁判員は裁判長の後ろ。
