version: 1
kind: placement
arrows: true
title: TCP のつなぎ方と切り方（状態は 11 個）
# **つなぐのは 3 通、切るのは 4 通。** その 1 通の差が、この図の中身。
#
# ## つなぐ —— 3 ウェイハンドシェイク
#
# クライアントが **SYN**（乱数 A を seq に）を送り、
# サーバが **SYN + ACK**（seq に乱数 B、ack に A + 1）を返し、
# クライアントが **ACK**（seq に A + 1、ack に B + 1）を返す。**3 通。**
#
# ## 切る —— 4 ウェイハンドシェイク
#
# **FIN → ACK → FIN → ACK。** なぜ 4 通かというと、
# **「もう送らない」と「もう受け取らない」が別の話**だから。
# 片方が FIN を送ってから相手が FIN を送るまでの間、
# **送り終えたのは片方だけ**という状態（半クローズ）があり、
# **相手はまだ送れる。** その区間が CLOSE-WAIT と FIN-WAIT-2。
#
# ## TIME-WAIT
#
# 最後の ACK を送った側は、すぐには消えない。
# **最後の ACK が落ちたら、相手は FIN を送り直してくる** ——
# そのとき応えられる者がいないと、相手は待ち続ける。
# だから 2MSL（RFC 793 の MSL ＝ 最大セグメント生存時間は 2 分。最大 4 分）待つ。
# 実装では 30 秒・1 分・2 分が多い。
#
# **CLOSING は、両側が同時に FIN を送ったときだけ通る道**なので、この梯子には現れない。
#
# ヘッダのビットの並びは見本 234。状態の説明は RFC 793 の語をそのまま使った。
