version: 1
kind: placement
title: 車道 舗装構成断面図（N5 交通・TA=21cm 相当）
# 1 px = 5 mm。断面なので y は深さ（下が深い）
#
# **表層と基層は 50 mm ＝ 10 px しかない。** 名前を層の中へ書くと、
# 隣の層の名前とぶつかる（文字は 12 px ある）。縮尺を崩して層を厚く描けば
# 名前は入るが、**縮尺が正しいことがこの図の中身**なので崩さない。
# 実物の舗装構成図と同じく、**薄い層の名前は右の構成表で読む。**
