version: 1
wrap: true
title: 冷却水の系統（P&ID）
# **P&ID は、配管と計器を 1 枚に書く図**（Piping and Instrumentation Diagram）。
# フローシートが「何をするか」なら、P&ID は**「何が付いているか」**。
#
# ## 配管には 1 本ずつ番号が付く
#
# `2"-CS-101` のように、**口径・流体の記号・通し番号**を続けて書く。
# 番号が無いと、現場で「この管」と指させない。
#
# ## ポンプが 2 台あるのは、1 台が予備だから
#
# 片方を止めて整備できることが、動かし続ける条件になる。
# **2 台とも同じ所から吸って同じ所へ出す**のが、図で確かめること。
