version: 1
wrap: true
title: 冷却水の系統（P&ID）
# **P&ID は、配管と計器を 1 枚に書く図**（Piping and Instrumentation Diagram）。
# フローシートが「何をするか」なら、P&ID は**「何が付いているか」**。
#
# ## 配管には 1 本ずつ番号が付く
#
# `3"-CWS-101` のように、**口径・流体の記号・通し番号**を続けて書く
# （CWS は冷却水の往き、CWR は還り）。番号が無いと、現場で「この管」と指させない。
#
# ## ストレーナはポンプの吸込側
#
# 異物を羽根車へ入れないために置くので、**ポンプの手前**に付ける。
# 吸込管は吐出管より細くしない（吸込側の抵抗はキャビテーションに直結する）。
#
# ## ループは 2 つある
#
# 製造ラインを回る**二次側**（冷却水槽 → ポンプ → 熱交換器 → 機械 → 槽へ還る）と、
# その熱を冷却塔へ捨てる**一次側**。熱交換器が 2 つのループを分けている。
#
# ## ポンプが 2 台あるのは、1 台が予備だから
#
# 片方を止めて整備できることが、動かし続ける条件になる。
# **2 台とも同じ所から吸って同じ所へ出す**のが、図で確かめること。
