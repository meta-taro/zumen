version: 1
kind: placement
arrows: true
title: 板金の展開図 —— 足しただけでは合わない
scale: { mm: 0.25 }
# **展開長は、外側寸法を足しただけでは合わない。**
# 曲げると外側が伸びるので、その分（伸び値）を曲げの数だけ引く。
# 50 ＋ 30 − 2.9 ＝ 77.1。
#
# 外は伸び、内は縮み、あいだに**伸びも縮みもしない面（中立面）**がある。
# その面の長さが展開長。**中立面は板厚の真ん中ではなく、内側へ寄る。**
#
# **伸び値は規格ではない。** 材質・板厚・内R・金型で変わり、
# 各工場が実測データとして持っている ——
# だから図面には**どの伸び値で展開したか**を書く。この図の 2.9 も例。
