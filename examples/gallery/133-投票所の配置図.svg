<g data-name="n0"><text x="40" y="555" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・衆議院総選挙は投票が 3 つ。交付 → 記載 → 投函を 3 回繰り返す</text></g>
<g data-name="n1"><text x="40" y="577" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・動線は一方通行。戻らせると、次の用紙と取り違えたまま投函される</text></g>
<g data-name="n2"><text x="40" y="599" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・立会人は 2 人以上 5 人以下（期日前は 2 人）。投票箱が見える位置に座る</text></g>
<g data-name="n3"><text x="40" y="621" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・車椅子用の記載台と点字投票の用紙は、入口に近い側へ置く</text></g>
<g data-name="kd1"><text x="545" y="151" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">記載台</text><text x="545" y="166" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#63636e">4 台</text></g>
