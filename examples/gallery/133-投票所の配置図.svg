<g data-name="kd3"><text x="545" y="431" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">記載台</text><text x="545" y="446" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#63636e">4 台</text></g>
