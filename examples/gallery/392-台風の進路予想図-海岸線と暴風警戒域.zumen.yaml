version: 1
kind: placement
arrows: false
title: 台風の進路予想図（海岸線つき・暴風警戒域を 1 本で包む・架空）
sources:
  - name: "気象庁「台風経路図の見方」"
    url: https://www.jma.go.jp/jma/kishou/know/typhoon/7-1.html
    retrieved: 2026-10-15
  - name: "気象庁「ホームページにおける気象情報の配色に関する設定指針」表 1-2"
    url: https://www.jma.go.jp/jma/kishou/info/colorguide/HPColorGuide_202007.pdf
    retrieved: 2026-10-15
  - name: "Natural Earth 1:50m Land（パブリックドメイン）"
    url: https://www.naturalearthdata.com/
    retrieved: 2026-10-15
# **予報円は「中心が入る確率 70%」の範囲。台風が大きくなるという意味ではない。**
# 先へ行くほど円が大きいのは、進路がはっきりしないから。
#
# 決まり（気象庁「台風経路図の見方」・配色指針 表 1-2）——
# - いまの中心は ×。**暴風域（25m/s 以上）は赤、強風域（15m/s 以上）は黄**
# - 予報円は破線、予報円の中心を結ぶ線も破線。これまでの経路は青の実線
# - **暴風警戒域は赤の実線で、外側を 1 本の線で囲む**
# - 予報は 1 日先まで 12 時間きざみ、5 日先まで 24 時間きざみ
#
# **暴風警戒域の作り方。** 中心が予報円のどこへ進んでも暴風域に入るおそれがある範囲なので、
# 各時刻の円を「予報円 ＋ 暴風域の半径」に太らせ、円から円へ中心が動く間に掃く範囲（隣どうしをつないだ
# 先細りのカプセル）の和を取った。その縁を 0 の等値線として 1 本で引いている。
# 見本 183 は時刻ごとの円のままで、この「1 本で包む」が描けていなかった。
#
# 円の半径は km で決め、その緯度での縮尺（平射図法なので緯度で変わる）で px にした。
# 陸は Natural Earth 1:50m（パブリックドメイン）。国境は描いていない。
# 台風の位置・気圧・半径はすべて架空。テレビ局の様式は写していない。
palette:
  陸: "#d4e6c3"
  暴風域: "#ff2800"
  強風域: "#faf500"
  暴風警戒域: "#e01e00"
  経路: "#1f5bff"
