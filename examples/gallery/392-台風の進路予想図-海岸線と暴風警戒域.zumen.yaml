  - id: n0
    label: 予報円は、その時刻に台風の中心が入る確率が 70% の範囲です。台風が大きくなるという意味ではありません。先へ行くほど円が大きいのは、進路がはっきりしないからです。
    marker: none
    align: left
    at: { x: 0, y: 788 }
    size: { w: 1400, h: 18 }
  - id: n1
    label: 暴風警戒域は、中心が予報円のどこへ進んでも暴風域に入るおそれがある範囲です。予報円を暴風域の半径ぶん太らせ、円から円へ動く間に通る範囲を 1 本の線で包みます。
    marker: none
    align: left
    at: { x: 0, y: 810 }
    size: { w: 1400, h: 18 }
  - id: n2
    label: 予報は 1 日先まで 12 時間きざみ、5 日先まで 24 時間きざみです。いまの強風域（黄）と暴風域（赤）は実況で、塗ってあります。
    marker: none
    align: left
    at: { x: 0, y: 832 }
    size: { w: 1400, h: 18 }
  - id: n3
    label: 台風の位置・気圧・半径はすべて架空です。陸は Natural Earth（パブリックドメイン）を間引いたもので、国境は描いていません。テレビ局の様式は写していません。
    marker: none
    align: left
    at: { x: 0, y: 854 }
    size: { w: 1400, h: 18 }
