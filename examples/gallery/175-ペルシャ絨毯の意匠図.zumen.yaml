version: 1
kind: placement
arrows: false
title: ペルシャ絨毯の意匠図（ナクシェ・架空の柄）
# **方眼の 1 マスが 1 結び。** 色そのものが指示で、織師はその色の糸を結ぶ。
#
# **絨毯の 1/4 だけを描く。** 残りは左右と上下へ折り返すので描かない ——
# 実物の意匠図もそうなっている（この図の右と下が絨毯の中心線）。
#
# ノットの細かさは**ラージ**で数える（横 1 列に何結びあるか）。
# 1 ラージはペルシア結びで 6.5cm、トルコ結びで 7.0cm。
# 50 ラージなら 1cm に 7.7 結び ＝ 1 結び 1.3mm。
#
# 面の色は \`fill\` ＋ \`hatch: solid\`（塗り潰し）。柄・色数・産地は架空。
