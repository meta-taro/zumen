version: 1
kind: placement
paper: { size: Letter, orient: portrait, margin: 0 }
title: "Form W-9（米国 IRS・納税者番号の確認書 Rev. March 2024。Letter 1 ページ目の様式部分）"
watermark:
  text: 見本 SAMPLE
  note: "2026-11-11 時点の Form W-9 (Rev. March 2024) を写したもの。公式の様式ではありません（Not the official form: irs.gov/FormW9）"
# **米国の納税者番号（TIN）を、支払う側へ渡すための様式。** IRS へは送らない（様式の右上）。
# 罫線は PDF の 1 ページ目から位置ごと写し（pdftocairo -svg）、字は pdftotext -bbox の位置から置いた。
# 字の大きさが固定（12px）なので様式を 1.4 倍で描き、Letter へ縮めて収める。英文は欄の幅で折り返し直した（行の切れ目は原本と違う）。
# 1 ページ目の下半分（General Instructions）は省いて詰め、下端の Cat. No. と様式番号の行をすぐ下へ寄せた。紙の余白（左 36pt・上 29pt）も切り落とした。
#
# 出典：
#   IRS「Form W-9 (Rev. March 2024) Request for Taxpayer Identification Number and Certification」https://www.irs.gov/pub/irs-pdf/fw9.pdf（取得 2026-11-11）
#   米国連邦政府の著作物は著作権の対象外（17 U.S.C. §105）。
# 原本との違い：Part I / Part II の札は原本では黒地に白字（ここは枠だけ）。左の縦書き 2 つは原本では下から上へ読む（ここは上から下）。
#   表題「W-9」など大きな字も 12px。「Go to」の前の三角、3b の点線のリーダーは描いていない。
# 省いたもの：1 ページ目の下半分の General Instructions と 2〜6 ページ（説明文）。
# 空欄のまま：番号・氏名・住所は書いていない（社会保障番号の例も入れない）。
