version: 1
kind: placement
arrows: false
title: 円だけで作る動物のマーク（キツネ・ネコ・イヌ・ゴリラ／架空のマーク）
# **円と円の「和」と「交わり」だけで作る。** 直線も自由曲線も使わない。
#
# ## 尖った耳は「2 円の交わり」
#
# 円を足していくだけでは**丸い塊**にしかならない。
# **2 つの円が重なった部分（レンズ形）は両端が尖る** —— これが耳になる。
# 耳は**先の点と根もとの点**で決める。向きと長さが、そのまま動物の種類になる。
#
# ## 目と鼻は「抜く」
#
# 塗った輪郭の上に**紙の色の円**を置く。線で描かない。
# **抜くほうが小さい円で済み、縮小しても潰れない。**
#
# ## 何が種類を決めるか
#
# **耳の向きと、鼻先の長さ。** 顔の円はどれもほぼ同じ大きさで、
# **耳を外へ倒して鼻先を伸ばせばキツネ、耳を立てればネコ、
# 耳を横へ下げればイヌ。** ゴリラだけは頭とアゴの 2 円で縦長にし、口もとを大きく抜く。
#
# **どのマークも架空のもの。** 実在の商標を写したものではない。
