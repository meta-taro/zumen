version: 1
kind: placement
arrows: true
scale: { mm: 60 }
title: カーリングのシート（線はすべてティーの中心から測る）
sources:
  - name: "World Curling「The Rules of Curling and Rules of Competition」（2026 年 9 月 1 日版）R1・R2・R5・R6・R8・R12"
    url: https://worldcurling.org/competitions/rules/
    retrieved: 2026-10-06
# **線は、すべてティー（ハウスの中心の穴）から測る。**
# ティーラインはシートの中央から 17.375m、そこから手前へ 6.401m がホッグライン（内側の縁）、
# 先へ 1.829m がバックライン（外側の縁）、3.658m がハックライン。
# **バックラインの外側の縁は、ハウスのいちばん外の円（半径 1.829m）と同じ所にある。**
#
# **何のための図か。** 製氷・施設の担当と審判が、ペブルを撒く前に線とハウスの位置を
# 規則書の数で確かめるための図。作戦（どこへ置くか）は描かない。
#
# **描いたもの。** ①シート全体（1 px ＝ 60 mm）：45.720m × 4.750m、両端のハウス・ティーライン・
# ホッグライン・バックライン・ハックライン、センターライン。
# ②片側の拡大（1 px ＝ 20 mm）：ハウスの 4 つの円、ホッグライン（幅 102mm を幅のまま）、
# コーテシーライン、ハック 2 つ（センターラインから 76mm、幅 152mm、ハックラインから 203mm まで）、
# バックボード、フリーガードゾーン（ホッグラインの内側の縁からティーラインまで、ハウスを除く —— R6(a)）。
#
# **長さと幅は規則の限度で描いた。** 長さは「45.720m 以上」、幅は「4.750m 以下」—— どちらも限度の値。
# 既存の施設で足りなければ 44.501m・4.420m まで縮めてよい（R1(a)）。
# 縮めても、ティーから測る線の位置は変わらない（変わるのはハックからバックボードまでの余り）。
# **描かなかったもの（理由）。**
# - ハウスの色（赤・青）—— 規則は円の半径しか決めていない。色は施設ごと
# - 車いすカーリングの線（センターラインの両側 457mm の細い線 —— R1(c)）—— 種目が違う。表に入れなかった
# - ストーン（円周 914mm 以下）—— 置くと作戦の図になる
# - ノーティックゾーン（R7）—— FGZ の中でセンターラインに触れている石の話で、線ではない
# 出典（取得 2026-10-06）：World Curling, The Rules of Curling and Rules of Competition, 1 September 2026。
# R1(a)(b)(d)(e)（寸法）、R2(f)(g)（ホッグを越えない石・バックラインを越えた石は外す）、R5(e)（ホッグの前に手を離す）、
# R6(a)(b)（FGZ）、R8(e)（相手の石はティーラインの後ろでだけ掃ける）、R12(b)（得点）。
