title: 中継の決まり（駅伝のたすきと、リレーのバトン）
# **駅伝の中継線は「渡す点」だが、準備は数百 m にまたがる。**
# 前走者がたすきを外すのは**中継線の手前 400m** から、
# 次走者が掛けるのは**中継後 200m** までがおおよその目安 ——
# 走りながら外し、走りながら掛けるので、**中継所の図は線 1 本ではなく前後の区間を持つ。**
# たすきは**必ず前走者と次走者の間で手渡す**（置いて拾うのは認められない）。
#
# **リレーは 30m のゾーンの中で渡し終える。**
# 各走者のスタート地点（100m）を基準に、**手前 20m・後ろ 10m** で計 30m。
# **2018 年に 20m から 30m になった** ——
# 手前にあった助走だけの区間（通称ブルーゾーン 10m）がゾーンに取り込まれた形で、
# **渡せる場所が長くなったのではなく、助走の区間が渡してよい区間になった。**
# ゾーンの外で渡すと失格。
#
# **たすきは寸法が決まっている**（日本陸連の駅伝競走規準）。
# 布製で**長さ 1,600〜1,800mm・幅 6cm**、**肩から斜めに脇の下**へ掛ける ——
# 斜めに掛けるのは**走りながら外せるから**で、首にかけた輪だと外すのに立ち止まることになる。
#
# **同じ「中継」でも、測っているものが違う。**
# 駅伝は**渡す 1 点**を決めて前後に余裕を置き、リレーは**渡してよい区間**を決めて
# その外を失格にする —— **図に引く線の意味が、逆になっている。**
