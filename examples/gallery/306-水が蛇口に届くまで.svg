<g data-node="flock" data-pinned="false" data-shape="rect"><rect x="279" y="106" width="254" height="76" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-node="chinden" data-pinned="false" data-shape="cylinder"><path d="M 326 247 L 326 323 A 80 9 0 0 0 486 323 L 486 247" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/><ellipse cx="406" cy="247" rx="80" ry="9" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
