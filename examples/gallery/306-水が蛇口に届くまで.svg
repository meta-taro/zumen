<g data-node="en2" data-pinned="false" data-shape="rect"><rect x="574" y="247" width="320" height="76" rx="6" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-node="haisui" data-pinned="false" data-shape="stacked"><rect x="589" y="388" width="296" height="76" rx="4" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/><rect x="583" y="394" width="296" height="76" rx="4" fill="#ffffff" stroke="#1c1c22" stroke-width="1"/></g>
<g data-name="shusui"><text x="131" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">取水</text><text x="131" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">取水塔・沈砂池・取水ポンプ</text></g>
<g data-name="chakusui"><text x="131" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">着水井</text><text x="131" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">勢いと水位を落ち着かせる</text></g>
<g data-name="gyoshu"><text x="131" y="427" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">凝集剤を入れて混ぜる</text><text x="131" y="445" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">薬品混和池 —— 速く混ぜる</text></g>
<g data-name="flock"><text x="406" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">フロックを育てる</text><text x="406" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">フロック形成池 —— ゆっくり混ぜる</text></g>
<g data-name="chinden"><text x="406" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">沈でん池</text><text x="406" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">育った粒を沈める</text></g>
<g data-name="en1"><text x="406" y="427" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">塩素注入（1 回目）</text><text x="406" y="445" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">処理のため</text></g>
<g data-name="roka"><text x="734" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">濾過池</text><text x="734" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">急速濾過（緩速濾過なら凝集・沈でんを使わない）</text></g>
<g data-name="en2"><text x="734" y="283" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">塩素注入（2 回目）</text><text x="734" y="301" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">家に着くまで持たせるため（蛇口で 0.1mg/L 以上）</text></g>
<g data-name="haisui"><text x="734" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">浄水池 → 送水ポンプ → 配水池</text><text x="734" y="448" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">配水池から各家庭へ</text></g>

</svg>