title: "製図用紙の様式（A3 横。輪郭・中心マーク・区域区分・比較目盛・表題欄）"
# **製図用紙は、刷られる前提で様式が決まっている。** 縮んで刷られても、比較目盛を測れば元の大きさに戻せる。
#
# 座標は mm で考えて px に直した（1px = 25.4/96 mm。paper の margin: 0 で、用紙の左上が原点）。
# 架空：作成元・図面番号・取付板の寸法。区域の数（8×6）は規格の幅（25〜75mm・偶数）から選んだ。
# 出典：JIS Z 8311:1998 製図－製図用紙のサイズ及び図面の様式（5 表題欄・6 輪郭・7 中心マーク・8 方向マーク・9 比較目盛・10 格子参照方式・11 裁断マーク・12 印刷された製図用紙）
#   https://kikakurui.com/z8/Z8311-1998-01.html（取得 2026-11-10）。sources: に書かないのは、縁まで使う様式で出典の行を刷る余白が無いため（書くと図の下へ足され、等倍で刷れなくなる）。
# 未確認：区域の符号の字の高さ（図13）と、比較目盛の置き場所の図（図12）は見ていない。目盛は輪郭線の内側に置いた。
