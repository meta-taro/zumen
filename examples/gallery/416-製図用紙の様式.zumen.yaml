title: "製図用紙の様式（A3 横。輪郭・中心マーク・格子参照方式・比較目盛・表題欄）"
# **製図用紙は、刷られる前提で様式が決まっている。** 縮んで刷られても、比較目盛を測れば元の大きさに戻せる。
#
# 座標は mm で考えて px に直した（1px = 25.4/96 mm。paper の margin: 0 で、用紙の左上が原点）。
# 架空：作成元・図面番号・取付板の寸法。区域の数（8×6）は規格の幅（25〜75mm・偶数）から選び、区切りを中心マークに合わせた（図13。ISO 5457:1999 の 4.4 は A3 を 8×6・中心マークから 50mm と決めている）。
# 出典：JIS Z 8311:1998 製図－製図用紙のサイズ及び図面の様式（5 表題欄・6 輪郭・7 中心マーク・8 方向マーク・9 比較目盛・10 格子参照方式・11 裁断マーク・12 印刷された製図用紙）
#   https://kikakurui.com/z8/Z8311-1998-01.html（取得 2026-11-10）。sources: に書かないのは、縁まで使う様式で出典の行を刷る余白が無いため（書くと図の下へ足され、等倍で刷れなくなる）。
# 図7・8・12・13 は同じ URL の図の画像（page-6.png・page-7.png）で見た。
# 「輪郭」は用紙の縁と輪郭線の間の帯（6.1）。比較目盛はその帯の中、輪郭線に沿わせる（9・図12）。
# 上下右の輪郭（10mm）は格子の符号が占めるので、目盛は左のとじ代（20mm）に置いた。左の中心マークには方向マーク（図8）があるので、目盛は下へずらした（9 は「なるべく」対称）。
# 区域の符号の字の高さは JIS に無い（10 は書体を直立体と言うだけ）。ISO 5457:1999 は 3.5mm。
# 表題欄は、図面を特定する事項（図面番号・図名・作成元）を表題欄の右下隅に置く（5.2）。図面番号が用紙の右下の角に来る。
# とじ穴（同じ規格の附属書図2・参考）は縁から 12.5mm・φ6 なので 9.5〜15.5mm。比較目盛（16〜20mm）にはかからない。
# 170mm 以下は、表題欄のうち図面を特定する事項の部分の長さ（5.2）。この見本は表題欄全体も 170mm。
# 取付板の図は JIS B 0001:2019 の線の使い分けで描く：外形線（板・穴）は太い実線（paths の既定 0.53mm）、中心線・寸法線・引出線は細線（0.26mm）。
# 穴は太線で描くため 24 角形の paths にした（節の枠は太さを変えられない）。半径 5.5mm、角の膨らみの差は 0.05mm。
# 穴には 1 個ずつ中心線（縁から 3mm 出す）。穴の指示は、穴の縁へ中心に向けて矢印で当てた引出線から、水平に折った線の上に書く（附属書図2 の 4-φ6 と同じ形）。
# 寸法（JIS B 0001:2019 の 11.4 d) 2)）：数値は寸法線の上側（垂直の寸法線では左側）。だから寸法は上と左に出し、小さい寸法（穴の間 120・60、板から 10mm）を内側、全体（160・100、20mm）を外側に並べた。
#   穴の間の寸法補助線は、穴の中心線の端（縁から 3mm）から出す。穴の中心から出すと、実線が穴の中の一点鎖線に重なる。
#   数値の向き（垂直の寸法線は右から読めるように立てる。11.4 d) 1)）は描画が対応していない —— 100・60 は横書きのまま。
# 板の厚さ t6 は図の中に書く（11.6.6）。材料の欄は SS400 だけ（同じ寸法を 2 か所に書かない）。
# 普通公差（11.1 l)）：公差を書いていない寸法に効く規格と等級を、表題欄の付近に書く。JIS B 0405:1991（ISO 2768-1:1989 と同じ）の中級 m。
# 投影法：表題欄の中に第三角法の記号を描く（8.3・図14）。左に同心の 2 円、右に細いほうを円へ向けた台形（円錐台）。円の外径を 5.8mm（欄の高さ 7.9mm に収まる大きさ）にした（JIS は大きさを決めていない）。
