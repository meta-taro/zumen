# **Spacing is two numbers at once** —— the floor area one head is responsible
# for, and how far apart heads may sit. Light hazard allows **225 sq ft** and
# **15 ft**; this grid uses 12 x 12 ft, so each head carries 144 sq ft.
#
# **The wall rule follows from the spacing:** no more than half of it, here
# 7 ft 6 in. Widen the grid and the heads move away from the walls as well.
#
# **日本語の見本 136（天井伏図）・119（消火器と消火栓）と対。**
#
# Figures follow NFPA 13 for light hazard. The room and the layout are fictional.
