version: 1
kind: placement
arrows: true
title: 公園の遊具と安全領域（架空の配置）
scale: { mm: 25 }
# **落下高さが、安全領域を決める。**
#
# 落下高さ 600mm 以下なら安全領域 1,500mm、超えるなら 1,800mm。
# 測るのは**遊具の外形から全方向**へ。すべり台の出口は勢いがあるので、もっと広く取る。
#
# **安全領域どうしは重なってよい。** ただし
# **遊具そのものが、他の遊具の安全領域に入ってはいけない** —— この図はそれを機械で確かめた。
#
# 安全領域の中は、コンクリートやアスファルトにできない（砂・ウッドチップ・ゴムなど）。
# 1 px ＝ 25mm。公園の形・配置は架空。
