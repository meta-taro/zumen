# **同じ「日本語」の試験でも、受ける人が違う。** JLPT は日本語を母語としない人のため。日本語検定は別の検定で、級を学年と社会人の段階で示す。
# 左右の級を横に並べても、対応はしない（どちらが難しいか、ではない）。
#
# 決まり（取得 2026-11-05）——
# 日本語検定：受検級 1〜7 級。1〜3 級 60 分、4〜7 級 50 分。総合得点率で認定（1 級 80% 程度・2〜7 級 70% 程度）、
#   届かなくても 1 つ下の割合（準 1 級 70%・準 2〜準 7 級 60%）で「準」の級に認定。令和 7 年度第 1 回から領域別 50% の基準は撤廃。
# JLPT：N1〜N5。総合 0〜180 点で合格点以上、かつ得点区分ごとに基準点以上（N1〜N3 は 3 区分 各 19/60、N4・N5 は 38/120 と 19/60）。
