version: 1
kind: placement
arrows: true
title: 基板の層を増やすのは、GND を近づけるため
scale: { mm: 0.004 }
# **層を増やすのは、配線を通すためだけではない。**
# GND を信号の真下に近づけて、**線を細くするため**。
#
# 同じ 50Ω が、2 層（GND まで 1.53mm）では約 2.85mm、
# 4 層（GND まで 0.2mm）では約 0.33mm —— **8.5 倍の差**。
# 2 層で 3mm の線は、部品の足の間隔（2.54mm）より太くて引けない。
#
# **特性インピーダンスは線幅だけでは決まらない** —— GND までの厚み h とセット。
# 板厚 1.6mm は同じでも、どこに GND を置くかで線幅が変わる。
#
# 線幅は目安式から解いた（h ＝ 1.53mm で 2.85mm は、
# 実務で言われる 2.9〜3.1mm と一致する）。
