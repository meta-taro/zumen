version: 1
direction: down
title: 三審制（同じ「3 回」でも、通る裁判所が違う）
# **三審制は「3 回やる」ではなく、「3 つの審級を通る」という決まり。**
# どの裁判所から始まるかで、**通る先が変わる** ——
# 1 審が同じ簡易裁判所でも、**民事と刑事で 2 審の行き先が違う。**
#
# **民事で訴額 140 万円以下なら、1 審は簡裁。**
# このとき控訴は**地裁**、上告は**高裁**で、**最高裁までは行かない。**
# それ以外の民事は 1 審が地裁で、控訴が高裁、上告が最高裁。
#
# **刑事は、1 審が簡裁でも地裁でも、2 審は高裁・3 審は最高裁。**
# 民事のように審級がずれない。
#
# **控訴と上告は、別のもの。** 第 2 審へ行くのが**控訴**、第 3 審へ行くのが**上告** ——
# **控訴は「判決に納得できない」で足りるが、上告は理由が限られる**
# （憲法違反など）。**3 回目は、事実をもう一度調べ直す場ではない。**
#
# **地裁 → 高裁の線が 2 つの意味を持っている。**
# 地裁が 1 審なら**控訴**、簡裁 1 審の民事で地裁が 2 審なら**上告** ——
# 同じ 2 つの裁判所のあいだでも、**何審目から来たかで名前が変わる。**
#
# 家庭裁判所は家事事件と少年事件を扱い、その上は高等裁判所。
