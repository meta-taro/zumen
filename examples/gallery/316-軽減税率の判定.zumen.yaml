title: 軽減税率の判定（同じ品物でも、どこで食べるかで変わる）
# **2019 年 10 月から、消費税は 10% と 8% の 2 本立てになった。**
# 軽減税率 8% の対象は、大きく 2 つだけ ——
# **飲食料品**（食品表示法に規定する食品。**酒税法に規定する酒類を除く**）と、
# **週 2 回以上発行される、定期購読契約の新聞。**
#
# **同じ品物でも、どこで食べるかで税率が変わる。**
# **持ち帰りは 8%、店内で食べれば 10%。**
# 分かれ目は品物ではなく、**「テーブル・いす等を設けて飲食させるための設備を置いた場所で
# 食事を提供する」かどうか。** 同じハンバーガーが、レジでの一言で変わる。
#
# **新聞も、買い方で変わる。**
# 定期購読の契約なら 8%、**コンビニで買えば 10%**。電子版も 10%。
# **「何を」ではなく「どう買ったか」で決まる。**
#
# **一体資産は、2 つの条件を両方満たしたときだけ 8%。**
# 食品と食品でないものを組にして売る場合、**税抜価額が 1 万円以下**で、かつ
# **食品の割合が 3 分の 2 以上**であること。おまけ付きのお菓子がこれ。
#
# **学校給食と老人ホームでの食事は 8%。** 設備を置いた場所での食事だが、
# 外食とは別に扱われる —— **線は、生活のほうに合わせて引かれている。**
# ただし給食・老人ホームとも**金額の上限つき**（税抜で 1 食 730 円以下・1 日累計 2,190 円まで。
# 令和 8 年 6 月 1 日から。それまでは 690 円・2,070 円）。
#
# **ケータリング（出張料理）は 10%。** 相手が指定した場所で、調理・盛付け・配膳など
# 役務を伴って出すもの。**出前・宅配は品物を届けるだけなので 8%。**
#
# 出典：国税庁「よくわかる消費税軽減税率制度」（令和元年 7 月）
# https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keigenzeiritsu/pdf/0018006-112.pdf ／
# 同「令和 8 年 6 月〜消費税の軽減税率の対象となる給食の金額基準が変わります！」（令和 8 年 3 月）
# https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keigenzeiritsu/pdf/0026002-079.pdf
# （2026-10-02 照合）。
