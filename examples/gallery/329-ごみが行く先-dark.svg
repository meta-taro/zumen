<g data-name="katei"><text x="265" y="205" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">家庭から出る</text><text x="265" y="223" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">一般廃棄物。市町村が集めて処理する</text></g>
<g data-name="jigyo"><text x="246" y="99" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">事業所から出る</text><text x="246" y="117" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">産業廃棄物。出した事業者が自分で処理する</text></g>
<g data-name="bunbetsu"><text x="563" y="192" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">分別・保管</text><text x="563" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">法が並べる一連の取り扱いの最初</text></g>
<g data-name="shushu"><text x="814" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">収集・運搬</text></g>
<g data-name="shokyaku"><text x="1096" y="207" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">焼却</text><text x="1096" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">容積が 80〜95% 減る。約 4 割が発電もする</text></g>
<g data-name="hasai"><text x="1100" y="101" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">破砕・選別</text><text x="1100" y="119" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">大きいものを砕き、使えるものを分ける</text></g>
<g data-name="saisei"><text x="1450" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">再生（資源化）</text><text x="1450" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">焼却と並んで、法の一連に最初から入っている</text></g>
<g data-name="genryo"><text x="190" y="334" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">原料・製品へ戻る</text></g>
<g data-name="hai"><text x="1436" y="195" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">焼却灰・残さ</text><text x="1436" y="213" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">減ったが、無くなってはいない</text></g>
<g data-name="umetate"><text x="218" y="425" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">最終処分（埋立）</text><text x="218" y="443" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">この図の、ただ 1 つの行き止まり</text></g>
</svg>