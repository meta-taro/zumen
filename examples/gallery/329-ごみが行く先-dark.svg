<g data-name="katei"><text x="303" y="182" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">家庭から出る</text><text x="303" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">一般廃棄物。市町村が集めて処理する</text></g>
<g data-name="jigyo"><text x="270" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">事業所から出る</text><text x="270" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">産業廃棄物・事業系一般廃棄物。出した事業者に処理の責任</text></g>
<g data-name="bunbetsu"><text x="631" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">分別・保管</text><text x="631" y="107" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">法が並べる一連の取り扱いの最初</text></g>
<g data-name="shushu"><text x="1062" y="96" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">収集・運搬</text></g>
<g data-name="shokyaku"><text x="270" y="321" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">焼却</text><text x="270" y="339" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">かさは減るが、灰が残る。施設の約 4 割が発電もする</text></g>
<g data-name="hasai"><text x="279" y="427" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">破砕・選別</text><text x="279" y="445" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">大きいものを砕き、使えるものを分ける</text></g>
<g data-name="saisei"><text x="1022" y="440" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">再生（資源化）</text><text x="1022" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">処分と並んで、法の目的（1 条）に最初から入っている</text></g>
<g data-name="genryo"><text x="1328" y="447" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">原料・製品へ戻る</text></g>
<g data-name="hai"><text x="646" y="334" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">焼却灰・残さ</text><text x="646" y="352" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">減ったが、無くなってはいない。一部はセメント原料などへ</text></g>
<g data-name="umetate"><text x="980" y="321" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">最終処分（埋立）</text><text x="980" y="339" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">この図の、ただ 1 つの行き止まり</text></g>

<g data-name="sources"><a href="https://www.env.go.jp/recycle/waste_tech/ippan/r5/data/env_press.pdf"><text x="20" y="519" font-family="sans-serif" font-size="10" fill="#a0a0ab">出典：環境省「一般廃棄物の排出及び処理状況等（令和 5 年度）について」（2026-10-02 取得）</text></a><text x="20" y="533" font-family="sans-serif" font-size="10" fill="#a0a0ab">出典：e-Gov 法令検索「廃棄物の処理及び清掃に関する法律」第 1〜3 条・第 6 条の 2・第 11 条（2026-10-04 取得）</text></g>
</svg>