<g data-name="tank"><text x="783" y="233" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">飼育槽 ×3</text><text x="783" y="251" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">各 30m³・密度 40kg/m³</text></g>
<g data-name="drum"><text x="1023" y="233" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">ドラムフィルタ</text><text x="1023" y="251" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">目開き 60μm・固形物</text></g>
<g data-name="settle"><text x="1249" y="221" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">沈殿槽</text><text x="1249" y="239" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">沈む固形物・汚泥抜き</text></g>
<g data-name="skim"><text x="1249" y="327" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">泡沫分離装置</text><text x="1249" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">溶存有機物・微細懸濁</text></g>
<g data-name="nitri"><text x="1487" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">硝化槽（好気）</text><text x="1487" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">NH4⁺ → NO2⁻ → NO3⁻</text></g>
<g data-name="denit"><text x="255" y="93" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">脱窒槽（貧酸素）</text><text x="255" y="111" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">NO3⁻ → N2 ガス</text></g>
<g data-name="co2"><text x="516" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">脱炭酸塔</text><text x="516" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">CO2 を抜く（pH が下がるため）</text></g>
<g data-name="ph"><text x="783" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">pH・アルカリ度調整</text><text x="783" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">重曹を足す。pH 7.0〜8.0</text></g>
<g data-name="uv"><text x="1023" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">紫外線殺菌</text><text x="1023" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">病原体を減らす</text></g>
<g data-name="heat"><text x="1249" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">熱交換</text><text x="1249" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">水温を一定に保つ</text></g>
<g data-name="o2"><text x="224" y="327" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">酸素供給</text><text x="224" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">溶存酸素 6 mg/L 以上</text></g>
<g data-name="pump"><text x="505" y="233" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">循環ポンプ</text><text x="505" y="251" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">系のぜんぶを回す</text></g>
<g data-name="make"><text x="224" y="221" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">補給水</text><text x="224" y="239" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">蒸発と汚泥で抜けた分（5%/日以下）</text></g>
<g data-name="sludge"><text x="1470" y="233" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">汚泥処理</text><text x="1470" y="251" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">系の外へ出す</text></g>

</svg>