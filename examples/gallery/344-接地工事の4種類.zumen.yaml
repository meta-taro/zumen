title: 接地工事の 4 種類（B 種だけ、数が決まっていない）
# **A・C・D は数で、B だけは式で決まる。**
#
# ## 4 種類
#
# **A 種**は高圧・特別高圧の機器の金属の架台やケース —— **10Ω 以下、接地線 2.6mm 以上。**
# **C 種**は低圧で **300V を超える**もの —— **10Ω 以下、1.6mm 以上。**
# **D 種**は低圧 **300V 以下** —— **100Ω 以下、1.6mm 以上。**
#
# ## B 種だけが式
#
# **B 種**は高圧と低圧をつなぐ変圧器の**低圧側の中性点**に施す。
# 抵抗の上限は **150 ÷ I**（I は変圧器の高圧側電路の 1 線地絡電流）。
# 混触したとき **2 秒以内に自動遮断する**なら **300 ÷ I** まで緩められる。
#
# **「電流が大きい所ほど、抵抗を小さくしろ」** ——
# 数を 1 つ決めてしまうと、電流の大小に関わらず同じ電圧が出てしまう。
#
# ## 抵抗を下げる代わりに、速さで守る
#
# **C 種と D 種は、100mA 以下の漏電遮断器を付ければ 500Ω 以下でもよい。**
# 抵抗を下げる工事の代わりに、**切る速さ**で守るという交換になっている。
#
# ## 何のためか
#
# **漏電による感電と火災を防ぐこと。**
# そして**変圧器の中で混触したとき、低圧の電路へ高い電圧が入るのを抑えること。**
# 前者は人を守り、後者は機器と回路を守る。
#
# 家の電気系統は見本 06、受変電の結線は見本 19、電気の引き込みは見本 309。
