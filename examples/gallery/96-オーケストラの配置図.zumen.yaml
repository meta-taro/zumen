version: 1
kind: placement
arrows: false
title: オーケストラの配置（対向配置と現代配置・同じ編成で並べて比べる）
# **同じ楽器を、どう並べるかだけの図。** それで音が変わる。
#
# ## 弦だけが動く
#
# 木管・金管・打楽器の位置は、どちらの配置でもほぼ同じ。
# **動くのは第 2 Vn と Vc（と Cb の側）だけ。**
#
# ## なぜ分けるのか
#
# 対向配置は、**第 1 と第 2 の掛け合いが左右に分かれて聞こえる。**
# 古典派はそう書かれているので、そのとおりに並べると書かれた形が出る。
# 現代配置は両方の Vn が左に集まるので、**厚みと一体感**が出る。
#
# 弧に並べてあるのは飾りではない —— **指揮者から等距離**に置くため。
#
# **同じ題材で、見本 317 もある。** こちらは対向配置と現代配置を並べて比べる図、
# 317 は「配置そのものが音量の調整である」ことを扱う。

