# **面積が足りることと、取れることは別。**
#
# ホームセンターのカット（パネルソー）は**端から端まで通す切り方だけ**。
# だから ③ の風車配置は、面積が足りていても頼めない ——
# 通るカットが 1 本も無いことを、当たる所に × を置いて見せた。
#
# もう 2 つは**刃厚 3mm**（910 を 300 × 3 に割ると残り 1mm）と、
# **木目の向き**（長手 1820。回すと横木目になり、棚板は割れやすい）。
