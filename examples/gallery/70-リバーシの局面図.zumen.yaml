version: 1
kind: placement
arrows: false
title: リバーシ 初期配置（黒番・着手可能点 4 つ）
# 「オセロ」は登録商標なので、一般名の「リバーシ」で描いている。
# 盤は 8×8 のマス、石はマスの中央。盤の 4 点は線の交点（実物の盤と同じ位置）。
# 着手可能点は小さな丸 —— 実物の対局では盤に印は無いが、解説図では示す。
#
# **盤面だけで局面が決まる。** 石は裏返して使い回すので持ち駒が無く、
# **将棋（見本 67）と違って、盤の絵を写せばそれで足りる** ——
# 必要なのは盤面と手番の 2 つだけ。
#
# **初期配置が中央 4 マスに交差で置かれているから、着手可能点が 4 つになる。**
# 同じ色を縦横に並べると、最初の一手の選べる場所が変わる。
