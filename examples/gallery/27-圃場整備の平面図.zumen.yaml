title: ほ場整備 平面図（30a 区画・24m×125m）
# **ほ場整備は、田の形を機械に合わせる工事。**
# 30a（この図では 24m×125m）という細長い区画は、**トラクタが向きを変える回数を減らす形。**
# （標準区画の寸法と水路の配置は、農林水産省「土地改良事業計画設計基準」で確かめていない。2026-10-04 時点で同省のページが開けなかった。）
# 短辺で回るほど作業時間が増えるので、長辺を長く取る。
#
# ## 用水路と排水路は、別の系統
#
# 入れる水と抜く水を同じ溝にすると、下流の田に一度使った水が回る。
# **上流側に用水、下流側に排水**と分けるので、区画の向きも決まる。
# この図では、どの区画も**北の短辺で用水路に、南の短辺で排水路に**接する。隣の田を通って水が入る・抜ける区画は無い。
# 2026-10-05 まで用水路と排水路を区画の長辺の間に縦に通していて、1-1 は排水路に、1-2 は用水路に接しておらず、
# **水が隣の田を通らないと入らない・抜けない**形だった（上の「別の系統」と食い違い）。
#
# ## 暗渠排水は、見えない工事
#
# 地面の下に管を埋めて、田の水を抜けるようにする。
# **抜ける田は、稲以外も作れる**（転作）—— 図に書いてあるのはそのため。
# 1 px = 250 mm。30a = 24m × 125m = 3,000 m²
