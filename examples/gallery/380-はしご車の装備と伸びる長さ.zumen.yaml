# **はしご車の図。何がどこに付いていて、はしごがどこまで届くか。**
# 小中学生が「はしご車は何 m まで届くの」と聞いたときに、**高さだけでなく横の届き方も**答えるための図。
#
# ## 図の中身
#
# ① 車の上の装備（簡略した形。**実在の車の外観はなぞっていない**）
#    はしごは**縮めて寝かせた状態**で車の上に載り、根もとが**ターンテーブル**（回る台）。
#    先にバスケット。現場では**ジャッキ（アウトリガ）**を張り出して車体を支え、傾きを直してからはしごを起こす。
# ② はしごの角度：**−17〜75°**。**下向き（俯角）にも伸びる**ので、川や崖の下のように
#    車より低い所にいる人へも届く（メーカーの説明）。
# ③ 長さの比べ：6 機種の**最大地上高**を 1px ＝ 100mm で並べた。
#    **長い機種ほど最大作業半径（横への届き）が小さい**（25m 級 21.0m → 54m 級 16.2m）。
#    重さと揺れを抑えるため、と読めるが、メーカーは理由を書いていないので図には書かない。
# ④ 仕様の表（あるメーカー 1 社の公開仕様。**他社は数が違う**）
# ⑤ 決まりの表：置く場所（高さ 15m 以上の建物が多い所）と、乗る人数（5 人）は**消防庁の整備指針**が決めている。
#
# ## 「連」と「段」
# メーカーの仕様は「4 連構成」と書く。はしごが **4 本重なっていて、引き出して伸ばす**という意味で、
# 子どもに言う「4 段」は横桟（足を掛ける棒）の数ではない。横桟の本数は公開されていないので描かない。
#
# ## 描かなかったもの
# - **実在の車の外観・消防本部の名前・消防章・ナンバー**（本物に見えるものを作らない）
# - ジャッキ（アウトリガ）の**張り出し幅と本数** —— 公開仕様に無い。点線で「ここに張り出す」とだけ描いた
# - はしごの**横桟の本数**・油圧の回路 —— 公開資料で確かめられない
# - 54m がビル何階か —— メーカーは「18 階」と書くが、階高を仮定した数なので表にだけ添える
#
# 出典（2026-10-06 に読んだ）：モリタ はしご付消防自動車の仕様表（001/002/003/004/008spec）と FAQ、
# 消防庁「消防力の整備指針」第 7 条（はしご自動車の配置）・第 27 条 3 項（隊員の数）。
