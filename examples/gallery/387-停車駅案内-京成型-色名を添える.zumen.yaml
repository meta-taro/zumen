# ホームと車内に貼る「どの種別が、どの駅に停まるか」の案内。
# 見本 52 と同じ並べ方（行が種別、列が駅、白い丸が停車）に、**京成型の作風**を足した版。
#
# ## 京成型とは
# 国交省のガイドライン p.113 が「列車種別の線の色に色名を表示した例」として載せている作風。
# 種別の色の札に **「みどり Green」「あか Red」のように色名をかなと英語で書く**。
# 色が見分けにくい人でも、**色名を読めば「あかの電車に乗る」と言い合える**。
# ガイドラインの言い方では「路線、車両種別等を色により表示する場合には、文字を併記する等
# 色だけに頼らない表示方法にも配慮する」（p.80）・「凡例等には、それぞれの色名を明記する」（参考 2-2-5）。
#
# ## 色の選び方（ガイドライン p.80・参考 2-2-5 に照らした）
# - 見分けにくい組：赤と黒・赤と緑・緑と茶・黄緑と黄・紫と青・赤と茶・水色とピンク。
#   **この 4 色（あか・あお・あおみどり・はいいろ）はどの組にも当たらない。**
# - 「やむを得ず緑を使う場合は、緑ではなく青緑」→ 緑の代わりに **あおみどり**。
# - 「濃い赤を用いず朱色やオレンジに近い赤」→ あかは **朱寄り**（#e8380d）。
# - 「青と黒、黄と白の組合せは用いない」→ **黒と黄は使わない**（白い丸を黄の帯に置くと黄と白になる）。
# - 「色と色の境界には白または黒の細線」「色付きの線は極力太く」→ 帯は太く、帯の間に白い隙間。
# 実物の京成は普通を「くろ」にしている。色を変えにくい既存の路線は、**色名の併記で補っている**
# —— 新しく決めるなら、そもそも見分けにくい組を選ばない。この図は後者。
#
# ## 描かなかったもの（理由）
# - 中国語・韓国語の併記：実物は 4 言語。ガイドラインは英語を○、他言語を◇（望ましい）としている。
#   この図では英語までにした（文字の量で帯の読みやすさを落とさないため）。
# - 乗換駅を縦に貫く灰色の帯・同じ色の破線の帯（阪急型）：重なり順と模様の色を道具がまだ持たない。
#
# ## 架空であること
# 路線（KR 線）・駅・停車駅・色はすべて架空。実在の事業者の図をなぞったものではなく、社名・ロゴも入れていない。
# 色は「この図のためのもの」（DESIGN.md §7 の例外）。palette の鍵は色名そのもの —— 鍵が図の中に文字で出る。
palette:
  あか: "#e8380d"
  あお: "#0068b7"
  あおみどり: "#00957a"
  はいいろ: "#77777a"
