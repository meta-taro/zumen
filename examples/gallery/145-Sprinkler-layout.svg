<g data-name="n1"><text x="104" y="433" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">Spacing is two numbers at once: the area a head covers, and how far apart heads may sit.</text></g>
<g data-name="n2"><text x="104" y="455" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">The wall limit is half the spacing, so widening the grid moves the heads off the walls too.</text></g>
<g data-name="n3"><text x="104" y="477" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">Figures follow NFPA 13 for light hazard. The room and the layout are fictional.</text></g>
<g data-name="m1"><text x="544" y="75" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">Light hazard: 225 sq ft max per sprinkler, 15 ft max spacing</text></g>
<g data-name="m2"><text x="544" y="103" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">This grid is 12 ft x 12 ft = 144 sq ft a head</text></g>
<g data-name="m3"><text x="544" y="131" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">6 ft from the walls — half the spacing is the limit (7 ft 6 in)</text></g>
<g data-name="m4"><text x="544" y="159" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">4 in minimum from a wall, so a head never sits in the corner</text></g>
<g data-name="m5"><text x="544" y="187" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">Deflector 1 in to 12 in below the ceiling (standard spray)</text></g>
<g data-name="m6"><text x="544" y="215" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">Hatched: the area one head is responsible for</text></g>
<g data-name="m7"><text x="544" y="243" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">Double circle: riser and cross main</text></g>
