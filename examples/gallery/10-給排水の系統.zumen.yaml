title: 住宅の給排水衛生設備系統図
# **給水は押し、排水は落ちる。** だから太さの決まり方が逆になる。
#
# ## 給水は細い（13A・20A）
#
# 水道本管の圧力で押すので、**同時に何個使うか**で口径を決める。
# 全部の器具を足した量では決めない（全部を同時には使わない）。
#
# ## 排水は太い（50A・75A）
#
# 落ちるだけなので、**勾配と、空気の通り道**が要る。満管になると
# 封水を引っ張って臭いが上がるため、給水より 2 段も 3 段も太くする。
#
# ## ますは、詰まる所に置く
#
# 汚水ますは方向が変わる所と合流する所。**掃除できない配管は、詰まったら掘る。**
