version: 1
kind: placement
arrows: true
title: IH クッキングヒーターの原理（熱くなるのは鍋底 0.05mm）
# **熱は鍋の中で生まれる。** コイルが作る磁力線が鍋底を突き抜け、
# 鍋の中に渦電流が流れ、**鍋自身の電気抵抗**で発熱する。
# ガラスも空気も温めていない —— トッププレートが熱いのは、鍋から伝わったから。
#
# **電流は表面のごく薄い層にしか流れない**（表皮効果）。
# δ ＝ √( ρ ／ π f μ )。20kHz の鉄で **0.050mm** ——
# 紙より薄い層だけが働いている。
#
# **鉄が効くのは、層が薄いぶん抵抗が高いから。**
# 同じ 20kHz で、鉄の表面抵抗（1.99 mΩ）はアルミ（0.046 mΩ）の **43 倍**。
# アルミと銅は「電気を通しすぎて熱が出ない」。
#
# **オールメタルは周波数を上げて埋めるが、√f でしか増えない。**
# 20kHz → 90kHz でアルミの抵抗は 2.1 倍にしかならず、火力は 80〜90% に落ちる。
#
# 見分けるのは材質ではなく**鍋底**。ステンレスでも 18-8／18-10 は磁石がつかない。
