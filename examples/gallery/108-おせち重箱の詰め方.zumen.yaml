title: おせち三段重の詰め方（6.5 寸・市松／段取り／升掛）
# 1 px = 1 mm。**どこに何を詰めるか**の図。品数と型に決まりがある。
#
# ## 奇数で詰める
#
# **3・5・7。** 偶数は「割れる」「別れる」を連想させるので使わない。
#
# ## 隙間を残さない
#
# **固形のものから先に詰め**、隙間はカップ入り（栗きんとん・煮物）で埋める。
# 詰まっていると崩れず、**味も移らない。**
#
# ## 描けない型がある
#
# 詰め方の型は 市松・段取り・升掛・七宝・末広の 5 つ。
# **末広（扇）と七宝（円の重なり）は、面を塗った曲線**が要るので、
# いまの zumen では描けない（README の「まだ無いもの」に書いてある）。
# ここでは矩形で割れる 3 つを描いた。
