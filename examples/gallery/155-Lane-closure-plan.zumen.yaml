    title: "Lane closure (not to scale)"
    at: { x: 60, y: 60 }
    size: { w: 600, h: 620 }
  - id: strip
    title: "The same closure, to scale along its length (1 px = 5 ft)"
    at: { x: 760, y: 910 }
    size: { w: 540, h: 100 }
    scale: { in: 60 }
    grid:
      x:
