version: 1
kind: placement
arrows: true
title: 魚の三枚おろし（包丁の向きは、中骨が決める）
# **三枚おろしは、右の身・左の身・中骨の 3 つに分けること。**
# 背骨を挟んで左右対称な魚なら、ほぼすべてこの順で下ろせる。
#
# **包丁の向きは、中骨に沿わせる向きで決まる。**
# **腹側は頭から尾へ、背側は尾から頭へ** —— 逆に引くと骨から外れて身を削る。
# **ウロコは尾から頭へ** 落とす（鱗は頭向きに重なっているので、逆から当てないと起きない）。
# 頭は**胸びれと腹びれが頭側に残るよう斜めに**落とす。
#
# **順番。** ウロコ → 頭 → 腹を開いて内臓と血合いを洗う → 腹側から頭→尾 →
# 背側から尾→頭 → 中骨に沿って身を外す → 裏返して同じことを繰り返す。
# **洗うのは内臓を出した直後だけ**で、身にしたあとは洗わない。
#
# **三枚にしたあと、身には骨が残る。**
# **腹骨はすき取り**（身ごとすくうように）、**血合骨は骨抜きで頭の方向へ引く** ——
# 血合骨は頭のほうへ斜めに生えているので、**向きを間違えると折れる。**
# 身が割れるのは力ではなく向きの問題。皮を引いて、残るのが**柵**。
#
# **枚数は技の名前ではなく、魚の形の言い換え。**
# ひらめ・かれいが**五枚おろし**なのは体が平たく、背びれと尻びれに沿って
# 身が 4 つに分かれるから（中骨と合わせて五枚）。
