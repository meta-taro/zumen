sources:
  - name: "日本食肉格付協会「牛部分肉取引規格」"
    url: "https://www.jmga.or.jp/standard/beef-partial/"
    retrieved: 2026-10-02
# **書く位置が体の位置**（歯式・査定図・ヘアのブロッキングと同じ型）。
#
# ## 目分量では割らない
#
# **境目は骨の位置で決まっている。** 例えばリブロースとサーロインの境は
# 第 10・第 11 胸椎跡の間（背線にほぼ直角に切る）。かたロースとリブロースの境は、枝肉を「まえ」と「とも」に
# 分ける所（部分肉取引規格の本文に椎骨の番号は書かれておらず、ここでは番号を書かない）。
# **規格で決まっているから、どこで買っても同じものが届く。**
# 出典：日本食肉格付協会「牛部分肉取引規格」https://www.jmga.or.jp/standard/beef-partial/ （取得 2026-10-02）
#
# ## ヒレはサーロインの中に描く
#
# **ヒレはサーロインの内側**（背骨の下）にある。
# 側面図では重なるので、**サーロインの中へ入れて**描いた ——
# 入れ子なので `straddles`（はみ出した重なり）にはならない。
#
# ## 位置は模式（並べ方は体の前後・上下）
#
# 背の列は前から ネック・かたロース・リブロース・サーロイン・らんいち。
# かたはかたロースの下、前のすねはその下。かたばら・ともばらは腹側。
# 後ろ脚は前側がしんたま、後ろ側がそともも。**うちももは脚の内側**なので側面図では見えず、ここでは下に並べた。後ろのすねはいちばん下。
#
# ## 歩留まりは書かない
#
# 個体と分割のしかたで変わる。**数字が独り歩きするので、この図には載せない。**
