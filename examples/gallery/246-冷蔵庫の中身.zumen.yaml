title: 冷蔵庫の中身（冷凍サイクルと、庫内の風の道）
# **冷蔵庫は冷やしていない。庫内の熱を汲み出して、外へ捨てている。**
# 背面が温かいのはそのため。捨てる熱は、取った熱 ＋ 圧縮機が使った電気。
#
# 回すのは 4 つだけ —— **圧縮機・凝縮器・キャピラリチューブ・蒸発器**。
# 家庭用は膨張弁ではなく**細い管でしぼる**。
#
# **蒸発器は 1 つしかない。** 冷凍室の裏で冷やし、ファンで各室へ配り、
# ダンパで冷蔵室へ行く量を変える。霜取りヒーターが要るのは、
# 庫内の水分がいちばん冷たい所（蒸発器）へ集まるから。
#
# **冷媒は 3 代で替わった。** R12（ODP 1.0 / GWP 10,900）→
# R134a（0 / 1,430）→ **R600a（0 / 3）** —— 温暖化の重さは 3,600 分の 1。
# かわりに**燃える冷媒（A3）に戻った**ので、量を 150g 前後に抑えている。
#
# **真空断熱材は、ウレタン 63mm ぶんの断熱を 14mm で作る**（U ＝ 0.38 W/m²K）。
# 外形が同じでも内容積が違うのは、壁の厚みの差。
