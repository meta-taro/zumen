title: 競泳の 50m プール（5m と 15m の印は、何を見るためにあるか）
palette:
  緑: "#2e8b57"
  青: "#1f5fbf"
  黄: "#9c7c00"
  赤: "#d62828"
sources:
  - name: "World Aquatics「Competition Regulations」（2026 年 2 月施行）Part Two Swimming Rules §15 Swimming Facilities and Equipment、§2.9・§5・§6・§8"
    url: https://www.worldaquatics.com/rules/competition-regulations
    retrieved: 2026-10-06
# **50m は、壁と壁ではなく、タッチ板とタッチ板の間。**
# 板を両端に付けるプールは、壁と壁を 50.020〜50.030m に造る（§15.2.1.2）。
#
# **何のための図か。** 施設の担当と審判が、ロープ・旗・床の線を据える位置を
# 規則の数で確かめるための図。泳法の指導や、記録の判定の手順は描かない。
#
# **描いたもの（①平面 1 px ＝ 80 mm）。** オリンピックの 8 レーン（2.5m × 8 ＋ 外側の空き 2.5m × 2、幅 25m）、
# コースロープ 9 本とその色（1・8 は緑、2・3・6・7 は青、4・5 は黄 —— §15.7.6.1）、
# 両端 5.0m の赤い浮き（§15.7.7）、15m と 25m の色を変えた浮き（§15.7.9・15.7.10）、
# 背泳ぎの旗の綱（壁から 5.0m。頭の上にあるので破線 —— §15.9.1）、プールの両側の 15m の印、
# 床のライン（幅 0.25m で描いた。2〜48m、両端に 1m の横線 —— §15.13.1・15.13.2）と 15m の横線 0.5m（§15.13.4）、
# 両端のタッチ板（幅 2.4m —— §15.16.4。厚さ 0.01m は 3px で描いた）、スタート台。
# **②断面（1 px ＝ 20 mm）。** スタート側の 0〜7m。水深 2.5m（§15.4.1）、その他の大会の最小（1.0m、
# スタート台を使うなら壁から 1.0〜6.0m は 1.35m —— §15.4.3・15.8.4）、スタート台の高さ 0.5〜0.75m（§15.8.1）、
# タッチ板の上 0.3m・下 0.6m（§15.16.4.2）、旗の綱の高さ 1.8m（§15.9.1）。
#
# 断面のプールの縁（デッキ）の高さは規則に無いので、タッチ板の上端（水面上 0.3m）に揃えて描いた。
#
# **レーン 1 を下（スタート側から見て右手）に置いた。** §15.8.6 は 10 レーンのプールで
# 「0 をスタート側から見て右手」を勧めている。8 レーンの向きは規則に無いので、同じ向きに揃えた。
# **描かなかったもの（理由）。**
# - 旗そのもの（三角 0.20 × 0.40m を 0.25m おき —— §15.9.2）—— 1 px ＝ 80 mm では 3px になり、点にしか見えない。表に数だけ書いた
# - 壁の的線（target line）・背泳ぎのレッジ・排水溝 —— 平面では壁の厚みに入ってしまう
# - 10 レーンの世界選手権の割り方（2.5m × 8 ＋ 2.4m × 2 ＋ 0.1m の空き —— §15.6.2.1）—— 1 枚に 2 つの割り方を重ねると読めない
# - 水温（25〜28℃）・照度（1500 lx）・水の流れ —— 平面に場所を持たない
# 出典（取得 2026-10-06）：World Aquatics Competition Regulations（In force as from February 2026）Part Two Swimming Rules
# §15.1〜15.16（施設）、§2.9（背泳ぎの旗は種目の前に泳法審判が確かめる）、§5・§6・§8（15m までに頭を出す）。
# 施設の基準は、旧 FINA の Facilities Rules（FR）ではなく、いまはこの Part Two §15 に書かれている。
