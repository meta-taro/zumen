title: LAN ケーブルの結線（T568A と B の違いは、橙と緑だけ）
# **2 つの規格があるのに、違うのは 4 本だけ。** 4・5・7・8 番は完全に同じ。
#
# ## T568A
#
# 1 白/緑・2 緑・3 白/橙・4 青・5 白/青・6 橙・7 白/茶・8 茶。
#
# ## T568B
#
# 1 白/橙・2 橙・3 白/緑・4 青・5 白/青・6 緑・7 白/茶・8 茶。
#
# **ペア 2（橙）とペア 3（緑）を入れ替えただけ。**
#
# ## ペア 3 が、となり合っていない
#
# ペアは 1（4・5 番）・2（1・2 番）・3（**3 番と 6 番**）・4（7・8 番）。
# **ペア 3 だけが、間にペア 1 をはさんで離れている。**
# 真ん中の 2 本（4・5）を電話に使っていたころの並びが、そのまま残っている。
#
# ## 両端が同じならストレート
#
# 両端とも同じ規格で結べば**ストレート**、片方だけ変えると**クロス**。
# いまは Auto MDI-X が入っているので、クロスケーブルはほとんど要らない。
#
# ## なぜ撚るのか
#
# **撚ると、ノイズ源に近い線が入れ替わる。**
# 両方の線が同じだけノイズを受けるので、差動で打ち消し合う。
# **対ごとに撚りの細かさを変えてある**のは、同じ撚り率だと
# 別の対の同じ線が繰り返しとなり合ってしまい、差動の利点を失うから。
#
# ## 4 本だけ繋がっていれば動く、は 1Gbps では通らない
#
# **1000BASE-T は 4 対すべてを使う。** 10BASE-T・100BASE-TX が 2 対しか
# 使っていなかったので、その時代の常識が残っている。
#
# ラックと 1U は見本 235、PoE の給電クラスは見本 236。
#
# 色は palette で持たせ、**ピン番号と色の名前を図の中に文字でも出している** ——
# 色だけに頼ると、白黒と色覚特性で読めなくなる。
# **規格が決めているのは色の名前（橙・緑・青・茶）であって、hex ではない**ので、
# ここの値は地の上で読める濃さに寄せてある。
