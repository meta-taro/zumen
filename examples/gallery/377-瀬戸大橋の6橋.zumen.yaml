title: 瀬戸大橋の 6 橋 —— 吊橋・斜張橋・トラス橋が連なる 2 層の道路・鉄道併用橋（側面の模式と諸元）
sources:
  - name: "本州四国連絡高速道路株式会社「瀬戸大橋 —— 瀬戸大橋６橋（下津井瀬戸大橋・櫃石島橋・岩黒島橋・与島橋・北備讃瀬戸大橋・南備讃瀬戸大橋）」"
    url: "https://www.jb-honshi.co.jp/seto-ohashi/shoukai/6kyou.html"
    retrieved: 2026-10-06
  - name: "本州四国連絡高速道路株式会社「瀬戸中央自動車道」「開通から20周年まで」「補剛桁の架設」"
    url: "https://www.jb-honshi.co.jp/seto-ohashi/shoukai/"
    retrieved: 2026-10-06
# **瀬戸大橋は 1 本の橋ではない。** 海峡部 9.4km に連なる 6 つの橋の総称で、
# 形式が 3 つ（吊橋・斜張橋・トラス橋）混ざり、どれも上段が道路・下段が鉄道の 2 層になっている。
# この図は、その並びと形式、支間の割り方と高さを 1 枚で読むための側面の模式図。
#
# ## 何のための図か
#
# 理解のための図。「瀬戸大橋」と一口に呼ばれるものが、どんな橋の組み合わせでできているか ——
# どこが吊橋で、どこが斜張橋で、なぜ北備讃と南備讃のあいだにアンカレイジが 1 つしかないか。
#
# ## 描き方
#
# - 横 1px＝6m、縦 1px＝1m。**高さを 6 倍に強調した**（同じ縮尺だと塔が 30px にしかならず、形式が読めない）
# - 橋の長さ（支間割）と塔頂高・桁下高は公式頁の数どおりに置いた。**橋と橋のあいだは詰めた**（長さの数が無い）
# - 北備讃と南備讃は、共用アンカレイジ（BB4A）で**継ぎ目なく**つないだ。ここは実物も 1 基
# - 吊橋はケーブルとハンガー、斜張橋は塔から桁へのケーブル、トラス橋は上弦・下弦と斜材で形式を描き分けた
# - 下津井瀬戸大橋は**側径間を吊らない**ので、側径間のケーブルにハンガーを描かず、桁は塔から少しだけ張り出した
#
# ## 公式頁の数（この図はこれだけで描いた）
#
# | | 形式 | 橋長 | 支間割 | 塔頂高（T.P.） | 桁下高（略最高高潮面） |
# |---|---|---|---|---|---|
# | 下津井瀬戸大橋 | 張出径間付単径間補剛トラス吊橋 | 1,400m | 230+940+230 | 149m | 31m |
# | 櫃石島橋 | 3 径間連続鋼トラス斜張橋 | 790m | 185+420+185 | 152m | 32m |
# | 岩黒島橋 | 3 径間連続鋼トラス斜張橋 | 790m | 185+420+185 | 161m | 41m |
# | 与島橋 | 2 径間及び 3 径間連続トラス橋 | 850m | (125+137)+(175+245+165)=847m | —— | 45m |
# | 北備讃瀬戸大橋 | 3 径間連続補剛トラス吊橋 | 1,538m | 274+990+274 | 184m | 65m |
# | 南備讃瀬戸大橋 | 3 径間連続補剛トラス吊橋 | 1,648m | 274+1,100+274 | 194m | 65m |
#
# 瀬戸中央自動車道：延長 37.3km、第一種第 2 級、設計速度 100km/h、4 車線、昭和 63 年 4 月開通（開通式 1988 年 4 月 10 日）。
# ルートは道路 37.3km・鉄道 32.4km。海峡部 9.4km の 6 橋を総称して瀬戸大橋。
# 補剛桁は上が鋼床版（道路）、下が下路床組（鉄道）。電力・通信ケーブル、管理路、外面作業車の軌条も添架（補剛桁の架設の頁の説明図）。
#
# ## 計算した所
#
# 6 橋の橋梁区間長 1,447＋792＋792＋854＋1,611＋1,723＝7,219m。9.4km との差 約 2.2km が橋のあいだ。
# 与島橋の支点は 0・125・262・437・682・847m（橋脚 4 基 YB1P〜YB4P と両端）。
#
# ## 描かなかったもの
#
# - **ケーブルのたるみ（サグ）の量・斜張橋のケーブルの本数・トラスの高さ。** 公式頁に数が無い。形式が分かる形だけを描き、注記で「模式」と言った
# - **鉄道の線路の数。** 公式頁で確かめられなかった（下段が鉄道であることだけを描いた）
# - **橋と橋のあいだの高架橋・島の地形。** 長さの数が無い
# - **基礎（ケーソン）と水深。** 南備讃の番の州側は水深 50m の大水深基礎だが、図が海の中まで広がり、6 橋の並びが読めなくなる
# - **公式のロゴ・写真・案内図。** これは公開されている数から描き直した非公式の図
#
# 出典：本州四国連絡高速道路株式会社「瀬戸大橋」の頁（瀬戸大橋６橋・各橋の諸元、瀬戸中央自動車道、開通から20周年まで、補剛桁の架設）。2026-10-06 取得。
