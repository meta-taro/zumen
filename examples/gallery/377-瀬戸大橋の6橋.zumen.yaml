  - id: n0
    label: "・瀬戸大橋は 1 本の橋ではない。海峡部 9.4km に連なる 6 橋の総称（瀬戸中央自動車道・JR 瀬戸大橋線。1988 年 4 月 10 日開通）"
    marker: none
    align: left
    at: { x: 530, y: 104 }
    size: { w: 960, h: 18 }
  - id: n1
    label: "・形式が 3 つ混ざる —— 吊橋 3（下津井瀬戸・北備讃瀬戸・南備讃瀬戸）、斜張橋 2（櫃石島・岩黒島）、トラス橋 1（与島）"
    marker: none
    align: left
    at: { x: 530, y: 126 }
    size: { w: 960, h: 18 }
  - id: n2
    label: "・どの橋も 2 層の道路・鉄道併用橋。上段が道路（4 車線・設計速度 100km/h）、下段が鉄道"
    marker: none
    align: left
    at: { x: 530, y: 148 }
    size: { w: 960, h: 18 }
  - id: n3
    label: "・中央支間がいちばん長いのは南備讃瀬戸大橋の 1,100m。塔頂も 194m でいちばん高い"
    marker: none
    align: left
    at: { x: 530, y: 170 }
    size: { w: 960, h: 18 }
  - id: n4
    label: "・北備讃と南備讃は、あいだのアンカレイジ（BB4A）を共用。ケーブルを空中で交差させ、両側の引張力を釣り合わせて小さくした"
    marker: none
    align: left
    at: { x: 530, y: 192 }
    size: { w: 960, h: 18 }
  - id: n5
    label: "・下津井瀬戸大橋は側径間を吊らない（張出径間付き単径間吊橋）。地形の都合で、側径間に桁を張り出した"
    marker: none
    align: left
    at: { x: 530, y: 214 }
    size: { w: 960, h: 18 }
  - id: n6
    label: "・6 橋の橋梁区間長の和は 7,219m（計算）。9.4km との差の約 2.2km は橋と橋のあいだで、この図では詰めて描いた"
    marker: none
    align: left
    at: { x: 530, y: 236 }
    size: { w: 960, h: 18 }
  - id: n7
    label: "・塔頂高は T.P.±0 から、桁下高は略最高高潮面から測った値（公式頁のまま）。2 つの基準面の差は描いていない"
    marker: none
    align: left
    at: { x: 530, y: 258 }
    size: { w: 960, h: 18 }
  - id: n8
    label: "・ケーブルのたるみ・斜張橋のケーブルの本数・トラスの高さは模式。公式頁に数が無いので、形だけを描いた"
    marker: none
    align: left
    at: { x: 530, y: 280 }
    size: { w: 960, h: 18 }
