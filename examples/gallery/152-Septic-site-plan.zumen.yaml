# **A plan drawing decided by something vertical** —— how fast water leaves the
# soil. The perc test gives the loading rate, the bedroom count gives the design
# flow, and together they give the trench area that the plan then arranges.
#
# **The reserve area is drawn and kept empty.** A drainfield is a consumable;
# the next one has to have somewhere to go.
#
# Sizes, soils and setbacks are fictional; local health codes decide them.
