title: イコライザーの仕組み（GEQ は決まった 31 本、PEQ は中心と幅を選ぶ）
sources:
  - name: "JIS C 1514:2002 オクターブ及び 1/N オクターブバンドフィルタ（IEC 61260:1995）3.2〜3.7"
  - name: "JIS C 1513:2002 音響・振動用オクターブ及び 1/3 オクターブバンド分析器 付表 1 中心周波数"
  - name: "W3C「Audio EQ Cookbook」（Working Group Note, 2021-06-08）peakingEQ"
    url: "https://www.w3.org/TR/audio-eq-cookbook/"
    retrieved: 2026-10-06
# **イコライザーは、どこを（周波数）・どれだけ（ゲイン）・どの幅で（Q）変えるかの 3 つ。**
# グラフィック EQ はそのうち「どれだけ」だけを動かし、パラメトリック EQ は 3 つとも動かす。
#
# ## 31 本の中心周波数
#
# JIS C 1514:2002（IEC 61260:1995）は、オクターブ比を 10 のべきで G ＝ 10^(3/10) と決め、基準を厳密に 1000Hz とする。
# 1/3 オクターブの厳密な中心は fm ＝ 1000 × G^(x/3) ＝ 1000 × 10^(x/10)（x は整数）。
# 帯域の端は f1 ＝ fm × G^(−1/6)、f2 ＝ fm × G^(+1/6)（＝ 10^(±1/20) 倍）。
# 公称値は厳密値を丸めたもので、JIS C 1514:2002 の引用規格に ISO 266:1997（Preferred frequencies）がある。
# 例：x ＝ 7 の厳密値 5,011.872Hz、公称 5,000Hz（JIS C 1514:2002 3.5 備考 3）。
# 20Hz（x ＝ −17）から 20kHz（x ＝ 13）まで 31 本。
#
# ## 計算したもの
#
# ② ③の曲線はアナログのピーキングフィルタ（Audio EQ Cookbook の peakingEQ と同じ形、A ＝ 10^(dB/40)）の振幅で、
# 各バンドを直列につないだもの（dB で足す）として計算した。実機の GEQ は回路で重なり方が違うので、
# **深さは目安**。1/3 オクターブの Q は 1/Q ＝ 2 sinh((ln2/2) × 1/3) から 4.318。
#
# ## 架空のところ
#
# つまみの設定（200・250・315Hz を下げ、3.15kHz を上げる）と PEQ の 3 バンドは説明のための例。
#
# ## 描かなかったもの
#
# - シェルビング（低域・高域をまとめて上げ下げする形）とハイパス —— 形が違う。PEQ の 3 バンドはピーキングだけにした
# - 位相の変化 —— EQ は位相も動かすが、この図は大きさだけ
# - 製品のパネル —— 実在の機種の配置をなぞらない
#
# EQ がミキサーのどこにあるかは見本 343、スピーカーの構造は見本 371、PA の配置は見本 101・370。
