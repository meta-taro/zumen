  - id: n0
    label: "イコライザーは、周波数ごとに音量を上げ下げする道具。どこを・どれだけ・どの幅で変えるかの 3 つで決まる。"
    marker: none
    align: left
    at: { x: 60, y: 730 }
    size: { w: 1130, h: 18 }
  - id: n1
    label: "1/3 オクターブの中心は 1000Hz を基準に 10^(1/10) 倍ずつ並ぶ（JIS C 1514:2002 ＝ IEC 61260:1995、公称値は ISO 266:1997）。"
    marker: none
    align: left
    at: { x: 60, y: 756 }
    size: { w: 1130, h: 18 }
  - id: n2
    label: "10 本で 10 倍、3 本でほぼ 2 倍（1 オクターブ）。20Hz〜20kHz にちょうど 31 本入る —— 31 バンドの GEQ はこの数。"
    marker: none
    align: left
    at: { x: 60, y: 782 }
    size: { w: 1130, h: 18 }
  - id: n3
    label: "帯域の端は中心の 10^(±1/20) 倍（約 0.89 倍と 1.12 倍）。隣の帯域と隙間なくつながる。"
    marker: none
    align: left
    at: { x: 60, y: 808 }
    size: { w: 1130, h: 18 }
  - id: n4
    label: "1/3 オクターブの幅を Q で言うと 4.32（1/Q ＝ 2 sinh(ln2/2 × 1/3)）。Q が大きいほど細い。"
    marker: none
    align: left
    at: { x: 60, y: 834 }
    size: { w: 1130, h: 18 }
  - id: n5
    label: "GEQ のつまみの並びは、そのまま周波数特性の絵に見える。ただし隣のバンドと重なるので、合成はつまみの線より深くなる。"
    marker: none
    align: left
    at: { x: 60, y: 860 }
    size: { w: 1130, h: 18 }
  - id: n6
    label: "ハウリングは 1 つの周波数で起きる。2.7kHz のように GEQ の間に落ちたら、PEQ の細い Q で狙う。"
    marker: none
    align: left
    at: { x: 60, y: 886 }
    size: { w: 1130, h: 18 }
  - id: v1
    label: "① グラフィック EQ（31 バンド）のつまみ —— 下の数字は 1/3 オクターブの公称中心周波数（Hz）"
    marker: none
    align: left
    at: { x: 170, y: 112 }
    size: { w: 760, h: 18 }
  - id: v2
    label: "② ①の設定で実際にかかる特性（各バンドを Q4.32 のピーキングとして重ねた計算）"
    marker: none
    align: left
    at: { x: 170, y: 452 }
    size: { w: 720, h: 18 }
  - id: v3
    label: "③ パラメトリック EQ（3 バンド）の特性"
    marker: none
    align: left
    at: { x: 1260, y: 112 }
    size: { w: 400, h: 18 }
