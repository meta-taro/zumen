# **英語の解答用紙だけにあるのは、4 線の罫と、語数を数える欄。**
#
# 決まり（取得 2026-11-05）——
# 4 線は上からアセンダライン・ミーンライン・ベースライン（基線、太線や赤線）・ディセンダライン（羽島市立中央中学校）。
# 大文字は第 1〜第 3 線、x 高さの小文字は第 2〜第 3 線、b d f h i k l t は第 1 線まで、g j p q y は第 4 線まで。
# 4 線の罫は学校のプリントの形。入試の解答用紙（長野県・三重県、取得 2026-11-10）は無地の枠か 1 本線。
# 短縮形は 1 語、符号は語数に含めない（神奈川県 R6）。記入例は 12 語：I'm / going / to / visit / Kyoto / and / I / want / to / see / old / temples。
