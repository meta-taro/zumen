title: 階段の寸法（2H ＋ D が同じでも、急さは別物）
# **住宅の階段は、建築基準法で下限が決まっている。**
# **蹴上 230mm 以下・踏面 150mm 以上・有効幅（内法）750mm 以上。**
# **蹴上だけが「以下」** —— 踏面と幅は「以上」で縛るのに、蹴上は上限で縛る。
# 高く上がりすぎることのほうが危ないから。
#
# **2H ＋ D は、歩幅に合わせる目安。**
# 蹴上を H、踏面を D として **2H ＋ D ＝ 歩幅**（600mm 以上）。
#
# **ところが、同じ 610mm でも急さは別物。**
# **蹴上 230・踏面 150 は 230 × 2 ＋ 150 ＝ 610**（勾配およそ **57 度**）。
# **蹴上 180・踏面 250 も 180 × 2 ＋ 250 ＝ 610**（勾配およそ **36 度**）。
# **20 度違うのに、式の上では同じ。**
# 2H ＋ D は「歩幅に合うか」しか見ていない —— **急さは蹴上と踏面の比**で決まる。
#
# 家庭用の階段は **45 度前後**とされるが、**45 度はけっこう急。**
# 法の下限いっぱいはさらに急で、**降りるときに踏面が見えない** ——
# **上がれることと、降りられることは別。**
#
# **手すりの高さは 2 つある。**
# **水平部は 1,100mm 以上、段部は 850mm 以上。**
# 段の上に立つ人の足もとはすでに段ぶん高いので、**手の高さを揃えるために手すりは低く取る。**
