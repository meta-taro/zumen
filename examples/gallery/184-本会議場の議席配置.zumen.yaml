version: 1
kind: placement
arrows: false
title: 本会議場の議席配置（扇形と会派の並び・架空の会派）
# **席順が、会派の大きさを表している。**
#
# 議席は議長席を中心に**扇形**に並ぶ（どの席からも発言しやすくするため）。
# 会派は**議長席に向かって左から、所属議員の多い順**に座るのが慣例。
# 議長席の左右 2 列は国務大臣席で、**総理大臣席は議長席に近い左側**。議長の左隣は事務総長席。
#
# この図の席は、**列の席数を半径に比例させ、合計を定数 465 に合わせて**作った。
# 左から右（角の小さい順）に、会派を大きい順で配っている。会派名と議席数は架空。
