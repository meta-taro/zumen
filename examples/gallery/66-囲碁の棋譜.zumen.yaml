version: 1
kind: placement
arrows: false
title: 囲碁 棋譜（19 路・布石 12 手まで）
# 碁盤は「線の交点」に石を置く —— マス目ではない。
# ここでは 18×18 のマスの枠で線を作り、石はその角（＝交点）へ置いている。
# 線を辺で引くと交差が 324 か所になり、検査が「読みにくい」と言う ——
# 盤としては正しいので、交差の数え方が合わない図もある（記録）。
# 星は 9 つの小さな黒点。**石が乗る星は書かない** ——
# zumen は重なり順を正本から決められないので、小さい星が石の上に出る（課題 10）。
# 手数は石の中（白石の数字は黒、黒石の数字は白）。
parts:
  # 盤のマスと石は部品（parts）にした。マスは 1 つ定義して grid で 18×18 に並べ、
  # 石は黒と白を 1 つずつ定義して、手数だけを set で変える。
  # place を nodes より前に書いたので、展開したマスと石は nodes（星・座標・注記）の前に並ぶ。
  cell:
    nodes:
      - { id: sq, label: "", at: { x: 0, y: 0 }, size: { w: 28, h: 28 } }
  black:
    nodes:
      - { id: s, label: "", marker: circle, hatch: solid, at: { x: 0, y: 0 }, size: { w: 24, h: 24 } }
  white:
    nodes:
      - { id: s, label: "", marker: circle, at: { x: 0, y: 0 }, size: { w: 24, h: 24 } }
place:
  # 盤。左上のマスが (44, 44)、1 マス 28px。マスの名前は g.<行>.<列>
  - { part: cell, as: g, at: { x: 44, y: 44 }, grid: { cols: 18, rows: 18, step: { x: 28, y: 28 } } }
  # 石。手数の順
  - { part: black, as: m1, at: { x: 452, y: 116 }, set: { s: { label: "1" } } }
  - { part: white, as: m2, at: { x: 116, y: 452 }, set: { s: { label: "2" } } }
  - { part: black, as: m3, at: { x: 116, y: 116 }, set: { s: { label: "3" } } }
  - { part: white, as: m4, at: { x: 452, y: 452 }, set: { s: { label: "4" } } }
  - { part: black, as: m5, at: { x: 480, y: 172 }, set: { s: { label: "5" } } }
  - { part: white, as: m6, at: { x: 480, y: 396 }, set: { s: { label: "6" } } }
  - { part: black, as: m7, at: { x: 396, y: 88 }, set: { s: { label: "7" } } }
  - { part: white, as: m8, at: { x: 88, y: 396 }, set: { s: { label: "8" } } }
  - { part: black, as: m9, at: { x: 172, y: 480 }, set: { s: { label: "9" } } }
  - { part: white, as: m10, at: { x: 284, y: 116 }, set: { s: { label: "10" } } }
