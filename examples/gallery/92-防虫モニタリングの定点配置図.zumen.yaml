version: 1
kind: placement
arrows: false
north: up
title: 食品工場 防虫モニタリング 定点配置図（HACCP / IPM）
# 虫を殺す図ではなく、**どこで何匹捕れたかを毎月比べるための図**。
#
# ## 定点は動かさない
#
# **番号と位置が固定されていることが記法。** 置き場所を変えた瞬間、
# 先月との比較ができなくなり、増えているのか減っているのかが言えなくなる。
#
# ## 中と外を分けて読む
#
# 外の定点に虫が居るのは当たり前。見るのは**外と中の差**と、**中の増え方**。
# だから外の定点には措置値を置かない。
#
# ## 区画
#
# 汚染区（荷受・原料庫）→ 準清浄区（前処理）→ 清浄区（充填・包装）。
# **虫は人と物と一緒に、この向きへ移動する。**
