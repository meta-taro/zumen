version: 1
kind: placement
paper: { size: A4, orient: landscape, margin: 0 }
title: "バンドのステージプロットとインプットリスト（図の丸の番号＝表の Ch）"
# 出典（取得 2026-11-13）：
#   Musosoup「Stage plot」https://musosoup.com/blog/stage-plot
#     客席から見た向きで描く・ドラムは奥、メインボーカルは前の中央・寸法は前の縁と中心線から・
#     マイクとモニター（ミックス番号）・電源の位置・版と日付・連絡先・図と表で同じ名前を使う
#   Improvised Music Company「What is a Technical Rider and why do I need one」
#     https://www.improvisedmusic.ie/supporting-musicians/resources-opportunities/what-is-a-technical-rider-and-why-do-i-need-one
#     ライダーはステージ図・チャンネル表・機材表の 3 つ。チャンネル表は入力数・楽器名・マイクか DI・
#     スタンドの種類・立ち位置・子箱の入力番号。手描きなら太鼓は丸・マイクは丸・アンプは四角・ウェッジは三角
#   Shure「Beyond the Basics: Drum Miking」https://www.shure.com/en-US/insights/beyond-the-basics-drum-miking
#     キックの中と外に 1 本ずつ（Beta 91A ＋ Beta 52A）
#
# **この図の要は、図と表が同じ番号で結ばれていること。** 丸の数字は入力 Ch で、
# PA は表の 16 行と図の 16 個の丸を突き合わせて、どこへ何を立てるかを決める。返しは M の番号で同じことをする。
# 上手・下手：客席から見て右が上手（STAGE LEFT）。英語の left / right は演者から見た向き。
# スネア裏はヘッドを反対から拾うので、表と逆の位相になる。卓で反転する（備考）。
#
# 座標は mm で考えて px に直した（1px = 25.4/96 mm。margin: 0 で紙の左上が原点）。舞台は 1/60（8 × 5m）。
# 決まりではないもの：記号の形（手描きの慣習）・Ch の並び（ドラム→ベース→ギター→鍵盤→声はこの例の選び方）・
#   表の列・A4 横に 1 枚でまとめたこと（図と表を分ける人もいる）。
# 架空：バンド名・編成・版・機材の選び方・返しの中身はすべて架空。マイクの型番は例で、ライダーでは「同等品可」と添えることが多い。
# 描かなかったもの：電話番号・メールアドレス（架空でも書かない）・照明・特効・ケーブルの引き回し。
