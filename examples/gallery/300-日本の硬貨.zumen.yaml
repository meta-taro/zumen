title: 日本の硬貨（大きさは、価値の順に並んでいない）
# **3 つの順番が、どれも一致しない。**
#
# - **価値の順** —— 1 → 5 → 10 → 50 → 100 → 500
# - **大きさの順** —— 1 円 20mm → **50 円 21mm** → **5 円 22mm** → 100 円 22.6mm → **10 円 23.5mm** → 500 円 26.5mm
# - **重さの順** —— 1 円 1.0g → 5 円 3.75g → **50 円 4.0g** → **10 円 4.5g** → 100 円 4.8g → 500 円 7.1g
#
# **50 円は 5 円より小さく、10 円は 100 円より大きい。** 価値と形はつながっていない。
#
# **穴があるのは 5 円と 50 円だけ**（5mm と 4mm）。
# どちらも穴があるが、**50 円にはギザがあり、5 円には無い** ——
# **触っただけで区別できるように組んである。**
# ギザがあるのは 50 円と 100 円で、500 円は斜めのギザ。
#
# **5 円の 3.75g は 1 匁（もんめ）。** ほかの 5 種が 1.0・4.0・4.5・4.8・7.1 と
# 切りのよい数なのに、**5 円だけ 3.75 という半端な数**なのは、尺貫法の重さの単位が
# そのまま残っているから。
#
# **厚さは法令で定めていない。** 決まっているのは**直径・重さ・素材・縁・穴**で、
# 厚さは「おおよその値」しかない —— 自動販売機は電気の通りやすさと重さと直径で見分けている。
#
# 素材はアルミニウム（1 円）・黄銅（5 円）・青銅（10 円）・白銅（50 円・100 円）・
# バイカラークラッド（500 円。2021 年 11 月から）。
#
# **同じ題材で、見本 216 もある。** 216 は素材・直径・量目と「手で見分ける順」、
# こちらは「価値・大きさ・重さの 3 つの順番が、どれも一致しない」ことを扱う。

