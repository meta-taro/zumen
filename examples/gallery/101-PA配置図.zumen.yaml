version: 1
kind: placement
arrows: false
north: up
scale: { mm: 100 }
title: 野外ステージの PA 配置図（40 × 60m・ディレイタワー 2 段）
# 1 px = 100 mm。**距離が時間になる図。**
#
# ## 離れたスピーカーは、遅らせて鳴らす
#
# 音は 1 秒に 340m ほどしか進まない。**30m 後ろのスピーカーをそのまま鳴らすと、
# メインより 88 ms 早く届いて**、音が後ろから来ているように聞こえる。
# だから遅らせる。
#
# 遅延（ms）＝ 距離差（m）÷ 音速（m/s）× 1000。**1 ms ≒ 34cm。**
# 音速は気温で変わる —— **c ＝ 331.5 ＋ 0.6 × 気温（℃）。**
#
# ## 計算値に 5〜15 ms 足す
#
# ぴったり合わせるのではなく**少し遅らせる**と、
# 先に届いたメインの方向から音が来ているように聞こえる（ハース効果）。
#
# 破線の扇は**スピーカーが届く範囲**（物ではないので破線）。
#
# 会場・曲目は架空。
