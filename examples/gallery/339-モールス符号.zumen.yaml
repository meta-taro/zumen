version: 1
kind: placement
arrows: true
title: モールス符号（形ではなく、長さの比）
# **決めてあるのは長さの比だけ。** 短点を 1 単位として ——
# **長点 3、符号の中の間隔 1、文字と文字の間隔 3、語と語の間隔 7。**
#
# ## だから、何で送ってもいい
#
# 点と線の「形」は決まっていない。**決まっているのは時間の比**なので、
# **音でも、光でも、打鍵でも、同じ符号が通る。**
#
# ## SOS
#
# **S は ・・・、O は －－－。**
# 間に文字間隔 3 を入れて並べると、**SOS はちょうど 27 単位**になる
# （5 ＋ 3 ＋ 11 ＋ 3 ＋ 5）。
# 図は、その 27 単位をそのままの長さで描いたもの。
#
# ## 速さの言い方
#
# **WPM（語毎分）。1 語は短点 50 個分**と決めてあり、**10WPM は 50 字／分**にあたる。
#
# ## 和文は別の体系
#
# 同じ「・」と「－」でも意味が違う（それぞれ「ヘ」と「ム」）。
# 国際基準ではなく、1854 年版のドイツ規格に基づいている。
#
# ## 出典の中で突き合わせた
#
# 参照した記事は SOS を「**－・・／－－－／・・・**」と書いていたが、
# **これは D・O・S。** 同じ記事が **S ＝ ・・・、O ＝ －－－** と書いているので、
# **出典の中で食い違っている。** この図は後者（字の定義）から組み立てた。
#
# 表には出典が字を挙げているものだけを載せた。ほかの字も同じ決まりで並ぶ。
# 点字の 6 点は見本 194、QR コードの作りは見本 304。
