version: 1
kind: placement
arrows: false
title: "Baseball infield — layout (schematic)"
scale: { in: 6 }
# **Every distance starts at the apex of home plate.**
#
# Bases are 90 ft apart, measured apex-to-far-corner; the rubber is 60 ft 6 in
# from the same apex; home to second is 127 ft 3 3/8 in because the infield is
# a square stood on its corner.
#
# **The infield is fixed, the outfield is not** —— 400 ft to centre and 325 ft
# down the lines are minimums, and every park past that is its own shape.
#
# Figures follow the published dimensions; the drawing is schematic.
