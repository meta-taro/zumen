version: 1
kind: placement
arrows: true
title: 処方箋の読み方（1 行に、全部入っている）
# **処方の 1 行に「何を・どれだけ・いつ・何日分」が全部入っている。**
# 例 —— **アローゼン（0.5）2P 2× 朝夕食後 14TD。**
# **アローゼン**が薬の名前、**（0.5）**が 1 包 0.5g、**2P** が 1 回 2 包、
# **2× 朝夕食後**が 1 日 2 回といつ飲むか、**14TD** が 14 日分。
# **T は錠剤、C はカプセル、P は包**（分包した粉薬）。
#
# **使用期間は、無記入なら発行日を含めて 4 日。**
# **発行日を 1 日目に数え、休みの日も日数に入る** ——
# 金曜に出た処方箋は、**月曜にはもう切れている。**
# 「4 日もある」と思うと、連休をまたいだだけで使えなくなる。
#
# **記載事項は、薬の名前と量だけではない。**
# 患者の氏名・年齢、薬名、分量、用法・用量、発行の年月日、**使用期間** ——
# **「いつまで使えるか」も、書かなければならないことのひとつ。**
#
# **Rp. は「処方」ではなく「受け取れ」。**
# **℞** は 16 世紀の書類にあったラテン語 **recipe**（受け取れ）の略で、
# はじめは Rc と書かれた。**薬剤師への命令の形**が、今も頭に残っている。
#
# 様式は模式（欄の寸法は確かめていない）。薬の名前は例として書いたもの。
