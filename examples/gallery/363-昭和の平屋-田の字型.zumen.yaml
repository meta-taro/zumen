# **田の字型 —— 襖を外せば広間になる家。**
#
# 昭和の木造平屋に多い型。8 帖の和室 4 つ（茶の間・寝間・次の間・座敷）を襖で仕切って田の字に並べ、
# 南に縁側を通す。**部屋ごとの廊下が無く、縁側と隣の部屋を通って行き来する。**
# 襖をすべて外せば 32 帖の広間 —— 冠婚葬祭を家でした頃は、この広さが要った。
#
# | | |
# |---|---|
# | 座敷 | 床の間（と押入）を持つ、いちばん格の高い部屋。客を通す |
# | 茶の間 | 家族が食べて集まる部屋。台所の隣 |
# | 縁側 | 廊下を兼ねる板張り。庭に開く |
# | 水まわり | 北に寄せる（日の当たる南を部屋に使う）|
#
# 畳は 1 枚 0.91m × 1.82m（半間 × 1 間）。8 帖の敷き方は、4 枚の角が 1 点に集まらないように回す。
#
# **出どころ** —— よく知られた家族ものの作品の家について語られる「昭和の田の字型の平屋」という考察を手がかりに、
# **zumen が自分で間取りを組んだ。特定の作品・実在の家の間取りを写したものではない**（名前も出さない）。架空。
