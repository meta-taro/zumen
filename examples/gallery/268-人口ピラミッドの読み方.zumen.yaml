version: 1
kind: placement
arrows: true
title: 人口ピラミッドの読み方（段は年齢、意味は生まれた年）
# **人口ピラミッドは「今の姿」ではなく、80 年ぶんの出生の記録を縦に積んだ図。**
# 段の位置は年齢だが、**意味しているのは生まれた年** ——
# だから、ふくらみもへこみも**毎年 1 段ずつ上へ動く。**
#
# 日本の形には**ふくらみが 2 つ**ある。**団塊の世代**（1947〜49 年生。
# 第 1 次ベビーブームで年間出生数が約 270 万人）と、**団塊ジュニア**（1971〜74 年生）。
# **へこみが 1 つ**あり、これは**丙午の 1966 年生** ——
# **出生数が前年より約 25% 少なく**、翌 1967 年には戻っている。
# **避けたのであって、失われたのではない。**
#
# **形は 3 つに分かれる。** 下が広い**ピラミッド型**、縦にまっすぐな**つりがね型**、
# 下がすぼまる**つぼ型**。日本はつぼ型に 2 つのふくらみが残った、ひょうたんのような形。
# **型の名前は、これから何が起きるかの言い換え** ——
# 下がすぼまった形は、40 年後の働き手の数をそのまま示している。
#
# **3 つに切って読む**（令和 6 年 10 月 1 日現在。令和 7 年版高齢社会白書）。
# 総人口 **1 億 2,380 万人**、65 歳以上（老年）**3,624 万人・29.3%**、
# 15〜64 歳（生産年齢）**59.5%**、15 歳未満（年少）**11.2%**。
# 令和 52 年（2070 年）には**2.6 人に 1 人が 65 歳以上**と推計されている。
#
# **3 区分から、割り算 1 回で比が出る。** 65 歳以上 1 人を支える生産年齢は
# 59.5 ÷ 29.3 ＝ 約 2.0 人、生産年齢 1 人が支えるのは
# （29.3 ＋ 11.2）÷ 59.5 ＝ 約 0.68 人。**形を見た時点で、この比は決まっている。**
#
# **段の長さは形をつかむための模式**で、各段の実数ではない。
