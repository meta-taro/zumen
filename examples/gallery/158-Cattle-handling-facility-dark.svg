<g data-name="n1"><text x="60" y="633" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">A behaviour diagram drawn in plan: the dimensions come from what cattle will and will not do.</text></g>
<g data-name="n2"><text x="60" y="655" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">The race curves because cattle head back to where they came from.</text></g>
<g data-name="n3"><text x="60" y="677" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">Not a trick: from the pen an animal must see two body lengths up the race.</text></g>
<g data-name="n4"><text x="60" y="699" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">Sides are solid for the same reason - what they see beside them stops them.</text></g>
<g data-name="n5"><text x="60" y="721" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">Dimensions follow published handling-facility guidance; this layout is fictional.</text></g>
<g data-name="h60"><text x="980" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">SINGLE FILE RACE</text></g>
<g data-name="h250"><text x="980" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">THE CURVE</text></g>
<g data-name="h396"><text x="980" y="411" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">WHY IT CURVES</text></g>
<g data-name="h498"><text x="980" y="513" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">SOLID SIDES, LEVEL FLOOR</text></g>
<g data-name="b82"><text x="936" y="97" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">26 to 28 in</text></g>
<g data-name="b104"><text x="936" y="119" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">20 in</text></g>
<g data-name="b126"><text x="936" y="141" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">16 to 18 in at the bottom</text></g>
<g data-name="b148"><text x="936" y="163" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">32 in at the 5 ft level</text></g>
<g data-name="b170"><text x="936" y="185" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">5 ft for English breeds</text></g>
<g data-name="b192"><text x="936" y="207" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">5 ft 6 in to 6 ft</text></g>
<g data-name="b214"><text x="936" y="229" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">30 ft</text></g>
<g data-name="b272"><text x="936" y="287" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">12 to 20 ft</text></g>
<g data-name="b294"><text x="936" y="309" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">only with a 10 ft straight first</text></g>
<g data-name="b316"><text x="936" y="331" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">the animal must see two body</text></g>
<g data-name="b338"><text x="936" y="353" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">lengths up the race</text></g>
<g data-name="b360"><text x="936" y="375" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">the entrance reads as a dead end</text></g>
<g data-name="b418"><text x="936" y="433" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">go back to where they came from</text></g>
<g data-name="b440"><text x="936" y="455" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">uses that instead of fighting it</text></g>
<g data-name="b462"><text x="936" y="477" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">they still have to see ahead</text></g>
<g data-name="b520"><text x="936" y="535" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">race, crowd pen, loading ramp</text></g>
<g data-name="b542"><text x="936" y="557" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">what they see beside them stops them</text></g>
<g data-name="b564"><text x="936" y="579" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">always level</text></g>
<g data-name="b586"><text x="936" y="601" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">inside the race, never in the pen</text></g>
<g data-name="b608"><text x="936" y="623" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">10 to 11 ft 6 in</text></g>
<g data-name="l4"><text x="530" y="309" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">SINGLE FILE RACE  (solid sides)</text></g>
<g data-name="a82"><text x="845" y="97" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Width, adult cows</text></g>
<g data-name="a104"><text x="845" y="119" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Width, calves</text></g>
<g data-name="a126"><text x="845" y="141" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">V race</text></g>
<g data-name="a170"><text x="845" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Side height</text></g>
<g data-name="a192"><text x="845" y="207" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Excitable lines</text></g>
<g data-name="a214"><text x="845" y="229" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Minimum length</text></g>
<g data-name="a272"><text x="845" y="287" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Inside radius</text></g>
<g data-name="a294"><text x="845" y="309" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">As tight as 5 ft</text></g>
<g data-name="a316"><text x="845" y="331" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">From the crowd pen</text></g>
<g data-name="a360"><text x="845" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Or else</text></g>
<g data-name="a418"><text x="845" y="433" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Cattle</text></g>
<g data-name="a440"><text x="845" y="455" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">The curve</text></g>
<g data-name="a462"><text x="845" y="477" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Not a trick</text></g>
<g data-name="a520"><text x="845" y="535" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Solid</text></g>
<g data-name="a542"><text x="845" y="557" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Why</text></g>
<g data-name="a564"><text x="845" y="579" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Crowd pen</text></g>
<g data-name="a586"><text x="845" y="601" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Any ramp</text></g>
<g data-name="a608"><text x="845" y="623" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Crowd gate</text></g>
<g data-name="l6"><text x="410" y="383" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">10'-0&quot; straight first</text></g>
<g data-name="l7"><text x="124" y="389" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">cattle come in here</text></g>
<g data-name="l1"><text x="124" y="279" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">HOLDING PEN</text></g>
<g data-name="l2"><text x="328" y="423" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">CROWD PEN</text></g>
<g data-name="l3"><text x="376" y="307" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">crowd gate</text></g>
<g data-name="l8"><text x="380" y="517" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">out and away</text></g>
<g data-name="l5"><text x="380" y="492" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">SQUEEZE</text></g>
</svg>