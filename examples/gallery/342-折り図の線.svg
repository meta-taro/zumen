<g data-name="h140_700"><text x="450" y="716" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">折り図の線</text></g>
<g data-name="h880_700"><text x="1150" y="716" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">基本形（途中で止めた形に名前がある）</text></g>
<g data-name="t1"><text x="140" y="183" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">① 同じ場所の線でも、線種で結果が逆になる</text></g>
<g data-name="t1b"><text x="140" y="205" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">　矢印は折る向き。 どちらも「右半分を左へ」だが、折れる方向が違う。</text></g>
<g data-name="y140_724"><text x="366" y="740" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">破線。手前から向こうへ折る</text></g>
<g data-name="y140_748"><text x="366" y="764" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">一点鎖線。向こうから手前へ折る</text></g>
<g data-name="y140_772"><text x="366" y="788" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">✂ の印</text></g>
<g data-name="y140_796"><text x="366" y="812" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">吉澤章（1940〜50 年代）とランドレットら</text></g>
<g data-name="t2"><text x="940" y="183" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">② 線種が記法そのもの</text></g>
<g data-name="g1"><text x="940" y="215" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・谷折り線 …… 破線（― ― ― ― ―）</text></g>
<g data-name="g2"><text x="940" y="239" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・山折り線 …… 一点鎖線（― ・ ― ・ ―）</text></g>
<g data-name="g3"><text x="940" y="263" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・切る線 …… ✂ の印</text></g>
<g data-name="g5"><text x="940" y="311" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・この記号体系は 1940〜50 年代に吉澤章が発展させ、</text></g>
<g data-name="g6"><text x="940" y="335" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">　その後サミュエル・ランドレットらが補完した。</text></g>
<g data-name="g7"><text x="940" y="359" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・だから言葉が要らない —— 線の形だけで、</text></g>
<g data-name="g8"><text x="940" y="383" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">　どちらへ折るかが世界中に通じる。</text></g>
<g data-name="y880_724"><text x="1106" y="740" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">折り鶴を作る途中。4 つのとがった「カド」を持つ</text></g>
<g data-name="y880_748"><text x="1106" y="764" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">あやめを作る途中</text></g>
<g data-name="y880_772"><text x="1106" y="788" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">さかなを作る途中</text></g>
<g data-name="y880_796"><text x="1106" y="812" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">同上</text></g>
<g data-name="x140_724"><text x="250" y="740" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">谷折り線</text></g>
<g data-name="x140_748"><text x="250" y="764" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">山折り線</text></g>
<g data-name="x140_772"><text x="250" y="788" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">切る線</text></g>
<g data-name="x140_796"><text x="250" y="812" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">記号体系</text></g>
<g data-name="x880_724"><text x="990" y="740" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">鶴の基本形</text></g>
<g data-name="x880_748"><text x="990" y="764" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">あやめの基本形</text></g>
<g data-name="x880_772"><text x="990" y="788" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">さかなの基本形</text></g>
<g data-name="x880_796"><text x="990" y="812" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">とびらの基本形</text></g>
<g data-name="vn"><text x="360" y="505" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">破線 ＝ 谷折り線</text></g>
<g data-name="vh"><text x="360" y="527" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">手前から向こうへ折る</text></g>
<g data-name="mn"><text x="720" y="505" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">一点鎖線 ＝ 山折り線</text></g>
<g data-name="mh"><text x="720" y="527" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">向こうから手前へ折る</text></g>
<g data-name="ve"><text x="360" y="629" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">谷（へこむ）</text></g>
<g data-name="me"><text x="720" y="629" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">山（出っぱる）</text></g>
<g data-name="side"><text x="140" y="583" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">↓ 折ったあと、端から見ると</text></g>
</svg>