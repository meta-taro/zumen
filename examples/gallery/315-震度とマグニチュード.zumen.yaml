version: 1
kind: placement
arrows: true
title: 震度とマグニチュード（数字の差が小さく見える尺度）
# **震度は 10 階級。** 0・1・2・3・4・**5 弱・5 強・6 弱・6 強**・7 ——
# **1996 年 4 月 1 日**に 5 と 6 がそれぞれ弱・強に分かれ、8 階級から 10 階級になった。
#
# **階級は、計測震度という数から決まる。**
# 加速度の絶対値がある値以上になる時間の合計が**ちょうど 0.3 秒**になる値を求めたもので、
# 境目はこう決まっている。
#
# | 階級 | 計測震度 |
# |---|---|
# | 震度 4 | 3.5 以上 4.5 未満 |
# | 震度 5 弱 | 4.5 以上 5.0 未満 |
# | 震度 5 強 | 5.0 以上 5.5 未満 |
# | 震度 6 弱 | 5.5 以上 6.0 未満 |
# | 震度 6 強 | 6.0 以上 6.5 未満 |
# | 震度 7 | 6.5 以上 |
#
# **5 と 6 だけ 0.5 刻み。** 下の階級は 1.0 刻みなのに、
# **被害が急に増える所だけ細かく分けてある。**
#
# **震度とマグニチュードは、別のものを測っている。**
# **マグニチュードは地震そのものの規模**で、1 つの地震に 1 つ。
# **震度はその場所の揺れの大きさ**で、**観測点の数だけある** ——
# 「震度 6 強の地震」という言い方は、本当は略語。
#
# **M が 1 増えると、エネルギーは約 32 倍**（**10 の 1.5 乗 ＝ 31.62**）。
# 2 増えれば **約 1,000 倍**、M6 と M9 では **約 32,000 倍。**
# **数字の差が小さく見えるのが、この尺度の怖い所。**
#
# エネルギーの比は計算で確かめた。
