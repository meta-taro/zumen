title: "内容証明の謄本（縦書き 1 行 20 字以内・1 枚 26 行以内。訂正と付記の書き方つき）"
# **内容証明は、謄本の字数と行数に上限がある。** 用紙の大きさ・書く道具は問わない（市販の用紙でなくてよい、コピーでもよい）。
# 上限は謄本だけで、受取人へ送る内容文書には無い。
#
# 座標は mm で考えて px に直した（1px = 25.4/96 mm。paper の margin: 0 で、紙の左上が原点）。
# 出典：
#   日本郵便「内容証明」https://www.post.japanpost.jp/service/send/domestic/option/syomei/（取得 2026-11-10）
#     差し出すもの：内容文書・謄本 2 通（差出人と郵便局が 1 通ずつ保存）・差出人と受取人の住所氏名を書いた封筒。一般書留にする
#   日本郵便「内容証明 ご利用の条件等」https://www.post.japanpost.jp/service/send/domestic/option/syomei/use.html（取得 2026-11-10）
#     縦書き：1 行 20 字以内・1 枚 26 行以内。横書き：20×26・13×40・26×20 のいずれか
#     訂正・挿入・削除：字数と箇所を欄外か末尾の余白に書き、差出人の印を押す。字体は読めるように残す
#     2 枚以上はつづり目に契印。住所氏名は末尾の余白に付記（内容文書と同じなら原則省略可。字数・枚数に数えない）
# 決まりではないもの：用紙を A4 横にしたこと、ますの大きさ 7.5mm、5 行ごとの目盛、欄外の「削除壱字 加入壱字」の文言（ページは字数と箇所を書くとだけ言う）。
# 架空：文面・日付・金額・住所・氏名はすべて架空。
