# **Three different lengths, three different questions.**
#
# | | |
# |---|---|
# | Common path | how far before you can choose between two exits |
# | Dead end | how far into a corridor that goes nowhere |
# | Exit access travel | how far to an exit once you can choose |
#
# Sprinklers lengthen all three —— which is why the egress plan and the
# sprinkler plan get read together（見本 145）.
#
# **Occupant load decides how many exits; travel distance decides where.**
# 48 people would allow a single exit; the conference room pushes the floor
# past 49, so two are required.
#
# **日本語の見本 22（避難経路図）と対。**
#
# Occupancy, areas and distances are fictional.
