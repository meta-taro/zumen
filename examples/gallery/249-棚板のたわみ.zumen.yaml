version: 1
kind: placement
arrows: true
title: 棚板はなぜたわむか（スパン・厚み・幕板）
# **たわみはスパンの 3 乗で効く。** 同じ本を載せるなら、
# スパンを 2 倍にすると 8 倍。**本で埋めるなら 4 乗で 16 倍。**
#
# δ ＝ 5 W L³ ／ (384 E I)、I ＝ b t³ ／ 12。
# **厚みも 3 乗。** 18mm を 24mm にすると、たわみは (18/24)³ ＝ 0.42 倍。
#
# **材料を替えるより、形を変えるほうが効く。**
# 奥行 250・厚 18・スパン 900 に本 20kg で、8 タイプなら 7.7mm、
# 18 タイプでも 5.1mm。ところが**前に 40mm の幕板を付けると 0.8mm**。
# 断面二次モーメントが 121,500 → 739,500 mm⁴（6.1 倍）になるため。
#
# 効くのは**中立軸からどれだけ離れた所に材料があるか**。
# 本棚の幕板は、見栄えではなくたわみ止め。
#
# E は JIS A 5908 の曲げヤング係数（8 タイプ 2,000 ／ 13 タイプ 2,500 ／
# 18 タイプ 3,000 N/mm² 以上）。
