title: ビンゴカード（No.0142・5×5・中央フリー）
# 列ごとに数の範囲が決まっている —— B は 1〜15、I は 16〜30、
# N は 31〜45、G は 46〜60、O は 61〜75。中央はフリー。
# 主催側の進行表は見本 65。
#
# **列ごとに範囲が分かれているのは、ビンゴが成立するため。**
# 75 個から無作為に 25 個選ぶと、1 枚のカードに偏りが出て、
# **どの列も揃わないカード**が生まれる。列ごとに 15 個から 5 個ずつ取れば、
# どの列も同じ確率で埋まる。
#
# **中央がフリーなのは、縦横斜めの 12 本すべてが通る唯一のマスだから** ——
# ここを埋めておくと、最初の 1 個が出る前からリーチが近い。
