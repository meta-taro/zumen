version: 1
kind: placement
arrows: true
title: はめあい（JIS B 0401 ＝ ISO 286・φ30 の例）
# **同じ φ30 でも、記号で役目が変わる。** H7/g6 は回り、H7/p6 は二度と外れない。
#
# **大文字が穴、小文字が軸。** 文字が「基準の線からどちら側へどれだけ離すか」、
# 数字（IT 等級）が「公差の幅」を決める。**H は下の許容差が 0。**
#
# 数は引き算で出る —— 最大すきま ＝ 穴の上 − 軸の下、
# 最大しまり ＝ 軸の上 − 穴の下。
# φ30 の H7/p6 なら **しまり 1〜35μm** で、いちばん都合が良くても必ず食い込む。
#
# **穴を基準にするのは、穴のほうが作りにくいから。**
# 穴は工具（ドリル・リーマ）の寸法に引きずられるが、軸は旋盤で削り分けられる。
#
# 数値は「18 を超え 30 以下」の欄（単位 μm）。
#

#
# **JIS B 0401 と ISO 286 の版は確かめていない。**

