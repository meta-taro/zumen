version: 1
kind: placement
arrows: true
title: 学校の机と椅子（JIS S 1021:2011）
scale: { mm: 5 }
# **大きさは学年ではなく、身長で決まる。**
#
# そして**机と椅子は同じ号数で組む** —— 片方だけ替えると「差尺」（机面 − 座面）が狂う。
# 差尺は 1 号 230mm、6 号 320mm。**号数が上がるほど広がるが、同じ比率ではない。**
#
# 2011 年の改正で 5.5 号（身長 150〜160cm）が足された。
#
# **JIS S 1011 の版は確かめていない**（もう一方の JIS S 1021:2011 は版まで確かめた）。

