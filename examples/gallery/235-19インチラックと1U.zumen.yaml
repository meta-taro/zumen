version: 1
kind: placement
arrows: true
title: 19 インチラックと 1U —— 穴は等間隔ではない
scale: { mm: 1 }
# **決めているのは、幅と穴の位置だけ。**
# 奥行き・重さ・扉・電源・冷却は規格ではない ——
# **だから「入る」ことと「収まる」ことは別。**
#
# **取付穴は等間隔ではない。** 15.875 / 15.875 / 12.7 の繰り返しで、
# **12.7 の真ん中が 1U の境目**。等間隔にしなかったのは、境目が分かるようにするため。
#
# 1U ＝ 44.45mm ＝ 1.75 インチ。42U で 1866.9mm ——
# インチで決まった数が、ミリの図面にそのまま出てくる。
