title: 衆議院の議席が決まるまで（1 人が 2 票を持つ）
sources:
  - name: "e-Gov 法令検索「公職選挙法」第 4 条第 1 項・第 95 条の 2"
    retrieved: 2026-10-02
# **有権者は 1 人で 2 票を持つ。** 1 票目は小選挙区の候補者へ、2 票目は比例代表の政党へ。
# **別々の数え方をして、別々の議席を配る。**
#
# ## 465 は、2 つに分かれている
#
# **小選挙区 289 議席、比例代表 176 議席、合わせて総定数 465。**
# 小選挙区は各区で 1 位だけが当選するので、**2 位以下の票は議席にならない。**
# 比例代表は政党の得票で配るので、**少数の票も積み上がる。**
#
# ## 2 つは、切り離されていない
#
# **重複立候補**という仕組みがあり、政党は**小選挙区の候補者を比例名簿にも載せられる。**
# 小選挙区で落選しても、**比例で復活当選**できる。
# ただし**小選挙区の得票が有効投票総数の 10 分の 1（供託物没収点）に届かなかった人は、
# 比例名簿に載っていないものとみなされる**（公職選挙法 95 条の 2 第 6 項）—— 復活の扉は閉じる。
#
# ## 惜敗率
#
# 比例名簿で**同じ順位に並べた**とき、実際の順位は**惜敗率**で決まる。
# **小選挙区で惜しく負けた候補ほど、比例で復活しやすい。**
#
# つまり、**同じ「落選」でも、僅差で負けたかどうかが次の扉を開ける。**
# 1 票目の結果が、2 票目で配る議席の中身を動かしている。
#
# 惜敗率＝その候補の得票 ÷ その選挙区の当選者の得票（同 95 条の 2 第 3 項）。
# 比例の議席は、各党の得票を 1, 2, 3 … で順に割った商の大きい順に配る（同 1 項。ドント式）。
# 出典：公職選挙法 4 条 1 項（定数 465・小選挙区 289・比例 176）、95 条の 2
# （e-Gov 法令検索、2026-10-02 照合）。
#
# 投票所の配置は見本 133、当選したあとの本会議場の議席は見本 184。
