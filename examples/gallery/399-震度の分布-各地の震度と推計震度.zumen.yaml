    label: 震度は 10 階級（0・1・2・3・4・5 弱・5 強・6 弱・6 強・7）。①は震度計のある所の値で、地図の数字がそれ。
    marker: none
    align: left
    at: { x: 0, y: 584 }
    size: { w: 984, h: 18 }
  - id: n1
    label: ②の推計震度分布図は、観測した震度と地盤の揺れやすさから、震度計の無い所の震度を推計して面で示す。
    marker: none
    align: left
    at: { x: 0, y: 606 }
    size: { w: 984, h: 18 }
  - id: n2
    label: 最大震度 5 弱以上を観測したときに出し、推計震度 4 以上の範囲を塗る。格子は 250m 四方（この図は 3km に粗くした）。
    marker: none
    align: left
    at: { x: 0, y: 628 }
    size: { w: 984, h: 18 }
  - id: n3
    label: 推計の値は 1 階級ほど違うことがあり、格子の境は震度の境ではない —— 見るのは、強い揺れの広がりと形。
    marker: none
    align: left
    at: { x: 0, y: 650 }
    size: { w: 984, h: 18 }
  - id: n4
    label: この図では、観測した最大は 5 弱なのに、震度計の無い断層の真上が推計で 6 弱〜6 強になった —— ②が要るのはそのため。
    marker: none
    align: left
    at: { x: 0, y: 672 }
    size: { w: 984, h: 18 }
  - id: n5
    label: 地震・震度は架空で、実在の地震とは関係ありません。色は気象庁の配色指針 表 2-2。陸と県の境は Natural Earth。
    marker: none
    align: left
    at: { x: 0, y: 694 }
    size: { w: 984, h: 18 }
