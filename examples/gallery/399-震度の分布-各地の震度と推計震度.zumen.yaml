# **震度は 2 つの形で出る。** 震度計のある所の値（各地の震度）と、それを面に広げた推計震度分布図。
#
# 決まり（気象庁「推計震度分布図について」・同 報道発表 2022 年 12 月 16 日）——
#
# - 推計震度分布図は、観測した震度と地盤の増幅度から、**震度計の無い所の震度を推計**して面で示す
# - **最大震度 5 弱以上を観測したときに発表**し、**推計震度 4 以上の範囲**を示す
# - 格子は 250m 四方（2023 年 2 月 1 日から。それまでは 1km）
# - 「個々のメッシュの震度は、矩形内が同一震度であることを示すものではなく、メッシュの境界線が震度の境界でもない」。
#   「推計された震度の値は、場合によっては 1 階級程度異なる」。**見るのは大きな震度の面的な拡がりと形**
# - 震度は 10 階級（0・1・2・3・4・5 弱・5 強・6 弱・6 強・7。計測震度との対応は見本 315）
# - 色（配色指針 表 2-2）：7＝180,0,104／6 強＝165,0,33／6 弱＝255,40,0／5 強＝255,153,0／5 弱＝255,230,0／
#   4＝250,230,150／3＝0,65,255／2＝0,170,255／1＝242,242,255
#
# ## 筋書き（架空）
#
# 広島県北部の内陸、北東—南西の断層（約 30km）。震度は「断層からの距離」で弱まる式に、地盤のゆらぎ（架空）を足して決めた。
# **観測した最大は 5 弱**（三次市など）だが、**震度計の無い断層の真上は推計で 6 弱〜6 強**になる —— 推計震度分布図が要る理由を、図の中で起こした。
# 市町の名前は実在、震度は架空。**実在の地震とは関係ない。**
#
# ## 描き方
#
# 格子は 3km に粗くした（250m では 1 枚に数十万マス）。同じ震度の格子をつないで輪にし、弱い震度から順に塗った
# （全マスで色違い 0 を確かめてある。見本 394・396 と同じ作り方）。穴は、中が陸なら陸の色、海なら紙の色で抜いた。
# 震央は × の線で描いた（丸い札にすると、真下の 6 強の塗りを隠す）。
#
# ## 描かなかったもの
#
# - 震度速報（地域ごとの震度。地域の区割りの線を持っていない）
# - 長周期地震動階級、津波の有無（見本 397）
# - テレビ局の様式（地図の飾り・字幕の帯）は写していない
palette:
  陸: "#e3e3e3"
  震度7: "#b40068"
  震度6強: "#a50021"
  震度6弱: "#ff2800"
  震度5強: "#ff9900"
  震度5弱: "#ffe600"
  震度4: "#fae696"
  震度3: "#0041ff"
  震度2: "#00aaff"
  震度1: "#f2f2ff"
