  - id: n11
    label: "ゴミの収集が止まっていれば、これは家に置くことになります。"
    marker: none
    align: left
    at: { x: 260, y: 822 }
    size: { w: 560, h: 18 }
  - id: r1
    label: "災害時のトイレは、水の量ではなく「回数」で考えます。 1 人 1 日 5 回 —— これが内閣府のガイドラインが備蓄計画に使う数です。"
    marker: none
    align: left
    at: { x: 150, y: 890 }
    size: { w: 1090, h: 18 }
  - id: r2
    label: "4 人家族の 1 週間で 140 回分（③）。買い置きの箱 1 つでは足りません。並べてみると、量が分かります。"
    marker: none
    align: left
    at: { x: 150, y: 914 }
    size: { w: 1090, h: 18 }
  - id: r3
    label: "断水すると水洗は流せません。 便器に袋をかぶせて使い、1 回ごとに 1 袋出ます —— 出た袋は、捨てられるまで家に置きます。"
    marker: none
    align: left
    at: { x: 150, y: 938 }
    size: { w: 1090, h: 18 }
  - id: r4
    label: "避難所の基数は、避難者の数で決まります（②）。発災当初は 50 人に 1 基、長期化したら 20 人に 1 基。"
    marker: none
    align: left
    at: { x: 150, y: 962 }
    size: { w: 1090, h: 18 }
  - id: r5
    label: "女性用と男性用の比は 3 対 1。 女性のほうが時間がかかり、列ができるからです。"
    marker: none
    align: left
    at: { x: 150, y: 986 }
    size: { w: 1090, h: 18 }
  - id: r6
    label: "数が足りないと、人は水を飲むのをやめます。 そこから脱水とエコノミークラス症候群が起きます —— トイレの数は、健康の数です。"
    marker: none
    align: left
    at: { x: 150, y: 1010 }
    size: { w: 1090, h: 18 }
  - id: r7
    label: "食べ物と水の備蓄は言われますが、出るほうは数えられていないことが多い。数えれば、足りるかどうかがその場で分かります。"
    marker: none
    align: left
    at: { x: 150, y: 1034 }
