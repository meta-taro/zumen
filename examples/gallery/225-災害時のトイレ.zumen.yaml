version: 1
kind: placement
arrows: true
title: 災害時のトイレ —— 必要な数は「回数」で決まる
palette:
  G: "#e0e0e0"
# **1 人 1 日 5 回。** 水の量ではなく、回数で数える
# （内閣府「避難所におけるトイレの確保・管理ガイドライン」）。
#
# **4 人家族の 1 週間で 140 回分。** 1 回ごとに 1 袋出て、
# ゴミの収集が止まっていれば、それは家に置くことになる。
#
# 避難所は発災当初 50 人に 1 基、長期化したら 20 人に 1 基。
# **女性用と男性用の比は 3 対 1。**
#
# **数が足りないと、人は水を飲むのをやめる。** トイレの数は、健康の数。
