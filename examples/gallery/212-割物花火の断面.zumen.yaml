# **星は、玉の中の位置関係を保ったまま広がる。** だから球に開く。
#
# 星を球の面に沿って隙間なく並べ、中心の割薬で一度に押し出す。
# **並べ方が、そのまま開いた形になる。**
#
# 星は芯に薬を掛け重ねた層で、**燃えるのは掛けた順の逆**（菊 → 紅 → 銀）。
# 作った順と、見える順が逆になる図。
