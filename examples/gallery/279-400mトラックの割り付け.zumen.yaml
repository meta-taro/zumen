version: 1
kind: placement
arrows: true
scale: { mm: 196 }
title: 400m トラックの割り付け（1 レーンだけが 400m）
# **「1 周 400m」は、1 レーンの計測線の話。**
# 内側ラインから **30cm** 内側を回ったときに 400.00m になるよう作ってある ——
# 選手はラインを踏まずに、いちばん内側を走る。
#
# **数の組み立て。** 直走路 **84.39m × 2 ＝ 168.78m**、
# 曲走路は半径 36.50m ＋ 計測線 0.30m ＝ **36.80m** の円で **2π × 36.80 ＝ 231.22m** ——
# 合わせて **400.00m**。**半径 36.50m そのものを回ると、400m には足りない。**
#
# **レーン幅は 1.220m ± 0.01**（2010 年 4 月 1 日以降に造るトラック）。
# 計測線は 1 レーンが内側ラインから 30cm、**2 レーン以降は 20cm。**
#
# **外側のレーンは、同じ 1 周でも長い。**
# 1 レーン 400.00m ／ 2 レーン 407.04m ／ 3 レーン 414.70m ／ 8 レーン 453.03m ——
# **3 レーンから先は 1 レーンにつき 7.67m ずつ増える**（2π × 1.22 ＝ レーン幅の円周ぶん）。
# 2 レーンだけ 7.04m と違うのは、計測線が 30cm ではなく 20cm だから。
#
# **ずらすのは、曲走路のぶんだけ。** 直走路はどのレーンも 84.39m で同じなので、
# 差が出るのは曲走路だけ —— **100m のスタートが一直線なのは、曲走路を通らないから。**
# ずらす量は「走る距離を同じにする」ためであって、有利不利の調整ではない。
