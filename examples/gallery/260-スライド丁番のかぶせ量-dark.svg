<g data-name="why2"><text x="495" y="674" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">丁番を決めてからでないと、扉の幅が出ない。</text><text x="495" y="688" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">インセットは四周にも隙間が要る（ふつう 2〜3mm ずつ）ので、</text><text x="495" y="702" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">扉が小さくなるぶん、中身の有効寸法も変わる。</text></g>
<g data-name="why1"><text x="470" y="444" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">側板 1 枚を、左右の扉で分け合う。 18 ＋ 0（全かぶせ ＋ インセット）か、</text><text x="470" y="458" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">9 ＋ 9（半かぶせ 2 枚）か。中央の仕切りに 2 枚つくなら、半かぶせが定番。</text></g>
<g data-name="why3"><text x="1045" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">35mm の穴を、厚み 18mm の扉に 12mm 掘る。</text><text x="1045" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">残るのは 6mm —— 座ぐりが深すぎると、表へ抜ける。</text><text x="1045" y="378" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">専用のビットがあるのは、深さを止めるため。</text></g>
<g data-name="why4"><text x="1045" y="586" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">作ったあとに合わせられることが、この金物の値打ち。</text><text x="1045" y="600" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">木は動くので、切ったときの寸法のままでは</text><text x="1045" y="614" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">いずれ隙間が揃わなくなる。</text></g>
<g data-name="r1"><text x="150" y="753" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">扉の幅は、丁番を決めてからでないと出せません（①②）。かぶせ量がそのまま寸法に入るからです。</text></g>
<g data-name="r2"><text x="150" y="777" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">側板 1 枚を、左右の扉で分け合います。 18 ＋ 0（全かぶせ ＋ インセット）か、9 ＋ 9（半かぶせ 2 枚）か。</text></g>
<g data-name="r3"><text x="150" y="801" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">中央の仕切りに 2 枚つくなら、半かぶせが定番です。 片方を全かぶせにすると、もう片方が側板に載れません。</text></g>
<g data-name="r4"><text x="150" y="825" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">全かぶせとインセットでは、扉 1 枚で 18mm 違います（②）。見た目も納まりも別物になります。</text></g>
<g data-name="r5"><text x="150" y="849" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">カップは 35mm、掘り込みは 12mm 前後（③）。厚み 18mm の扉なら、残るのは 6mm です。</text></g>
<g data-name="r6"><text x="150" y="873" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">座ぐりが深すぎると、表へ抜けます。 専用のビットがあるのは、深さを止めるためです。</text></g>
<g data-name="r7"><text x="150" y="897" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">付けてから 3 方向に動かせます（④）。木は動くので、作ったあとに合わせられることが、この金物の値打ちです。</text></g>
<g data-name="h534"><text x="495" y="550" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">本体の外幅 800mm・側板 18mm・扉どうしの隙間 3mm</text></g>
<g data-name="t1"><text x="150" y="164" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">① 水平断面（上から見る）—— 扉が側板にどれだけかぶるか</text></g>
<g data-name="t2"><text x="150" y="514" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">② 扉の幅は、かぶせ量から逆に出す</text></g>
<g data-name="h186"><text x="1045" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">扉側の加工</text></g>
<g data-name="h446"><text x="1045" y="462" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">ねじの役目</text></g>
<g data-name="y558"><text x="466" y="574" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">(800 − 3) ÷ 2 ＝ 398.5mm</text></g>
<g data-name="y582"><text x="466" y="598" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">内法 764 → (764 − 3) ÷ 2 ＝ 380.5mm</text></g>
<g data-name="y606"><text x="466" y="622" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">1 枚あたり 18mm。見た目も納まりも別物</text></g>
<g data-name="t3"><text x="850" y="164" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">③ カップは 35mm</text></g>
<g data-name="t4"><text x="850" y="430" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">④ 付けてから、3 方向に動かせる</text></g>
<g data-name="x558"><text x="330" y="574" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">全かぶせ 2 枚</text></g>
<g data-name="x582"><text x="330" y="598" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">インセット 2 枚</text></g>
<g data-name="x606"><text x="330" y="622" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">差</text></g>
<g data-name="y470"><text x="986" y="486" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">かぶせ量を増減（隙間をそろえる）</text></g>
<g data-name="y494"><text x="986" y="510" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">扉と本体の面を合わせる</text></g>
<g data-name="y518"><text x="986" y="534" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">座金の位置で高さを合わせる</text></g>
<g data-name="y210"><text x="1046" y="226" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">35mm（いちばん多い）</text></g>
<g data-name="y234"><text x="1046" y="250" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">11〜13mm</text></g>
<g data-name="y258"><text x="1046" y="274" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">18〜25mm</text></g>
<g data-name="y282"><text x="1046" y="298" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">3〜6mm（丁番で決まる）</text></g>
<g data-name="x210"><text x="945" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">カップ径</text></g>
<g data-name="x234"><text x="945" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">掘り込み深さ</text></g>
<g data-name="x258"><text x="945" y="274" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">扉の厚み</text></g>
<g data-name="x282"><text x="945" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">端からの距離</text></g>
<g data-name="ac"><text x="295" y="379" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">側板をまるごと覆う（18mm 前後）</text></g>
<g data-name="bc"><text x="515" y="379" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">その半分（9mm 前後）</text></g>
<g data-name="cc"><text x="735" y="379" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">側板の内側へ納まる（0mm）</text></g>
<g data-name="an"><text x="295" y="225" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">全かぶせ</text></g>
