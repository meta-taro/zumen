<g data-name="t1"><text x="140" y="173" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">① 上から下へ、順番が決まっている（1 チャンネルぶん）</text></g>
<g data-name="t1b"><text x="140" y="195" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">　左下へ出ている枝が PFL。フェーダーの手前から取っているので、卓の音量に左右されない。</text></g>
<g data-name="h960_470"><text x="1210" y="486" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">枝の取り方</text></g>
<g data-name="pfln"><text x="60" y="871" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">Pre Fader Listening —— フェーダーで音量を調整される「前段」の信号をソロで聞く</text></g>
<g data-name="in"><text x="415" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">入力（マイク／ライン）</text></g>
<g data-name="ha"><text x="415" y="321" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">HA（ヘッドアンプ）</text></g>
<g data-name="fil"><text x="415" y="377" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">フィルタ（HPF / LPF）</text></g>
<g data-name="eq"><text x="415" y="433" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">EQ</text></g>
<g data-name="dyn"><text x="415" y="489" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">ダイナミクス</text></g>
<g data-name="ins"><text x="415" y="545" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">インサート</text></g>
<g data-name="aux"><text x="415" y="601" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">AUX SEND</text></g>
<g data-name="pan"><text x="415" y="657" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">PAN POT</text></g>
<g data-name="fad"><text x="415" y="713" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">フェーダー</text></g>
<g data-name="bus"><text x="415" y="769" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">BUS / GROUP</text></g>
<g data-name="mst"><text x="415" y="825" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">マスター</text></g>
<g data-name="m1"><text x="960" y="207" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・フェーダーの前から取る（プリフェーダー）</text></g>
<g data-name="m2"><text x="960" y="231" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">　→ 卓の音量を動かしても、送る量は変わらない。</text></g>
<g data-name="m3"><text x="960" y="255" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">　　演者に返す「モニター」はこちら。</text></g>
<g data-name="m5"><text x="960" y="303" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・フェーダーの後から取る（ポストフェーダー）</text></g>
<g data-name="m6"><text x="960" y="327" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">　→ 卓の音量に連動して送る量も動く。</text></g>
<g data-name="m7"><text x="960" y="351" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">　　残響などの「エフェクト」はこちら。</text></g>
<g data-name="m9"><text x="960" y="399" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・インサートは直列。 通った音がそのまま先へ行く。</text></g>
<g data-name="m10"><text x="960" y="423" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">　AUX は並列で、枝分かれして戻ってくる。</text></g>
<g data-name="t2"><text x="960" y="173" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">② 同じ AUX でも、取り出す場所で別のものになる</text></g>
<g data-name="y960_494"><text x="1206" y="510" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">直列。切って間に挟む</text></g>
<g data-name="y960_518"><text x="1206" y="534" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">並列。分けて送り、戻す</text></g>
<g data-name="y960_542"><text x="1206" y="558" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">フェーダーの前を、ソロで聞く</text></g>
<g data-name="y960_566"><text x="1206" y="582" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">まとめてから、まとめて動かす</text></g>
<g data-name="pfl"><text x="200" y="834" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">PFL</text></g>
<g data-name="x960_494"><text x="1080" y="510" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">インサート</text></g>
<g data-name="x960_518"><text x="1080" y="534" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">AUX SEND</text></g>
<g data-name="x960_542"><text x="1080" y="558" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">PFL</text></g>
<g data-name="x960_566"><text x="1080" y="582" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">BUS / GROUP</text></g>
<g data-name="inn"><text x="546" y="265" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">コンデンサマイクにはファンタム電源</text></g>
<g data-name="han"><text x="546" y="321" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">ここで利得を合わせる。以降の段の余裕が決まる</text></g>
<g data-name="filn"><text x="546" y="377" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">要らない帯域を先に落とす</text></g>
<g data-name="eqn"><text x="546" y="433" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">音色を補正する／積極的に変える</text></g>
<g data-name="dynn"><text x="546" y="489" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">コンプレッサー・リミッター・ノイズゲート</text></g>
<g data-name="insn"><text x="546" y="545" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">外部機器を直列に挿す。PRE か POST を選べる</text></g>
<g data-name="auxn"><text x="546" y="601" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">出口が複数。エフェクトや返しへ送る</text></g>
<g data-name="pann"><text x="546" y="657" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">ステレオの定位を決める</text></g>
<g data-name="fadn"><text x="546" y="713" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">音量を調整する</text></g>
<g data-name="busn"><text x="546" y="769" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">複数チャンネルをまとめる（サブグループ）</text></g>
<g data-name="mstn"><text x="546" y="825" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">最終出力</text></g>

</svg>