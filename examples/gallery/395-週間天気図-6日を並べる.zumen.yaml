# **週間天気図は、日ごとの予想天気図を並べた図。** 高気圧と低気圧が西から東へ入れ替わって通るのが、6 枚で読める。
#
# 気象庁が発表する予想天気図は 24・48 時間後まで（「天気図の種類」）。6 日分を並べる週間天気図は**民間の様式**で、
# 記号だけは気象庁の地上天気図の決まりに合わせた ——
# 等圧線 4hPa ごと・20hPa ごと（1000・1020）は太線／寒冷前線は青の三角、温暖前線は赤の半円で、**記号は進む側**／高は青、低は赤。
#
# 等圧線は日ごとの気圧の場（高・低の山と谷の和＋前線に沿った谷）から等値線を取った（見本 391 と同じ作り方）。
# 小さい図なので、中心の × と気圧の数字は省き、札を中心に置いた。**札に隠れる小さな輪は描かず、前線は札の縁から描く**
# （札の下を線が通ると、文字の下敷きが札の中に白く出る）。
#
# 筋書き（架空）：北日本を抜ける低気圧（16 日）→ 移動性高気圧が日本を覆う（17〜18 日）→
# 次の低気圧が日本海から北日本へ（19〜20 日）→ 西高東低に近い形（21 日）。
# 陸は Natural Earth 1:50m（パブリックドメイン）。国境は描いていない。テレビ局の様式は写していない。
