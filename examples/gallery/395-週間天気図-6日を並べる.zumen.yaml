  - id: n0
    label: 週間天気図は、1 週間先までの予想天気図を日ごとに並べた図です。高気圧と低気圧が西から東へ、日ごとに入れ替わって通っていくのが 6 枚で読めます。
    marker: none
    align: left
    at: { x: 0, y: 796 }
    size: { w: 1360, h: 18 }
  - id: n1
    label: この図では、低気圧が北日本を抜けたあと（16 日）、移動性高気圧が日本を覆い（17〜18 日）、次の低気圧が日本海から北日本へ進み（19〜20 日）、最後に西高東低の冬型に近い形になります（21 日）。
    marker: none
    align: left
    at: { x: 0, y: 818 }
    size: { w: 1360, h: 18 }
  - id: n2
    label: 気象庁が発表する予想天気図は 48 時間先までです。6 日分を並べる週間天気図は民間の様式で、記号は気象庁の地上天気図の決まり（等圧線 4hPa・20hPa 太線、前線の記号は進む側）に合わせました。
    marker: none
    align: left
    at: { x: 0, y: 840 }
    size: { w: 1360, h: 18 }
  - id: n3
    label: 気圧配置は架空です。小さい図なので中心の × と気圧の数字は省きました。陸は Natural Earth（パブリックドメイン）。テレビ局の様式は写していません。
    marker: none
    align: left
    at: { x: 0, y: 862 }
    size: { w: 1360, h: 18 }
