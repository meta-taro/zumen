<g data-name="rn0"><text x="1060" y="274" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・三主枝は三才（天・地・人）になぞらえたもの。飾りではなく構造</text></g>
<g data-name="rn1"><text x="1060" y="300" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・上から見て不等辺三角形になるように置く。等間隔にしない</text></g>
<g data-name="rn2"><text x="1060" y="326" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・手前から見て、奥側に真が来る</text></g>
<g data-name="rn3"><text x="1060" y="352" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・長さは比で決まる。花器の大きさが変われば全部変わる</text></g>
<g data-name="rn4"><text x="1060" y="378" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・真 → 副 → 体・控 の順に生ける。順番を変えると寸法が決まらない</text></g>
<g data-name="rn5"><text x="1060" y="404" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・小原流の盛花は、口の広い浅い水盤に剣山を使う。客枝をほぼ 90 度に取る</text></g>
<g data-name="rn6"><text x="1060" y="430" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">・流派で呼び名と角度が違う。図には流派を書く</text></g>
<g data-name="leg"><text x="1060" y="468" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">太線 ＝ 役枝　　丸 ＝ 枝先　　斜線 ＝ 花器</text></g>
<g data-name="p_t"><text x="660" y="126" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">上から見る（不等辺三角形になる）</text></g>
<g data-name="p_n2"><text x="660" y="511" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">3 本が等間隔・等長にならないようにする</text></g>
<g data-name="c_n"><text x="1060" y="209" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">真 → 副 → 体・控 の順に生ける</text></g>
<g data-name="c_t"><text x="1060" y="56" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">三主枝（生花正風体）</text></g>
<g data-name="tc0_2"><text x="1455" y="115" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">作品の芯。奥へ</text></g>
<g data-name="tc1_2"><text x="1455" y="145" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">真の曲がりに沿い後方へ（奥行き）</text></g>
<g data-name="tc2_2"><text x="1455" y="175" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">前方に低く</text></g>
<g data-name="p_n"><text x="660" y="485" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">手前から見て、奥側に真が来る</text></g>
<g data-name="th2"><text x="1455" y="87" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">向き</text></g>
