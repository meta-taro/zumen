title: 和文と欧文を混ぜるときの寸法図（仮想ボディとベースライン）
# **基準が違うものを、同じ行に並べている。**
#
# ## 和文は「中央」、欧文は「ベースライン」
#
# 和文は**仮想ボディ**という正方形の中に、**中央**へ来るように設計されている。
# 欧文は**ベースライン**の上に乗せて揃える。
#
# **ベースラインは、仮想ボディの中心と下端の「あいだ」にある。**
# しかも**書体ごとに位置が違う。**
# だからそのまま混ぜると行が揃わず、ちぐはぐに見える。
#
# ## 直し方
#
# **ベースラインシフト**で欧文を動かす。書体ごとに量が違うので、
# 組み合わせごとに持たせる（合成フォント）。
# **欧文だけ大きさを変える**こともある —— x ハイトが小さい書体は、
# 同じ級数でも小さく見えるため。
#
# ## 単位
#
# **1 級（Q）＝ 1 歯（H）＝ 0.25 mm。**
# 級は「大きさ」、歯は「送り」。単位は同じでも意味が違う。
