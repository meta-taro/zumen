title: ピアノの鍵盤（88 は、7 オクターブ ＋ 4 鍵）
# **黒鍵が 2 つの組と 3 つの組に分かれているのは、手がかりを作るため。**
# 1 オクターブは 12 個。等間隔に並べてしまうと**どれがドか分からない**ので、
# **並びにわざと偏りを作ってある** —— だから鍵盤を見ずに、触って位置が分かる。
#
# **88 は、7 オクターブ ＋ 4 鍵。**
#
# | | |
# |---|---|
# | 7 オクターブの白（7 × 7） | 白 49 |
# | 7 オクターブの黒（5 × 7） | 黒 35 |
# | 下の端 A0・B0 | 白 2 |
# | 下の端 A#0 | 黒 1 |
# | 上の端 C8 | 白 1 |
# | **合計** | **白 52 ＋ 黒 36 ＝ 88** |
#
# **両端が半端なのが「A0 から C8」の正体**で、広さは **7 オクターヴと短 3 度。**
#
# **1 つの音に張る弦の本数が違う。**
# **最低音域は 1 本、低音域は 2 本、中音域より上は 3 本** —— **弦の総数は 200 本を超える。**
# 短く細い弦は 1 本では音が小さいので、**同じ高さの弦を何本も同時に叩く。**
# **張力の合計は 20 トンにも及ぶ。**
#
# **ペダルは 3 本で、中央だけ役目が違う。**
# 右（ダンパー）はすべてのダンパーが離れて音が延びる。左（ソフト／シフト）は音量を減らす。
# **中央（ソステヌート）は、踏んだ時点で押していた鍵のダンパーだけが降りない** ——
# 手を放してもその音だけ延び、**あとから弾いた音は延びない。**
#
# 図は 2 オクターブぶん。鍵の幅は実物の比ではない（白鍵の寸法は確かめていない）。
