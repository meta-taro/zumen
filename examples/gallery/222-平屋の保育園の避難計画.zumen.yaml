# **上が無い施設は、避難先を「作れない」。** 借りる約束を先にしておくしかない。
#
# 平屋の保育園が、20m 先の 3 階建てへ避難する計画。
# 園児 30 人のうち 15 人は抱っこ・おんぶが要る（0〜2 歳）。
#
# **受け入れ側が 3 人出ると、外にいる時間が半分になる** ——
# これは園だけでは決められない数で、だから計画の半分は隣の建物の話になる。
#
# 浸水想定区域の保育所・学校・高齢者施設・病院などは、
# 避難確保計画の作成と**年 1 回以上の訓練**が義務（水防法 15 条の 3）。
