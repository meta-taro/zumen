title: 靴のサイズの図（JIS S 5037:1998・足長とワイズから足囲を読む）
# **靴のサイズは、靴ではなく足の寸法**（足入れサイズ）。
# 足長はかかとからいちばん長い指まで、足囲は親指と小指の付け根の一周。
#
# JIS S 5037:1998 では、**ワイズが 1 段上がると足囲 ＋6mm**（足幅 ＋2mm）、
# **足長が 0.5cm 増えると、同じワイズで足囲 ＋3mm**。
# だから「25.0cm の EE」と「25.5cm の E」は足囲が近い。
#
# 表の数字は、足長 24.0cm の E ＝ 237mm を起点に、この 2 つの刻みから計算した。
