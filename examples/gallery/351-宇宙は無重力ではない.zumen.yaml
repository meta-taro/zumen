version: 1
kind: placement
arrows: false
title: 宇宙は無重力ではない（ISS の高さでも 89%）
# **高さ 400km の ISS でも、地球が引く力は地表の 88.5%（8.68m/s²）。**
# 飛行士が浮くのは、力が無いからではない —— **落ち続けているから。**
#
# ## 力はほとんど減っていない
#
# 引く力は距離の 2 乗で弱まるが、**測るのは地球の中心から**である。
# 地表で 6,371km。400km 上がっても 6,771km で、**6% 遠くなっただけ。**
# 2 乗しても 0.89 にしかならない。
#
# | どこ | 高さ km | 地表を 100% として |
# |---|---|---|
# | カーマン線 | 100 | 96.93% |
# | **ISS** | **400** | **88.53%** |
# | 静止衛星 | 35,786 | 2.284% |
# | 月 | 384,400 | 0.0266% |
#
# **1% まで落ちるのは高さ 57,000km。** 地球 9 個ぶん外側である。
#
# ## 浮く理由は「落ち続けている」
#
# ISS は **1 秒で 7.66km 進み、そのあいだに 4.34m 落ちる。**
# ところが**その 7.66km 先では、地球の面も 4.34m 下がっている。**
# だから、いつまでも地面に着かない。**高さが変わらないだけで、落ちてはいる。**
#
# 体重計が 0 を指すのは、**体重計も同じ速さで落ちている**から。
# 押し返すものが無いだけで、引かれる力は消えていない。
#
# ## 「微小重力」と呼ぶ理由
#
# 完全に落ちていても、**重心から離れた点は少しだけ違う軌道**を描く。
# 重心から 10m のところで **2.6 × 10⁻⁶ g**（＝ 2GMd / r³）。
# 大気の抵抗と、人や機械の動きも足される。**0 にはならない**ので µg と書く。
#
# ## 縦を誇張してある
#
# ②は**縦を 1000 倍**にしてある。7.66km に対して 4.34m は、
# そのまま描くと線の太さに埋まる。**横だけが読める図。**
#
# 出典: g = g₀(R/(R+h))²、R = 6,371km、g₀ = 9.807m/s²。
# ISS の速さと周期は NASA の公開値（7.66km/s・92.6 分）。月の距離は平均 384,400km。
