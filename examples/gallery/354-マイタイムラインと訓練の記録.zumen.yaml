  - name: "気象庁「新たな防災気象情報について（令和 8 年〜）」"
# **避難の「最善」は、その日に誰も出せない。だから平時に決めて、訓練で直す。**
#
# マイ・タイムラインは、台風が近づいて川が増水するときに**自分と家族がいつ何をするか**を、
# 前もって時系列に書いておく表（国土交通省が推している。平成 27 年 9 月の関東・東北豪雨で、
# 避難の遅れと孤立が出たのを受けて作られた）。
#
# ## 表の組み方（国土交通省 関東地方整備局の記入例に揃えた）
#
# | | |
# |---|---|
# | 横 | 台風直撃の 3 日前・2 日前・1 日前・半日前、氾濫の 5 時間前・3 時間前、氾濫発生 |
# | 行動 | **7 つの基本行動**から選ぶ —— 台風を調べ始める／川の水位を調べ始める／住んでいる所と上流の雨量を調べ始める／持っていくものを準備する／避難しやすい服装に着替える／安全な所へ移動を始める／避難完了 |
# | 縦 | 家族の 1 人ずつ（この図で足した。記入例は 1 人分） |
#
# **時計ではなく、レベルの数字で動く。**「何日前」は目安で、記入例にも
# 「タイミングはイメージであり、実際の洪水時とは異なることがある」と書いてある。
# レベル 3（高齢者等避難）は**避難に時間がかかる人が動き出す合図**。
# この家族の祖母は、それさえ待たずに半日前に動く —— 訓練で測ったら間に合わなかったから（②）。
#
# **2026 年 5 月 29 日から、気象庁の情報にもレベルの数字が付いた。** 大雨の例で
# レベル 2 大雨注意報／レベル 3 大雨警報／**レベル 4 大雨危険警報（新設）**／レベル 5 大雨特別警報。
# 見本 221 の③と同じ対応。
#
# ## ②が主役
#
# 表は 1 回書いて終わりではない。**訓練で測って、直す。** ★ が直した所。
# **直さなかった所も「測って、直さない」と残す** —— 測ったことが次の訓練の起点になる。
# 災害の日に開くのは、**最後の訓練で直したこの版**。その日に作り直さない
# （災害時の画面は、訓練で見たものと同じであるべき）。
#
# ## 描かなかったもの
#
# - **経路。** 災害前の道路のデータで計算した経路は、塞がった道を案内する。経路は歩いて決めて、地図の側に持つ
# - **実在の家族・実在の町。** 家族も訓練の値も架空。避難先の ○ ✕ は見本 353 の架空の町に揃えた
# - **土砂災害・津波の時間割。** 津波は「何日前」が無い（揺れたらすぐ）。この表は台風と川の増水に限る
#
# 出典: 国土交通省 関東地方整備局「マイ・タイムライン」（STEP3 マイ・タイムラインを作ってみましょう）、
# 国土交通省「マイ・タイムライン」。気象庁「新たな防災気象情報について（令和 8 年〜）」。
