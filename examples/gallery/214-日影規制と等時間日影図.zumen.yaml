# 冬至日の 8 時〜16 時に、周りの土地が何時間日陰になるかを測る。
# **等時間日影線はこの図では計算で出した** —— 東京（北緯 35.7°）、
# 時刻ごとの影を 2 分きざみで重ね、同じ時間だけ日陰になる点を結んでいる。
#
# **内側だけ見ても足りない。** 3 時間線が 5m ラインの内側でも、
# 2 時間線が 10m ラインを超えれば建たない。
