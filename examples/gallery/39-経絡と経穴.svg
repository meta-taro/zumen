<g data-name="lu9"><text x="12" y="301" font-family="sans-serif" font-size="10" fill="#63636e">LU-9</text><text x="79" y="307" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">太淵</text><text x="79" y="322" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#63636e">橈骨動脈拍動部</text></g>
