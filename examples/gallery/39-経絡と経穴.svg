<g data-name="li4"><text x="232" y="301" font-family="sans-serif" font-size="10" fill="#63636e">LI-4</text><text x="299" y="307" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">合谷</text><text x="299" y="322" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#63636e">第 2 中手骨中点・橈側</text></g>
<g data-name="li11"><text x="232" y="243" font-family="sans-serif" font-size="10" fill="#63636e">LI-11</text><text x="299" y="249" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">曲池</text><text x="299" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#63636e">肘窩横紋外端</text></g>
