version: 1
kind: placement
title: 小ホール 座席図（6 列 × 10 席 ＝ 60 席・車椅子 2）
# **座席図の主役は、席ではなく「通路と勾配」。**
# 勾配 10° があるのは、前の人の頭で舞台が隠れないようにするため。
#
# ## 通路は条例で決まる
#
# 横に並べてよい席の数（基準席数）は 8 席から始まり、いす席の間隔（前の席の背と後ろの席の
# 前端の間）が 35cm を超える 1cm ごとに 1 席ずつ増える（上限 20 席）。**その数以下ごとに
# 両側へ縦通路**（幅 80cm 以上）、最前部には横通路（1m 以上）。通路は**避難口へ直通**させる。
# この図は 10 席の両側に側通路（壁の内側から約 900〜950）、前通路 1,200、後通路があり、前後どちらの出口へも行ける。
# 出典：札幌市火災予防条例 第 57 条とその解説（市町村の火災予防条例はどこも同じ形）
# https://www.city.sapporo.jp/shobo/yobo/jorei/documents/086-57jyo.pdf （2026-10-02 照合）。
#
# ## 出口の戸は外開き
#
# 劇場・集会場の客席からの出口の戸は**内開きにしてはならない**（建築基準法施行令 118 条。屋外への出口は 125 条 2 項）。
# EX-1・EX-2 とも弧が壁の外に出ているのはそのため。
#
# ## 車椅子席は、通路に面した所に取る
#
# 席を外して空けるのではなく、**そこまで段差なしで行ける経路**が要る。
# この図では後通路に面し、EX-1 から段差なしで入れる位置に取った。
#
# ## 誘導灯が 2 つあるのは、二方向避難
#
# 暗くする部屋なので、**どこに座っていても 2 つの出口が見える**ようにする。
# 席の数より先に、出口と通路の幅が決まる。
# 1 px = 25 mm。席幅 520・席ピッチ 550・列間（いす背の間隔）1,000
scale: { mm: 25 }
wall: { mm: 150, outer: 200 }
grid:
  x:
    - { id: X1, at: 0 }
    - { id: X2, at: 300 }
  y:
    - { id: Y1, at: 38 }
    - { id: Y2, at: 120 }
    - { id: Y3, at: 360 }
groups:
