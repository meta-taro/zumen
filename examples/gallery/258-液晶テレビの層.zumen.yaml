version: 1
kind: placement
arrows: true
title: 液晶テレビの層（液晶は光を作らない。遮るだけ）
# **液晶は光を作らない。** 後ろの光を、通したり遮ったりしているだけ。
# だから**黒は「遮りきれなかった光」**で、暗い場面では灰色に見える。
#
# **2 枚の偏光板は、最初から 90° ずれて貼ってある。** そのままでは光は止まる。
# 液晶が光の振動面をねじると通る —— **電圧でねじり方を変えて、明るさを作る。**
#
# **光は層ごとに減る。** 偏光板で約半分（向きの揃っていない光を片方だけ通すので、
# **原理として半分は捨てるしかない**）、カラーフィルタで約 1/3、
# 開口率で約 60% —— 順に掛けると**残るのは 1 割前後**（各段は代表値）。
#
# **黒を作るには、光を出さないのがいちばん。**
# 直下型のローカルディミングは区画ごとに LED を落とす工夫で、
# **有機 EL は画素ごとに消せる**ので、この層の山もその工夫も要らない。
