title: 避難所の開設 —— 最初にすることは、人を入れることではない
# **避難所は「開ける」ところから始まる。**
# 最初にすることは人を入れることではなく、**建物が使えるかを見ること**。
# 避難所も被災する —— 入れてから危険が分かると、もう一度動かすことになる。
#
# **名簿が無いと、すべての数が出せない**（安否・物資・支援の割り当て・退所）。
# 受付と名簿は**実動訓練で確かめておく**（内閣府「避難所運営ガイドライン」）。
#
# ガイドラインは **4 段階（準備・初動・応急・復旧）× 19 業務**のチェックリスト。
# **災害が起きてからの話は「初動」だけ** —— 準備が半分を占める。
