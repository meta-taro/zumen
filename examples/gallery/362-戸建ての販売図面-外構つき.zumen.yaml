# **戸建ての販売図面は、敷地と道路から描く。**
#
# マンションの販売図面（見本 166・173・359〜361）は住戸の中だけを描くが、戸建ては**敷地の中の建物**を売る。
# 前面道路の幅（建築基準法の接道・道路斜線）、駐車場の向き、庭と日当たり —— どれも間取りの外にある。
#
# | 描くもの | この図では |
# |---|---|
# | 道路と幅 | 南 6.0m（公道）・西 4.0m。敷地の境界は線だけで、面を敷かない |
# | 建物 | 1 階・2 階を横に並べ、どちらも 1 間（1.82m）の升目に乗る |
# | 和室 | 畳 8 枚の敷き方（0.91m × 1.82m）。**畳は広さを数える単位でもある** |
# | 外構 | 駐車場の車（2.5m × 5.0m）、アプローチの敷石、庭の木、デッキ |
#
# 帖は ㎡ ÷ 1.62 を小数第 1 位で切り捨て（不動産の表示に関する公正競争規約施行規則 第 9 条第 16 号：1 帖 1.62㎡ 以上）。延床は 1F・2F とも 5 間 × 4 間 ＝ 9.10m × 7.28m ＝ 66.24㎡。
#
# 見せ方は見本 359〜361 と同じ**見せ方の表（styles）**で書いた。
# 床の模様は rows（フローリング・デッキ）・grid（タイル・敷石）・dots（庭の土と芝）。
#
# 出どころ —— 戸建ての販売図面（外構つき）の実物（提供資料、2026-09-28）。**間取り・面積・敷地はすべて架空。**
