title: 入学までの流れ
# **この図の中身は、合格発表から先の分かれ方。**
# 合格・補欠・不合格で道が分かれ、**補欠は「繰り上げ」で合格へ合流する。**
# 合流があるので、入学手続きの締切は補欠の人数が決まるまで動かせない。
#
# ## 手続きをしないと入学にならない
#
# 合格発表と入学のあいだに、**手続きという別の工程がある。**
# ここを箱にして描かないと、「合格＝入学」と読まれる。
#
# ## 日付ではなく順番の図
#
# 年間の流れなので、長さではなく**前後の関係**を読む。
# 日付が要るなら、工程表（見本 51）の形にする。
