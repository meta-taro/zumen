# **横の長さが時間。** 1 分 ＝ 4px（二次試験は 8px）。
#
# 決まり（日本英語検定協会の各級ページ、取得 2026-11-05）——
# 3 級以上は一次（リーディング・ライティング → リスニング）に受かると二次（英語での面接）。
# 4・5 級は一次（リーディング → リスニング）とスピーキングテスト（級の認定に影響しない）。
# 問題文は写していない（構成だけ）。
