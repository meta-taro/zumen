title: 引越しの搬入経路と家具配置図（3LDK の一室・架空の物件）
scale: { mm: 10 }
# **下見で描く図。** 置き場所を決める図ではなく、**通るかどうかを決める図。**
#
# ## 見るのは「いちばん狭い所」
#
# 家具ごとに、経路上で**いちばん狭い所**を 1 つ選び、そこと寸法を比べる。
# **ドアは有効開口**（枠の内法 − 建具の厚み）。
# **廊下の曲がりは対角**で見る —— まっすぐの幅だけ見ると、当日に止まる。
#
# ## 立てれば通ることが多い
#
# だから**天井高**と、照明・梁の出っ張りを確かめておく。
# それでも通らないものは**吊り上げ**。窓の開口と手すり、クレーンの据え場所まで決める。
#
# ## カタログ寸法を信じない
#
# 取っ手と脚が入っていないことがある。**下見で実測して mm で書く。**
# 「だいたい」は当日に止まる。
