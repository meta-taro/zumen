title: 大圏航路と等角航路（東京 → ニューヨーク、メルカトル図法と正距方位図法）
sources:
  - name: "国土地理院「地球上と地図上の最短距離」"
    url: https://www.gsi.go.jp/kaiseki/RegistratedinJan19.2021/20210119Theshortestdistanceonearthandonthemap.pdf
    retrieved: 2026-10-16
  - name: "Natural Earth 1:50m Land（パブリックドメイン）"
    url: https://www.naturalearthdata.com/
    retrieved: 2026-10-16
# **地図の上の直線は、最短の道とは限らない。** 東京からニューヨークへの 2 つの道を、2 つの図法で並べた。
#
# 決まり（国土地理院「地球上と地図上の最短距離」）——
#
# - **等角航路**：進行方向を一定の方位角に保つ航路。**メルカトル図法では、出発点と到着点を結んだ直線が等角航路**
#   （正角図法で、経線がすべて平行な円筒図法だから）
# - **大圏航路**：地球表面上の 2 点を結ぶ最短距離となる航路。2 点を通る大円
# - メルカトル図法では、2 点が赤道上か同じ子午線上にある場合を除いて大圏航路は曲線になり、**北半球では上に凸**
#
# 正距方位図法（東京中心）では、**中心から引いた直線が大圏航路**で、中心からの距離と方位が正しい。
# これは図法の定義から言えることで、この図では実際に計算して確かめた（大圏の 121 点を投影すると、東京からの直線に乗る）。
#
# ## 数（計算。地球を半径 6,371.0088km の球とした）
#
# | | 長さ | 東京を出る向き |
# |---|---|---|
# | 大圏航路 | 約 10,850km | 北北東（約 25°）。いちばん北で北緯 69.8°（西経 143° あたり、アラスカの上） |
# | 等角航路（東回り） | 約 12,780km | ほぼ真東（約 88°） |
#
# 差は約 1,930km（約 18%）。西回りの等角航路は約 18,680km で、描いていない。
#
# ## 描き方
#
# ① はメルカトル図法（東経 100°〜西経 60°、北緯 75°〜南緯 40°）、② は東京を中心にした正距方位図法（13,000km の円まで）。
# ② の円の外にはみ出す陸は、円周へ寄せて閉じた（形が崩れるのは円の外の部分だけ）。この縮尺で読めない小さな島は描いていない。
#
# ## 描かなかったもの
#
# - 実際の旅客機の経路（偏西風・空域・ETOPS で大圏からずれる。経路は日ごとに違うので、確かめられる一本が無い）
# - 地球の扁平（楕円体）。距離は球として計算した
