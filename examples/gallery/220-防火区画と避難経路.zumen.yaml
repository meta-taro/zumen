version: 1
kind: placement
arrows: true
title: 防火区画と、防火戸が閉まったあとの避難経路
scale: { mm: 100 }
# **避難訓練でいちばん大事なのは、いつもの近道が閉まること。**
#
# 防火戸とシャッターは煙感知で自動的に閉まる。だから訓練の図は
# 「ふだんの経路」ではなく「**閉まったあとの経路**」を描く ——
# 東階段まで 43m の道が、西階段まで 28m に変わる。
#
# 煙は天井を這って広がるので、防煙壁は天井から 50cm 下げ、
# 排煙口は天井から 80cm 以内に付ける（令 126 条の 2・3）。
