version: 1
kind: placement
arrows: true
title: ギターのフレット位置（12√2）
scale: { mm: 1 }
# **フレットは等間隔ではない。**
#
# 1 フレットごとに **1 / 2^(1/12)** 倍。だから **12 フレットでちょうど半分**になる。
# 式は n 番の位置 ＝ S ×（1 − 2^(−n/12)）。
#
# そして **理論どおりに作っても音は合わない** ——
# 押さえると弦が伸びて音程が上がるので、**サドルを後ろへずらす**（弦ごとに違う）。
#
# **同じ題材で、見本 310 もある。** こちらは寸法（12√2 と実際の位置）、
# 310 は「なぜ等分ではなく比なのか」を扱う。

