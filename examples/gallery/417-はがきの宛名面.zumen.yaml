version: 1
kind: placement
paper: { size: Hagaki, margin: 0 }
title: "はがきの宛名面（縦書き。郵便番号の枠は上端から 12mm・右端から 8mm）"
palette:
  朱色: "#e8382a"
# **はがきの宛名面は、機械が読む所が決まっている。** 郵便番号の枠の位置と大きさは、区分機が読むための寸法。
#
# 座標は mm で考えて px に直した（1px = 25.4/96 mm。paper の margin: 0 で、はがきの左上が原点）。
# 出典：
#   内国郵便約款（日本郵便、最近改正 2026-11-02）第 21 条（当社が発行する葉書：長辺 14.8cm・短辺 10cm、左上に料額印面、
#   上部の中央に「郵便はがき」、上部に受取人・下部に差出人の郵便番号記入枠）・第 22 条（私製葉書：14〜15.4cm × 9〜10.7cm、2〜6g、
#   「郵便はがき」又はこれに相当する文字を上部又は左側部の中央に）・第 23 条（通信文は表面の下部 2 分の 1 以内）
#   https://www.post.japanpost.jp/assets/docs/about/disclosure/yakkan/1-1.pdf（取得 2026-11-10）
#   内国郵便約款 第 42 条第 4 項（郵便切手は表面の左上部（横長は右上部）にはり付ける）
#   内国郵便約款 別記 1「郵便番号を記載する方法」（私製葉書の場合の図：上端から 12.0±1.5mm・右端から 8.0±1.5mm、
#   枠 5.7×8.0mm、左端から 7.0・14.0・21.6・28.4・35.2・42.0mm、右端までの全長 55.7mm（＝枠の全幅 47.7＋8.0）。
#   寸法は枠線の内側から測る ―― 描いた線は線の太さの半分だけ外へ出し、内側が 5.7×8.0mm になるようにした。
#   上 3 けたとハイフンの線 0.4〜0.6mm、下 4 けた 0.2〜0.4mm。色は朱色又は金赤色。
#   (1)ア(ｵ) 郵便番号記入枠とあて名との間は 10mm 以上あける。例 1 の図：あて名の範囲は枠の 10mm 下から、右端から 15mm・左端から 10mm 内側、
#   下端から 10mm 上まで。左上の幅 35.0mm・高さ 70.0mm の斜線部分は「通信日付印の押印に使用する領域」（備考 3）で、切手の位置（備考 2）はこの中。
#   あて名の範囲はこの 35×70mm を避けている。図の斜線・点線は葉書に印刷しない（備考 5）ので、この図でも細い点線で境だけを描いた）
#   https://www.post.japanpost.jp/assets/docs/about/disclosure/yakkan/1-3.pdf（取得 2026-11-20）
#   同じ寸法は日本郵便「郵便番号・バーコードマニュアル 郵便番号枠」〔定形郵便物〕の図（JIS S 5502:2010 の封筒の規格。はがきは JIS の適用範囲外）
#   https://www.post.japanpost.jp/service/search/zipcode/zipmanual/p05.html（取得 2026-11-10）
# 「郵便はがき」の文字は枠の 4.0mm 上（別記 1 の私製葉書の図の、枠の左の「4.0」）。枠の右寄りの「4.0」はハイフンの高さ（枠の上の内側から 4.0mm＝高さの中央）。
# 枠の下 10mm は「空白とします」（別記 1 (1)ア(ｵ)）なので、説明の文字（「郵便番号の枠は朱色」）も置かない。下の注記へまとめた。
# 架空：住所・氏名。例：切手の枠の大きさ（約款が決めるのは左上部と、切手と消印のための 35×70mm の場所まで。切手そのものの大きさは決めていない）、
# 差出人の郵便番号枠の位置と大きさ（21 条 (6) は「下部」と言うだけで、寸法は別記 1 にも無い）。
# 色の値 #e8382a は朱色の例（日本郵便は朱色又は金赤色と言うだけで、色の値は決めていない）。絵の注記も「朱色又は金赤色」と書く（朱色だけではない）。
