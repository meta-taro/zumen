version: 1
kind: placement
paper: { size: Hagaki, margin: 0 }
title: "はがきの宛名面（縦書き。郵便番号の枠は上端から 12mm・右端から 8mm）"
palette:
  朱色: "#e8382a"
# **はがきの宛名面は、機械が読む所が決まっている。** 郵便番号の枠の位置と大きさは、区分機が読むための寸法。
#
# 座標は mm で考えて px に直した（1px = 25.4/96 mm。paper の margin: 0 で、はがきの左上が原点）。
# 出典：
#   内国郵便約款（日本郵便、最近改正 2026-11-02）第 21 条（当社が発行する葉書：長辺 14.8cm・短辺 10cm、左上に料額印面、
#   上部の中央に「郵便はがき」、上部に受取人・下部に差出人の郵便番号記入枠）・第 22 条（私製葉書：14〜15.4cm × 9〜10.7cm、2〜6g、
#   「郵便はがき」又はこれに相当する文字を上部又は左側部の中央に）・第 23 条（通信文は表面の下部 2 分の 1 以内）
#   https://www.post.japanpost.jp/assets/docs/about/disclosure/yakkan/1-1.pdf（取得 2026-11-10）
#   日本郵便「郵便番号・バーコードマニュアル 郵便番号枠」（JIS S 5502。版は確かめていない（マニュアルが JIS 規格と書くだけ）：上端から 12.0±1.5mm・右端から 8.0±1.5mm、
#   枠 5.7×8.0mm・間隔 7.0mm、ハイフンの後は 21.6mm から、全幅 47.7mm、寸法は枠線の内側から。
#   上 3 けたとハイフンの線 0.4〜0.6mm、下 4 けた 0.2〜0.4mm。色は朱色又は金赤色）
#   https://www.post.japanpost.jp/service/search/zipcode/zipmanual/p05.html（取得 2026-11-10）
# 架空：住所・氏名。例：切手の枠の大きさ、差出人の郵便番号枠の位置と大きさ（一次資料で寸法を確かめていない）。
# 色の値 #e8382a は朱色の例（日本郵便は朱色又は金赤色と言うだけで、色の値は決めていない）。
