<g data-name="irainin"><text x="258" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">依頼人</text><text x="258" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">振込を頼む</text></g>
<g data-name="shimuke"><text x="540" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">仕向銀行</text><text x="540" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">振込を受け付けた側</text></g>
<g data-name="zengin"><text x="214" y="206" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">全銀システム</text><text x="214" y="224" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">全銀センターは東京と大阪の 2 か所</text></g>
<g data-name="net"><text x="540" y="299" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">ネッティング（相殺）</text><text x="540" y="317" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">その日の分をまとめ、差額だけを日銀へ通知</text></g>
<g data-name="rtgs"><text x="550" y="193" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">RTGS（即時グロス決済）</text><text x="550" y="211" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">流動性節約機能付き。1 件ずつ</text></g>
<g data-name="nichigin"><text x="878" y="299" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">日銀ネット（当座預金）</text><text x="878" y="317" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">差額の決済は、その日の午後 4 時 15 分</text></g>
<g data-name="hishimuke"><text x="861" y="193" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">被仕向銀行</text><text x="861" y="211" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">受取人の口座がある側</text></g>
<g data-name="kouza"><text x="189" y="415" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">受取人の口座へ入金</text></g>
</svg>