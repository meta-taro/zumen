version: 1
kind: placement
arrows: false
title: 梁の配筋図（G1・断面と側面／架空）
# **検査で見るのはこの図。** コンクリートを打つ前に、鉄筋が図のとおりかを確かめる。
# 打ってしまえば中は見えないので、**打設前がやり直せる最後の時**になる。
#
# ## 記号
#
# | | |
# |---|---|
# | `D22` | 鉄筋の径（異形鉄筋 22 mm） |
# | `4-D22` | **D22 が 4 本** |
# | `@200` | 配置の間隔 200 mm |
# | `40d` | 径の 40 倍（D22 なら 880 mm）。定着と重ね継手の長さ |
#
# ## かぶり厚さは、主筋からではない
#
# **コンクリート表面から、いちばん外側の鉄筋の表面まで。**
# 梁ではあばら筋が外側にあるので、**あばら筋の外面から測る。**
# 主筋から測ると、あばら筋の径のぶん足りなくなる。
#
# ## 端部でピッチを詰める
#
# せん断力は端部で大きいので、あばら筋は**端を詰めて中央を空ける**（@100 / @200）。
# 一定間隔で並べると、いちばん要る所が足りない。
#
# ## 縮尺が 2 つある
#
# **断面は 1 px ＝ 4 mm、側面は 1 px ＝ 20 mm。**
# 同じ梁でも、断面は鉄筋の並びを、側面は長さ方向の配置を見せるので、
# **要る細かさが違う**（views。D35）。
views:
  - id: sec
    title: 断面図（1 px ＝ 4 mm）
    at: { x: 90, y: 140 }
    size: { w: 100, h: 175 }
    scale: { mm: 4 }
    grid:
      x:
        - { id: X1, at: 90 }
        - { id: X2, at: 190 }
      y:
        - { id: Y1, at: 140 }
        - { id: Y2, at: 315 }
  - id: side
    title: 側面図（1 px ＝ 20 mm）
    at: { x: 330, y: 185 }
    size: { w: 300, h: 35 }
    scale: { mm: 20 }
    grid:
      x:
        - { id: A, at: 330 }
        - { id: B, at: 480 }
        - { id: C, at: 630 }
