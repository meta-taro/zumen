<g data-name="r1"><text x="150" y="843" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">避難所は「開ける」ところから始まります。 最初にすることは人を入れることではなく、建物が使えるかを見ることです。</text></g>
<g data-name="r2"><text x="150" y="867" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">避難所も被災します。 入れてから危険が分かると、もう一度動かすことになります —— 弱っている人を、二度。</text></g>
<g data-name="r3"><text x="150" y="891" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">受付と名簿は、実動訓練で確かめておきます。 当日はじめて作ると、列が止まって外に人が溜まります。</text></g>
<g data-name="r4"><text x="150" y="915" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">名簿が無いと、すべての数が出せません（②）—— 安否も、物資も、支援の割り当ても、退所の把握も。</text></g>
<g data-name="r5"><text x="150" y="939" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">ガイドラインは 4 段階 × 19 業務のチェックリストです（③）。災害が起きてからの話は「初動」だけで、準備が半分を占めます。</text></g>
<g data-name="r6"><text x="150" y="963" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">準備が終わっていないと、初動でそれを作ることになります。 そのぶん、人が外で待ちます。</text></g>
<g data-name="r7"><text x="150" y="987" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">面積の割り当ては見本 95（1 人 3.5m² のスフィア基準）、トイレの基数は見本 225（20 人に 1 基）。この図は、その前の段階です。</text></g>
<g data-name="q1"><text x="350" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">施設の被害状況を見る</text></g>
<g data-name="q2"><text x="350" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">被災者を受け入れられる状態か</text></g>
<g data-name="t1"><text x="150" y="214" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">① 最初にすることは、人を入れることではない</text></g>
<g data-name="ng"><rect x="599" y="358" width="72" height="15" fill="#ffffff"/><text x="635" y="369" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">開設しない</text><rect x="566" y="372" width="138" height="15" fill="#ffffff"/><text x="635" y="383" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">（別の避難所へ誘導）</text></g>
<g data-name="a1"><text x="350" y="474" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">開設を決める</text></g>
<g data-name="a2"><text x="350" y="554" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">受付をつくり、名簿を作る</text></g>
<g data-name="a3"><text x="350" y="634" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">居住スペースを割り当てる</text></g>
<g data-name="u0b"><text x="946" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">「この人はここに居ます」と言えるのは名簿だけ</text></g>
<g data-name="u1b"><text x="946" y="315" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">何人分を頼むかが決まる</text></g>
<g data-name="u2b"><text x="946" y="349" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">要配慮者・アレルギー・持病を先に知る</text></g>
<g data-name="u3b"><text x="946" y="383" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">居ない人の分を数え続けない</text></g>
<g data-name="n1"><text x="150" y="683" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">建物が無事とは限らない。 避難所も被災する。</text></g>
<g data-name="n2"><text x="150" y="705" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">入れてから危険が分かると、もう一度動かすことになる。</text></g>
<g data-name="n3"><text x="150" y="733" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">受付と名簿は、実動訓練で確かめておく（ガイドライン）。</text></g>
<g data-name="n4"><text x="150" y="755" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">当日はじめて作ると、列が止まって外に人が溜まる。</text></g>
<g data-name="t2"><text x="760" y="214" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">② 名簿は、何のために作るか</text></g>
<g data-name="t3"><text x="760" y="464" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">③ ガイドラインは、4 段階 × 19 業務</text></g>
<g data-name="n5"><text x="760" y="419" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">名簿が無いと、すべての数が出せない。</text></g>
<g data-name="g1"><text x="760" y="553" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">災害が起きてからの話は「初動」だけ。</text></g>
<g data-name="g2"><text x="760" y="575" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">準備（鍵・名簿の様式・訓練）が終わっていないと、</text></g>
<g data-name="g3"><text x="760" y="597" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">初動でそれを作ることになる。</text></g>
<g data-name="g5"><text x="760" y="641" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">19 の業務はチェックリストの形で書かれている ——</text></g>
<g data-name="g6"><text x="760" y="663" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">順番と抜けを、紙の上で確かめられるように。</text></g>
<g data-name="uh1"><text x="1090" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">なぜ</text></g>
<g data-name="u0a"><text x="850" y="281" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">安否を答えるため</text></g>
<g data-name="u1a"><text x="850" y="315" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">物資の数を出すため</text></g>
<g data-name="u2a"><text x="850" y="349" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">支援を割り当てるため</text></g>
<g data-name="u3a"><text x="850" y="383" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">退所を知るため</text></g>
<g data-name="uh0"><text x="850" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">何のため</text></g>
<g data-name="ph0"><text x="815" y="504" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">準備</text></g>
<g data-name="ph1"><text x="935" y="504" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">初動</text></g>
<g data-name="ph2"><text x="1055" y="504" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">応急</text></g>
<g data-name="ph3"><text x="1175" y="504" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">復旧</text></g>
</svg>