<g data-name="why1"><text x="500" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">中継線は「渡す点」だが、準備は数百 m にまたがる。</text><text x="500" y="433" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">走りながら外し、走りながら掛けるので、</text><text x="500" y="447" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">中継所の図は線 1 本ではなく、前後の区間を持つ ——</text><text x="500" y="461" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">たすきは必ず前走者と次走者の間で手渡す（置いて拾うのは認められない）。</text></g>
<g data-name="why2"><text x="500" y="799" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">2018 年に 20m から 30m になった。</text><text x="500" y="813" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">手前にあった助走だけの区間（ブルーゾーン 10m）が、ゾーンに取り込まれた ——</text><text x="500" y="827" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">渡せる場所が長くなったのではなく、助走の区間が渡してよい区間になった。</text><text x="500" y="841" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">ゾーンの外で渡すと失格。バトンの位置で判定する（走者の体ではない）。</text></g>
<g data-name="why3"><text x="1115" y="349" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">斜めに掛けるのは、走りながら外せるから。</text><text x="1115" y="363" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">首にかけた輪だと、外すのに立ち止まることになる ——</text><text x="1115" y="377" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">肩から脇の下なら、腕を抜くだけで外れる。</text><text x="1115" y="391" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">長さが 1.6〜1.8m と幅があるのは、体格に合わせるため。</text></g>
<g data-name="why4"><text x="1115" y="647" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">同じ「中継」でも、測っているものが違う。</text><text x="1115" y="661" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">駅伝は渡す 1 点を決めて前後に余裕を置き、</text><text x="1115" y="675" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">リレーは渡してよい区間を決めて、その外を失格にする ——</text><text x="1115" y="689" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">図に引く線の意味が、逆になっている。</text></g>
<g data-name="r1"><text x="150" y="903" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">駅伝の中継線は「渡す点」ですが、準備は数百 m にまたがります（①）。外すのは手前 400m から、掛けるのは中継後 200m までが目安です。</text></g>
<g data-name="r2"><text x="150" y="927" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">たすきは必ず前走者と次走者の間で手渡します。 置いて拾うのは認められません。</text></g>
<g data-name="r3"><text x="150" y="951" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">リレーは 30m のゾーンの中で渡し終えます（②）。各走者のスタート地点を基準に、手前 20m・後ろ 10m です。</text></g>
<g data-name="r4"><text x="150" y="975" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">2018 年に 20m から 30m になりました。 助走だけだったブルーゾーン 10m が、渡してよい区間に取り込まれました。</text></g>
<g data-name="r5"><text x="150" y="999" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">たすきは寸法が決まっています（③）。布製で長さ 1,600〜1,800mm、幅 6cm、肩から斜めに脇の下へ。</text></g>
<g data-name="r6"><text x="150" y="1023" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">斜めに掛けるのは、走りながら外せるからです。 首の輪だと、外すのに立ち止まることになります。</text></g>
<g data-name="r7"><text x="150" y="1047" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">同じ「中継」でも、測っているものが違います（④）。駅伝は渡す 1 点、リレーは渡してよい区間です。</text></g>
<g data-name="t1"><text x="150" y="164" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">① 駅伝の中継 —— 中継線の前後に、長い「準備の区間」がある</text></g>
<g data-name="t2"><text x="150" y="564" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">② リレーの中継 —— 30m の中で渡し終える</text></g>
<g data-name="h890_186"><text x="1115" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">日本陸連の駅伝競走規準</text></g>
<g data-name="h890_460"><text x="1115" y="476" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">渡す決まりの比べ方</text></g>
<g data-name="t3"><text x="890" y="164" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">③ たすきは、寸法が決まっている</text></g>
<g data-name="t4"><text x="890" y="444" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">④ 駅伝とリレーは、別の競技の別の決まり</text></g>
<g data-name="m400"><text x="360" y="329" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">手前 400m —— ここからたすきを外してよい</text></g>
<g data-name="y890_484"><text x="1046" y="500" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">中継線で渡す。前後に準備の区間</text></g>
<g data-name="y890_508"><text x="1046" y="524" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">外すのは手前 400m から</text></g>
<g data-name="y890_532"><text x="1046" y="548" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">30m のゾーンの中で渡し終える</text></g>
<g data-name="y890_556"><text x="1046" y="572" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">ゾーンの外で渡すと失格</text></g>
<g data-name="y890_580"><text x="1046" y="596" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">たすき（布）／ バトン（棒）</text></g>
<g data-name="y890_210"><text x="1086" y="226" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">布</text></g>
<g data-name="y890_234"><text x="1086" y="250" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">1,600 〜 1,800mm</text></g>
<g data-name="y890_258"><text x="1086" y="274" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">6cm</text></g>
<g data-name="y890_282"><text x="1086" y="298" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">肩から斜めに、脇の下へ</text></g>
