version: 1
kind: placement
title: 総合仮設計画図（敷地 60m×45m・移動式クレーン 25t 吊）
# **仮設計画図は、建物ではなく「工事のあいだだけ在るもの」を描く図。**
# 仮囲い・足場・クレーン・通路・置場 —— **竣工したら 1 つも残らない。**
#
# ## クレーンの位置が、ほかを全部決める
#
# 吊る位置と重さで作業半径が決まり、**その円の中に材料置場を入れる。**
# 置場が円の外だと、二度運びになる。だからクレーンから先に置く。
#
# ## 出入口は 1 か所にしない
#
# 車輌が入って出られないと、道路で待つことになる。
# **近隣と警察の協議がここから始まる**ので、図が先に要る。
# ## この図の組み方（2026-10-02 に描き直した）
#
# - 車輌通路は西の G-1 から入り、東の G-2 へ抜ける（一方通行。車が道路で待たない）
# - クレーンは通路の上に 2 か所据える（CR-1・CR-2）。**作業半径 25m の円 2 つで、建物の屋上の四隅まで届く**
#   （据付位置から最も遠い屋上の角まで 24.9m）。材料置場・加工場はその円の中
# - 外部足場は建物を一周する幅 600（くさび緊結式）。帯で描いた
# - 仮囲いは隣地境界より 500 離す。車輌通路は敷鉄板
# - クレーンの箱（8.0m × 5.0m）は、アウトリガを**中間の 5.0m で張り出した**ときの広さ。25t 吊のラフテレーンクレーンは
#   最大で 6.6m 張り出す（中間 6.1m・5.0m・3.6m、最小 2.3m）ので、幅 5,500 の通路では最大まで張り出せない。
#   中間の張出しでは吊れる重さが下がるので、作業半径 25m で吊る荷の重さは、採用する機種の性能表（張出し幅ごと）で確かめる
#   （張出し幅の数値はタダノ eGR-250N の製品情報 https://www.tadano.com/japan/lifting-equipment/rough-terrain-cranes/egr-250n/ 取得 2026-10-05）
# - アウトリガを張り出している間は、通路はクレーンの所で塞がる。搬入車はクレーンの手前で止めて荷を下ろし、
#   吊り終えてから G-2 へ抜ける。2 台を同時に据えない（CR-2 は CR-1 の盛り替え）
#
# 前は、クレーン 1 か所で建物の東の半分（約 18m）に届かず、外部足場を建物の東に 10m 幅の箱で描き、
# 出入口は北西の 1 か所だけだった（上の「出入口は 1 か所にしない」と食い違い）。
# 1 px = 100 mm
