version: 1
kind: placement
arrows: false
title: "Cabin layout - LOPA (fictional single aisle)"
scale: { in: 1 }
# **A cabin layout is not "how many seats fit".**
#
# Every pair of emergency exits carries a number of seats it is allowed to
# serve (14 CFR 25.807: Type A 110, Type I 45, Type III 35, Type IV 9), and the
# seat count of the cabin is **the sum of those numbers**. This cabin has a
# Type I pair forward, a Type III pair over the wing and a Type I pair aft:
# 45 + 35 + 45 = **125**. It carries 120, so it fits.
#
# **The floor is not what limits it.** Add a row and the drawing stays legal
# only while that sum does; to seat more, you change the exits, not the pitch.
#
# At a Type III the rule is about **the passage, not the seat**: 10 in between
# two-seat rows, 20 in for three-seat rows, and the opening must stay clear for
# at least the width of the narrowest seat on board - **with every seatback in
# its most adverse position.** That is why those seats do not recline.
#
# 1 px = 1 in. The aircraft, the cabin and the seat count are fictional.
