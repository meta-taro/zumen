version: 1
kind: placement
arrows: false
title: JR 中央線快速 停車駅一覧（東京〜高尾・種別 4 区分）
# 帯が種別、白丸が停車、帯が抜けているところが通過。
# **快速は平日と土休日で停車駅が違う** —— 高円寺・阿佐ケ谷・西荻窪は土休日は通過。
# 通勤特快は平日朝上りのみで、停車は 9 駅だけ。
#
# 帯の色はこの図のためのもので、事業者の種別色ではない。
# 色だけに頼らせないため、種別名を各帯の右に文字で出している。
# 駅名・停車駅は事実。図は zumen で描いたもので、どの事業者の図の写しでもない。
