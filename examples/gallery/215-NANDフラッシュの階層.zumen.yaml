    marker: none
    align: left
    at: { x: 130, y: 972 }
    size: { w: 1100, h: 18 }
  - id: r5
    label: "その「写し」は、ホストが頼んでいない書き込みです。 ③ では 3 ページ頼んで 8 ページ書かれました（2.7 倍）。"
    marker: none
    align: left
    at: { x: 130, y: 996 }
    size: { w: 1100, h: 18 }
  - id: r6
    label: "これをライトアンプリフィケーション（WAF ＝ SSD が書いた量 ÷ ホストが書いた量）と呼びます。1.0 が下限です。"
    marker: none
    align: left
    at: { x: 130, y: 1020 }
    size: { w: 1100, h: 18 }
  - id: r7
    label: "空きが減るほど不利になります。 有効ページの割合が高いブロックしか残っていなければ、写す量が増えるからです。"
    marker: none
    align: left
    at: { x: 130, y: 1044 }
    size: { w: 1100, h: 18 }
  - id: r8
    label: "ダイは「独立に命令を実行できる最小単位」です（①）—— 並列に動かせる数が、そのまま速さの上限になります。"
    marker: none
    align: left
    at: { x: 130, y: 1068 }
    size: { w: 1100, h: 18 }
