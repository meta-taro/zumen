version: 1
kind: placement
title: 給食厨房の区域と一方通行（HACCP）
# **HACCP の厨房図は、動線ではなく「区域」を描く図。**
# 汚染 → 準清潔 → 清潔と区域を分け、**人も物も戻らせない。**
#
# ## 戻り道を作らないのが目的
#
# 一度清潔区域へ入ったものを汚染区域へ返すと、そこで交差汚染が起きる。
# だから図は**一方通行**を矢印で示し、**戻る矢印が 1 本も無いこと**を確かめるために描く。
#
# ## 加熱と急速冷却は、時間の勝負
#
# 加熱で菌を殺しても、ゆっくり冷ませば増える温度帯を長く通る。
# **急速冷却が工程図に載るのは、時間そのものが管理点だから。**
#
# ## 冷却は清潔作業区域
#
# 区域の区分は、汚染作業区域（検収場・原材料の保管場・下処理場）、
# 準清潔作業区域（調理場）、清潔作業区域（**放冷・調製場**・製品の保管場）。
# 加熱したあと冷ますものは、清潔作業区域へ渡して冷ます。
# 出典：厚生労働省「大量調理施設衛生管理マニュアル」（加熱は中心 75℃ で 1 分以上、
# 冷却は 30 分以内に中心 20℃ 付近、調理後 2 時間以内の喫食、区域の区分）。取得 2026-10-02
groups:
