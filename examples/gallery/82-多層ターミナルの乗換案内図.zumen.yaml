version: 1
kind: placement
title: 多層ターミナルの乗換案内図（架空駅・1F / B1 / B2 と縦の動線）
# **階層のある乗換を、2D で持てるところまで**やった図。
# 上から 1F・B1・B2。**同じ x にあるものは、上下で同じ位置**にしてある ——
# だから破線の縦動線（階段・ES・EV）が「どこで上下するか」を指せる。
#
# 太い矢印が案内する経路：JR 中央改札 → ES → B1 中央通路 → 階段 → B2 南行ホーム。
#
# **1 枚の中に、向きのある線と無い線が混ざる。**
# 縦動線は向きを持たないので ends で矢印を消してある ——
# arrows は図ぜんたいの設定なので、混ざる図では辺ごとに言う。
#
# 実在の駅では描いていない。**各階の正確な配置が手元に無いため**（調べずに描かない）。
