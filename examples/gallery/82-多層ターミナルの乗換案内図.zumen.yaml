version: 1
kind: placement
title: 多層ターミナルの乗換案内図（架空駅・1F / B1 / B2 と縦の動線）
# **階が正本の言葉になった**（floors ＋ nodes[].floor）。
# 階の枠と階名は**機械が描く** —— 箱を足しても枠がずれない。
# 箱は 1 px も動かない（floor は「どの枠に属するか」を言うだけ）。
#
# 縦動線は edges[].vertical（stair / escalator / elevator。JIS Z 8210 の語）。
# 同じ階どうしを結ぶと検証器が知らせる —— またがないものは縦動線ではない。
#
# 太い矢印が案内する経路：JR 中央改札 → ES → B1 中央通路 → 階段 → B2 南行ホーム。
# **1 枚の中に、向きのある線と無い線が混ざる**ので、縦動線は ends で矢印を消してある。
#
# 凡例と注記には floor を書いていない —— **階に属さないものは、どの枠にも入らない。**
#
# 実在の駅では描いていない。**各階の正確な配置が手元に無いため**（調べずに描かない）。
floors:
  - B2
  - B1
  - 1F
nodes:
