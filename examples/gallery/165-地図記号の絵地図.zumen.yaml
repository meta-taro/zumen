version: 1
kind: placement
arrows: false
title: 地図記号の絵地図（小学校の社会科／架空の町）
north: up
# **地図記号は絵ではなく、決まりごと。**
#
# だから**同じ形でも、○で囲むだけで別の意味**になる ——
# 文（小中学校）を○で囲むと高等学校、×（交番）を○で囲むと警察署、
# ○（町村役場）を二重にすると市役所。**見分けをつけるための決まり**で、
# 形そのものが変わるわけではない。
#
# 記号のもとは 2 つある。**文字からできたもの**（文・〒・卍・×）と、
# **道具や作物の形からできたもの**（消防署のさすまた、田の刈り株、畑のふた葉、
# 果樹園の実、茶畑の茶の実）。
#
# **記号は増えたり減ったりする。** 1997 年に電子基準点、2002 年に図書館と博物館、
# 2006 年に老人ホームと風車、2019 年に自然災害伝承碑。
# **老人ホームと風車は、全国の小中学生 12 万件の応募から生まれた。**
#
# この図では、**文字の記号はそのまま書き、鳥居は線を組んで作った**
# （zumen に地図記号を足していない。いまの道具で組めるかを見るため）。
#
# 町と施設の場所は架空。記号は国土地理院のもの。
