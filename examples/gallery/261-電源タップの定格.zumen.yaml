title: 電源タップの定格（つないでも足し算にならない）
# **タップをつないでも、容量は増えない。**
# 壁のコンセント 1 口が 15A なら、その先に何個足しても合計は 15A のまま。
#
# **上限を決めるのは、いちばん細い所。** 本体に 15A と書いてあっても、
# コードが **0.75sq なら 7A（700W）**が上限（1.25sq で 12A、2.0sq で 17A）。
#
# **熱を作るものだけが、桁違いに食う。** 電子レンジ 1,400W、
# ホットプレート 1,300W、ドライヤー 1,200W に対して、
# **テレビ 150W、ノート PC 65W、スマホ充電 20W** —— 2 桁ちがう。
# 危ないのは「数」ではなく、**熱を作るものが 2 つ乗ったとき。**
#
# **巻いたコードリールは 5A（500W）まで。** 巻くと出た熱が逃げず、被覆が溶ける。
#
# **ブレーカーは、タップを守らない。** タップは 15A、分岐ブレーカーは 20A。
# ホットプレート 1,300W ＋ こたつ 600W ＝ **1,900W（19A）**は、
# ブレーカーが落ちない値 —— **落ちないまま、タップだけが熱を持ち続ける。**
#
# **トラッキングは、使っていなくても起きる。** 差さっていれば刃の間に電圧はかかっていて、
# ほこりと湿気で炭化し、発火する。**家具の裏の見えないコンセントがいちばん危ない。**
