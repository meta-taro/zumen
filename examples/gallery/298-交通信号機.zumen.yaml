version: 1
kind: placement
arrows: true
title: 交通信号機（色の順は、見落としの重さで決まっている）
# **横型は左から 青・黄・赤、縦型は上から 赤・黄・青。**
# 理由ははっきりしていて、**赤をいちばん視認性の良い位置に置かなければならない**から ——
# **青が端にあるのは、赤を優先した結果。**
# 色の順は美しさではなく、**見落としたときの重さ**で決まっている。
#
# **矢印の並びも決まっている。** 横型では三色灯器の**下**、縦型では**右**に付き、
# **青の隣が左折、黄の隣が直進、赤の隣が右折。**
#
# **灯器の大きさ。** 法令（道路交通法施行規則 別表第一 備考）は**円形の表示面の直径を 20〜45cm** と決め、
# ふつう使うのは **φ250mm と φ300mm**（県警の工事仕様の姿図が φ25・φ30）。
# 歩行者専用は**一辺 20〜25cm の正方形**も使える。
# 灯火は高速自動車国道・自動車専用道路で **200m**、その他の道路で **150m** 先から識別できる光度が要る（同 第 4 条 3 項）。
#
# **高さ。** 法令は別表第一の図で示し、実際の取付高は県警の工事仕様が決める ——
# 例：岐阜県警は**横型 5,600mm 以上**（矢印付き・縦型は 5,000mm 以上）、**歩行者用 2,500mm 以上**。
# 歩行者専用信号機は 2.5m 以上にできる（別表第一 備考一）。
#
# **LED 式は、反射鏡を持たない。**
# 電球式は着色レンズと反射鏡で色と向きを作っていたが、LED はそれ自体が色を含めて光るので
# どちらも要らない。**表示面から均一に光が出て、疑似点灯（西日が反射して点いて見える現象）が起きない。**
# 消費電力は電球式の **6 分の 1 程度**（警察庁「LED 式信号灯器に関する Q&A」）。
#
# 縦型は雪が積もりにくいので雪国で多く、狭い所や陸橋・側道でも使われる。
#
# 出典（2026-09-29 に確かめた）: 道路交通法施行規則 第 4 条・別表第一（e-Gov 法令）、
# 岐阜県警察「交通安全施設整備工事共通仕様書」第 4 節 信号灯器設置工事、警察庁「LED 式信号灯器に関する Q&A」。
# 灯器の並び（横型は左から青・黄・赤、縦型は上から赤・黄・青）と矢印の位置は、別表第一の図と各県警の姿図による。
#
# **縮尺は図ごとに違う** —— ①② の灯器は 1px ＝ 3mm、③ の高さ比べは 1px ＝ 20mm。
