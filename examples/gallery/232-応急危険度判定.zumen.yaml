title: 応急危険度判定 —— 赤い紙は「全壊」ではない
# **答えているのは「今入って大丈夫か」であって、「どれだけ壊れたか」ではない。**
#
# 目的は**余震などの二次災害を防ぐこと**。外壁や窓ガラスの落下、
# 付属設備の転倒も危険のうち。だから**壊れ方が小さくても、
# 落ちそうなものがあれば赤**になる。
#
# **応急危険度判定は申請を待たない**（行政と判定士が回る）。
# **罹災証明は申請してから始まる**（自分で出さないと始まらない）——
# この違いを知らないと、赤い紙を見て「手続きは済んだ」と思ってしまう。
