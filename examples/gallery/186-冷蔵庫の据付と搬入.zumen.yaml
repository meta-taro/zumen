version: 1
kind: placement
arrows: true
title: 冷蔵庫の据付と搬入（放熱スペースは機種で違う）
scale: { mm: 5 }
palette:
  放熱: "#8f6f3f"
  前: "#3f6f8f"
# **「何センチ空ける」の一般解は無い。**
#
# 同じメーカーでも、3 ドア以上は上 50mm・左右 5mm・**背面 不要**、
# 2 ドアは上 300mm・左右 20mm・背面 70mm、1 ドアは上 100mm・左右 20mm・背面 100mm。
# だから ① は 3 台を並べた —— **違いそのものが中身**。
#
# もう 1 つは ③。搬入は「狭いほう ＋100mm」で足りると思われがちだが、
# **角だけは対角で決まる**。幅 785mm の廊下どうしの角に、対角 979mm は入らない。
# 傾けた本体を破線で重ねてあるのは、**壁に当たることを見せるため**（交差は中身）。
#
# CROSSINGS_ARE_CONTENT: 角で傾けた本体が壁に当たることを示す図。交差が結論。
