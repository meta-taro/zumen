version: 1
kind: placement
title: 2LDK 平面詳細図（1 階）
# **平面詳細図は、間取り図ではない。**
# 壁の厚みと建具の開き方まで描くので、**家具が入るかどうかが読める。**
# 不動産の間取り図が壁を 1 本線で描くのとは、そこが違う。
#
# ## 廊下の幅は、通るためではなく運ぶため
#
# 人が歩くだけなら 750 で足りるが、**冷蔵庫と洗濯機が通る**必要がある。
# 曲がり角では対角の寸法が効くので、直線の幅だけでは決まらない。
#
# ## どの部屋にも、廊下から戸 1 枚で入れる
#
# 便所・洗面・洋室・和室は、どれも幅 900 の廊下に面して戸を付けた。
# 2026-10-04 まで便所の戸が LDK に、洋室の戸も LDK に開いていて、
# **食事をする部屋を通らないと便所に入れなかった。** 廊下を X2 の通りまで寄せて直した。
#
# ## 納戸に窓が無いのは、居室にしないため
#
# 採光の基準（床面積の 1/7）を満たせない部屋は、居室と呼べない。
# **窓の有無が、部屋の名前を決めている。**
# 1 px = 15 mm。通り芯どうしの寸法が現場の数字になる。
#
# ## 畳数は、壁心の面積を 1.62 で割った数
#
# 不動産の表示に関する公正競争規約施行規則 第 9 条第 16 号（畳 1 枚 = 1.62 m² 以上）。
# LDK は 3,900 × 4,200 ＝ 16.38 m² ＝ 10.1 畳（端数は切り捨て）。2026-09-29 まで 16 畳・和室 6 畳・洋室 5.4 畳と書いていたが、
# **通り芯の寸法から検算すると合わなかった**ので、寸法のほうを正として直した
# （出典 https://www.sfkoutori.or.jp/webkanri/kanri/wp-content/uploads/2019/01/kiyak_zenbun.pdf 取得 2026-09-29）。
scale: { mm: 15 }
# 間仕切 105（軸組）・外壁 180
wall: { mm: 105, outer: 180 }
north: up
grid:
  x:
    - { id: X1, at: 40 }
    - { id: X2, at: 300 }
    - { id: X3, at: 360 }
    - { id: X4, at: 480 }
  y:
    - { id: Y1, at: 40 }
    - { id: Y2, at: 320 }
    - { id: Y3, at: 480 }
    - { id: Y4, at: 560 }
groups:
