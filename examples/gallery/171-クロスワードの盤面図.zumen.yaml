version: 1
kind: placement
arrows: true
title: クロスワードの盤面図（5×5 の日本式と、15×15 のアメリカ式）
# **クロスワードは、語より先に盤面が決まる。**
# 黒マスの形が語の長さと本数を決め、そこへ入る語が探される ——
# だから「盤面図」は、絵ではなく**図面**として先に描かれる。
#
# ①は 5×5 の日本式（カタカナ）。**語も交差もすべて成り立っている**
# （交差する字が一致していることを、作るときに機械で確かめた）。
# 二重のマスを読む順に並べるとキーワードになる（日本の雑誌の形）。
#
# ②は 15×15 のアメリカ式の**盤面だけ**。語は入れていない。
# 180 度回して同じ／すべての語が 3 文字以上／すべてのマスがヨコとタテの
# 両方の語に入る／白マスが分断されない／黒マス 16% 以下／語数 78 以下 ——
# この 6 つを満たす配置を探した。表の数字は、この盤面から数えた。
#
# 番号の振り方は左上から行の順。語の始まるマスにだけ付ける。
