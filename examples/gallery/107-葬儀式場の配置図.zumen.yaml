arrows: false
scale: { mm: 20 }
title: 葬儀式場の配置図（仏式・一般葬／12 × 14m）
# 1 px = 20 mm。**席を決めることが、焼香の順を決めること。**
#
# ## 上座は祭壇に近い前列中央
#
# 故人との関係が深い人ほど前へ。**向かって右が親族席、左が一般席。**
#
# ## 供花も序列で並ぶ
#
# 贈り主の序列で、**祭壇に近いほうから**並べる。
# 間違えると、その場で気づかれる。
#
# ## 地域と宗派で違う
#
# ここに描いたのは一般的な形。**迷ったら葬儀社と菩提寺に確認すること。**
#
# 式場は架空。
