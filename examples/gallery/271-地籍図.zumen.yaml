title: 地籍図（線ではなく、点の座標でできている）
# **地籍図は「絵」ではなく、点の座標の集まり。** 筆界点を平面直角座標系の (X, Y) で持ち、
# **線はその点を結んだ結果** —— だから図から測るのではなく、**座標から面積が計算で出る。**
#
# **面積は、測るのではなく計算する（座標法）。**
# 4 点 (0.00, 0.00) (18.20, 0.00) (20.50, 14.60) (1.80, 13.10) なら、
# Σ（x_i × y_i+1 − x_i+1 × y_i）＝ 507.99、**÷ 2 で 254.00m²。**
# **同じ点を使えば、誰が計算しても同じ面積になる** ——
# 登記簿の地積が地籍調査で変わるのは**測り方が変わったから**で、土地が増えたわけではない。
#
# **流れは 準備 → 一筆地調査 → 地籍測量 → 閲覧 → 認証 → 登記所送付。**
# **立会いが 2 番目に来るのが、この調査の性格** ——
# 測ってから所有者に見せるのではなく、**所有者が立ち会って境界を確認してから測る。**
# 認証された成果は登記所へ送られ、**地籍図は不動産登記法 14 条の地図**として備え付けられる。
#
# **公図と地籍図は別のもの。** 公図は地籍調査に基づかない「地図に準ずる図面」で、
# 精度は地籍図のほうが高い —— **現地と合わない図面が、今も登記所にある。**
#
# **筆界は、話し合いでは動かせない。** 筆界は公法上の境界で、当事者の合意では動かない
# （動かすには分筆・合筆の登記が要る）。所有権界は私法上の境界で、合意で動かせる。
# **一筆地調査の立会いは、合意を作る場ではなく、もとからある筆界を確認する場。**
