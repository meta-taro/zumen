version: 1
kind: placement
arrows: true
title: 庭木の剪定指示図（忌み枝と切り方）
# **どの枝を切るかではなく、「どこで切るか」まで書いて初めて指示になる。**
#
# ## 忌み枝
#
# 樹形を乱し、風と光をさえぎる枝。
# **徒長枝・逆さ枝・平行枝・車枝・ふところ枝・かんぬき枝。**
# 一覧は「迷ったら切る」の目安で、**どの枝を残すかは樹形で決まる。**
#
# ## 切り方は 2 つしかない
#
# **切り返し**（先端を切る）と**間引き**（付け根から抜く）。
# **切り返すと、そこから枝が増える。間引くと、枝が減って光と風が通る。**
#
# 徒長枝を切り返すと**さらに強い枝が出る**ので、付け根から抜く。
#
# ## 外芽の上で切る
#
# **外を向いた芽の少し上**で、**芽と反対側へ斜めに**切る。
# 内を向いた芽で切ると、枝が内側へ伸びて混む。
