version: 1
kind: placement
arrows: true
title: 建具の開き勝手と有効開口（弧 1 本が、部屋の使い方を決める）
# **建具表の開閉記号は、V の先が吊元（丁番の側）。**
# 記号が言っているのは「どちら向きに開くか」ではなく**「どこが動かないか」** ——
# 吊元が壁のどちら側かで、家具を置ける壁も、スイッチを付けられる壁も、
# 隣の扉とぶつかるかどうかも決まる。**平面図の 1 本の弧が、その部屋の使い方を決めている。**
#
# **有効開口は、枠の寸法ではない。** 180° 開かない扉は、**開いた扉自身が開口を狭める** ——
# 戸当たり間の内法 780 の開き戸は、扉厚 33 を引いて **747 しか通れない。**
# 車椅子に要る 800 に届かせるには、内法を **833 以上**にする必要がある。
# **引き戸なら、内法がそのまま有効開口。**
#
# **開き戸は、床も使う。** 扉幅 750 の開き戸は、半径 750 の 4 分円 ——
# **0.44m²（約 0.3 畳）が、物を置けない床**になる。引き戸が狭い部屋で選ばれるのは、
# 有効開口だけでなくこの床のため（代わりに引き込む側の壁 1 枚が使えなくなる）。
#
# **通れる幅は、法令と体で決まる。** 廊下の有効幅員は伝い歩きで 780 以上
# （突出部 750 以上）、車椅子で 850 以上（突出部 800 以上）。
# 出入口は直進なら 800 以上、**出てすぐ曲がるなら 800〜900** ——
# 車椅子は直角に曲がれないので、**扉の先の形で答えが変わる。**
#
# **開き勝手は、好みでは決めない。** 便所・洗面が外開きなのは、
# **中で人が倒れると内開きが開かなくなる**から。劇場・映画館・集会場の客用の屋外出口は、
# **内開きにしてはならない**（建築基準法施行令 125 条 2 項）——
# 避難する人が押し寄せると、扉を引く空間が人で埋まる。
