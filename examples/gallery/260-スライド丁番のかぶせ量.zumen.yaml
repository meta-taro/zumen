title: スライド丁番のかぶせ量（扉の幅は、丁番を決めてから出す）
# **扉の幅は、丁番を決めてからでないと出せない。** かぶせ量がそのまま寸法に入る。
#
# **側板 1 枚を、左右の扉で分け合う。**
# 18 ＋ 0（全かぶせ ＋ インセット）か、**9 ＋ 9（半かぶせ 2 枚）**か。
# 中央の仕切りに 2 枚つくなら半かぶせが定番 ——
# 片方を全かぶせにすると、もう片方が側板に載れない。
#
# 本体の外幅 800・側板 18・扉どうしの隙間 3 なら、
# **全かぶせ 2 枚で 398.5mm、インセット 2 枚で 380.5mm。**
# 扉 1 枚で 18mm 違い、見た目も納まりも別物になる。
#
# **カップは 35mm、掘り込みは 12mm 前後。** 厚み 18mm の扉なら残るのは 6mm で、
# 深すぎると表へ抜ける（専用のビットがあるのは、深さを止めるため）。
#
# **付けてから左右・前後・上下の 3 方向に動かせる。**
# 木は動くので、作ったあとに合わせられることが、この金物の値打ち。
