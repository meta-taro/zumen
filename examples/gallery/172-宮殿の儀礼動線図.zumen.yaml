version: 1
kind: placement
arrows: true
title: 宮殿の儀礼動線図（アンフィラードと、身分ごとの到達範囲）
# **宮殿の続き間は、飾りではなく手続き。**
#
# 扉を一直線に並べる（アンフィラード）。軸線に立つと奥まで見通せる。
# 部屋は奥へ行くほど小さくなる —— 待つ人が減るため。
# 案内人は、その人の**身分が許すいちばん奥の部屋まで**通す。
# 同格以上の客には、主人が**奥から迎えに出る**（出てくる距離が敬意の量）。
#
# 並びは英国バロック（ハンプトン・コート、ウィリアム 3 世の続き間）。
# **寸法は入れていない** —— これは順序と到達範囲の図で、造るための図ではない
# （だから \`scale\` も通り芯も書かない）。
