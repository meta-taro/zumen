version: 1
kind: placement
arrows: true
title: ラマチャンドランプロット（主鎖の形は、角 2 つでほぼ決まる）
# **たんぱく質の主鎖の形は、残基あたり 2 つの角でほぼ決まる。**
# **φ**（ファイ）と **ψ**（プサイ）—— どちらも主鎖の二面角。
# 3 つ目の **ω**（オメガ。ペプチド結合まわり）は**部分二重結合性のため平面に保たれ、
# ふつう 180 度からほとんど動かない。** だから軸が 2 本で足りる。
#
# **二次構造は、プロットの決まった場所に出る。**
# 右巻き α ヘリックスは **φ −57 ／ ψ −47**、
# 平行 β シートは **φ −119 ／ ψ +113**、逆平行 β シートは **φ −139 ／ ψ +135**。
# 左巻き α ヘリックスは右巻きの鏡像なので、符号を反転した位置に来る ——
# ただし**出てくる残基はほとんどグリシン**で、側鎖が水素 1 個しかなく、ぶつかる相手が無いから。
#
# **1 枚では足りない。** MolProbity・Phenix・wwPDB は
# **一般／Ile・Val／Gly／pre-Pro／trans Pro／cis Pro の 6 枚**を使い分ける。
# グリシンは側鎖が水素だけで**最も広く**、プロリンは五員環が Cα と主鎖 N をつないでいて
# **φ が縛られる** —— 1 枚で全部を測ると、グリシンは外れていないのに外れ扱いになり、
# プロリンは外れているのに通ってしまう。
#
# **検証に出る数。** 好まれる領域は高品質な構造の **98%**、許容される領域は **99.95%**。
# **clashscore** は 0.4Å を超える原子の重なりの数を 1000 原子あたりに直した値で、
# **MolProbity score** はそれと非 favored 率・不良ロタマー率の対数加重。
# 参照データは分解能 **1.8Å 以下**の構造から集めた**約 10 万残基**
# （**2018 年に参照データが更新されている** —— 版が違うと外れ値の数も変わる）。
#
# **外れ値は「間違い」ではなく「説明が要る所」。** 歪んだ残基は実在するので、
# 0 にするのが目的ではなく、電子密度で裏が取れるかどうかを見る。
#
# 図の領域はおおよその位置。実際の境目は高分解能の構造を集めた分布から引く。
