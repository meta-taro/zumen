version: 1
kind: placement
arrows: true
title: 木工の組み手（蟻の勾配・ほぞの 3 分の 1・木の動き）
# **蟻組の勾配は、欠けない角度の限界。** 針葉樹は **1:6（9.5°）**、
# 広葉樹は **1:8（7.1°）** —— かたい木ほどゆるくする。
# **角度を立てるほど、テールの角が「短い木口」になって欠ける**から。迷ったら 1:7。
#
# **勾配があるかどうかで役目が変わる。** 蟻組は引っぱっても抜けず、
# あられ組は接着剤が切れたら抜ける。**引き出しの前板だけが蟻組なのは、
# そこだけ毎日引っぱられるから** —— 奥板があられ組なのは手抜きではない。
#
# **ほぞは材厚の 3 分の 1。**（30mm の材なら 10mm。）厚くしても強くならない ——
# ほぞを厚くすると受ける穴が広がり、**折れるのはほぞではなく穴の側**になる。
#
# **木は幅方向にしか動かない。** 接線 10 ／ 放射 5 ／ 繊維 0.5〜1、
# 含水率 1% あたり幅の 0.2〜0.4%。**幅 600mm の天板は含水率 5% で 9mm 動く。**
# 固定すると力が逃げ場を失い、板が割れるか framing が裂ける。
#
# **反る向きは、挽く前から決まっている。** 木表は接線方向で木裏（放射方向）の
# 2 倍縮むので、**乾くと木表が凹・木裏が凸になる。**
# 板の反りは不良品ではなく、丸太のどこから取ったかの結果。
