<g data-name="start"><text x="519" y="75" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">売るもの</text></g>
<g data-name="q_food"><text x="546" y="192" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">飲食料品か</text><text x="546" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">食品表示法に規定する食品</text></g>
<g data-name="q_paper"><text x="152" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">新聞か</text></g>
<g data-name="std1"><text x="319" y="456" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">10%</text><text x="319" y="474" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">それ以外はすべて標準税率</text></g>
<g data-name="q_sake"><text x="578" y="324" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">酒類か</text><text x="578" y="342" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">酒税法に規定するもの</text></g>
<g data-name="q_eat"><text x="606" y="460" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">外食・ケータリングか</text><text x="606" y="478" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">飲食設備で食べさせる／指定場所で配膳（給食等を除く）</text></g>
<g data-name="q_sub"><text x="152" y="334" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">週 2 回以上 ＋ 定期購読か</text></g>
<g data-name="light1"><text x="660" y="600" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">8%</text><text x="660" y="618" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">持ち帰り・出前・宅配・給食・老人ホーム（上限つき）</text></g>
<g data-name="light2"><text x="109" y="462" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">8%</text><text x="109" y="480" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">定期購読の新聞</text></g>
<g data-name="std2"><text x="376" y="594" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c1c22">10%</text><text x="376" y="612" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#63636e">店内飲食・ケータリング</text></g>

