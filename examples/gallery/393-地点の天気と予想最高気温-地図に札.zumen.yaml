# **地図の上の札は、地点ごとの 1 行の表。** 名前・天気マーク・予想最高気温・前日差を、その地点のそばに置く。
#
# 札は地点そのものに重ねず、そばへずらして**細い線で本当の位置（点）とつなぐ** ——
# 札を地点の上に置くと、密な所（近畿・中国）で札どうしが重なる。テレビの図は札をおおよその位置に置くだけのことが多い。
# 沖縄は本土から離れているので、左上の枠へずらして**同じ縮尺**で描いた（枠でずらしたことを書く）。
#
# 前日差は「きのうの最高との差」。同じ 23℃ でも −3 なら涼しくなった日と読める。
# 最高気温は赤の札（数字は染めない）。天気マークは見本 390 と同じ形と配色（気象庁の配色指針）。
#
# 札の置き場所は、**海岸線が札の文字の下を通らない**ところを探して決めた。
# 線の上の文字には読めるように地の色の下敷きが付き、赤い札の中に白い四角が出るため。
# 地点の位置は実在の都市の経緯度。天気・気温・前日差は架空。
# 陸は Natural Earth 1:50m（パブリックドメイン）。国境は描いていない。テレビ局の様式は写していない。
palette:
  陸: "#d4e6c3"
  晴れ: "#ffaa00"
  くもり: "#aaaaaa"
  雨: "#0041ff"
  最高: "#ff2800"
