title: うるう年の決め方（400 年で 97 回。100 回ではない）
# **4 年に 1 回では、多すぎる。**
# 1 年の長さ（回帰年）は約 **365.2422 日**。4 年に 1 回うるう年を入れると
# 平均 **365.25 日**になり、**128 年で 1 日ずれる。**
#
# だから 2 つの例外を足す ——
# **100 で割り切れる年は、うるう年にしない。**
# **ただし 400 で割り切れる年は、やはりうるう年。**
#
# **400 年で 97 回。** 400 ÷ 4 ＝ 100 回から、100 で割れる 4 回（100・200・300・400）を引き、
# 400 で割れる 1 回を戻して **100 − 4 + 1 ＝ 97。**
# 400 年の日数は **400 × 365 + 97 ＝ 146,097 日**、1 年の平均は
# **146,097 ÷ 400 ＝ 365.2425 日** —— 回帰年との差は **0.0003 日／年**で、
# **1 日ずれるのに約 3,300 年かかる。**
#
# **おまけに、曜日も 400 年で元に戻る。**
# 146,097 は **7 で割り切れる**（146,097 ÷ 7 ＝ 20,871）——
# だから**カレンダーの並びは 400 年周期で繰り返す。**
# 4 年でも 100 年でもなく 400 年なのは、この偶然も効いている。
#
# **2000 年はうるう年、1900 年と 2100 年はうるう年ではない。**
# 生きているあいだに例外の例外に当たるのは珍しく、
# **2000 年はその珍しいほう**だった。
#
# 数はすべて計算で確かめた（回数・日数・平均・7 で割り切れること）。
