title: ヤーデージブック 1 番ホール（パー 4・410 yd）
# 1 px = 1 yd。**距離と「入れてはいけない場所」の図。**
#
# ## 面が主役
#
# フェアウェイ・池・バンカー・グリーンは、どれも**不定形の面**。
# 閉じた辺に `hatch` を入れて塗ってある（D31。2026-09-15 から描けるようになった）。
#
# ## 距離は 2 つ持つ
#
# **ピンまでと、エッジまで。** 刻むかどうかの判断がそれで決まる。
# ハザードは「手前」と「奥」の両方を書く —— 届くかではなく、**越えるか**を見る。
#
# ## 当日の欄を空けておく
#
# ピンの位置は朝に渡される。風も当日のもの。
# **書き込む場所を用意しておくのが、この冊子の役目。**
#
# コースは架空。
