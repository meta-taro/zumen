title: 避難場所と避難所 —— 逃げる先と、暮らす先（災害対策基本法・JIS Z 9098:2016）
sources:
  - name: "e-Gov 法令検索「災害対策基本法」第 49 条の 4・第 49 条の 7"
    url: "https://laws.e-gov.go.jp/law/336AC0000000223"
    retrieved: 2026-10-04
# **「避難所」は、逃げる先ではない。**
#
# 2013 年の災害対策基本法の改正で、似た名前の 2 つを分けた。
#
# | | 指定緊急避難場所 | 指定避難所 |
# |---|---|---|
# | 何のため | **命を守る**（切迫した危険から逃げ込む） | **暮らす**（家に戻れない間） |
# | 根拠 | 第 49 条の 4 | 第 49 条の 7 |
# | 災害の種類 | **8 種類ごとに指定** | 問わない |
#
# 分けた理由は東日本大震災。**区別されておらず、逃げた先の施設を津波が襲って
# 多数の犠牲が出た**（平成 27 年版 防災白書）。
#
# ## 8 種類
#
# 洪水／崖崩れ・土石流・地滑り／高潮／地震／津波／大規模な火事（施行令 第 20 条の 4）、
# 内水氾濫／火山現象（施行規則 第 1 条の 6）。
#
# **同じ場所でも、災害ごとに ○ と × が変わる。** ③はそれを架空の町の 3 か所で見せる。
# 学校は「避難所」として知られているが、川沿いで想定浸水深 5m なら洪水では × ——
# 5m は 2 階建ての 2 階の床を越える（見本 221 の色分けと同じ切り方。3m は住宅の 2 階床の目安で、
# 階高の大きい学校では 2 階の床に届かないことがある）。
#
# ## 標識の規格は、法の 8 種類と揃っていない
#
# | 規格 | 受け持つ災害 |
# |---|---|
# | JIS Z 9098:2016 災害種別避難誘導標識システム | 洪水・内水氾濫・高潮・土石流・崖崩れ・地滑り・大規模な火事 |
# | JIS Z 9097:2014 津波避難誘導標識システム | 津波 |
# | —（種別の仕組みは無い） | **地震・火山現象** |
#
# JIS Z 9098:2016 は標識を 4 種類（注意・避難情報・避難誘導・避難場所）に分け、
# **途切れずに続けて置く**（シームレスデザイン）。適・不適は「○」「×」の黒で示す。
#
# ## 描かなかったもの
#
# - **実在の町の指定。** ③の 3 か所は架空。○ × は市町村が場所ごとに決めて公表するもので、
#   この図から自分の町の答えは出ない。**自分の町は、市町村の一覧で確かめる**
# - **図記号そのもの。** JIS Z 8210 の図記号は名前で置いた（記号そのものは描いていない）
# - **避難するかどうかの判定。** それは見本 221（避難行動の判定と浸水深）
#
# 何のための図か —— **地図に「避難所」と出ていても、それが今の災害で逃げてよい所かは
# 別の話**だと分かるため。
#
# 出典: 災害対策基本法 第 49 条の 4・第 49 条の 7、同施行令 第 20 条の 4、同施行規則 第 1 条の 6。
# 内閣府「平成 27 年版 防災白書」第 1 部 第 1 章 第 2 節 2-2。内閣府「指定緊急避難場所の指定に関する手引き」。
# JIS Z 9098:2016、JIS Z 9097:2014。**JIS Z 8210 の版は確かめていない**（図記号の名前を引いただけ）。
