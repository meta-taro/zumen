title: 算数・数学の問題図の決まりごと
# **問題の図は、数を並べる場所ではない。**
#
# 何が等しいか・どこが直角か・どこが平行かを、**線の引き方で先に渡す道具**。
# 斜線 1 本と 2 本は「別の組が等しい」こと。補助線は破線で引く ——
# 元からある線と、自分が足した線を見て区別できるようにするため。
#
# **図は正確とは限らない。** 読むのは数と印であって、目で測るものではない。
