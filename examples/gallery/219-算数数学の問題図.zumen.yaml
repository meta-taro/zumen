  - id: t4n
    label: "高さの破線は、与えられた値（6）を示す線。"
    marker: none
    align: left
    at: { x: 700, y: 880 }
    size: { w: 490, h: 18 }
  - id: t4n2
    label: "解くときに足したのは、対角線 1 本だけです。"
    marker: none
    align: left
    at: { x: 700, y: 902 }
    size: { w: 490, h: 18 }
  - id: r1
    label: "問題の図は、数を並べる場所ではありません。 何が等しいか・どこが直角か・どこが平行かを、線の引き方で先に渡す道具です。"
    marker: none
    align: left
    at: { x: 150, y: 1046 }
    size: { w: 1080, h: 18 }
  - id: r2
    label: "だから印に意味があります。 斜線 1 本と 2 本は「別の組が等しい」ことで、同じ 1 本どうしだけが等しい。"
    marker: none
    align: left
    at: { x: 150, y: 1070 }
    size: { w: 1080, h: 18 }
  - id: r3
    label: "問題の図には、与えられた値だけを書きます。 求めるものは x か「？」で、途中で出した値は解くときに足します（④）。"
    marker: none
    align: left
    at: { x: 150, y: 1094 }
    size: { w: 1080, h: 18 }
  - id: r4
    label: "補助線は破線で引きます。 元からある線と、自分が足した線を、見て区別できるようにするためです。"
    marker: none
    align: left
    at: { x: 150, y: 1118 }
    size: { w: 1080, h: 18 }
  - id: r5
    label: "図は正確とは限りません。 入試の図に「図は正確ではありません」と書いてあるのは、目で測らせないためです —— 読むのは数と印。"
    marker: none
    align: left
    at: { x: 150, y: 1142 }
    size: { w: 1080, h: 18 }
  - id: r6
    label: "円周角（②）も立方体の切断（③）も、図の形そのものが答えの理由になっています。図を描くことが、解くことの一部です。"
    marker: none
    align: left
    at: { x: 150, y: 1166 }
    size: { w: 1080, h: 18 }
