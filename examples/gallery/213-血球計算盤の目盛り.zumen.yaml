version: 1
kind: placement
arrows: true
title: 血球計算盤の目盛りと、数え方（改良ノイバウエル）
scale: { mm: 0.005 }
palette:
  G: "#e0e0e0"
views:
  - id: ban
    title: ① 目盛り（1px ＝ 0.005mm・実寸 3mm 角）
    at: { x: 96, y: 170 }
    size: { w: 750, h: 660 }
    scale: { mm: 0.005 }
  - id: dan
    title: ② 断面（1px ＝ 0.002mm）
    at: { x: 860, y: 170 }
    size: { w: 400, h: 330 }
    scale: { mm: 0.002 }
  - id: masu
    title: ③ 境界に触れた細胞（1px ＝ 0.001mm・1 マス 0.25mm）
    at: { x: 860, y: 540 }
    size: { w: 400, h: 380 }
    scale: { mm: 0.001 }
# **深さ 0.100mm が、面積を体積に変える。**
#
# 目盛りは面積しか区切っていない。カバーガラスを載せると隙間が 0.100mm に決まり、
# **1 大ブロック（1mm 角）＝ 0.1µL ＝ 10⁻⁴mL** になる。
#
# 境界に触れた細胞は、**相対する 2 辺のどちらか一方だけ**を数える（上と左）。
# 隣のマスがその分を数えるので、全体では合う。
