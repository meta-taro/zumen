  - id: r1
    label: "深さ 0.100mm が、面積を体積に変えます。 目盛りは面積しか区切っていませんが、"
    marker: none
    align: left
    at: { x: 130, y: 1108 }
    size: { w: 1120, h: 18 }
  - id: r2
    label: "カバーガラスを載せると隙間が 0.100mm に決まるので、1 大ブロック（1mm 角）＝ 0.1mm³ ＝ 0.1µL になります。"
    marker: none
    align: left
    at: { x: 130, y: 1131 }
    size: { w: 1120, h: 18 }
  - id: r3
    label: "0.1µL ＝ 10⁻⁴mL。 だから培養細胞では「4 大ブロックの平均 × 10⁴ × 希釈倍率」で 1mL あたりの数が出ます。"
    marker: none
    align: left
    at: { x: 130, y: 1154 }
    size: { w: 1120, h: 18 }
  - id: r4
    label: "数えるものによって、見る区画が変わります。 多いもの（赤血球）は狭く、少ないもの（白血球）は広く取る ——"
    marker: none
    align: left
    at: { x: 130, y: 1177 }
    size: { w: 1120, h: 18 }
  - id: r5
    label: "一度に数えられる数に収めるためです。区画を変えたら、体積が変わるので係数も変わります。"
    marker: none
    align: left
    at: { x: 130, y: 1200 }
    size: { w: 1120, h: 18 }
  - id: r6
    label: "境界に触れた細胞は、相対する 2 辺のどちらか一方だけを数えます（③）。上と左、と決めておく。"
    marker: none
    align: left
    at: { x: 130, y: 1223 }
    size: { w: 1120, h: 18 }
  - id: r7
    label: "両方数えれば二重に、どちらも数えなければ抜けます。隣のマスがその分を数えるので、全体では合います。"
    marker: none
    align: left
    at: { x: 130, y: 1246 }
    size: { w: 1120, h: 18 }
  - id: r8
    label: "中央 C は 25 中ブロックすべてが 16 小マスに分かれます。この図は、数える 5 つだけを描いてあります。"
    marker: none
    align: left
    at: { x: 130, y: 1269 }
    size: { w: 1120, h: 18 }
  - id: r9
    label: "決まっているのは隙間の 0.100mm だけです。②のカバーガラスと計算盤の厚みは、この図では切ってあります。"
    marker: none
    align: left
    at: { x: 130, y: 1292 }
    size: { w: 1120, h: 18 }
  - id: r10
    label: "上下左右の 4 大ブロックは描いていません —— 数えるのは W1〜W4 と C だからです。"
    marker: none
    align: left
    at: { x: 130, y: 1315 }
    size: { w: 1120, h: 18 }
