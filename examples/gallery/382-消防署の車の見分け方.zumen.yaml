  朱色: "#e8452f"
  赤色: "#d7000f"
# **消防署の車の見分け方。** 子どもが「赤い車がいっぱいあるけど、何が違うの」と聞いたときの答え。
# 見分けどころ（積んでいるもの）に加えて、**何人乗るか**と**どれだけ置くか**を、
# 消防庁の「消防力の整備指針」の条で添えた。**数は全部、条文か仕様表から取った。**
#
# ## 図の中身
# 7 種類の車を、簡略した形（箱）と 4 行で並べる。
# - 見分けどころ：積んでいるもの（メーカーの仕様・説明と、救助省令 別表第一）
# - 乗る人：整備指針 第 27〜30 条（ポンプ車・はしご車・化学車は 5 人、条件つきで 4 人。救急 3 人。救助 5 人。指揮 3 人以上）
# - 置く数：整備指針 第 5・7・8・13〜15 条、救助省令 第 3 条
# - 色：消防自動車は朱色、救急自動車は白色（細目告示 第 231 条 3 号。見本 381）
#
# ## 気をつけたこと
# - 「水槽付消防ポンプ自動車」は**消防ポンプ自動車の一種**として扱われる（メーカーの仕様表の分け方）。
#   整備指針に水槽付だけの人数の条は無いので、**人数と台数は書かない**（空けておく）
# - ポンプの性能は**規格省令の別表**：A-2 級は**0.85MPa で毎分 2.0m³ 以上**
# - 吸水口・吐水口の数は**ある 1 機種の例**（吸水口 2・中継口 2・吐水口 4、車体の両側）。機種で違う
# - 救助隊の人数は、救助省令（第 2 条）が「5 人以上で編成するよう努める」、整備指針（第 29 条）が「救助工作車 1 台につき 5 人」
#
# ## 描かなかったもの
# - **実在の車の外観・消防本部の名前・消防章・車体の文字**（本物に見えるものを作らない）
# - 救急車の**車内の配置** —— 患者室の寸法を決めた公開の一次資料を見つけられなかった
# - 空港用化学消防車・特殊車（整備指針 第 16 条）—— 地域の実情で置く車で、決まった数が無い
#
# 出典（2026-10-06 に読んだ）：消防力の整備指針（消防庁の告示ページ）、救助省令・動力消防ポンプ規格省令（e-Gov）、
# 細目告示 第 231 条（国土交通省）、モリタの仕様表と FAQ。
