version: 1
kind: placement
arrows: true
title: 三角定規 2 枚と、分度器
# **三角定規が 2 枚 1 組なのは、2 枚あると作れる角が増えるから。**
#
# 1 枚では 30・45・60・90 の 4 つだけ。
# 2 枚を足し引きすると **15° きざみで 10 通り**になる。
# 15° で足りるのは、それが 90 も 60 も 45 も 30 も割り切る幅だから（最大公約数）。
#
# **平行線が引けるのは、1 枚を押さえて滑らせるから。**
# 分度器は目盛りが 2 通り振ってあり、**0 が左右の両方にある。**
