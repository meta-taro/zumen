version: 1
kind: placement
arrows: false
title: 伽藍配置の移り変わり（飛鳥寺式から東大寺式まで）
# **並びそのものが、時代を表す。**
#
# いちばん古い飛鳥寺式では、**塔が伽藍の中心**にあった（仏舎利をおさめる塔が主役）。
# 時代が下るにつれて塔は中心から離れ、**東大寺式では回廊の外**へ出る。
# 入れかわりに、本尊をまつる**金堂が中心**になる ——
# **主役が替わったことが、配置に出ている。**
#
# 塔だけ面を敷いてある（\`fill\`）。どこへ動いたかを追うため。
# 下が南（中門・南大門の側）で、5 つとも同じ中軸線にそろえた。
# 建物の大小と実際の寸法は描き分けていない —— これは**並びの図**。
