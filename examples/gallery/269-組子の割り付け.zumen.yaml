version: 1
kind: placement
arrows: true
title: 組子の割り付け（麻の葉と三ツ組手）
# **麻の葉は、正六角形の中を 18 の二等辺三角形に割った模様。**
# 六角形を 6 つの正三角形に分け、**それぞれを重心から 3 本で割る**（6 × 3 ＝ 18）。
# **六角形の大きさを決めると、部材の長さも角度も全部決まる** ——
# 逆に 1 か所を 0.1mm 間違えると、**そのずれが最後の 1 本まで積み上がる。**
# 「**割り付けができて一人前**」と言われるのは、ここが全部つながっているから。
#
# **地組は、3 本を 1 点で組む（三ツ組手）。** 端を **60° と 120°** に削り、
# 欠き込みの深さを **3 分の 1・3 分の 2・2 分の 1** に変えて嵌め込む ——
# **全部を半分ずつ欠くと、3 本目の行き場が無くなる。**
#
# **地組と模様は別々に作る。** 地組はどの文様でも同じ格子で、
# **入れる葉（正三角形のパーツ）を替えると、別の文様になる。**
#
# **釘も接着剤も使わない。** 意地ではなく寸法の都合で、
# **釘の頭も接着剤の層も 0.01mm の割り付けより厚い** —— 入れた瞬間に模様が歪む。
#
# **平面を隙間なく埋められる正多角形は 3 つだけ**（正三角形・正方形・正六角形）。
# 六角形を選ぶと**1 点に集まる部材が 3 本**で済む ——
# 三角格子なら 6 本、四角格子なら 4 本が 1 点に来る。
# **三ツ組手が 3 本なのは、六角形を選んだ結果。**
