version: 1
kind: placement
arrows: true
title: ミツバチの巣房（六角の理由）
scale: { mm: 0.1 }
# **同じ面積を囲むのに、六角形は壁がいちばん短い。** だから六角。
#
# 正三角形 4.56／正方形 4.00／**正六角形 3.72**（面積 1 のときの周）。
# 円は 3.55 とさらに短いが、**円は隙間なく並ばない** ——
# 隙間なく並ぶ形の中では六角が最短。
#
# 壁は 2 つの房で共用し、**裏と表の房底は食い違って噛み合う**。
# 口はやや上向き（約 3°）で、蜜がこぼれない。
