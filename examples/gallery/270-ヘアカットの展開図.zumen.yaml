version: 1
kind: placement
arrows: true
title: ヘアカットの展開図（何 mm ではなく、何度で引き出したか）
# **展開図が書いているのは「何度に引き出して、どこを切ったか」。**
# どこを何 mm 切ったかではなく、**何度で引き出したか**が図の主語になる。
#
# **0° は全部が 1 本の線に落ちてそろう（ワンレングス）。**
# **90° は頭皮に直角で、どこも同じ長さになる（セイムレイヤー）。**
# その間が**グラデーション**（下が短く上が長い）、**90° を超えるとロングレイヤー**
# （上が短く下が長い）。**引き出した毛は戻るときに元の位置へ帰る** ——
# 戻った先で段になるかどうかは、**引き出した角度だけで決まっている。**
#
# **頭を分けてから切る。** セクション（大きな区分）→ パネル（一度に持つ束）→
# スライス（パネルの 1 枚）。**1 枚のスライスの中でしか角度は保てない**ので、
# 厚く取るほど切り口がぼける。セクションの境（一点鎖線）は
# **「そこで形が変わってよい」という宣言。**
#
# **同じ角度でも、ガイドの決め方で形が変わる。**
# **固定ガイド**は同じ 1 か所へ集めて切るので、**引き寄せた距離がそのまま段差**になり、
# 重さが集まって広がる形になる。**移動ガイド**は前に切ったパネルを次の基準にするので、
# 差が積み上がらず均一な段になる。
#
# **1 枚に載せるのは 5 つ** —— セクションの境／スライスの向き／引き出す角度／
# ガイド（固定か移動か）／切り口の向き。**1 つでも欠けると、別の人が切ると違う形になる。**
# **展開図は、切った結果ではなく切り方の指示書。**
