# **津波警報・注意報は、沿岸を「線」で塗る。** 面ではない —— 警報は海岸線そのものに出る。
#
# 決まり（気象庁「津波警報・注意報、津波情報、津波予報について」）——
#
# | 種類 | 発表基準（予想される津波の最大波の高さ） | 数値での発表 | 巨大地震のとき |
# |---|---|---|---|
# | 大津波警報 | 高いところで 3m を超える | 10m 超／10m（5m を超え 10m 以下）／5m（3m を超え 5m 以下） | 巨大 |
# | 津波警報 | 高いところで 1m を超え 3m 以下 | 3m | 高い |
# | 津波注意報 | 0.2m 以上 1m 以下で、災害のおそれがある | 1m | （書かない） |
#
# - **M8 を超える巨大地震**では、最初は規模を正しく求められないので、**高さを数字で言わず「巨大」「高い」**と言う。
#   規模が求まると数字の高さに切り替える（2013 年 3 月から。きっかけは見本 355 の 2011 年の第 1 報）
# - とるべき行動（原文）：大津波警報・津波警報は「沿岸部や川沿いにいる人は、ただちに高台や避難ビルなど安全な場所へ避難してください」。
#   津波注意報は「海の中にいる人はただちに海から上がって、海岸から離れてください」
# - 全国を **66 の津波予報区**に分けて出す（気象庁「津波予報区について」）。この図の範囲で使った区切り ——
#   北海道太平洋沿岸**東部**＝根室・釧路／**中部**＝十勝・日高／**西部**＝胆振と、白神岬より東の渡島。
#   オホーツク海沿岸は宗谷岬より東。青森県は**太平洋沿岸**（大間崎より東）・**陸奥湾**（平館〜脇野沢）・**日本海沿岸**の 3 つ。
#   千葉県は**九十九里・外房**（野島崎より東）・**内房**・**東京湾内湾**（富津岬より北）
# - 色（配色指針 表 1-2）：大津波警報 200,0,255、津波警報 255,40,0、津波注意報 250,245,0。**大津波警報は線の幅を 2 倍。**
#   海は**濃い青 59,69,128**（3.(5)②「大津波警報・津波警報・津波注意報は発表領域を線で示すので、見分けられるよう濃い青」）。
#   陸は灰色（同 ①）
#
# ## 描き方
#
# 都道府県の輪のうち、**隣の県と点を共有していない辺が海岸。** それを岬の位置で切り、予報区に分けた。
# 振興局の境は海岸の地名で取った（十勝と釧路＝直別、日高と胆振＝むかわ町汐見と日高町富浜の間。OpenStreetMap で位置を引いた）。
# **境目は 1〜2km ずれうる**（陸の線は 1:10m で、1 点が 1km 前後）。
#
# 警報の線は、海岸線に沿った**細い帯の面**として塗った（黄色の「線」は白い紙で 3:1 を割るため）。
#
# ## 筋書き（架空）
#
# 十勝・根室沖で M8 を超える地震。第 1 報（3 分後）は「巨大」「高い」、規模が求まった更新（約 40 分後）で数字に切り替わり、
# **北海道太平洋沿岸西部は津波警報 → 大津波警報、宮城県は津波注意報 → 津波警報に上がる。**
# 到達予想は「ただちに来襲と予測」の 2 区を除いて、更新より前に第 1 波が来る所がある —— **第 1 報で逃げる**理由。
#
# **地震・高さ・到達時刻は架空で、実在の地震とは関係ない。** 2026 年 4 月 20 日の三陸沖の地震とも別。
#
# ## 描かなかったもの
#
# - 北方領土（元の地図データでサハリン側に入っているため、陸としては描くが塗っていない）。伊豆諸島・小笠原は枠の外
# - 満潮時刻・観測値（津波情報）。到達予想時刻は架空の分だけを表に書いた
# - テレビ局の様式（地図の飾り・字幕の帯）は写していない。色と区分は気象庁の決まりだけ
palette:
  海: "#3b4580"
  陸: "#c8c8cb"
  大津波警報: "#c800ff"
  津波警報: "#ff2800"
  津波注意報: "#faf500"
