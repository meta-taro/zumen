  - id: n0
    label: 大津波警報は予想される高さが 3m を超えるとき（発表は 5m・10m・10m 超）。
    marker: none
    align: left
    at: { x: 0, y: 996 }
    size: { w: 908, h: 18 }
  - id: n1
    label: 津波警報は 1m を超え 3m 以下（3m）、津波注意報は 0.2m 以上 1m 以下（1m）。
    marker: none
    align: left
    at: { x: 0, y: 1018 }
    size: { w: 908, h: 18 }
  - id: n2
    label: M8 を超える巨大地震では最初は規模が正しく求まらないので、高さを数字で言わず
    marker: none
    align: left
    at: { x: 0, y: 1040 }
    size: { w: 908, h: 18 }
  - id: n3
    label: 「巨大」（大津波警報）・「高い」（津波警報）と言う。注意報には高さを書かない。
    marker: none
    align: left
    at: { x: 0, y: 1062 }
    size: { w: 908, h: 18 }
  - id: n4
    label: 規模が求まると数字の高さに切り替わり、区分が上がる所も出る（この図では北海道太平洋沿岸西部と宮城県）。
    marker: none
    align: left
    at: { x: 0, y: 1084 }
    size: { w: 908, h: 18 }
  - id: n5
    label: 更新より先に第 1 波が来る所がある。津波は繰り返し来て、第 1 波が最大とは限らない。
    marker: none
    align: left
    at: { x: 0, y: 1106 }
    size: { w: 908, h: 18 }
  - id: n6
    label: 地震・高さ・到達時刻は架空で、実在の地震とは関係ありません。予報区の境目は、振興局の境と岬でおおよそ切った。
    marker: none
    align: left
    at: { x: 0, y: 1128 }
    size: { w: 908, h: 18 }
  - id: n7
    label: 色と線の幅は気象庁の配色指針（海は濃い青、警報は沿岸を線で示す）。陸と県の境は Natural Earth。
    marker: none
    align: left
    at: { x: 0, y: 1150 }
    size: { w: 908, h: 18 }
