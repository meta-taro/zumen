title: 能舞台（床板の向きが、場所を分ける）
# **本舞台は常寸で京間三間四方 —— ほぼ 6m 角。** 檜の板で、
# **床下の要所には甕を埋める**（足拍子の響きをよくするため）。
#
# **床板の向きが、場所を分ける。**
# 地謡座は本舞台と同じく**板を縦**に敷き、後座は**板を横**に渡す ——
# だから後座は「**横板**」とも呼ばれる。
# 後座には囃子方が**笛・小鼓・大鼓・太鼓の順**で坐る。
#
# **四本柱は飾りではない。** 面をかけると視野がほとんど無くなるので、
# **柱が、自分がどこに立っているかを知る手がかり**になる ——
# **目付柱**はその名のとおり目を付けるための柱で、ほかに**シテ柱・脇柱（大臣柱）・笛柱**。
# 笛柱には**『道成寺』の鐘を吊るための金属の環**が付いている。
#
# **橋掛りは通路ではない。** 歌舞伎の花道と同じように**演技の場**として重んじられ、
# 本舞台へ**約 110 度**の角度で取り付く（正面の客から見やすい角度）。
# 橋掛りには**一の松・二の松・三の松**が並び、演技のときの目印になる
# （いまは照明の都合で造木が多い）。
#
# **鏡板の老松は、神の依り代であり、囃子の反響板でもある。**
#
# **出口が、そのまま筋の意味になる。**
# シテは**鏡の間**で装束をつけ面をかけ、**揚幕**（五色の布。幕番が竹で上げ下げする）から出る。
# ところが**舞台で切られた役は、小さな切戸口から退場する** —— 揚幕へは帰らない。
#
# **白洲**は客席と舞台のあいだに敷き詰めた玉砂利で、**水を象徴する。**
# **階（きざはし）**は三段。いまはシテが落ちたときに使う程度。
