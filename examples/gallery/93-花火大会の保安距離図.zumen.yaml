version: 1
kind: placement
arrows: false
north: up
scale: { mm: 2000 }
title: 花火大会 打揚配置・保安距離図（10 号・5 号・3 号／第 3 種場所）
# 1 px = 2 m。**円が図の中身**で、飾りではない。
#
# ## 保安距離は「人を入れない距離」
#
# 火薬類取締法施行規則に基づき、**玉の大きさごとに距離が決まっている**
# （埼玉県煙火消費技術基準 別表 1）。測り方は
# **消費場所から通路等までの水平最短距離**。
#
# **円の中に、観覧席・通路・建物を入れない。** これが図を描く理由そのもの。
#
# ## 号数は玉の直径
#
# 3 で割ると寸になる。30cm ＝ 10 号 ＝ 尺玉。
# 同じ号数でも**ポカ物と割物で距離が違う**（割物のほうが遠い）。
#
# ## 風
#
# 強風（風速 10m/s 以上、または強風注意報）では打ち揚げない。
# 風下は火の粉が流れるので、風向計を図に載せる。
#
# 地名はすべて架空。
