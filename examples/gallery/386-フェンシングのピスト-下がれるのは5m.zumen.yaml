# **センターラインから後ろの限界線まで 7m ＝ 構えの 2m ＋ 下がれる 5m。**
# オンガードライン（中央から 2m）で構えれば、どちらの選手も両足で後ろの限界線を越えずに
# 5m 下がれる（t.18.2）。**14m という長さは、この 5m から決まっている。**
#
# **何のための図か。** 会場の設営と審判が、ピストの線と延長・台・採点器の台の位置を
# 規則の数で確かめるための図。技（突き・払い）や、有効面の判定は描かない。
#
# **描いたもの。** ①平面（1 px ＝ 25 mm）：長さ 14m・幅 1.5m のピスト、5 本の線（センターラインは破線、
# オンガードライン ±2m、後ろの限界線 ±7m —— t.19）、最後の 2m（色を変える —— t.19.4。色は規則に無いので
# 橙で描いた）、両端の延長（1.5〜2m のうち 2m で描いた —— m.57.4）、構えの位置（t.22.3・22.4。点で示した）。
# ②台の断面（1 px ＝ 10 mm）：高さ 50cm 以下、ピストより両側 25cm 以上広い（m.57.3b）。
#
# **寸法は dims で書いた（数値は縮尺から機械が出す）。** 全長はピストの左右の辺から測って 560 px ＝ 14 m。
# 手で引いていたころの線は端を 1 px ずつ縮めていたので 558 px（13.95 m）で、注記の「14m」と合っていなかった。
# ②の「高さ 50cm 以下」は人の文字のまま —— 規則の上限で、図の 50 px（10 mm/px）と照らして検査が見る。
#
# **描かなかったもの（理由）。**
# - 主審の立ち位置・選手の左右（t.22.1 は「先に呼ばれた選手が主審の右」とだけ言う）—— 主審の位置の数が規則に無い
# - 台の両端の坂の勾配 —— 「ゆるい坂」とだけあり、数が無い
# - 採点器の台（ピストの縁から 1〜5m —— t.18.4）—— 距離だけで、どちら側に置くかも台の大きさも規則に無い。表に数だけ書いた
# - 子機（slave score machine）—— 延長の縁から 5m 以上離すとだけあり、台の図から外れる
# - 有効面・剣の寸法 —— ピストの図ではない
# 出典（取得 2026-10-06）：FIE Technical Rules（August 2026）t.17・t.18（幅 1.50m、長さ 14m・誤差 4cm、
# 2m の所から 5m 下がれる、採点器の台は 1〜5m）、t.19（5 本の線と最後の 2m）、t.22（構え）、
# t.33〜t.36（横・後ろの限界を越えたとき）。FIE Material Rules（August 2026）m.57（導電性の床 17〜18m、
# 延長 1.50〜2m、台の高さ 50cm 以下・両側 25cm 以上）。
# **縮尺が 2 つある**（①は 1 px ＝ 25 mm、②は 1 px ＝ 10 mm）。寸法（dims）はその図の縮尺で測るので、図ごとに分けた。
