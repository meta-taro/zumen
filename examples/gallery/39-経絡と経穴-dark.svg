<g data-name="lu9"><text x="12" y="277" font-family="sans-serif" font-size="10" fill="#a0a0ab">LU-9</text><text x="79" y="283" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">太淵</text><text x="79" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a0a0ab">橈骨動脈拍動部</text></g>
