<g data-name="li4"><text x="232" y="277" font-family="sans-serif" font-size="10" fill="#a0a0ab">LI-4</text><text x="299" y="283" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">合谷</text><text x="299" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a0a0ab">第 2 中手骨中点・橈側</text></g>
