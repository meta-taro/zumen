version: 1
kind: placement
arrows: false
title: トロンボーンのポジション（スライドは、先へ行くほど開く）
scale: { mm: 1.2 }
# **7 つのポジションは、等間隔ではない。** 1 番と 2 番は 8.5cm、
# 6 番と 7 番は 11.3cm 離れている。**隣へ行くたびに 1.0595 倍（＝ 12√2）。**
#
# 半音下げるには管を 2^(1/12) 倍にする。管が長くなるほど
# 「その 5.95%」が増えるので、**先へ行くほど間隔が開く。**
#
# ## ギターと同じ式が、逆を向く
#
# ギターのフレット（見本 204・310）も 12√2 だが、**詰まっていく。**
# 押さえたところから駒までの**残り**を短くしていくから。
# トロンボーンは**管ぜんぶ**を長くしていくので、**開いていく。**
# **式は同じで、測る向きが逆。**
#
# ## E2 の下に穴がある
#
# F 管の無いテナーの最低音は **E2**（7 番・第 2 倍音）。
# その下のペダル B♭1 までの 5 音（E♭2・D2・D♭2・C2・B1）は**出ない。**
# F 管はこの穴を埋めるために付いている。
#
# **それでも B1 は残る。** F 管側は管が 1.33 倍なので、同じ半音でも
# 移動が 1.33 倍要る。C2 で 47mm、B1 で 198mm 足りない ——
# **スライドの長さが先に尽きる。** バストロンボーンが 2 つめの弁を持つのは、そのため。
#
# ## この図の読み方
#
# **横だけが実寸**（1px ＝ 0.833mm）。②の升目の横位置は
# ①の目盛りと同じ ——「その音は、スライドがここにあるときに出る」と読む。
# 縦は音の高さで、寸法ではない。
#
# 管長 2.85m は、奏者の表（1 番から 3.25 / 6.75 / 10.5 / 14.5 / 18.75 / 23.25 インチ）
# から逆算した値。計算と実測は、どこも 3mm 以内で合う。
#
# ギターのフレットは見本 204・310、楽譜の寸法は見本 210、ピアノの鍵盤は見本 311。
