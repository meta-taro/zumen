version: 1
kind: placement
arrows: false
title: レゴのモザイク割り付け図（16×16・架空の絵柄）
scale: { mm: 0.25 }
# **色が指示そのものである図**（仕様 §3.0.13 の例外）。
# 1 マス ＝ 1×1 の部品 1 個で、**何色をどこへ置くか**しか書いていない。
#
# 面は `fill` で塗る。`color`（線の色）ではない ——
# 線に書くと**枠まで染まって、マスの区切りが消える**。
# `hatch: solid` と組み合わせて、面をその色で塗り潰している。
#
# **色だけに頼らせない。** 各マスに符号を 1 文字書いてある（K・O・W・P・A）。
# 白黒で刷っても、色覚特性でも、これなら置ける。
#
# 寸法は動かせない —— ポッチの間隔 8.0 mm、部品の実寸 7.8 mm（遊び 0.2 mm）、
# ブロック 9.6 mm、プレート 3.2 mm（ブロックの 1/3）。1 px ＝ 0.25 mm。
# 色の値は BrickLink の色（実物の部品の色。こちらで作らない）。
