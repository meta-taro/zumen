title: 日本銀行券の大きさと識別マーク（模式・図柄は描かない）
scale: { mm: 0.5 }
# **紙幣そのものは描かない。**
#
# 通貨及証券模造取締法があるので、肖像・模様・地紋は出さない。
# 描くのは**外形の寸法**と、**触って分かる印（識別マーク）の位置**だけ。
#
# 中身は 2 つ。**高さはどれも 76mm で、幅だけが違う**こと。
# そして**識別マークは形が同じ（11 本の斜線）で、位置で券種を分けている**こと ——
# 上下の中央にある印は、**二つ折りで重ならないよう左右にずらしてある**。
