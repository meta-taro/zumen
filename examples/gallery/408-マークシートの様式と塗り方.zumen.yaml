version: 1
kind: placement
title: マークシートの様式と塗り方（架空の解答用紙・受験番号・タイミングマーク・良い例と悪い例）
palette:
  ドロップアウトカラー: "#d9627a"
  薄い: "#8f8f8f"
sources:
  - name: "埼玉県教育委員会「令和 9 年度 マークシート方式及び記述式による学力検査を受検するときの注意について」（HB または B の鉛筆・良い例と悪い例・受検番号の塗り間違い 4 例・0 が上で 9 が下）"
    url: https://www.pref.saitama.lg.jp/documents/257619/r9gakuryokukensashiryou.pdf
    retrieved: 2026-11-05
  - name: "大学入試センター「令和 8 年度 大学入学共通テスト 受験上の注意」（黒鉛筆 H・F・HB に限る・プラスチック製の消しゴム・薄い／一部だけ／消し跡は読み取れないことがある）"
    url: https://www.dnc.ac.jp/albums/abm.php?d=4&f=abm00005930.pdf
    retrieved: 2026-11-05
  - name: "US 5,140,139「Preparing mark/read documents…」（タイミングマークは用紙の片側の縁に間隔をおいて刷る）"
    url: https://patents.google.com/patent/US5140139A/en
    retrieved: 2026-11-05
  - name: "東京都教育委員会「マークシート方式による学力検査」（多少はみ出しても大丈夫・悪い例・HB 又は B）"
    url: https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/12_47
    retrieved: 2026-11-05
  - name: "US 7,864,986「Optical mark reading…」（ドロップアウトカラーは人には見えるが、読み取りでは消える。薄い青や赤）"
    url: https://patents.google.com/patent/US7864986B2/en
    retrieved: 2026-11-05
# **人が読む色と、機械が読む黒を分けて刷る。** 楕円と数字はドロップアウトカラー（読み取りで消える）、
# 読み取り機は、タイミングマークで決まる位置の黒を読む。
#
# 決まり（取得 2026-11-05）——
# 受験番号は左から手で書き、その下の同じけたの数字を塗る。マーク欄は 0 が上、9 が下（埼玉県教育委員会）。
# 鉛筆は試験ごとに決まる：大学入学共通テストは黒鉛筆 H・F・HB のみ、埼玉県の公立高校は HB または B（シャープペンシル可）。
# 用紙は架空。実在の試験の解答用紙の写しではない。
