# **共用部の図は、器具を描く。**
#
# 住戸の販売図面（見本 166・173・359〜361）は家具を描かない —— 置き家具は買う人が決めるから。
# **共用部は逆**で、ジムの台数、スタジオの広さ、ボウリングやビリヤードがあること自体が売り物になる。
# だから器具の並び（トレッドミル 5 台、バイク、サンドバッグ、リング、スピンバイク 6 台、ビリヤード台）を描く。
#
# ボウリングは USBC の規格の寸法で描いた（ほかの器具と部屋は架空）：
#
# | | |
# |---|---|
# | ファウルラインから先頭のピンの中心まで | 60ft ＝ 18.29m |
# | レーンの幅 | 41.5in ＝ 1.05m（板 39 枚） |
# | 助走路 | 15ft ＝ 4.57m 以上 |
# | ピン | 10 本、中心どうし 12in の正三角形 |
#
# **見せ方はベージュの作風**。見本 359〜361 の見せ方の表（styles）を差し替えただけで、同じ道具で描いた。
#
# 出どころ —— 高級マンションの共用部（アメニティ階）の図（提供資料、2026-09-28）。
# 寸法は USBC の規格（bowlingball.com「Bowling Lane Specifications」、Wikipedia「Tenpin bowling」）。**器具の配置と建物は架空。**
