title: 法定相続情報一覧図（被相続人 甲野太郎 法定相続情報／架空）
# **法務局が認証文を付けて交付する、公的な証明書。**
# これがあると、相続手続きの申請先ごとに戸籍謄本を出さずに済む。
#
# ## 「相続関係説明図」とは別のもの
#
# | | 法定相続情報一覧図 | 相続関係説明図 |
# |---|---|---|
# | 何か | **法務局が認証する証明書** | 申請内容を説明する図 |
# | 証明力 | **ある** | **無い** |
# | 数次相続 | 個別の相続だけ | 全部書くことがある |
#
# ## 用紙の決まり
#
# **A4 縦。長期保存に耐える丈夫な白紙。**
# **用紙の下から 5 cm には、法務局の認証文が入る** —— ここには何も書かない。
# 1 px ＝ 0.5 mm なので、下の帯 100 px がその 5 cm。
#
# ## 線の決まり
#
# **配偶者と被相続人は二重線、子は単線。** 戸籍の記載どおりに書く。
# **相続放棄した人も書く**（相続しないことになった人を落とさない）。
#
# ## 器の名前を器の真ん中に書かない
#
# 人の欄は中に何行も入るので、枠の名前を中央に置くと中身に乗る（D29）。
# **枠は名前を持たず、氏名は中の 1 行目として置く。**
#
# 出どころ —— 法務局「法定相続情報証明制度の具体的な手続について」ほか。
# 氏名・日付・地番はすべて架空。
