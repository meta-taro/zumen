version: 1
kind: placement
arrows: false
title: Exterior wall framing, platform framing (fictional)
# **Built in the order a framer builds it** — the same wall as 見本 139
# （矩計図）, but in the other building culture.
#
# ## What goes on the drawing
#
# Sill plate (pressure treated) on anchor bolts, bottom plate, studs at 16 in
# o.c., the rough opening (king stud, jack stud, header, cripples, rough sill),
# the double top plate, then the skin: sheathing, WRB, rainscreen battens, siding.
#
# **The skin is drawn part way across on purpose** —— that is how a wall looks
# while it is being built, and it keeps the framing visible behind it.
#
# ## The code numbers on the sheet
#
# | | |
# |---|---|
# | Anchor bolts | 1/2 in dia, 7 in embedment, **6 ft o.c. max**, 2 per plate (IRC R403.1.6) |
# | Studs | 2x6 at **16 in o.c.** |
#
# **日本語の同じ主題は見本 139（矩計図）。** 同じ「壁の作り方」を、
# 尺貫法と通り芯で書くか、フィートと o.c. で書くかの違いとして並べてある。
#
# 1 px ＝ 8 mm。寸法・建物はすべて架空。
