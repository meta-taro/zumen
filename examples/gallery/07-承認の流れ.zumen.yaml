version: 1
wrap: true
title: 稟議の流れ
# **稟議の図は、通る道ではなく「戻る道」を描くための図。**
# 差し戻しがどこへ返るか（起案者か、一つ前か）が決まっていないと、
# **止まった案件が誰の手元にあるか分からなくなる。**
#
# ## 金額で道が分かれる
#
# 100 万円未満は部長まで、以上は役員会まで。
# **分かれ目を図に書く**のは、起案者が自分で判断できるようにするため。
#
# ## 経理は承認者ではなく、確認者
#
# 同じ線上にあっても、**止める権限があるかどうかは別**。
# そこを描き分けないと、経理が「承認しない」と言えるのかが読めない。
direction: down
