title: クローンは「同じ個体」ではない（CC と レインボー）
# **世界初のクローン猫 CC は、元の猫と毛色が違った。**
#
# 2001 年 12 月 22 日、テキサス A&M 大学で誕生。名は Carbon Copy の略。
# 核を採ったのは三毛の「レインボー」。**核の DNA は完全に同じ。**
# それでも **CC は三毛にならず、白地に灰色のトラ（白キジ）**だった。
#
# ## なぜ同じにならないのか —— 3 つある
#
# | | 元の猫から来るもの | 来ないもの |
# |---|---|---|
# | 核の DNA | **そのまま**（だから「クローン」）| |
# | ミトコンドリア DNA | | **卵子の提供猫のもの** |
# | X 染色体の不活性化 | | **細胞ごとにランダムに決まり直す** |
# | 子宮の環境・その後の経験 | | **代理母と、育った場所のもの** |
#
# ## 三毛が三毛になる仕組み
#
# 茶色と黒の遺伝子は **X 染色体**にある。メス猫は X を 2 本持つが、
# **細胞ごとにどちらか片方が不活性化される。** どちらが止まるかは**ランダム**。
# その斑が毛色の模様になる —— **だから三毛の模様は遺伝しない。**
#
# クローンでも同じことが起きる。**DNA が同じでも、模様は決まり直す。**
#
# ## 描かなかったもの
#
# **手順は描かない**（方針 §5.5）。除核の方法も、電気刺激の条件も書いていない。
# **この図は「何が受け継がれ、何が受け継がれないか」の図。**
#
# 出典 —— CC（猫）に関する報道と、X 染色体不活性化（ライオニゼーション）の教科書的記述。
