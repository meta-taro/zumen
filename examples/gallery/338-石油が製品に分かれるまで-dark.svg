<g data-name="seisei"><text x="751" y="339" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">水素化精製</text><text x="751" y="357" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">硫黄などの不純物を除く</text></g>
