version: 1
kind: placement
arrows: true
title: 交通事故 現場見取図（信号機の無い交差点・出会い頭／架空の事故）
scale: { mm: 50 }
north: up
# **実況見分調書に綴じる見取図。** 警察が、当事者の立会いのもとで実測して描く。
# 後で過失割合を争うときに、いちばん強い証拠になる。
#
# ## 寸法は、すべて基点から測る
#
# **基点**は動かない物（電柱・路端・交差点の角）。
# 衝突地点も停止位置も、基点からの実測値で押さえる。**「だいたいこのへん」は書かない。**
#
# ## 地点は、立会人が指し示した所
#
# 甲車は **①〜⑤**（発見・危険・制動開始・衝突・停止）、乙車は **ア〜エ**。
# **調書の指示説明の番号と、図の番号を合わせる。**
# 警察が推測して置くものではない。
#
# ## 書くもの
#
# 道路の幅員・形状・規制（一時停止・横断歩道・停止線）、見通しを妨げる物、
# スリップ痕の長さ、天候と路面の状態、見分の日時、立会人。
#
# **車は左側通行。** 進路は、その道路の左半分に描く。
#
# **この図は関係を示すもので、過失割合そのものではない。**
