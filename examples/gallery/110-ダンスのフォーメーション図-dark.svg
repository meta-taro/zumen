<g data-node="n0" data-pinned="false" data-shape="rect"><text x="70" y="652" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・上手＝客席から見て右、下手＝左。舞台に立つと左右が逆になる。</text></g>
<g data-node="tc0_3" data-pinned="false" data-shape="rect"><rect x="610" y="506" width="330" height="28" fill="#22222a" stroke="#ffffff" stroke-width="1"/><text x="775" y="524" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">顔と人数を見せる</text></g>
<g data-node="tc1_3" data-pinned="false" data-shape="rect"><rect x="610" y="534" width="330" height="28" fill="#22222a" stroke="#ffffff" stroke-width="1"/><text x="775" y="552" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">センターを立てる</text></g>
<g data-node="tc2_3" data-pinned="false" data-shape="rect"><rect x="610" y="562" width="330" height="28" fill="#22222a" stroke="#ffffff" stroke-width="1"/><text x="775" y="580" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">奥行きを出す</text></g>
<g data-node="tc3_3" data-pinned="false" data-shape="rect"><rect x="610" y="590" width="330" height="28" fill="#22222a" stroke="#ffffff" stroke-width="1"/><text x="775" y="608" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">いちばん強く見える線に乗せる</text></g>
<g data-node="n2" data-pinned="false" data-shape="rect"><text x="70" y="704" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・上手奥から下手前へのナナメの線が、いちばん強く見える。</text></g>
<g data-node="n3" data-pinned="false" data-shape="rect"><text x="70" y="730" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・移動は最短でなくてよい。客席からどう見えるかで決める。</text></g>
<g data-node="n4" data-pinned="false" data-shape="rect"><text x="70" y="756" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・奇数人数は十字やＶ字が組みやすい（センターが決まる）。</text></g>
<g data-node="th3" data-pinned="false" data-shape="rect"><rect x="610" y="480" width="330" height="26" fill="#22222a" stroke="#ffffff" stroke-width="1"/><rect x="610" y="480" width="330" height="26" fill="#ffffff" fill-opacity="0.82"/><text x="775" y="497" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">狙い</text></g>
<g data-node="n5" data-pinned="false" data-shape="rect"><text x="70" y="782" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・止まる形だけでなく、どのカウントで着くかを書く。</text></g>
