# **曲面は、円弧を折れ線に刻んで描く。**
#
# 高級マンションの角住戸は、外周を曲面のバルコニーでくるむことが多い。
# zumen の部屋は矩形なので、**建物の外壁（直線）と、バルコニーの手すり（円弧）を分けて描く。**
# 円弧は 20 本の折れ線に刻み、外壁の直線と合わせて閉じた輪にして、床に `rows`（デッキ）を敷いた。
#
# | | |
# |---|---|
# | 弦（外壁の長さ） | 11.0m |
# | 矢（いちばん張り出した所） | 2.2m |
# | 半径 | R ＝ (c²/4 ＋ s²) ÷ 2s ＝ 7.975m |
# | 面積（弓形） | R²·acos((R−s)/R) − (R−s)·√(2Rs − s²) ＝ 16.64㎡ |
#
# 専有 143.00㎡（43.26 坪）。帖（J）は ㎡ ÷ 1.62。LDK はキッチンを含めて 50.60㎡。
# 部屋は白、面は LDK だけ、壁と柱はウォームグレー、家具は描かない（高級賃貸・分譲の型）。
#
# 出どころ —— 実在の高級マンションの販売図面（提供資料、2026-09-28）の曲面のバルコニー。**間取り・面積・物件はすべて架空。**
