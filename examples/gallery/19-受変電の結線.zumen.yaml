version: 1
wrap: true
title: 受変電設備の単線結線図
# **「単線」は、線が 1 本という意味ではない。**
# 三相 3 線も、単相 3 線も、**1 本の線で描く。**
# この図が運ぶのは電線の本数ではなく、**機器の順番と、系統の分かれ方**。
#
# ## 高圧受電は、変圧を自分でやるということ
#
# 6.6kV をそのまま受けて、自分の変圧器で 400V / 200V へ落とす。
# **引込柱から先は需要家の持ち物**（責任分界点）。だから保護も点検も自分でやる。
#
# ## 非常用は、自動切替の先にしか無い
#
# 発電機は常用の系統と並ばない。**自動切替（ATS）で切り替わった先**の
# 非常用分電盤だけが生きる。何を非常用にするかは、この図で決まる。
pins:
  tr1:
    appearance: primary
groups:
  - id: koatsu
    label: 高圧受電（6.6kV）
  - id: teiatsu
    label: 低圧（400V / 200V）
  - id: hijo
    label: 非常用
nodes:
  - id: intake
    type: network
    label: 引込柱
    tag: DS-1
    technology: 6.6kV 三相 3 線
    group: koatsu
  - id: vct
    type: generic
    label: 計器用変成器
    tag: VCT
    group: koatsu
  - id: lbs
    type: generic
    label: 高圧交流負荷開閉器
    tag: LBS-1
    group: koatsu
  - id: tr1
    type: cluster
    label: 変圧器
    tag: T-1
    technology: 500kVA
    group: koatsu
  - id: tr2
    type: cluster
    label: 変圧器
    tag: T-2
    technology: 150kVA
    group: koatsu
  - id: mcc1
    type: generic
    label: 動力盤
    tag: MCC-1
    technology: 400V
    group: teiatsu
  - id: lp1
    type: generic
    label: 電灯分電盤
    tag: LP-1
    technology: 200/100V
    group: teiatsu
  - id: gen
    type: cluster
    label: 非常用発電機
    tag: G-1
    technology: 200kVA・軽油
    group: hijo
  - id: ats
    type: generic
    label: 自動切替
    tag: ATS-1
    group: hijo
  - id: emb
    type: generic
    label: 非常用分電盤
    tag: EMB-1
    group: hijo
edges:
  - from: intake
    to: vct
  - from: vct
    to: lbs
  - from: lbs
    to: tr1
  - from: lbs
    to: tr2
  - from: tr1
    to: mcc1
  - from: tr2
    to: lp1
  - from: tr1
    to: ats
    label: 常用
  - from: gen
    to: ats
    label: 停電時
  - from: ats
    to: emb
