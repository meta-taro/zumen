title: 受変電設備の単線結線図
sources:
  - name: "日本電気技術者協会「高圧自家用受電設備の保護について」"
    url: "https://www.jeea.or.jp/course/contents/05204/"
    retrieved: 2026-09-29
# **「単線」は、線が 1 本という意味ではない。**
# 三相 3 線も、単相 3 線も、**1 本の線で描く。**
# この図が運ぶのは電線の本数ではなく、**機器の順番と、系統の分かれ方**。
#
# ## 高圧受電は、変圧を自分でやるということ
#
# 6.6kV をそのまま受けて、自分の変圧器で 400V / 200V へ落とす。
# **区分開閉器（PAS）から先は需要家の持ち物**（責任分界点）。だから保護も点検も自分でやる。
#
# ## 主遮断装置は、変圧器の合計で形が決まる
#
# 並びは 区分開閉器 → 断路器 → 取引用計器用変成器 → **主遮断装置** → 変圧器ごとの開閉器。
# 変圧器の合計が 300kVA を超えると、開閉器＋限流ヒューズ（PF・S 形）では受けられず、
# **遮断器で切る CB 形**になる。この図は 300＋150＝450kVA なので VCB を置く。
# 変圧器ごとの開閉器は、限流ヒューズ付きの負荷開閉器（LBS・PF 付）。
# 出典：日本電気技術者協会「高圧自家用受電設備の保護について」
# https://www.jeea.or.jp/course/contents/05204/ （取得 2026-09-29）
#
# ## 非常用は、自動切替の先にしか無い
#
# 発電機は常用の系統と並ばない。**自動切替（ATS）で切り替わった先**の
# 非常用分電盤だけが生きる。何を非常用にするかは、この図で決まる。
