title: ロープ結索の選び方（役目・部位・残る強度）
# **結索図がまず決めるのは「どこを使うか」。**
# 1 本のロープの中で、**端・中間・折り返し（バイト）は別の扱い**になる ——
# （バイトは交差させない U 字の折り返し。交差させると輪＝ループ。スタンディングパートは
#  結びに使わない側の長い部分で、「中間」とは別の言葉）
# 中間に輪を作れる結びと、端でしか作れない結びは別物で、
# 図に「端」と書いていなければ、読む側はどちらとも取れる。
#
# **結索は、役目で 3 つに分かれる**（消防の分け方）。
# **結合**（ロープとロープをつなぐ。本結び／ひとえつなぎ／ふたえつなぎ）、
# **結着**（柱や物に結び付ける。巻き結び／もやい結び）、
# **端止め**（端にコブを作る。8 の字結び）。
# 「よく使う結び 10 選」では選べない —— **先に決まるのは役目**で、
# 決まれば候補は 2〜3 個に絞れる。**本結びで柱に結ばない**し、
# **太さの違うロープを本結びでつながない**（ずれて解ける）。
#
# **結び目は、必ずロープのいちばん弱い所。**
# 結ぶと強度は **40〜80%**（クライミングの結びで 60〜80%、もやい結びで約 60%）まで落ちる ——
# 繊維が急に曲げられ、**外側は伸ばされ内側は潰されて、力が均等にかからなくなる。**
# **「10kN のロープ」は、結ばない状態での話。**
#
# **描けないものは、それらしく描かない。**
# 結び方の手順図には**線の上下（くぐる・またぐ）**が要り、zumen は交差を切って描けない。
# 結びごとの正確な強度も、材質と結び方で変わり出典が割れるので入れていない ——
# **役目・部位・強度の桁**までを、この 1 枚が引き受けている。
