title: 点字ブロックの敷設図（歩道・階段・横断歩道／JIS T 9251:2014）
scale: { mm: 10 }
# **足の裏と白杖だけで読む図面。** だから形が 2 種類しかない。
#
# ## 線状は「進め」、点状は「止まれ」
#
# **線状ブロック**は進行方向を指す。突起は棒状で、**進む向きへ並べる。**
# **点状ブロック**は「ここで止まって考える」の合図 ——
# 分岐、階段の上端・下端、横断歩道の手前、券売機の前。
#
# **点状を連続して敷かない。** どこもかしこも警告なら、警告にならない。
#
# ## 置かない所も決まっている
#
# **横断歩道の手前は、交差点部の両側 1 m に点状を置かない。**
# **屈曲部の内角が 135 度以上なら、警告ブロックを置かない**（ゆるい曲がり）。
#
# ## 色は、見える人のためでもある
#
# 黄色で、周囲の舗装と輝度の差をつける。**弱視の人はこれを見て歩く。**
#
# **点字そのものは見本 189・194。** こちらは床に敷く側（点状と線状の使い分けと寸法）。

