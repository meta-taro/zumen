# **The envelope is not a building.** It is what is left of the lot once the
# front, rear and side yards are taken out —— everything else on the sheet
# （house, garage, drive）is a choice made inside it.
#
# Coverage counts footprints; a second storey costs nothing in coverage but
# does count in floor area ratio. **That is why the two numbers are both here.**
#
# Zone, dimensions and the lot are fictional. Local rules differ everywhere.
