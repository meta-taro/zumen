version: 1
kind: placement
title: サーバ室 ラック配置図（ホットアイル・コールドアイル）
# 1 px = 20 mm。ラック 600×1000、コールドアイル 1,200、ホットアイル 900。
# 列（斜線）は機器、アイルは通路で、列とアイルの間に壁は無い（以前は壁で仕切っていて、
# 空気も人もアイルへ出入りできない図だった）。入退室・通路・搬入口からアイルの端へ入る。
# **4 列とも背面にホットアイルがある。** 以前は A 列の背面が外壁に付いていて、
# 吐いた熱気の逃げ場も、背面（電源・配線）へ回る通路も無かった。A 列の後ろに 900 を足し、部屋を 900 広げた。
# 列の長さ 300px ＝ 6,000mm ＝ **幅 600 のラックが 10 台**。部屋は 555 × 360px ＝ 11.1 × 7.2 m ≒ 80 m²。
#
# ## 数を突き合わせる（空調は IT の負荷より大きくなければならない）
#
# IT の負荷は A 60 ＋ B 52 ＋ C 48 ＋ D 24（8 台 × 3.0）＝ **184kW**。
# 空調は **70kW × 4 台で N＋1**（3 台で 210kW、1 台は予備）。
# UPS は 250kVA を 2 系統（2N）—— 片系で 184kW を持っても 8 割に収まる。
# **40kW × 2 台の N＋1（使えるのは 40kW）では、この部屋は冷えない** —— 以前の数はそうなっていた。
#
# **ラックの向きが、この図の全部。** 機器は前から冷たい空気を吸って、
# 後ろへ熱い空気を吐く —— だから**前面どうしを向かい合わせ、背面どうしを向かい合わせる。**
# 全部を同じ向きに並べると、前の列が吐いた熱風を次の列が吸うことになり、
# 同じ空調でも後ろの列だけが上がる。
#
# **通路の幅が違うのは、人ではなく空気の都合。** 冷たい側（コールドアイル）は
# 床の穴から吹き上げる量が要るので **1,200**、熱い側は抜けるだけなので **900**。
# 広いほうが前面側だと分かれば、図を見ただけでどちらから保守するかが決まる。
