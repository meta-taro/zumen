<g data-name="note1"><text x="45" y="661" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">インボイスに要る記載事項（国税庁の番号どおり）</text></g>
<g data-name="note2"><text x="45" y="684" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">① 発行事業者の氏名又は名称と登録番号（法人は T ＋ 13 桁の法人番号）</text></g>
<g data-name="note4"><text x="45" y="729" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">③ 取引内容。軽減税率の品目にはその旨（この例は「※」と「※は軽減税率対象」）</text></g>
<g data-name="note5"><text x="45" y="752" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">④ 税率ごとに分けて合計した対価の額（税抜きか税込み）と適用税率</text></g>
<g data-name="note7"><text x="45" y="797" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">⑥ 交付を受ける事業者の氏名又は名称（宛名）</text></g>
<g data-name="note9"><text x="45" y="843" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">様式は法令・通達で決まっていない。名称も問わない（納品書・領収書でもよい）。手書きでもよい</text></g>
<g data-name="note10"><text x="45" y="865" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">端数処理は 1 枚につき税率ごとに 1 回（切捨て・切上げ・四捨五入は任意）。行ごとに処理して足すのは不可</text></g>
<g data-name="note11"><text x="45" y="888" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">　この例の 8％：18,452 × 8％ ＝ 1476.16 → 1,476 円。行ごと（697 ＋ 331 ＋ 447）なら 1,475 円で、違う</text></g>
<g data-name="note12"><text x="45" y="911" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">簡易インボイス（小売・飲食・タクシーなど）は⑥を省ける。⑤は消費税額等か適用税率のどちらかでよい</text></g>
<g data-name="note3"><text x="45" y="706" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">② 取引年月日（1 か月分をまとめて書いてもよい）</text></g>
<g data-name="note6"><text x="45" y="774" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">⑤ 税率ごとに分けた消費税額等</text></g>
<g data-name="hasu"><text x="60" y="542" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">消費税額は税率ごとに 1 回、</text><text x="60" y="556" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">1 円未満を切り捨て</text></g>
<g data-name="seikyu"><text x="431" y="261" text-anchor="end" font-family="sans-serif" font-size="12" fill="#f4f4f6">25,733 円</text></g>
<g data-name="atena"><text x="60" y="161" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">株式会社みほん食堂　御中</text></g>
<g data-name="title"><text x="397" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">請　求　書</text></g>
