title: 壁量計算と 4 分割法（木造 2 階建て）
scale: { mm: 35 }
palette:
  側端: "#3f6f8f"
# **壁はあればいいのではない。**
#
# 必要壁量は**地震力（床面積 × 係数）と風圧力（見付面積 × 50）の大きいほう**。
# 存在壁量は**長さ × 壁倍率**。
#
# そして**足りていても、片側へ寄っていれば通らない** ——
# 4 分割法は、両端の 1/4（側端部分）の充足率を比べ、
# **小さいほう ÷ 大きいほう ≧ 0.5** を求める。③ はその、だめな例。
