version: 1
kind: placement
title: 3 階 避難経路図（収容 90 名）
scale: { mm: 25 }
wall: { mm: 120, outer: 200 }
north: up
# **避難口は、反対側に 2 か所置く**（二方向避難）。
#
# 1 か所がふさがっても、もう 1 か所へ行ける —— 火災は片側で起きるので、
# **同じ側に 2 つ置いても 1 つと同じ**になる。この図では階段を東西の端に離してある。
#
# ## 歩行距離は、壁を回り込んで測る
#
# 21m は直線距離ではなく、**実際に歩く道のり**。
# 消火器の歩行距離 20m と同じ測り方で、消火栓の水平距離 25m とは別
# （見本 119 に、同じ階で 2 つの測り方が並べてある）。
#
# ## EV は避難に使わない
#
# 火災時は停止するので、格子で塗って「避難に使わない」と示してある。
# 階段と EV は**竪穴区画**（令 112 条）—— 煙がいちばん速く上がる道だから、
# 区画して特定防火設備で閉じる（見本 220）。
#
# **防火戸が閉まったあとの経路**は、この図とは変わる（見本 220）。
