palette:
  強め合う: "#c0392b"
  弱め合う: "#1f6fb2"
# **2 つの波源から同じ波を出すと、強め合う線と弱め合う線が双曲線で並ぶ。**
# 水槽（リップルタンク）で 2 本の棒を同じリズムで水面に当てると見える模様である。
# **何のための図か：** 理科の授業で、模様を「見た」だけで終わらせず、**線がなぜそこにあり、何本あるか**まで読めるようにする。
#
# ## 決まり（同位相の 2 波源）
#
# - 強め合う（腹線）: |r₁ − r₂| ＝ mλ（m ＝ 0, 1, 2, …）
# - 弱め合う（節線）: |r₁ − r₂| ＝ (m ＋ ½)λ
# - 距離の差が一定の点の集まりは、**2 つの波源を焦点とする双曲線**（m ＝ 0 だけは垂直二等分線）
# - **三角形の 2 辺の差は残りの 1 辺より小さい**ので |r₁ − r₂| ≦ d。だから強め合う線は |m| ＜ d/λ の整数の数だけ
#
# この図は **d ＝ 2.4λ**。強め合う線は m ＝ 0, ±1, ±2 の 5 本、弱め合う線は ±0.5, ±1.5 の 4 本。
# d/λ をちょうど整数にすると、いちばん外の線が波源を結ぶ直線の外側へ潰れて数えにくいので、整数を避けた。
#
# ## 描き方
#
# 円は**ある瞬間の**山（実線）と谷（破線）。半径は λ ごと（λ ＝ 40px）。
# 強め合う線・弱め合う線は、双曲線 x ＝ ±a cosh t、y ＝ b sinh t（a ＝ δ/2、b² ＝ (d/2)² − a²）を刻んで通した。
# **照らした：** 実線の円どうしの交点（山と山）が赤い線の上に、実線と破線の交点（山と谷）が青い線の上に乗ること。
#
# ## 描かなかったもの（理由）
#
# - **振幅の減衰**: 円い波は遠くへ行くほど弱まる。距離が違う 2 つの波は振幅もずれるので、節線でも完全には 0 にならない。図は理想の形で、表にそう書いた
# - **時間の動き**: 山と谷は外へ広がるが、強め合う線と弱め合う線の位置は動かない。静止画では「動かない」ことだけ言葉で書いた
# - **逆位相の波源**: 強と弱が入れ替わる。表に 1 行だけ
# - **光のヤングの実験**: 同じ式（d sinθ ＝ mλ）で読めるが、別の図にする
#
# 出典（2026-10-06 取得）：
#   OpenStax University Physics Vol.3 §3.1（経路差 Δl ＝ mλ で強め合い、(m＋½)λ で弱め合う）
#   OpenStax Physics §13.3（重ね合わせ、強め合い・弱め合い、定常波の腹と節）
