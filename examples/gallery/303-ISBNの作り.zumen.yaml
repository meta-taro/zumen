title: ISBN の作り（桁数が動くのは、真ん中の 2 つだけ）
# **ISBN-13 は 5 つの部分でできている。**
# **接頭記号**（978 か 979。3 桁）／ **国・地域・言語**（日本は 4。1 桁）／
# **出版者記号** ／ **書名記号** ／ **チェックディジット**（1 桁）。
#
# **桁数が動くのは、真ん中の 2 つだけ。**
# 出版者記号が短いほど書名記号を長く取れるので、
# **たくさん本を出す出版者ほど、短い番号を持つ。** 合計は必ず 13 桁。
#
# **チェックディジットは、1 と 3 の重み付き和から出す。**
# 左から 1・3・1・3… を掛けて 12 個の積を足し、10 で割った余りを 10 から引く
# （**余りが 0 のときだけ答えは 0**。10 ではない）。
#
# 例（978-0-306-40615-7）—— 9+21+8+0+3+0+6+12+0+18+1+15 ＝ **93**。
# 93 ÷ 10 の余りは **3**。10 − 3 ＝ **7** で、いちばん右の桁と合う。
#
# **重みが 1 と 3 なのは、隣どうしの入れ替えを見つけるため。**
# 同じ重みだと 12 と 21 の区別がつかない ——
# 重みが違えば、入れ替えたときに積の合計が変わる。
#
# **それでも完全ではない。** 隣り合う 2 桁の**差が 5**のときだけ、
# 入れ替えても合計が変わらない（重みの差 2 × 差 5 ＝ 10 で、10 の倍数だから余りが動かない）。
# **「検査を通った」は「正しい」ではない。**
