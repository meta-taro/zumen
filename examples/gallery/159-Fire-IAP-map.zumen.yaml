# **A fire map is not a picture of the fire.**
#
# It is where the day is assigned and **where the way out is written**. So the
# line that is not finished is drawn as not finished - solid where it holds,
# dashed where it does not. A map that shows only completed line tells a crew
# the fire is caught.
#
# **LCES is not a poster.** Lookouts, communications, escape routes and safety
# zones are on this sheet, or they do not exist. Divisions are lettered round
# the fire from the anchor point, so a name on the radio is a place on the map.
#
# Every map product carries **STANDL-SGD** - scale, title, author, north arrow,
# date, legend, source, grid, datum. IAP maps are drawn at 1:24,000 and carried
# in a pocket.
#
# The fire, the divisions and the points are fictional.
