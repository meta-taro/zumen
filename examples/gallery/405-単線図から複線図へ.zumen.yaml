# **単線図は「どこに何があるか」、複線図は「電線 1 本ずつ」。** 描き直す手順そのものが、試験の中身。
#
# 決まり（電気技術者試験センターの施工条件、取得 2026-10-24）——
# 電源からの接地側は白、電源から点滅器・コンセントまでの非接地側は黒。
# 白をつなぐ端子は、コンセントの W・ランプレセプタクルの受金ねじ部・引掛シーリングの接地側。
# 電源側の電線との接続はリングスリーブ、ほかは差込形コネクタ（問題ごとに変わる）。
# 回路は架空。実際の試験問題の写しではない。
