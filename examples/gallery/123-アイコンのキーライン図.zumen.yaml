version: 1
kind: placement
arrows: true
title: アイコンのキーライン図（24dp グリッド／Material Design のシステムアイコン）
# **寸法の数字を揃えない。揃えるのは「見えた大きさ」。**
#
# ## キーライン図形
#
# 円は **⌀20**、正方形は **18 × 18**、縦長は **16 × 20**、横長は **20 × 16**。
# **同じ 20 にすると、正方形のほうが大きく見える** ——
# 四隅まで面があるぶん、目には大きく映るため。
#
# ## live area
#
# グリッドは **24 × 24 dp**、中身は **20 × 20 dp の live area** に収める。
# **外周 2dp は、切られても困らない余白。**
#
# ## 揃えるもの
#
# **角丸は外側の角だけ**（内側を丸めると太さが痩せて見える）。
# **線でできた記号はストロークを 2dp で揃える。**
# **三角は面積が小さく見える**ので、キーラインいっぱいまで使う。
#
# **アイコンは 1 つずつ作らない。** キーラインの上で、一式として作る。
