version: 1
kind: placement
arrows: true
title: プロトコルのヘッダは、32 ビット幅で読む
# **幅がビットの数そのもの。** RFC の図が 32 ビット幅なのは、その単位で読むから。
#
# 4 ＋ 4 ＋ 6 ＋ 2 ＋ 16 ＝ 32、16 ＋ 3 ＋ 13 ＝ 32 ——
# **32 で割り切れない並びは出てこない。** 行がそろうように決めてある。
#
# **IHL と Data Offset があるから、うしろにオプションを足せる**
# （ヘッダの長さを、ヘッダ自身が持っている）。
#
# 入れ子にすると **MTU 1500 から IP 20 ＋ TCP 20 を引いた 1460 が MSS**。
# Ethernet の 14 ＋ 4 バイトは MTU の外。
