scale: { mm: 0.9 }
title: ギターのフレット位置（等分するのは、差ではなく比）
# **フレットの間隔は、だんだん狭くなる。**
# 弦長 648mm のとき、ナット〜1 フレットは **36.4mm**、11〜12 フレットは **19.3mm** ——
# **同じ半音でも、長さは半分近くまで縮む。**
#
# **12 フレットがちょうど半分**（**324.0mm**）。弦長が半分になると 1 オクターブ上がり、
# そこから先は**同じ形が半分の大きさで繰り返す。**
#
# **位置は 1 つの式で出る。**
# **n 番目のフレットまでの距離 ＝ 弦長 ×（1 − 2 の −n/12 乗）**
# 648 ×（1 − 2^(−1/12)）＝ **36.4mm**、648 ×（1 − 2^(−12/12)）＝ **324.0mm**。
#
# **等分するのは、差ではなく比。**
# 1 オクターブは周波数が 2 倍。それを半音 12 個で等分するのだから、
# **1 回ぶんは 2 の 1/12 乗 ＝ 1.059463**（12 回かけるとちょうど 2）。
# 音の高さは比で感じるので、**足し算ではなくかけ算で等分する** ——
# フレットの間隔が狭くなるのはそのため。
#
# **昔からの「17.817 で割る」も、同じもの。**
# 残りの弦長を 17.817 で割った所に次のフレットを置く、を繰り返す。
# **17.817 ＝ 1 ÷（1 − 1/1.059463）** で、648 ÷ 17.817 ＝ **36.4mm** ——
# **べき乗を計算せずに同じ位置が出る**、計算尺も電卓も無い時代の書き換え。
#
# 数はすべて計算で確かめた（フレット位置・半音の比・17.817 との一致）。
