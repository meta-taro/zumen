    size: { w: 540, h: 18 }
  - id: c_n5
    label: "飼育水で軽くすすぐ。ウールは別で、目詰まりしたら洗うか換えます。"
    marker: none
    align: left
    at: { x: 690, y: 890 }
    size: { w: 540, h: 18 }
  - id: r1
    label: "ろ過装置は、汚れを消す機械ではありません。 ゴミをこし取り（物理）、溶けた毒を弱いものへ変える（生物）装置です。"
    marker: none
    align: left
    at: { x: 150, y: 930 }
    size: { w: 1080, h: 18 }
  - id: r2
    label: "水が先に当たるのが物理ろ材、後が生物ろ材。 順が逆だと、ゴミが生物ろ材に詰まって水が通らなくなります。"
    marker: none
    align: left
    at: { x: 150, y: 954 }
    size: { w: 1080, h: 18 }
  - id: r3
    label: "生物ろ過の正体はバクテリアです。 アンモニア →（ニトロソモナス）→ 亜硝酸 →（ニトロバクター）→ 硝酸 の 2 段。"
    marker: none
    align: left
    at: { x: 150, y: 978 }
    size: { w: 1080, h: 18 }
  - id: r4
    label: "だから新しい水槽はすぐには効きません。 バクテリアが増えるまで、アンモニアと亜硝酸が先に溜まります。"
    marker: none
    align: left
    at: { x: 150, y: 1002 }
    size: { w: 1080, h: 18 }
  - id: r5
    label: "硝酸はろ過では減りません。 水換えで出すか、水草に吸わせるかの 2 つだけです —— ここがろ過の限界です。"
    marker: none
    align: left
    at: { x: 150, y: 1026 }
    size: { w: 1080, h: 18 }
  - id: r6
    label: "掃除のしかたが逆になります。 ウールはゴミの塊なので洗う。生物ろ材はバクテリアの塊なので、洗いすぎない。"
    marker: none
    align: left
    at: { x: 150, y: 1050 }
    size: { w: 1080, h: 18 }
  - id: r7
    label: "硝化菌は酸素を使うので、止水では死にます。 停電でポンプが止まったら、ろ材を水槽へ戻すのはそのためです。"
    marker: none
    align: left
    at: { x: 150, y: 1074 }
    size: { w: 1080, h: 18 }
