title: 上部式フィルターの断面と、硝化のしくみ
# **ろ過装置は、汚れを消す機械ではない。**
#
# ゴミをこし取り（物理）、溶けた毒を弱いものへ変える（生物）装置。
# **水が先に当たるのが物理ろ材、後が生物ろ材** —— 逆だと生物ろ材が目詰まりする。
#
# アンモニア →（ニトロソモナス）→ 亜硝酸 →（ニトロバクター）→ 硝酸。
# **硝酸はろ過では減らない。** 水換えか、水草に吸わせるかの 2 つだけ。
