version: 1
title: 受注管理のテーブル関係（ER・鳥の足記法）
# **鳥の足（crow's foot）は、線の端の形が「何個つながるか」を言う。**
# 線そのものではなく、**端**を読む図。
#
# | 端の形 | 意味 |
# |---|---|
# | 三またの足 | 多（0 個以上、または 1 個以上） |
# | 縦棒 1 本 | ちょうど 1 |
# | 丸 ＋ 三またの足 | 0 以上（まだ 1 件も無くてよい） |
# | 丸 ＋ 縦棒 | 0 または 1 |
#
# **「0 でもよい」かどうかは、業務のほうから決まる。**
# まだ 1 件も注文していない顧客はいる（顧客 → 受注は **0 以上**）。
# 一度も売れていない商品もある（商品 → 明細も **0 以上**）。
# 受注 1 件に対する出荷は、**まだ無いか 1 回**（0 または 1）——
# **端の形が、その表に何が入り得るかをそのまま言っている。**
#
# ## 受注と受注明細を分けるのは、個数が違うから
#
# 受注 1 件に明細は何行でも付く。**同じ表に入れると、受注の日付が行の数だけ重複する。**
# 表を分ける理由は、たいていこの「個数の違い」にある。
#
# ## 価格を商品から分けるのは、時間があるから
#
# 商品は 1 つでも、価格は時期で変わる。**過去の受注は、そのときの価格で残す。**
