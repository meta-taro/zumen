<g data-name="kouseki"><text x="190" y="174" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">鉄鉱石</text><text x="190" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">酸素とくっついた形</text></g>
<g data-name="sekitan"><text x="190" y="83" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">石炭</text></g>
<g data-name="shoketsu"><text x="425" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">焼結鉱・コークス</text><text x="425" y="107" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">炉に入る形にそろえる</text></g>
<g data-name="bf"><text x="703" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">高炉（高炉法）</text><text x="703" y="107" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">320〜620／620〜950／950℃ 以上</text></g>
<g data-name="yosen"><text x="989" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">溶銑（銑鉄）</text><text x="989" y="107" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">炭素 4% 前後・硬いが割れやすい</text></g>
<g data-name="chutetsu"><text x="1245" y="182" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">鋳鉄・白銑鉄</text><text x="1245" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">成分を調整して鋳型へ</text></g>
<g data-name="scrap"><text x="997" y="295" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">スクラップ（鉄くず）</text></g>
<g data-name="eaf"><text x="1263" y="288" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">電気炉（電炉法）</text><text x="1263" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">鉄鉱石もコークスも要らない</text></g>
<g data-name="bof"><text x="1263" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">転炉（脱炭）</text><text x="1263" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">炭素を 2% 以下へ下げる</text></g>
<g data-name="nishi"><text x="185" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">二次精錬</text><text x="185" y="434" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">成分と温度を合わせる</text></g>
<g data-name="cc"><text x="429" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">連続鋳造</text><text x="429" y="434" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">スラブ・ブルーム・ビレット</text></g>
<g data-name="atsuen"><text x="703" y="423" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">圧延（熱間 → 冷間）</text></g>
<g data-name="kozai"><text x="954" y="423" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">鋼材</text></g>
</svg>