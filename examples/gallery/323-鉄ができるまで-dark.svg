<g data-name="kouseki"><text x="190" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">鉄鉱石</text><text x="190" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">酸素とくっついた形</text></g>
<g data-name="sekitan"><text x="190" y="181" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">石炭</text></g>
<g data-name="shoketsu"><text x="425" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">焼結鉱・コークス</text><text x="425" y="107" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">炉に入る形にそろえる</text></g>
<g data-name="bf"><text x="715" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">高炉（高炉法）</text><text x="715" y="107" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">上から鉄鉱石とコークス、下から熱風</text></g>
<g data-name="yosen"><text x="1008" y="89" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">溶銑（銑鉄）</text><text x="1008" y="107" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">炭素 4〜5%・硬いがもろい</text></g>
<g data-name="chutetsu"><text x="1253" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">鋳鉄・白銑鉄</text><text x="1253" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">成分を調整して鋳型へ</text></g>
<g data-name="scrap"><text x="1005" y="212" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">スクラップ（鉄くず）</text></g>
<g data-name="eaf"><text x="1271" y="288" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">電気炉（電炉法）</text><text x="1271" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">鉄鉱石もコークスも要らない</text></g>
<g data-name="bof"><text x="1271" y="182" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">転炉（脱炭）</text><text x="1271" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">酸素で炭素を燃やして減らす</text></g>
<g data-name="nishi"><text x="185" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">二次精錬</text><text x="185" y="434" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">成分と温度を合わせる</text></g>
<g data-name="cc"><text x="429" y="416" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">連続鋳造</text><text x="429" y="434" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">スラブ・ブルーム・ビレット</text></g>
<g data-name="atsuen"><text x="715" y="423" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">圧延（熱間 → 冷間）</text></g>
<g data-name="kozai"><text x="978" y="423" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">鋼材</text></g>

<g data-name="sources"><a href="https://www.jisf.or.jp/knowledge/manufacture/tenro.html"><text x="20" y="495" font-family="sans-serif" font-size="10" fill="#a0a0ab">出典：日本鉄鋼連盟「鋼をつくる」（2026-10-02 取得）</text></a></g>
</svg>