version: 1
kind: placement
arrows: true
title: 将棋の駒の利き（成ると、4 つが同じ動きになる）
# **成った瞬間に、4 種類の駒が 1 つの動きへまとまる。**
# **成銀・成桂・成香・と金 —— どれも金将と同じ動き。**
# 元は前 2 横 1 で飛び越える桂馬も、前へ何マスでも進む香車も、成れば同じになる。
#
# ## 成らない駒は 2 つだけ
#
# **玉将と金将**。ほかは全部成れる。
#
# ## 飛車と角行は、足される
#
# **竜王（飛車が成る）は、飛車の動きに斜め 1 マスが足される。**
# **竜馬（角行が成る）は、角行の動きに縦横 1 マスが足される。**
# **まとまるのではなく、増える** —— この 2 つだけが例外。
#
# ## 飛び越えられるのは桂馬だけ
#
# 飛車・角行・香車は何マスでも進めるが、**間に駒があるとそこで止まる。**
# **桂馬だけが飛び越えられる**（前 2 マス・横 1 マスの位置へ）。
#
# ## 枚数
#
# 1 人ぶんで計 20 枚 —— 玉将 1・飛車 1・角行 1・金将 2・銀将 2・桂馬 2・香車 2・歩兵 9。
#
# 局面図は見本 67、チェスは見本 68、囲碁の棋譜は見本 66。
