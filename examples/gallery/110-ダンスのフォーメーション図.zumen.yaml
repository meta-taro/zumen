title: ダンスのフォーメーション図（5 人・32 カウント／4 つの形）
# **同じ舞台を、カウントごとに並べる図。** 動きは形の差で読む。
#
# ## 上手と下手は、客席から見た向き
#
# **上手＝客席から見て右、下手＝左。** 舞台に立つと左右が逆になる ——
# 法廷の「右陪席」（見本 99）と同じ引っかけ。
#
# ## 位置はセンター基準
#
# センターを 0 として、上手側 +1 +2、下手側 −1 −2。
# 現場でもこの数え方で指示する。
#
# ## ナナメが強い
#
# **上手奥から下手前への線が、客席からいちばん強く見える。**
# 最後のカウントでそこへ乗せてある。
