version: 1
kind: placement
title: 投票所の配置図（衆議院総選挙・体育館／架空）
# **投票所がややこしいのは、衆議院総選挙で投票が 3 つあるから。**
# 小選挙区・比例代表・最高裁判所裁判官国民審査。
# **交付 → 記載 → 投函を 3 回繰り返す**ので、動線を折り返させると必ず混ざる。
#
# ## だから一方通行にする
#
# 入口から出口まで、**戻らない・交わらない**ように並べる。
# 用紙を取り違えたまま投函すると、**その票は無効になる。**
#
# ## 置く人
#
# | | |
# |---|---|
# | 投票管理者 | 1 名。投票所の責任者 |
# | 投票立会人 | **2 人以上 5 人以下**（期日前は 2 人）。**投票箱が見える位置に座る** |
# | 事務従事者 | 受付・名簿対照・用紙交付 |
#
# **立会人は「見ている」ことが仕事**なので、席の位置そのものが要件になる。
#
# 1 px ＝ 50 mm。出どころ —— 総務省・各市の投票の流れ図ほか。配置と人数は架空。
