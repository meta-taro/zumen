# **インターチェンジの形は、交差する道の種類と、料金所をどこに置くかで決まる。**
# 4 つの型を同じ縮尺（1px＝2m）・同じ向き（本線を横、日本の左側通行）で並べ、
# 「右へ渡る動き」がどこで跨ぎ、どこでループになるかを読めるようにした。
#
# ## 何のための図か
#
# 理解のための図。高速道路の出入口がなぜトランペットの形をしているか、
# 一般道とつなぐ所がなぜダイヤモンドで、なぜ日本にはクローバーが少ないか —— を形で読む。
#
# ## 描き方の決まり
#
# - **左側通行**（道路交通法 第 17 条 4 項）。本線は上の線が東向き（右へ）、下の線が西向き（左へ）。
#   出口は本線の左から分かれ、入口は左から合流する。米国の図を鏡に写しただけでは右側通行の図になるので、
#   **ループの回り方と、どの象限に何が来るかを左側通行で組み直した**
# - **上を通る道を切らずに描き、下を通る道を切る**（平面図の立体交差の描き方）。ランプが本線を跨ぐ所で本線を切った
# - ループは 270° 回って右折の向きへ出る。半径は 28px＝56m（カリフォルニア州の設計便覧のループ 150〜200ft の中ほど）
# - クローバー型は、北東の象限の 1 組（ループ 1 本と外側のランプ 1 本）を 90° ずつ回して 4 象限に置いた。
#   左側通行の 4 回対称は「東向き→南向き→西向き→北向き」で閉じる
# - ダブルトランペット型は、上のトランペットを 180° 回した 2 つ目を一般道の側に置いた（裏返すと右側通行になるので、回した）
#
# ## 一次資料
#
# - 道路構造令 第 28 条：車線 4 以上の普通道路が交差するときは立体交差。交差する道路をつなぐ道路を「連結路」。
#   連結路には第 5〜8 条・第 12・13・15・16 条・第 18〜20 条・第 22・25 条を当てない
# - 道路構造令 第 15 条：本線の曲線半径（設計速度 120→710／570、100→460／380、80→280／230、60→150／120、50→100／80、40→60／50）
# - カリフォルニア州交通局 設計便覧 第 500 章：型は diamond・loop・directional・hook の組み合わせ。
#   diamond は最も単純で費用が小さく、容量はランプ端の交差点で決まる。four-quadrant cloverleaf はループ間の
#   織り込みが短く容量が限られる（一般道とのICでは望ましくない。高速道路どうしなら集散路をつける）。
#   trumpet は交差する道が高速道路で終わるときに使う。ループは半径 150〜200ft、直結は最小 850ft、望ましくは 1,150ft。
#   ランプの設計速度は、端が全部曲がる交差点なら 25mph 以上、出口の分岐端は 50mph 以上
# - 国交省 有料道路課：従来の IC は料金所を集約する（スマート IC は ETC 専用で集約しない）。日本の平均 IC 間隔は約 10km
#
# ## 描かなかったもの
#
# - **実在のインターチェンジの名前と形。** 公式の平面図をなぞらない。型の説明だけの架空の配置
# - **日本の連結路の設計速度と最小曲線半径の表。** 『道路構造令の解説と運用』（日本道路協会）にあるが、
#   手元で一次資料を読めていない。米国の値は「米国の値」と書いて載せた
# - **加減速車線の長さ・テーパー・ノーズの形。** 図の粗さでは読めず、数を確かめていない
# - **ジャンクション（高速道路どうし）の直結型・タービン型。** 4 つの型で「右折をどう処理するか」の違いは言い切れている
#
# ## 計算した所
#
# 第 15 条の表は R＝V²／127(i＋f) の形と合う：100km/h・460m で i＋f＝10000／(127×460)≒0.171。
# 1ft＝0.3048m：150ft＝45.7m、200ft＝61.0m、850ft＝259.1m、1,150ft＝350.5m。25mph＝40.2km/h、50mph＝80.5km/h。
