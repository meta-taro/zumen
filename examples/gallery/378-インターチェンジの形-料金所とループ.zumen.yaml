  - id: n0
    label: "■ 型を決めるもの —— 料金所の数、平面交差を残すか、ループの交通量、用地"
    marker: none
    align: left
    at: { x: 660, y: 640 }
    size: { w: 900, h: 18 }
  - id: n1
    label: "・日本は左側通行（道路交通法 第 17 条 4 項）。出口も入口も本線の左から。右へ渡る動き（右折）が、跨ぐかループになる"
    marker: none
    align: left
    at: { x: 660, y: 664 }
    size: { w: 900, h: 18 }
  - id: n2
    label: "・トランペット型は、ランプが 1 本の道に集まる。料金所を 1 か所に集約できる（国交省：従来の IC は料金所を集約する）"
    marker: none
    align: left
    at: { x: 660, y: 688 }
    size: { w: 900, h: 18 }
  - id: n3
    label: "・ダブルトランペット型は、高速道路と一般道の両方を立体交差にし、あいだの 1 本に料金所を置く形"
    marker: none
    align: left
    at: { x: 660, y: 712 }
    size: { w: 900, h: 18 }
  - id: n4
    label: "・ダイヤモンド型は用地が小さく安いが、ランプの端が一般道との平面交差になる（容量はそこで決まる）"
    marker: none
    align: left
    at: { x: 660, y: 736 }
    size: { w: 900, h: 18 }
  - id: n5
    label: "・クローバー型は全部の動きが信号なしで流れるが、ループの出入口のあいだで車線変更が交錯する（織り込み）"
    marker: none
    align: left
    at: { x: 660, y: 760 }
    size: { w: 900, h: 18 }
  - id: n6
    label: "■ ランプの曲線半径（米国カリフォルニア州の設計便覧の値。1ft＝0.3048m で換算）"
    marker: none
    align: left
    at: { x: 660, y: 784 }
    size: { w: 900, h: 18 }
  - id: n7
    label: "・ループ：半径 150〜200ft（46〜61m）が普通。図のループは R＝28px＝56m"
    marker: none
    align: left
    at: { x: 660, y: 808 }
    size: { w: 900, h: 18 }
  - id: n8
    label: "・直結（ダイレクト）ランプ：最小 850ft（259m）、交通運用上は 1,150ft（351m）以上が望ましい"
    marker: none
    align: left
    at: { x: 660, y: 832 }
    size: { w: 900, h: 18 }
  - id: n9
    label: "・ランプの設計速度：端が全部曲がる交差点なら 25mph（40km/h）以上、出口の分岐点では 50mph（80km/h）以上"
    marker: none
    align: left
    at: { x: 660, y: 856 }
    size: { w: 900, h: 18 }
  - id: n10
    label: "■ 日本の道路構造令"
    marker: none
    align: left
    at: { x: 660, y: 880 }
    size: { w: 900, h: 18 }
  - id: n11
    label: "・車線 4 以上の道路どうしは立体交差（第 28 条 1 項）。つなぐ道を「連結路」と呼ぶ（同 3 項）"
    marker: none
    align: left
    at: { x: 660, y: 904 }
    size: { w: 900, h: 18 }
  - id: n12
    label: "・連結路には第 15 条（曲線半径）・第 16 条（片勾配）などを当てない（同 4 項）。値は別の運用で決める"
    marker: none
    align: left
    at: { x: 660, y: 928 }
    size: { w: 900, h: 18 }
  - id: n13
    label: "・本線の曲線半径（第 15 条）：設計速度 120km/h→710m（特例 570）、100→460（380）、80→280（230）、60→150（120）"
    marker: none
    align: left
    at: { x: 660, y: 952 }
    size: { w: 900, h: 18 }
  - id: n14
    label: "・どれも遠心力の釣り合い R＝V²／127(i＋f) の形（i 片勾配、f 横すべり摩擦）。100km/h・460m なら i＋f≒0.17（計算）"
    marker: none
    align: left
    at: { x: 660, y: 976 }
    size: { w: 900, h: 18 }
  - id: scale
    label: "縮尺：1px＝2m（ループの半径だけを合わせた。ランプの長さ・本線との間隔は模式）。▶ は本線の進む向き"
    marker: none
    align: left
    at: { x: 70, y: 556 }
    size: { w: 900, h: 18 }
