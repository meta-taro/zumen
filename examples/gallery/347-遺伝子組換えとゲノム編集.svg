<g data-name="g_b1"><text x="280" y="187" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">もとの DNA</text></g>
<g data-name="e_b3"><text x="759" y="411" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">もとの DNA</text></g>
<g data-name="g_b2"><rect x="447" y="176" width="86" height="15" fill="#ffffff"/><text x="490" y="187" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">入れた遺伝子</text></g>
<g data-name="e_cut"><text x="562" y="353" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">↑ ここを切る（入れない）</text></g>
