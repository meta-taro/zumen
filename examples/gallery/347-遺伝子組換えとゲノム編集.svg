<g data-name="t1"><text x="150" y="74" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">① 遺伝子組換え —— 別の生物の遺伝子を入れる</text></g>
<g data-name="t2"><text x="150" y="268" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">② ゲノム編集（切って終わる型・SDN-1）—— 自分の配列を切る</text></g>
<g data-name="g_ar"><text x="510" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">↓ 入れる</text></g>
<g data-name="g_n"><text x="150" y="221" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">外来遺伝子が残る → カルタヘナ法の対象 ／ 安全性審査 ／ 表示義務あり</text></g>
<g data-name="e_ar"><text x="510" y="377" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">↓ 切れた跡が、細胞自身の修復で閉じる</text></g>
<g data-name="e_n"><text x="150" y="445" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">外来遺伝子は残らない → カルタヘナ法の対象外 ／ 届出 ／ 表示義務なし</text></g>
<g data-name="e_n2"><text x="150" y="467" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">跡は数塩基の欠失や置換。自然に起きる突然変異と区別できない。</text></g>
<g data-name="g_b3"><text x="720" y="187" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">もとの DNA</text></g>
