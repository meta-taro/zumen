  色素: "#8f5a3a"
# **昆虫の複眼は、六角のレンズを持つ小さな目（個眼）の集まり。** 個眼 1 つの中で、光は角膜レンズ → 円錐晶体 → 感桿と進む。
# その先で、**光を 1 つのレンズからだけ受ける「連立像眼」**と、**たくさんのレンズから 1 か所へ集める「重複像眼」**に分かれる。
# **何のための図か：** 「虫の目はたくさんの目の集まり」で止まらず、1 つの個眼の中身と、昼と夜で目の作りが違う理由まで読めるようにする。
#
# ## 決まり（照らしたもの）
#
# - 個眼の断面はふつう六角（en.wikipedia「Ommatidium」）
# - **角膜と円錐晶体は円錐細胞が作る**（Lu & Kronforst 2026）。円錐細胞は 4 つ（en.wikipedia「Ommatidium」）
# - **一次色素細胞は円錐を包み、二次色素細胞は円錐の下半分から基底膜までを包んで、隣の個眼からの光を遮る**（Lu & Kronforst 2026。モンシロチョウの記述）
# - 典型的な昆虫の個眼の視細胞は 8 個（ショウジョウバエ R1〜R8）。チョウでは底のほうにだけある 9 個目（R9）がある（同上）
# - **連立像眼では、各個眼は色素で光学的に仕切られ、決まった角度の光だけが感桿に届く**（同上 図 1）。連立像眼の例にハチ・アリ・チョウ・ハエ（Stöckl ほか 2022）
# - **重複像眼では、レンズと感桿の間に色素の無い明帯があり、いくつもの個眼の光が明帯を通って 1 本の感桿に集まる**（同上。Exner 1891 を引く）
# - **重複像眼は夜の虫に多いが、昼の例外がある**。ホシホウジャク（Macroglossum stellatarum）は昼に飛ぶ重複像眼で、**明るさは 1 つのレンズの約 200 倍**（Stöckl ほか 2022）。ガと甲虫の多くが重複像眼（同上）
# - 大型のトンボ（不均翅亜目）の個眼は最大 約 30,000（Cezário ほか 2025。en.wikipedia「Ommatidium」も同じ値）
# - ショウジョウバエ 760（en.wikipedia「Drosophila melanogaster」）。シミの仲間（総尾目 Zygentoma）は「ほんの数個」（en.wikipedia「Ommatidium」）
#
# ## 描き方
#
# ① は六角を並べただけの模式で、大きさは実物どおりではない（個眼の直径は種と目の場所で大きく違う）。
# ② は連立像眼 1 つの縦断面。A–A の輪切りは**融合した感桿**（視細胞の光を受ける部分が 1 本にまとまる型）で描いた。
# ③ は**光の通り道を言うための模式**。個眼の角度・数・深さは実物の比ではない。重複像眼の光は、レンズと円錐で曲がる所を 1 本の直線で代用した。
#
# ## 描かなかったもの（理由）
#
# - **ハエの神経重複像眼**: 光学的には連立像眼の一種で、視細胞ごとの感桿が分かれ、神経のつなぎ方で像を重ねる。別の図にする
# - **トンボの目の上と下の違い**: 上の個眼は空を背にした獲物を見るのに特化し、偏光を感じる縁の帯もある。1 枚に入れると個眼の図が埋もれる
# - **紫外線の色覚**: 見本 375（波長の物差し）にハチの見える範囲を書いた
# - **個眼の直径の数値**: 一次資料で種ごとの値を確かめていないので、数を書いていない
#
# 出典（2026-10-06 取得）：
#   Lu & Kronforst (2026) J Comp Physiol A, doi:10.1007/s00359-025-01751-8
#   Stöckl ほか (2022) Proc R Soc B, doi:10.1098/rspb.2022.0758
#   Cezário ほか (2025) Naturwissenschaften, doi:10.1007/s00114-025-01959-3
#   en.wikipedia「Ommatidium」「Drosophila melanogaster」
