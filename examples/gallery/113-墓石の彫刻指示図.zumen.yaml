title: 墓石の彫刻指示図（和型三段・8 寸角／架空の家）
scale: { mm: 3 }
# **石材店が現場と工場へ出す指図。** どこに、何を、どの書体で、どう彫るか。
#
# ## 彫る場所は決まっている
#
# **棹石の正面**は家名か宗派の言葉。**右側面**は亡くなった人（戒名・没年月日・
# 俗名・行年）、**左側面**は建てた人と建立年月。**家紋は水鉢**が多い。
#
# 人数が増えると棹石の側面では足りなくなるので、**墓誌（霊標）**へ移す。
#
# ## 朱入れ
#
# **存命の人の名は朱を入れる**（長寿を祈る）。**亡くなったら朱を抜く。**
# 図面に「朱」と書いておかないと、彫ったあとで直せない。
#
# ## 追加彫刻は、既にあるものに合わせる
#
# 書体・字の高さ・彫り方を既存に合わせないと、同じ石の上で揃わない。
# **だから図面に書体と字の高さを書く。**
