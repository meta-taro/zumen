<g data-node="n0" data-pinned="false" data-shape="rect"><text x="104" y="525" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・かぶり厚さは、コンクリート表面からいちばん外側の鉄筋の表面まで。梁ではあばら筋の外面</text></g>
<g data-node="n1" data-pinned="false" data-shape="rect"><text x="104" y="547" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・あばら筋は端部で詰める（@100）。せん断力は端で大きく、中央では小さい</text></g>
<g data-node="n2" data-pinned="false" data-shape="rect"><text x="104" y="569" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・40d は径の 40 倍。D22 なら 880 mm。定着と重ね継手で使う</text></g>
<g data-node="n3" data-pinned="false" data-shape="rect"><text x="104" y="591" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・断面と側面で縮尺が違う。同じ梁でも、見せたいものが違えば細かさも違う</text></g>
