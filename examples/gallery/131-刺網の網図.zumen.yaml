version: 1
kind: placement
arrows: false
title: 刺網の網図（仕立て図・縮結 30%／架空の一反）
# **網は「縮めて仕立てる」。** 縮めないと目が開かず、網が縦に拡がらない。
# その縮め具合を **縮結（いせ）** といい、漁具の設計でいちばん基本の数字とされる。
#
# > **縮結 ＝（元の網地長さ − 仕立上げの長さ）／ 元の網地長さ**
#
# ## この図が言っていること
#
# **同じ網地が、仕立てると短く・縦に開く。** だから上下 2 枚を並べてある（views）。
# 30 m の網地を 21 m の綱に付ける（縮結 30%）と、
# 目が菱形に開いて**丈が 6 m → 4.28 m** になる。
# 縦の比は √(1 − 0.7²) ＝ 0.714 —— **横に縮めた分だけ、縦に開く。**
#
# ## 網図に書くもの
#
# | | |
# |---|---|
# | 目合（めあい） | 目の大きさ。**節**（15.15 cm の中の節数）か、伸ばした目の長さ |
# | 掛目（かけめ） | 丈の方向の目の数 |
# | 縮結 | 綱に付けるときの縮め率。**浮子方と沈子方で違う** |
# | あば綱 / いわ綱 | 浮子綱・沈子綱。**刺網では沈子綱を 3〜10% 長くする** |
#
# まき網では浮子方 30%・岩方 20% ほど（網地 500 間に対し、浮子方 350 間・岩方 400 間）。
#
# 1 px ＝ 50 mm。目合・掛目・寸法はすべて架空の一反。

scale: { mm: 50 }
views:
  - id: flat
    title: 仕立て前（網地を伸ばした状態）
    at: { x: 60, y: 130 }
    size: { w: 600, h: 120 }
    scale: { mm: 50 }
    grid:
      x:
        - { id: A, at: 60 }
        - { id: B, at: 660 }
      y:
        - { id: 上, at: 130 }
        - { id: 下, at: 250 }
  - id: rigged
    title: 仕立て後（縮結 30%。目が菱形に開く）
    at: { x: 60, y: 450 }
    size: { w: 420, h: 86 }
    scale: { mm: 50 }
    grid:
      x:
        - { id: C, at: 60 }
        - { id: D, at: 480 }
      y:
        - { id: あば, at: 450 }
        - { id: いわ, at: 536 }
