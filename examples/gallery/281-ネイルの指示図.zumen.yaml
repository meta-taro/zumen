title: ネイルの指示図（10 本は、同じデザインの 10 個ではない）
# **10 本は、同じデザインの 10 個ではない。**
# 幅も長さも指ごとに違うので、**同じ絵柄でも入る大きさが変わる** ——
# 小指（幅 6〜7mm）に、親指（12〜16mm）と同じ絵は入らない。指示図が 10 本ぶん要るのはそのため。
#
# **チップの番号は、小さいほど幅が広い**（服や靴と逆）。**0 が親指用、8〜9 が小指用。**
# 横幅は形でも変わり、ベリーショートなら 0 番 12mm 〜 9 番 6mm、
# オーバルなら 0 番 14mm 〜 9 番 7mm、ショートオーバルなら 0 番 16.5mm 〜 9 番 7.5mm。
# **同じ「5 番」でも、形が変われば幅が違う** ——
# ブランドで番号の振り方も違うので、**そのブランドの表で確かめる。**
# 親指から **2・5・4・6・8** が標準的な組み合わせだが、自分の爪で測り直す。
#
# **削って小さくはできるが、大きくはできない。** 迷ったら大きめを選ぶのは、
# **片方向にしか直せない**から —— 紙の型紙（見本 176・177）と同じ考え方。
#
# **「全部同じ感じで」は指示になっていない。**
# 10 本のうち何本が同じで、どの指だけ変えるのかを書く。
# **色は品番で書く** —— 色名は店と人で指すものが違う。
