title: 市道 3 号線 平面線形図（No.0 〜 No.9・W=8,800）
# 道路の平面線形。**曲がっていること自体が内容**なので、直角では代用できない。
# 道路中心線は一点鎖線、車道端（幅員線）は実線で描く（国土交通省「CAD 製図基準」
#   令和 7 年 12 月版の道路平面図のレイヤ：道路中心線＝構造物基準線・一点鎖線。
#   https://www.cals-ed.go.jp/mg/wp-content/uploads/cad8.pdf 取得 2026-10-02）。
# 同じ基準の平面図の記載事項 —— 道路中心線、曲線の起終点（BC・EC）、IP の位置と
#   曲線半径 R・接線長 TL・曲線長 CL・交角 IA、道路幅員線 —— を図に入れてある。
# IP へ向かう接線は、車道端の外側だけを細線で描いた（道路の中は中心線と重なるため）。
# 測点は 20m ごとで、中心線を横切る短い線が測点の位置。
# 曲線は IP.1 の単曲線 1 つ（R=200m、交角 IA=37°47′）で、
# 接線長 TL＝R·tan(IA/2)＝68.4m、曲線長 CL＝R·IA＝131.9m。BC は No.1＋10.0（30m）なので
# EC は 30＋131.9＝161.9m＝No.8＋1.9。IP は BC と EC から接線を TL だけ延ばした交点。
# 図は 1m＝4.5px で、R・接線・測点の間隔もこの縮尺で計算して描いてある。
