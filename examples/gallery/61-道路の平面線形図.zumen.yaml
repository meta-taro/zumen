# 道路の平面線形。**曲がっていること自体が内容**なので、直角では代用できない。
# 中心線と両側の車道端を via（通り道）で通し、curve: smooth で丸めている。
# 車道端の始まりと終わりにも点を置く —— 置かないと、端で道幅が絞れて見える。
# 測点は 20m ごと。曲線は IP.1 の単曲線 1 つ（R=200m、交角 I=37°47′）で、
# 接線長 TL＝R·tan(I/2)＝68.4m、曲線長 CL＝R·I＝131.9m。BC は No.1＋10.0（30m）なので
# EC は 30＋131.9＝161.9m＝No.8＋1.9。図は 1m＝4.5px で、R も測点の間隔もこの縮尺で描いてある。
