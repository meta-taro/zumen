version: 1
kind: placement
arrows: true
title: データセンターの気流（通路を分けるのは、熱気を吸わせないため）
# **ラックを全部同じ向きに並べると、前の列が出した熱気を次の列が吸い込む。**
# だから**1 列おきに向きを返して**、前面どうしの通路（コールドアイル）と
# 背面どうしの通路（ホットアイル）を作る。
#
# ## 冷気の道
#
# 空調機（CRAC）が**床下（フリーアクセスフロア）**へ冷気を送り、
# **コールドアイルの穴あきパネル**から上がって、両側のラックの**前面**から吸い込まれる。
# 背面から出た熱気は**ホットアイル**を通って天井へ戻る。
#
# ## 分けないと何が起きるか
#
# **吸気温度が上がる。** 同じ風量では冷えないので空調をさらに回すことになり、
# **PUE が上がる。** 通路を分けるのは、風量を増やさずに吸気温度を下げるための置き方。
#
# ## 数
#
# **空冷で冷やせるのは 1 ラックあたり 15kW まで。** それ以上は水を使う話になる。
#
# **PUE ＝ データセンター全体の消費電力 ÷ IT 機器の消費電力。**
# **低いほど効率がよく、1.0 が理論上の最良。最新のもので約 1.2** と見られている。
#
# 寒い土地では外気をそのまま使える。ある事例では**空調コストを約 4 割**減らせるとしている。
#
# 電力の系統は見本 241、ラックと 1U は見本 235、PoE は見本 236。
