version: 1
kind: placement
arrows: true
title: 時計の針の角度（3 時 15 分に、針は重ならない）
# **3 時 15 分に、長針と短針は重ならない。**
# 分針が 90 度（3 の位置）まで来るあいだに、**時針も 7.5 度ぶん進んでいる。**
# 3 時ちょうどの差は 90 度、3 時 15 分の差は **7.5 度。**
#
# **角度は 1 つの式で出る。**
# **2 つの針の角度 ＝ |30H − 5.5M|**（H は時、M は分。180 度を超えたら 360 から引く）。
# 時針は 1 分に **0.5 度**、分針は 1 分に **6 度** —— 差は 1 分に **5.5 度。**
# 3 時 15 分なら |30 × 3 − 5.5 × 15| ＝ |90 − 82.5| ＝ **7.5 度。**
#
# **12 時間で重なるのは、12 回ではなく 11 回。**
# 分針は 12 時間で **12 周**、時針は **1 周** —— 差は **11 周ぶん**で、
# **分針が時針を 1 周ぶん追い越すたびに 1 回重なる。**
# だから **12 ÷ 11 時間ごと**（約 1 時間 5 分 27 秒）に重なり、**11 時台だけ重ならない。**
#
# **直角になるのは 22 回。** 追い越し 1 回につき、**追いつく前に 1 回、追い越してから 1 回。**
# 一直線（180 度）になるのも 11 回。
#
# 数はすべて計算で確かめた（重なる時刻・角度・回数）。見本 303・308・310 と同じやり方。
