title: サッカーボールの形（切頂二十面体）
# **頂点に集まる角は 348°。360° に 12° 足りない。**
#
# その 12° が、平面を球にする。頂点は 60 個なので 12 × 60 ＝ 720°
# —— ちょうど球ひとつ分。
