palette:
  緑: "#0f7a3d"
  紅: "#c0392b"
title: 航海灯（見える色だけで、相手の向きが決まる）
# **夜の海では、相手の船の形は見えない。見えるのは灯火の色だけ。**
# だから**色の組み合わせだけで向きが決まる**ように、範囲が切ってある。
#
# ## 範囲
#
# **右舷灯（緑）と左舷灯（紅）は、それぞれ真正面から 112.5°** ——
# 真横（90°）から**2 点（22.5°）後ろまで。**
# **船尾灯（白）は後方 135°。**
# **112.5 × 2 ＋ 135 ＝ 360°** で、ちょうど 1 周になる。
#
# **マスト灯（白）は 225°** で、これは**舷灯 2 つを合わせた範囲と同じ。**
# 動力船は、前のマスト灯が見えない角度から見えるように、**後部マスト灯をもう 1 つ**置く。
#
# ## 読み方
#
# **緑だけ**が見えれば、相手の右舷を見ている —— 相手は自分から見て右へ進む。
# **紅だけ**なら左へ。**紅と緑の両方**が見えたら、**向かい合っている。**
# **白（船尾灯）だけ**なら、自分は相手の後ろにいる —— **追い越す側は自分。**
#
# **どの向きから見ても、答えがひとつに決まる。** 範囲が重ならないのは、そのため。
#
# 小さい船は全周灯（360°）でまとめることがある。
# 船の一般配置図は見本 126、海図の読み方は見本 223。
