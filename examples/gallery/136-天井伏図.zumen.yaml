version: 1
kind: placement
arrows: false
title: 天井伏図（事務室・システム天井 600 角／架空）
# **見上げるものを、見下ろして描く。** それが「伏図」。
# 天井を下から見上げた形をそのまま描くと左右が反転するので、
# **床を見下ろすのと同じ向き**で描き、天井を透かして見た形にする。
#
# ## 描く時期が決まっている
#
# **天井スラブのコンクリートを打つ前に描く。**
# 吊りボルトを留めるインサートを、打設前にスラブへ仕込むため。
# **打ってしまえば入れられない**（見本 134 の配筋図と同じで、打設前が最後の時）。
#
# ## 照明は 1 : 2 : 1
#
# **壁から器具まで：器具どうし：器具から壁 ＝ 1 : 2 : 1** に置く。
# 端が暗くなるのを防ぐ決め方で、
# 7,200 なら 1,800 / 3,600 / 1,800。5,400 なら 900 / 1,800 / 1,800 / 900。
# **天井板の目地か芯に合わせる** —— 割付を崩すと、板を切ることになる。
#
# ## 離隔
#
# | | |
# |---|---|
# | 煙感知器 ← 空調の吹出口 | **1,500 以上** |
# | 煙感知器 ← 壁 | **600 以上** |
# | スプリンクラー | 散水の障害が無いこと |
#
# ## 記号
#
# `CH` ＝ 天井高（`CH=2,600`）／`FL` ＝ 仕上げ床／
# `LGS` ＝ 軽量形鋼の下地／`PB` ＝ プラスターボード
#
# 1 px ＝ 15 mm。寸法・器具はすべて架空。
scale: { mm: 15 }
# 通り芯は**天井の伏図の中だけ**。views で囲っておかないと、
# 芯が紙の端まで伸びて、注記と仕様表の文字を貫く。
views:
  - id: plan
    at: { x: 60, y: 60 }
    size: { w: 480, h: 360 }
    grid:
      x:
        - { id: X1, at: 60 }
        - { id: X2, at: 180 }
        - { id: X3, at: 420 }
        - { id: X4, at: 540 }
