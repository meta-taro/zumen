title: 緊急地震速報（猶予は「残り」でしかない）
# **速報は地震を予知していない。速い波と遅い波の差を借りているだけ。**
#
# P 波は**秒速約 7 キロ**、S 波は**秒速約 4 キロ**（気象庁「緊急地震速報の仕組み」）。**1 秒あたり約 3 キロの差**で離れていく。
# 先に届く P 波を捕まえて、あとから来る S 波より先に知らせる —— それが全部。
#
# ## 引かれる分は、震源が近くても遠くても同じ
#
# 震源に近い観測点で P 波を**捉え**、震源と規模を推定する。
# そこに**解析と伝達の数秒程度**が乗る（気象庁「緊急地震速報の特性や限界」）。
# （以前は「P 波到達後 3 秒」「処理に数秒〜数十秒」と書いていた。3 秒は出典で確かめられず、
# 「数秒〜数十秒」は処理時間ではなく**発表から強い揺れまでの時間**だった。2026-09-29 に直した。）
# **この合計は、震源までの距離と関係なく引かれる。**
#
# ## だから、近いほど残らない
#
# 海溝型のように震源が遠ければ、借りられる差が大きいので
# **猶予は数秒から数十秒**になる。
#
# **陸地の浅い直下型では、激しく揺れる震央付近で原理上数秒しか猶予がないか、
# あるいは間に合わない。**
# これは装置が遅いからではなく、**借りる差がそもそも無いから。**
#
# ## 出す基準
#
# **警報は最大予測震度 5 弱以上**のとき。**予測震度 4 以上の地域**へ伝える。
# 警報は最低限の情報、予報はより豊富な情報を出す。
#
# **帯の長さは模式。** 目盛りを打っていないのは、各段の秒数が出典に無いから ——
# 確かなのは「解析と伝達に数秒程度」「猶予は数秒から長くても数十秒」「P 波 約 7 km/s・S 波 約 4 km/s」だけで、
# **この図が言いたいのは長さではなく、引かれる分が先にあるという順番。**
#
# 出典: 気象庁「緊急地震速報の仕組み」「緊急地震速報の特性や限界」「緊急地震速報とは」（取得 2026-09-29）。
#
# 震度とマグニチュードの違いは見本 315、避難の判定は見本 221。
