<g data-name="a352"><text x="775" y="367" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">N 89°45'00&quot; E</text></g>
<g data-name="a374"><text x="775" y="389" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Never over 90</text></g>
<g data-name="a396"><text x="775" y="411" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">Degrees below</text></g>
