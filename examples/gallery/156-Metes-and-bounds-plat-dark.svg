<g data-name="n1"><text x="60" y="713" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">A deed does not draw the land. It describes a walk: start at the POB and take each call in turn.</text></g>
<g data-name="nL"><text x="60" y="735" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">The lines carry only L1 to L5; the calls are in the line table, as on a real plat.</text></g>
<g data-name="n2"><text x="60" y="757" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">The drawing is the check on the words - if the walk does not come back to the POB, the description is broken.</text></g>
<g data-name="n3"><text x="60" y="779" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">This one closes to 0.04 ft in 892.90 ft, so 1 : 20,143. A field traverse never closes at zero.</text></g>
<g data-name="n4"><text x="60" y="801" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">Bearings, distances and monuments are fictional; a licensed surveyor decides them.</text></g>
<g data-name="h60"><text x="930" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">LINE TABLE  (what the deed says)</text></g>
<g data-name="h206"><text x="930" y="221" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">WHAT THE WALK GIVES BACK</text></g>
<g data-name="h330"><text x="930" y="345" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">HOW A BEARING IS READ</text></g>
<g data-name="h454"><text x="930" y="469" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">MONUMENTS</text></g>
<g data-name="h556"><text x="930" y="571" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">BASIS OF BEARING</text></g>
<g data-name="b82"><text x="856" y="97" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">thence N 89°45'00&quot; E, 210.00 feet</text></g>
<g data-name="b104"><text x="856" y="119" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">thence S 00°15'00&quot; E, 190.00 feet</text></g>
<g data-name="b126"><text x="856" y="141" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">thence S 45°30'00&quot; W, 95.50 feet</text></g>
<g data-name="b148"><text x="856" y="163" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">thence N 89°45'00&quot; W, 142.00 feet</text></g>
<g data-name="b170"><text x="856" y="185" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">thence N 00°09'00&quot; W, 255.40 feet</text></g>
<g data-name="b228"><text x="856" y="243" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">892.90 feet</text></g>
<g data-name="b250"><text x="856" y="265" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">51,579 sq ft, 1.184 acres</text></g>
<g data-name="b272"><text x="856" y="287" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">0.04 feet</text></g>
<g data-name="b294"><text x="856" y="309" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">1 : 20,143</text></g>
<g data-name="b352"><text x="856" y="367" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">face north, turn 89 deg 45 min toward east</text></g>
<g data-name="b374"><text x="856" y="389" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">the quadrant carries the rest</text></g>
<g data-name="b396"><text x="856" y="411" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">minutes, then seconds - 60 to each</text></g>
<g data-name="b418"><text x="856" y="433" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">the call carries R, L, delta, CB, CH</text></g>
<g data-name="b476"><text x="856" y="491" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">iron pin found - it was already there</text></g>
<g data-name="b498"><text x="856" y="513" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">iron pin set - the surveyor put it there</text></g>
<g data-name="b520"><text x="856" y="535" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">a called monument beats the measurement</text></g>
<g data-name="b578"><text x="856" y="593" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">assumed; the north line of the plat</text></g>
<g data-name="b600"><text x="856" y="615" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">the same corner reads differently</text></g>
<g data-name="b622"><text x="856" y="637" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">under a different basis</text></g>
<g data-name="lot"><text x="348" y="369" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">LOT 7   51,579 sq ft   1.184 acres</text></g>
<g data-name="road"><text x="340" y="215" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">ROAD  (60 ft right of way)</text></g>
<g data-name="a82"><text x="775" y="97" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">L1</text></g>
<g data-name="a104"><text x="775" y="119" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">L2</text></g>
