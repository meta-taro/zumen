version: 1
kind: placement
arrows: true
title: 罹災証明の住家被害認定 —— どこから測るか
scale: { mm: 20 }
# **ハザードマップは地面から、罹災証明は床から測る。**
#
# 区分は損害割合 1 つで決まる（全壊 50%／大規模半壊 40%／中規模半壊 30%／
# 半壊 20%／準半壊 10%）。水害では浸水深がそのまま区分になり、
# **床上 1.8m 以上で全壊**（外壁や建具が一定の被害を受けた一戸建て木造）。
#
# **0.1m 違うと区分が変わる。** 床が地面より 0.4m 高い家なら、
# 地面から 0.9m の水が「床上 0.5m」—— 中規模半壊の境目にちょうど乗る。
#
# 出典は内閣府「災害に係る住家の被害認定基準運用指針」。
