version: 1
direction: down
wrap: false
title: 本が読者に届くまで（売れ残りが、逆向きに戻ってくる）
# **本の流通がほかの商品と違うのは、売れ残りが戻ってくるから。**
# 書店は本を**買い取っていない** —— **委託販売**なので、売れなければ取次へ返し、
# 取次は出版社へ返す。**モノが下へ行き、返品が上へ戻る二重の流れ**が、この図の中身。
#
# **明治の末、雑誌の返品制（売れ残りを引き取る売り方）が広まったのが始まりとされる。**
# （特定の年と社名は、一次資料で確かめていないので書かない。）
# 書店から見れば、**在庫を抱える危険を負わずに棚を作れる**ということ。
#
# **1953 年（昭和 28 年）の独占禁止法改正で再販売価格維持の適用除外ができ、
# 書籍・雑誌・新聞・レコード盤の定価販売の慣行が追認された。**
# 出典：公正取引委員会「著作物再販制度の取扱いについて」（平成 13 年 3 月 23 日）
# https://www.jftc.go.jp/hourei_files/chosakuken.pdf （2026-10-02 照合）。
# 値引きで競争しない代わりに、**流通の効率化が進みにくい**という指摘が付いて回る。
#
# **取次は、ただの問屋ではない。**
# 書店からの代金回収を繰り延べ、出版社へは委託販売の代金を**見込みで先に払う** ——
# **実質的に金融の役目**を担っている。だから「取次が倒れると出版社が資金繰りで倒れる」
# という言われ方をする。
#
# **いまは直取引が増えている。** 大手出版社の一部が、ネット書店と
# 取次を通さない取引を始めている ——
# 図の真ん中を飛ばす線が太くなっていく、ということ。
nodes:
  - id: shuppan
    type: generic
    label: 出版社
    technology: 作って、取次へ預ける
  - id: toritsugi
    type: generic
    label: 取次
    technology: 問屋であり、金融でもある
  - id: shoten
    type: generic
    label: 書店
    technology: 買い取っていない（委託）
  - id: net
    type: generic
    label: ネット書店
    technology: 直取引が増えている
  - id: dokusha
    type: generic
    label: 読者
    technology: 定価で買う
  - id: henpin
    type: storage
    label: 返品
    technology: 取次を通って出版社へ戻る
edges:
  # 同じ 2 点の間に辺を 2 本書くと、名前（from>to）が同じになって 1 本として重なる。
  # 委託の行きと返品の戻りは、両向きの 1 本で描く
  - from: shuppan
    to: toritsugi
    label: 委託 ⇄ 返品
    ends: { from: arrow, to: arrow }
  - from: toritsugi
    to: shoten
    label: 配本
  - from: shoten
    to: dokusha
    label: 定価で売る（再販制度）
  - from: shuppan
    to: net
    line: dashed
    label: 直取引
  - from: net
    to: dokusha
  - from: shoten
    to: henpin
    line: dashed
    label: 売れなければ
  # **返品の逆流。** 返品 → 取次 → 出版社 の向きで書くと輪ができ、自動配置が
  # 出版社を図の下へ回してしまう。辺は順向きに書き、矢じりを戻る側（from）に付ける。
  - from: toritsugi
    to: henpin
    line: dashed
    ends: { from: arrow, to: none }
