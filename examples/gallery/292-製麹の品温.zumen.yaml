version: 1
kind: placement
arrows: true
title: 製麹の品温（時計ではなく、温度で次へ進む）
# **製麹は、2 日かけて品温を登らせる作業。**
# 引込（蒸米を麹室へ入れる。約 35℃）→ 種切り・床もみ（麹菌をふる。約 32℃）→
# **切り返し**（床もみから 10〜12 時間。32〜34℃）→ **盛**（12〜14 時間。約 35℃）→
# **仲仕事**（盛から 6〜8 時間。35〜37℃）→ **仕舞仕事**（さらに 4〜6 時間。38〜40℃）→
# **出麹**（さらに 8〜12 時間。**最高 40〜43℃**）。
#
# **全体でおよそ 48 時間**だが、蔵と麹の種類で **30〜50 時間**の幅がある ——
# **時計ではなく品温で次へ進む**ので、図の横軸は目安でしかない。
#
# **手を 3 回入れる理由。** 菌糸が増えるほど麹は自分で発熱する。
# 放っておくと中心が熱く外が冷たくなるので、
# **切り返し・仲仕事・仕舞仕事**でほぐし、広げ、温度と湿気を揃え、酸素を入れる。
# **発熱は止められないので、手を入れる回数で温度を作る** —— 登り方そのものが麹の設計図。
#
# **菌糸が米のどこまで入るかで、味が変わる。**
# **総破精**（そうはぜ）は米粒ぜんたいに菌糸が入り、酵素の力が強く**濃醇でコクのある味**。
# **突き破精**（つきはぜ）は点々と深く入り、酵素の力は中くらいで**すっきりと上品な味**。
#
# **麹は原料ではなく、道具に近い。** 総米のおよそ **20%** を麹米に回す
# （特定名称酒では**こうじ米 15% 以上**と決まっている。清酒の製法品質表示基準）。
# 残りは掛米で、蒸すだけ。
#
# **見本 287（日本酒の三段仕込み）と対。** あちらは仕込みの並び、こちらはその前の 2 日間。
