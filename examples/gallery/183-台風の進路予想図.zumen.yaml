version: 1
kind: placement
arrows: true
title: 台風の進路予想図（予報円と暴風警戒域・架空）
# **予報円は「中心が入る確率 70%」の範囲。** 台風が円に収まる意味ではない。
#
# **暴風警戒域は、予報円を暴風域の半径ぶん太らせた形** ——
# 中心が予報円のどこへ進んでも暴風域に入りうる範囲、という意味。
# 暴風域は平均風速 25m/s 以上、強風域は 15m/s 以上。
#
# 色は暴風域と強風域だけに敷く（気象庁の図と同じ考え）。
# 1px ＝ 3.6km。台風・進路・数値は架空。
palette:
  暴風域: "#b03a2e"
  強風域: "#c8a415"
