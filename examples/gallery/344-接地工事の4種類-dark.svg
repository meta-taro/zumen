<g data-name="r1"><text x="140" y="685" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・B 種は 150 ÷（変圧器の高圧側 1 線地絡電流 I）。 混触で 2 秒以内に自動遮断するなら 300 ÷ I。</text></g>
<g data-name="r2"><text x="140" y="709" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">　つまり「電流が大きい所ほど、抵抗を小さくしろ」—— 数ではなく式で決まっている。</text></g>
<g data-name="r3"><text x="140" y="733" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・C 種と D 種は、100mA 以下の漏電遮断器を付ければ 500Ω 以下でもよい。</text></g>
<g data-name="r4"><text x="140" y="757" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">　抵抗を下げる代わりに、切る速さで守るという交換。</text></g>
<g data-name="r5"><text x="140" y="781" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・目的は 2 つ —— 漏電による感電と火災を防ぐこと、</text></g>
<g data-name="r6"><text x="140" y="805" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">　変圧器の中で混触したとき、低圧の電路へ高い電圧が入るのを抑えること。</text></g>
<g data-name="t1"><text x="140" y="163" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">① どこに落とすか —— 4 種類の違いは「つなぐ相手」と「抵抗の上限」</text></g>
<g data-name="h140_810"><text x="450" y="826" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">4 種類（電気設備技術基準）</text></g>
<g data-name="h800_810"><text x="1100" y="826" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">どれを使うかは、電圧で決まる</text></g>
<g data-name="ab"><text x="305" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">A 種（第 1 種）</text></g>
<g data-name="bb"><text x="615" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">B 種（第 2 種）</text></g>
<g data-name="cb"><text x="925" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">C 種（特別第 3 種）</text></g>
<g data-name="db"><text x="1235" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">D 種（第 3 種）</text></g>
<g data-name="t2"><text x="140" y="653" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">② B 種だけ、数が決まっていない</text></g>
<g data-name="y140_834"><text x="336" y="850" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">10Ω 以下 ／ 2.6mm 以上</text></g>
<g data-name="y140_858"><text x="336" y="874" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">150 ÷ I（2 秒以内なら 300 ÷ I）／ 4.0mm 以上</text></g>
<g data-name="y140_882"><text x="336" y="898" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">10Ω 以下 ／ 1.6mm 以上</text></g>
<g data-name="y140_906"><text x="336" y="922" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">100Ω 以下 ／ 1.6mm 以上</text></g>
<g data-name="aw"><text x="305" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">高圧・特別高圧機器の</text><text x="305" y="331" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">金属の架台やケース</text></g>
<g data-name="bw"><text x="615" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">高圧と低圧をつなぐ</text><text x="615" y="331" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">変圧器の低圧側 中性点</text></g>
<g data-name="cw"><text x="925" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">低圧機器</text><text x="925" y="331" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">300V を超えるもの</text></g>
<g data-name="dw"><text x="1235" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">低圧機器</text><text x="1235" y="331" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">300V 以下</text></g>
<g data-name="y800_834"><text x="1066" y="850" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">A 種</text></g>
<g data-name="y800_858"><text x="1066" y="874" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">B 種（低圧側の中性点）</text></g>
<g data-name="y800_882"><text x="1066" y="898" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">C 種</text></g>
<g data-name="y800_906"><text x="1066" y="922" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">D 種</text></g>
<g data-name="y800_930"><text x="1066" y="946" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">C・D は 500Ω 以下でもよい</text></g>
<g data-name="x800_834"><text x="930" y="850" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">高圧・特別高圧の機器</text></g>
<g data-name="x800_858"><text x="930" y="874" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">高圧と低圧をつなぐ変圧器</text></g>
<g data-name="x800_882"><text x="930" y="898" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">低圧 300V を超える</text></g>
<g data-name="x800_906"><text x="930" y="922" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">低圧 300V 以下</text></g>
<g data-name="x800_930"><text x="930" y="946" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">漏電遮断器 100mA 以下</text></g>
