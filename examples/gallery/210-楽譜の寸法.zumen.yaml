    marker: none
    align: left
    at: { x: 200, y: 1182 }
    size: { w: 1000, h: 18 }
  - id: n3
    label: "五線の高さは独奏・パート譜で 7mm 前後、スコアで 6.0 〜 6.5mm。1 space はその 1/4（1.75mm）です。"
    marker: none
    align: left
    at: { x: 200, y: 1204 }
    size: { w: 1000, h: 18 }
  - id: n4
    label: "符尾の長さは 3.5 space —— ちょうど 1 オクターブぶんです。"
    marker: none
    align: left
    at: { x: 200, y: 1226 }
    size: { w: 1000, h: 18 }
  - id: n5
    label: "符尾の向きは、真ん中の線で決まります —— 上なら下向き、下なら上向き。付く側も、上向きなら符頭の右、下向きなら左と決まっています。"
    marker: none
    align: left
    at: { x: 200, y: 1248 }
    size: { w: 1000, h: 18 }
  - id: n6
    label: "♯を置く順は ファ・ド・ソ・レ・ラ・ミ・シ（5 度ずつ上がる並び）。♭はその逆順で、置く場所まで決まっています。"
    marker: none
    align: left
    at: { x: 200, y: 1270 }
    size: { w: 1000, h: 18 }
  - id: n7
    label: "音符の横の間隔は、時間に比例しません。長い音符ほど広くしますが、比例では広げすぎになります。"
    marker: none
    align: left
    at: { x: 200, y: 1292 }
    size: { w: 1000, h: 18 }
