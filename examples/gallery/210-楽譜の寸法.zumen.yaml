version: 1
kind: placement
arrows: true
title: 楽譜の寸法（五線が単位）
scale: { mm: 0.1 }
# **五線の間隔（1 space）が、すべての寸法の単位。**
#
# 符頭は縦 1 × 横 1.18 space、**符尾は 3.5 space（＝1 オクターブ）**、
# 連桁は太さ 0.5 space、五線の線は 0.125 space。
#
# **符尾の向きは真ん中の線で決まり**（上なら下向き、下なら上向き）、
# 付く側も決まっている（上向きは符頭の右、下向きは左）。
# ♯を置く順は**ファ・ド・ソ・レ・ラ・ミ・シ**で、置く場所まで決まっている。
