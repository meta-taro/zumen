version: 1
kind: placement
arrows: false
title: 送電線路の縦断面図（275kV・架空）
# **プロフィール図。** 送電線が地面からどれだけ離れているかを見る図。
#
# **縦横で縮尺が違う**（横 1:5,000／縦 1:1,000）。縦を強調しないと、
# 130m の起伏が 1,150m の中で潰れて読めない —— だから \`scale\` は書かない
# （1 つしか持てない縮尺を書くと、もう片方が嘘になる）。
# 同じ理由で**斜めの寸法線を引かない**。長さは数字で書く。
#
# 弛度は D ＝ WS² ÷ 8T（W 電線の重量・S 径間・T 水平張力）。
# **径間が延びると二乗で増える。** いちばん垂れるのは最高気温・無風のときで、
# そのときに最低地上高を満たすように鉄塔の高さを決める。
#
# 最低地上高は解釈 87 条。160kV を超える分は 10kV ごとに 12cm を足す。
# この図の弛度・地上高は、W・T・径間から計算した（手で書いていない）。
