version: 1
kind: placement
arrows: true
title: 円だけで作るマークの作図図（架空のマーク）
# **円と円の交点だけで輪郭を決める。** 直線も自由曲線も使わない。
#
# ## 中心と半径が正本
#
# 中心は**格子の交点**に置き、半径も**格子の整数倍か、その半分**に取る。
# **円を 1 つ動かすと輪郭が全部変わる**ので、
# 渡すのは仕上がりの形ではなく**円の中心と半径**。
#
# ## 足す円と引く円
#
# **実線が足す円、破線が引く円。**
# 足した円の和から、引く円を抜いた残りが輪郭になる。
# 左の図では、できあがる輪郭を**太線**で重ねてある ——
# **どの円のどの弧が、輪郭のどこになっているか**が読める。
#
# ## 仕上がりだけを渡さない
#
# 作図の円が無いと、**後から直せない。**
# 大きさを変える・左右を反転する —— どれも円の側で行う。
#
# **このマークは架空のもの。** 実在の商標を写したものではない。
