scale: { mm: 17 }
title: 墓地の区画図（番号は、たどり方を指している）
# **番号は場所を指すのではなく、たどり方を指している。**
# 「1-5-12-25」のような墓所番号は**区 → 地区 → 列 → 番**の階層で、
# **上から順にたどると現地に着く** —— 通し番号にすると、区画を足したときに全部振り直しになる。
# **墓地は数十年かけて区画を足していく**ので、階層でないと続かない。
#
# **広さは ㎡ で表す。** **4.0m² なら間口 2m × 奥行 2m**、**3.0m² なら 2m × 1.5m。**
# よくある広さは 1〜2m² 未満で、地方の霊園では 3〜5m² も多い。
# 区画の形は正方形とはかぎらず、**同じ面積でも、置ける墓石の大きさは間口で決まる。**
#
# **買うのは、土地ではない。** 取得するのは**永代使用権**（使う権利）で、
# 土地の所有権ではない —— 地番も登記もなく、**管理料が毎年かかる。**
# **区画図は不動産の図面ではなく、「この区画を使ってよい」という台帳の図** ——
# 同じ形の図でも、宅地の区画割（見本 33）とは性格が違う。
#
# **現地でこの図を持って歩く人がいる。** 番号だけの図では、区画が数百あると探せない ——
# **水場や管理棟のような目印**が、番号と現地をつなぐ。
