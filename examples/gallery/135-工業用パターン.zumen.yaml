version: 1
kind: placement
arrows: true
title: 工業用パターン（半袖シャツ・前身頃／後ろ身頃／袖・架空）
# **型紙は「切る前の指示書」。** 布は切ったら戻せないので、
# 置き方・向き・枚数を、切る前に全部決めてある。
#
# ## 記号
#
# | | |
# |---|---|
# | **地の目線** | **矢印。** 布の縦地と平行に置く。斜めに置くと、着たときに捻れる |
# | **わ** | 一辺が点線で「わ」。**布を二つ折りした折山**に合わせて裁つ |
# | **合印（ノッチ）** | 縁の `V` か `｜`。縫い代の端から **3 mm** の切り込みを入れる |
# | **裁断枚数** | 「表地 ×2」＝ **左右対称に 1 枚ずつ、計 2 枚** |
#
# ## 工業用パターンは縫い代つき
#
# 家庭用の型紙は出来上がり線で、縫い代を自分で足す。
# **工業用は縫い代が入った形**で配られるので、
# **生地にチャコで線を書かない** —— そのぶん速く、ぶれない。
#
# 1 px ＝ 5 mm。寸法・縫い代はすべて架空。
