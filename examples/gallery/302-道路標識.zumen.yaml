title: 道路標識（形と色で、読む前に種類が分かる）
# **本標識は 4 種類あり、形と色で種類が分かる。**
#
# | | 形と色 |
# |---|---|
# | **案内標識** | 青地または緑地に白 |
# | **警戒標識** | **黄地に黒の菱形**（一辺 45cm） |
# | **規制標識** | 白地に赤の枠・斜めの帯と青の記号、または青地に白（車両進入禁止・一時停止は赤地に白）。円形・四角・逆三角形 |
# | **指示標識** | 青地に白。五角形や正方形 |
#
# **文字が読めない距離でも、黄色い菱形が見えた時点で「注意」と分かる。**
# 形と色が先に届き、中身はあとから読む —— **読む前に種類が分かる**ことが、この体系の肝。
#
# **ウィーン標識条約は、警告に 2 つの型を認めている。** Aa 型は赤い縁の三角（白か黄の地）、
# **Ab 型は黄地に黒い縁の菱形**（正方形を 45° 回したもの）。禁止は丸で周囲が赤。
# **日本の警戒標識は Ab 型と同じ菱形**（日本は条約を批准していない）。欧州は Aa 型、米国・豪州は菱形。
# 日本の一時停止は逆三角形だが、条約では逆三角形は「譲れ」（B1）で、「止まれ」は八角形（B2）。
# 日本の一時停止は、条約の「譲れ」の形を「止まれ」に使っている（2026-10-02 まで表で取り違えていた）。
#
# **案内標識は、道で地の色が変わる。** 一般道は青、高速道路は緑。
#
# **本標識は、条件を持たない。**
# 「駐車禁止」は駐車禁止としか言えないので、**いつ・どこで・誰に効くかは、
# 下に付ける補助標識**（距離・区域・時間・車両の種類・方向）が持つ ——
# 本標識と補助標識の**組み合わせ**で意味を作っている。
#
# 出典（2026-09-29 に確かめた）: 道路標識、区画線及び道路標示に関する命令（昭和 35 年総理府・建設省令第 3 号）
# 第 1 条（本標識 4 種と補助標識）・別表第二 備考一（三）色彩。警戒標識の一辺 45cm は同 別表第二の図示寸法。
# ウィーン道路標識信号条約（1968）附属書 1 の警告標識 Aa 型・Ab 型。
#
# 色は palette で持たせた。**記号の名前（黄・赤・青・緑）は図の中に文字でも出している** ——
# 色だけに頼ると、白黒と色覚特性で読めなくなる。
