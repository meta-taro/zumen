version: 1
kind: placement
arrows: true
title: 食品工場のアレルゲン動線図（3 区域のゾーニングと専用ライン／架空の工場）
# **交差接触は、動線の設計で防ぐ。** 現場の注意では防げない。
#
# ## 一方通行
#
# 人・物・空気・水を、すべて一方通行にする。
# 物は **汚染 → 準清潔 → 清潔 → 準清潔 → 汚染** の順に進む。
# **戻り道を作らない。** 戻す必要が出たら、区域の分け方のほうが間違っている。
#
# ## 区域は落下菌で分ける
#
# **清潔作業区域**（製造・内装）は落下菌 30 以下・真菌 10 以下、
# **準清潔作業区域**（計量・外装・保管・出荷）は 50 以下、
# **汚染作業区域**（受入・下処理・廃棄物）は 100 以下が目安。
#
# ## アレルゲンは、空間か時間で分ける
#
# **特定原材料は 8 品目** —— えび・かに・くるみ・小麦・そば・卵・乳・落花生。
# 分けきれないときは**作る順番で分ける**（アレルゲンを使う品を後に作る）。
# 器具は**色で分ける**。切替のたびに洗浄し、拭き取りで確認する。
