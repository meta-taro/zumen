version: 1
kind: placement
arrows: false
title: コンテナ船 積付図（Bay 34・40ft・船尾から船首を見た断面）
# **線が 1 本も無い図。** セルの位置そのものが、コンテナの住所になっている。
#
# ## 住所は 6 桁（ISO 9711-1）
#
# `34` `03` `84` ＝ Bay 34 ／ Row 03 ／ Tier 84。
#
# - **Bay** … 船首から船尾へ。**40ft は偶数、20ft は奇数**（34 番の両隣が 33・35）
# - **Row** … 船の中心から外へ。**中心が 00、左舷が偶数、右舷が奇数**
# - **Tier** … 船倉は 02 から上へ 2 ずつ。**甲板上は 82 から**
#
# ## 向き
#
# 積付図は**船尾から船首を見る。** 船首を向いているので、
# **左が左舷（偶数）、右が右舷（奇数）**になる。
#
# ## 色は揚地（POD）
#
# 色が記法そのもの（D24）。**同じ港のものが縦に固まっていないと、
# 揚げるときに上のコンテナをどける手間が出る。**
# 色だけに頼らせないため、セルの符号にも港のコードを入れてある。
