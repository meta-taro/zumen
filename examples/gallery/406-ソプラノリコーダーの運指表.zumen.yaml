version: 1
kind: placement
title: ソプラノリコーダーの運指表（バロック式とジャーマン式は、ファだけが違う）
sources:
  - name: "Philippe Bolton「Baroque fingering chart」（リコーダー職人の運指表。● 閉じる・○ 開ける・ø 少し開ける）"
    url: https://www.flute-a-bec.com/tablaturgb.html
    retrieved: 2026-11-05
  - name: "Philippe Bolton「German or \"modern\" fingerings」（ジャーマン式は 1920 年代のハルラン案。5 番を小さく 4 番を大きくしてファを並び順に）"
    url: https://www.flute-a-bec.com/doigtes-allemands-gb.html
    retrieved: 2026-11-05
  - name: "Dolmetsch「Baroque/English Fingerings for the Recorder in Text Format」（穴の番号 0〜7、6・7 の 2 つ穴の a・b）"
    url: https://dolmetsch.com/textfingeringchart.htm
    retrieved: 2026-11-05
  - name: "島村楽器「リコーダーのバロック式とジャーマン式の違い」（日本の小学校はジャーマン式が多い・4 番と 5 番の穴の大きさで見分ける）"
    url: https://www.shimamura.co.jp/update/?p=59157
    retrieved: 2026-11-05
# **列がリコーダー 1 本、段が穴 1 つ。** 上が吹き口、裏穴（0）がいちばん上。
#
# 決まり（Philippe Bolton の運指表、取得 2026-11-05）——
# ● 閉じる、○ 開ける、斜線の丸はサミング（親指の爪で裏穴を少しだけ開ける）。
# 6・7 番は 2 つ穴。左が大きい穴、右が半音用の小さい穴。
# バロック式とジャーマン式で違うのは、この音域ではファと高いファだけ（ほかの音は同じ押さえ方）。
