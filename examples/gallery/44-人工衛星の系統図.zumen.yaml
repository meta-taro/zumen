version: 1
wrap: true
title: 小型地球観測衛星 系統図（150kg 級・太陽同期軌道）
# **衛星の系統図は、ミッション系とバス系に分かれる。**
# バス系は「衛星を生かす側」（電源・姿勢・通信・熱）で、
# ミッション系は「何をしに行ったか」。**バス系はどの衛星でもほぼ同じ形になる。**
#
# ## 太陽同期軌道だから、電源の設計が決まる
#
# いつも同じ地方時に赤道を通るので、日照と日陰の割合が毎周ほぼ一定になる。
# **日陰の間はバッテリだけで持たせる**ので、パドルの発生電力は
# 「使う分 ＋ 日照の間に充電する分」で決める。
#
# ## 回線が 2 つあるのは、用途が違うから
#
# X 帯は観測データを落とす太い回線、S 帯は指令と状態監視の細い回線。
# **S 帯が生きていれば、X 帯が死んでも衛星は救える。**
#
# ## 姿勢は「測る」と「回す」で分かれる
#
# スタートラッカと慣性基準装置が測り、リアクションホイールとスラスタが回す。
# ホイールは反動で回すので推進剤が要らないが、**溜まった回転はスラスタで逃がす。**
