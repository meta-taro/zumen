title: 遺伝子組換えとゲノム編集（残るものが違う）
# **どちらも「遺伝子をいじる」だが、終わったときに残るものが違う。**
# そしてその違いが、**そのまま日本の制度の違いになっている。**
#
# | | 遺伝子組換え | ゲノム編集（SDN-1）|
# |---|---|---|
# | すること | **別の生物の遺伝子を入れる** | **自分の配列を切る。入れない** |
# | 終わったとき | **外来遺伝子が残る** | **切れた跡が修復され、外来遺伝子は残らない** |
# | 自然に起きるか | **起きない**（交配では入らない）| **起きる**（突然変異と区別できない）|
# | カルタヘナ法 | **対象** | **外来遺伝子が残らなければ対象外** |
# | 食品としての扱い | **安全性審査** | **届出**（2019 年 10 月から）|
# | 表示 | **義務あり** | **義務なし** |
#
# ## 「切って終わり」が要点
#
# ゲノム編集には外から遺伝子を入れる型（SDN-2 / SDN-3）もある。
# **その場合は外来遺伝子が残るので、遺伝子組換えとして扱われる。**
# 届出で済むのは、**切って終わる型（SDN-1）**だけ。
#
# ## 描かなかったもの
#
# **手順は描かない**（`.claude/rules/専門図面の調査と実装方針.md` §5.5）。
# ベクターの作り方も、導入の条件も書いていない。**この図は「何が残るか」の図。**
#
# 出典 —— 厚生労働省「ゲノム編集技術を利用して得られた食品等の食品衛生上の取扱いについて」、
# 環境省報道発表（カルタヘナ法に該当しない生物の取扱い）、
# 神奈川県衛生研究所 衛研ニュース No.218。
