version: 1
kind: placement
arrows: false
title: "Cattle handling facility (fictional)"
scale: { in: 2 }
# **A behaviour diagram drawn in plan.**
#
# Every dimension on this sheet comes from what cattle will and will not do.
# The race curves because **cattle head back toward where they came from** -
# the curve uses that instead of fighting it.
#
# **It is not a trick.** An animal standing in the crowd pen still has to see
# two body lengths up the race; if it cannot, the entrance reads as a wall and
# nothing moves. That is also why a tight radius needs a straight section first.
#
# Sides are solid for the same reason: what they see beside them stops them.
# The crowd pen is level, and any ramp belongs inside the single file race.
#
# 1 px = 2 in. Dimensions follow published handling-facility guidance
# (Grandin, design of facilities for handling cattle); this layout is fictional.
