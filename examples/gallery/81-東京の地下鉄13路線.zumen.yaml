title: 東京の地下鉄 13 路線 都心部 路線図（東京メトロ 9 ＋ 都営 4・主要駅）
# **都心部の骨格だけ**を描いた模式図。全 285 駅ではなく、乗換と端点になる駅に絞ってある。
# 位置はおおよその方角に合わせてあり、縮尺は持たない（実物の路線図と同じ）。
# 線は折れ線（曲線にしない）—— 実物の路線図は直線で組む。
#
# 色は各路線の案内用の色（事実）。**このうち何本かは zumen の下限 3:1 を割る**ので
# 検証器が color-faint を出す —— それは正しい。実物も色だけでは読めないので、
# 路線記号（G・M・A・I…）と駅名を併記している。
#
# 駅名・接続は事実。図は zumen で描いたもので、どの事業者の図の写しでもない。
