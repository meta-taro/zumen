version: 1
kind: placement
arrows: true
title: PoE の給電クラス —— W が 2 つ書いてある理由
palette:
  G: "#e0e0e0"
# **規格には W が 2 つ書いてある** —— 出す側（PSE）と、受け取る側（PD）。
# **差は 100m のケーブルで熱になる分**で、規格が先に織り込んでいる。
# どの型も、おおむね 15% が消える。
#
# **選ぶときに見るのは、PD が受け取る側の数。**
# 「PoE+ は 30W」と言っても、機器側では 25.5W しか来ない。
#
# 8 本のうちどれで送るかは 2 通り（A はデータの線に重ね、B は空き線）。
# **30W を超えるなら 4 ペア全部**（bt）—— 1 本あたりの電流が減り、落ちる分も減る。
