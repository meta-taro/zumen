version: 1
kind: placement
arrows: true
title: クモの円網の作り方（縦糸は歩く道、横糸だけが粘る）
# **クモが自分の網にくっつかないのは、歩く糸が粘らないから。**
# 縦糸（放射糸）と足場糸は粘らず、**粘るのは横糸だけ** ——
# クモは縦糸の上だけを歩く。横糸には**粘球がほぼ等間隔**に並び、獲物はそこで止まる。
#
# **張る順番は決まっている。** 糸を風に流して渡す**橋糸** → **枠糸** →
# **縦糸（放射糸）** → **足場糸**（中心から外へ、粗いらせん）→
# **横糸**（外から内へ、細かいらせん）→ **足場糸を切り捨てる。**
# 足場糸は横糸を張るための仮設で、**通ったあとに捨てていく** —— 仮設を残さない。
# 完成まで 1 時間とかからない。
#
# **こしき**は縦糸が集まる中心で、ここにクモが止まる。
# **白帯（隠れ帯）**はジグザグや X 状の白い帯 ——
# 姿を隠す働きとされるが、**効果があるかどうかは定かではない**と書かれている。
#
# **横糸は、網の下側のほうが数が多い**（こしきは中心より上に来る）。
# なぜそうなるのかを書いた資料は見つけられなかったので、ここには理由を書いていない。
#
# **張り替えは高い。** ジョロウグモが網を全部張り替えると**約 2 日分の養分**を使うので、
# **破れた所だけ補修する。** オニグモは夜に張って明け方に片付ける ——
# **きれいな円網は、張ったばかりの網。**
