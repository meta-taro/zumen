    label: "歌詞の位置"
    marker: box
    at: { x: 60, y: 800 }
    size: { w: 200, h: 24 }
  - id: tb255
    label: "五線の下に。1 つの音で歌う音節は、その符頭の真ん中に揃える"
    marker: box
    align: left
    at: { x: 260, y: 800 }
    size: { w: 800, h: 24 }
  - id: ta256
    label: "句読点"
    marker: box
    at: { x: 60, y: 824 }
    size: { w: 200, h: 24 }
  - id: tb257
    label: "揃えるのは語の部分だけ。kle, の「,」は数えず、右へはみ出させる"
    marker: box
    align: left
    at: { x: 260, y: 824 }
    size: { w: 800, h: 24 }
  - id: ta258
    label: "ハイフン"
    marker: box
    at: { x: 60, y: 848 }
    size: { w: 200, h: 24 }
  - id: tb259
    label: "1 つの語を音節に切った所（Twin-kle・won-der・a-bove・dia-mond）は、2 つの音節の真ん中に - を置く"
    marker: box
    align: left
    at: { x: 260, y: 848 }
    size: { w: 800, h: 24 }
  - id: th260
    label: "描かなかったもの（理由）"
    marker: box
    hatch: solid
    at: { x: 60, y: 892 }
    size: { w: 1000, h: 24 }
  - id: ta261
    label: "日本語の歌詞"
    marker: box
    at: { x: 60, y: 916 }
    size: { w: 200, h: 24 }
  - id: tb262
    label: "訳詞には著作権が残るものがあるので付けない。英語の原詩（Jane Taylor、1806 年）を付け、音名を下に添えた"
    marker: box
    align: left
    at: { x: 260, y: 916 }
    size: { w: 800, h: 24 }
  - id: ta263
    label: "休符・旗・スラー・伸ばし線"
    marker: box
    at: { x: 60, y: 940 }
    size: { w: 200, h: 24 }
  - id: tb264
    label: "この曲は 4 分音符と 2 分音符だけで、1 音節を 2 つ以上の音で歌う所も無い。休符・旗・スラー・伸ばし線は出てこない"
    marker: box
    align: left
    at: { x: 260, y: 940 }
    size: { w: 800, h: 24 }
  - id: ta265
    label: "符頭の傾き"
    marker: box
    at: { x: 60, y: 964 }
    size: { w: 200, h: 24 }
  - id: tb266
    label: "本物の符頭は少し右上がりに傾くが、zumen の楕円は傾けられないので横長の楕円で代えた"
    marker: box
    align: left
    at: { x: 260, y: 964 }
    size: { w: 800, h: 24 }
  - id: ta267
    label: "ト音記号の太さ"
    marker: box
    at: { x: 60, y: 988 }
    size: { w: 200, h: 24 }
  - id: tb268
    label: "文字の 𝄞 は字体によって出ないので、通り道を通る曲線（smooth）で描いた。線の強弱は無い"
    marker: box
    align: left
    at: { x: 260, y: 988 }
    size: { w: 800, h: 24 }
  - id: n269
    label: "「きらきら星」の旋律を、五線譜の浄書の決まりどおりに組んだ図です（12 小節、ハ長調、4/4 拍子）。"
    marker: none
    align: left
    at: { x: 60, y: 1032 }
    size: { w: 1000, h: 18 }
  - id: n270
    label: "旋律は、1761 年にフランスで出版された「Ah! vous dirai-je, maman」。歌詞は Jane Taylor の詩「The Star」（1806 年）の第 1 連。どちらも著作権切れ。"
    marker: none
    align: left
    at: { x: 60, y: 1054 }
    size: { w: 1000, h: 18 }
  - id: n271
    label: "五線も音符も、zumen の共通の部品（細い帯・楕円・曲線）だけで描いています。楽譜専用の部品は使っていません。"
    marker: none
    align: left
    at: { x: 60, y: 1076 }
    size: { w: 1000, h: 18 }
