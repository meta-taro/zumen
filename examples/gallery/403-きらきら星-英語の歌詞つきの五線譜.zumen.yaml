# **楽譜は、五線の間隔（1 space）を物差しにした図面。** 普通の楽譜を 1 枚、決まりどおりに組む。
#
# 決まり（SMuFL の Bravura の engravingDefaults、取得 2026-10-20）——
# 五線 0.13・符尾 0.12・加線 0.16（はみ出し 0.4）・小節線 0.16・終止線の太線 0.5（間 0.4）space。
# 符頭は 1.18 × 1 space、符尾は 3.5 space。ト音記号はソの線から上 4.39・下 2.63、幅 2.68 space。
# 旋律と歌詞の区切りは Wikipedia の譜のソース（LilyPond）と同じ。歌詞は英語の原詩（Jane Taylor 1806）。日本語の訳詞は付けない（著作権）。
# 歌詞は五線の下、1 音 1 音節は符頭の真ん中に揃え（句読点は数えない）、語の切れ目のハイフンは音節の真ん中に置く。
