#
# ## 線が記法そのもの
#
# **婚姻は二重線、親子は単線。** 太さでも破線でも代わりにならない
# （`line: double`。src/line.ts）。読む側はこれで婚姻を見分けている。
#
# ## 名前の横の（　）
#
# 誰が不動産を取るのかを図の上で言い切る。書かないと補正になる。
# **相続放棄した人も省かない** —— 省くと、相続人の範囲が戸籍と合わなくなる。
#
# 人名・住所・本籍はすべて架空。
