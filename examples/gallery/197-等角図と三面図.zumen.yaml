version: 1
kind: placement
arrows: true
title: 等角図・三面図・斜投影
# **等角図は、3 方向を同じ物差しで測れる。** だから「等角」。
#
# 軸のあいだは 120°、2 本は水平から 30°。ただし**円は楕円になる**。
#
# 第三角法（日本・JIS）は「**見た側へ置く**」—— 上から見た図は上、右から見た図は右。
# 斜投影は正面を実寸のまま描き、**奥行きを 1/2 に縮める**（実寸だと太って見える）。
