# **規格の表ではなく、作るための図。**
#
# 肝は 2 つ。**ほぞ先は留め（45°）に切る** —— 脚の隣り合う 2 面から入るほぞが、
# 脚の中でぶつかるから。そして **天板は固定しない** ——
# 木は幅方向に伸縮するので、止めると割れる（駒止めを溝に差して逃がす）。
#
# ほぞ厚は**材厚の 1/3**が定石で、**ノミの寸法に丸める**（t25 → 9）。
# 1 枚に縮尺が 2 つ（三面図 1px＝5mm／詳細 1px＝0.5mm）。
