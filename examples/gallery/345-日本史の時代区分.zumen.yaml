version: 1
kind: placement
arrows: false
title: 日本史の時代区分（一本の線ではない）
# **年表は一本の線に見えるが、実際は重なっている。**
#
# ## 重なっている
#
# **戦国は室町の中にある。** 応仁の乱（1467）に始まるが、室町幕府は 1573 年まで続く ——
# **106 年ぶん重なる。** 幕末（1853〜1868）も江戸の中。
#
# ## 並立していた
#
# **南北朝の 56 年（1336〜1392）は、朝廷が 2 つあった。**
# 京都の北朝と吉野の南朝。足利義満の仲介で後亀山天皇が京都へ入り、合一する。
#
# ## 境目が 1 点に決まらない
#
# 鎌倉幕府の成立は **1185 と 1192 の両論**。守護・地頭を全国に置いた年か、
# 征夷大将軍に任じられた年か。**いまの教科書は 1185 が主流**（「いい国」→「いい箱」）。
#
# 幕末も、切り替わった 1 点は無い —— 大政奉還 1867・王政復古 1867・
# 戊辰戦争 1868〜69・版籍奉還 1869・廃藩置県 1871。
#
# ## 細い所は、拡大して別に描く
#
# 全体は 1px ＝ 0.96 年なので、**15 年は 16px にしかならない。**
# 帯の中に字が入らない所は、**下に拡大図**を置いた（②③）。年表の常道。
#
# **目盛の線は帯の中だけ**にしてある。下まで伸ばすと、出来事の字を貫く（実際に貫いた）。
# **出来事の名前は段をずらす** —— 幕末は 4 年に 4 つ集まるので、同じ段では必ず重なる。
