title: ミキサー 1 チャンネルの信号の道（順番が音を決める）
# **同じ機能でも、道のどこに置くかで別のものになる。**
#
# ## 順番
#
# 入力（マイク／ライン）→ **HA（ヘッドアンプ）**→ フィルタ（HPF / LPF）→ **EQ** →
# ダイナミクス → **インサート** → **AUX SEND** → PAN POT → **フェーダー** →
# BUS / GROUP → マスター。
#
# **HA で利得を合わせるのが先**なのは、そこで決まった余裕が以降の段すべてに効くから。
# **フィルタが EQ より前**なのは、要らない帯域を先に落としておくため。
#
# ## 同じ AUX でも、取り出す場所で別のものになる
#
# **フェーダーの前から取る（プリフェーダー）**と、卓の音量を動かしても送る量は変わらない ——
# **演者に返すモニター**はこちら。
#
# **フェーダーの後から取る（ポストフェーダー）**と、卓の音量に連動して送る量も動く ——
# **残響などのエフェクト**はこちら。
#
# **どちらも「AUX SEND」という同じつまみ**で、違うのは取り出す場所だけ。
#
# ## 直列と並列
#
# **インサートは直列。** 道を切って、そこへ外部機器を挟む。通った音がそのまま先へ行く。
# **AUX は並列。** 枝分かれして送り、戻してくる。
# インサートは PRE か POST を選べる。
#
# ## PFL
#
# **Pre Fader Listening** —— フェーダーで音量を調整される**前段**の信号をソロで聞く。
# 卓のフェーダーを下げていても聞けるので、**送り出す前に確かめられる。**
#
# PA の配置は見本 101、ホールの反射は見本 205、マイクの指向性は見本 327。
