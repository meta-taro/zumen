# 1 px = 5 mm。**同じ 6 箱を、段ごとに 90° 回して積む**（交互列積み）。
# 見本 98 は 4 つの積み方を平面で比べた。**ここは 1 つの積み方を、立体と段ごとの平面で読む** ——
# JIS Z 0111:2006 の付図そのものが、この形（等角図の下に、奇数段と偶数段の平面を並べる）で描いてある。
#
# ## この図にあるもの
# ① 等角図：パレットは JIS Z 0601:2001 の木製 T11 の寸法図どおり —— 上下の板 7 枚ずつ（150・120×5・150、すき間 33/34、厚さ 22）、
#    けた 3 本（幅 50・高さ 100）。寸法図は 2 枚あり（もう 1 枚は板 120 × 7、すき間 43/44）、
#    **どちらが A 形かは図の題が画像に写っておらず確かめていない。**
#    **けたに直交する手前の面に、フォークの差込口が 2 つ開く**（両面使用形二方差し）。右の面は外側のけたと板の木口で、差せない。
#    箱は 4 段 24 箱。立体は機械が奥から手前へ重ねる（`height`）。
# ② ③ 奇数段と偶数段の平面。**下が差込口の側**（等角図の左手前の面）。
# ④ 数と、照らした決まり。
#
# ## 交互列積みとは
# JIS Z 0111:2006 の「パレット積付けパターン」は、積付け効率と荷崩れ防止を考えて決める配列方式で、
# 基本はブロック積み・交互列積み・れんが積み・ピンホイール積み・スプリット積みの 5 つ。
# 付図 3（交互列積み）は、奇数段と偶数段で**同じ並びを 90° 回した**平面を並べている。
# **段の継ぎ目（目地）が上下で交差する**ので、上の箱が下の箱どうしを押さえてつなぐ。
# ブロック積み（付図 2）は奇数段も偶数段も同じ並びで、目地が縦に通る。
#
# ## 箱は架空
# 平面 550 × 366 は JIS Z 0105:2015 が 1,100 × 1,100 に対して決めたモジュールそのもの（1,100 の 1/2 × 1/3）。
# 3 × 366 ＝ 1,098 なので、366 の向きに 2 mm 余る。**高さ 250 mm と質量 12 kg は説明のための架空の値。**
#
# ## 照らした数（JIS Z 0651:2002）
# - 5.1 パレタイズド貨物のプランビューサイズの最大は、パレットの長さ・幅それぞれに 40 mm を足したもの → T11 なら 1,140 × 1,140
# - 5.3 全高（パレットを含む）は 2,200 mm 以下
# - 6.1 c) 積載面利用率は 85 % 以上 → この図は 6 × 550 × 366 ÷ 1,100² ＝ 99.8 %
#
# ## 描かなかったもの（理由）
# - 荷崩れ防止（ストレッチフィルム・バンド・角当て）：JIS Z 0651:2002 5.5 は「適切な荷崩れ防止を行う」とだけ書く。方法は確かめていない
# - 段数の上限・箱の圧縮強度：箱の材質と中身で決まる。架空の箱では決められない
# - JIS Z 0651:2002 表 2 の「記号」：表は画像で、形を確かめていない
# - 実物の倉庫・出荷の様式：事業者ごとに違う。確かめていない
