version: 1
kind: placement
arrows: true
title: 足関節のテーピング指示図（内反捻挫・右足）
# **止めるのは 1 方向だけ。** 内反捻挫は**底屈 ＋ 内返し**で起き、
# 足首の捻挫の**約 80〜90%** を占める（切れやすいのは前距腓靭帯）。
# **内返しだけを止めて、底背屈は残す**のがテーピングの狙い ——
# 全方向を固めると、動けないうえに他の関節を壊す。
#
# **順序が決まっているのは、あとのテープが前のテープの端を押さえるから。**
# アンダーラップ → **アンカー**（下腿 2 本 ＋ 前足部 1 本）→ **スターアップ**（3 本）→
# **ヒールロック**（左右 1 本ずつ）→ **ホースシュー**（U 字・1/2 重ね）→
# **フィギュアエイト**（1 本）→ **ラストアンカー**。
# **はがれるテーピングは、貼り方ではなく順番を間違えている。**
#
# **引く向きが、効きのすべて。** スターアップは**内側から踵を通して、外側を上へ引き上げる** ——
# 内返し（足裏が内を向く動き）の**逆へ引く**から止まる。
# **同じ場所に同じ本数を貼っても、向きが逆なら効かない。**
#
# **足首は 90° を保ったまま巻く。** 底屈したまま巻いたテープは、
# 90° に戻すと長さが余る —— **貼った時点では効いて見える。**
# 巻いたあとに、しわ・指の色・底背屈を必ず見る。
