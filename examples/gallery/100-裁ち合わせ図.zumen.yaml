version: 1
kind: placement
arrows: false
scale: { mm: 3 }
title: 裁ち合わせ図（ブラウス・布幅 110cm・用尺 1.30m）
# 1 px = 3 mm。**布の上のどこに型紙を置くか**だけの図。
# 布は二つ折り（わ）にしてあるので、描いてある幅は 110 ÷ 2 ＝ 55cm。
#
# ## 回してはいけない
#
# **地の目線は耳と平行**でなければならない。型紙を 90° 回すと、
# 布の伸び方が変わって**着たときに歪む。** だから隙間が空いても回さない。
#
# ## 「わ」に置くもの
#
# 前身頃・後ろ身頃は**中心線を折り山にぴったり載せる。**
# ずらすと左右の幅が違う服になる。
#
# ## 余りは捨てない
#
# 当て布・試し縫い・柄合わせのやり直しに使う。
#
# 寸法は例。実物はサイズと型で変わる。
