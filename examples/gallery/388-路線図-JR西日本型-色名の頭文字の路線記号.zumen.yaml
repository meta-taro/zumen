# 中心駅から放射状に伸びる路線を、**色の四角に白い 1 文字の路線記号**で読ませる路線図。
#
# ## JR 西日本型とは
# 2014 年 8 月 6 日の発表で、広島エリアは「広島駅を中心に広がる 5 つの路線に新たなラインカラーを
# 設定するとともに、**ラインカラーの色名称の頭文字を路線記号とします**」とした（Blue の B、Red の R…）。
# 実物の路線図では、**記号は線の端（終着駅の外）に置かれ**、路線名に色名を英語で添える
# （Kabe Line (Blue) のように）。**主要駅は黒い箱に白抜き**、その他の駅は線の上の小さな印。
# 同じ山陽線でも、広島を境に西と東で色と記号が違う —— **記号は行き先の方面を示す**
# （発表の共通コンセプト「行先路線に該当する路線記号を表示すること」）。この図の瀬戸本線（G と O）がそれ。
#
# ## 色の選び方（ガイドライン p.80・参考 2-2-5 に照らした）
# - 見分けにくい組：赤と黒・赤と緑・緑と茶・黄緑と黄・紫と青・赤と茶・水色とピンク・オレンジと黄緑。
# - 実物の広島エリアは赤（R）と緑（G）が広島駅で隣り合い、紫（P）と青（B）も同じ図にある
#   —— 記号の文字があるので読めるが、**新しく決めるなら組そのものを避ける**。この図は後者。
# - 赤を使わず、緑は青みに寄せた（「やむを得ず緑を使う場合は青緑」）。
# - 青の隣に紫を置かない。代わりに赤紫（マゼンタ）（「やむを得ず青を用いる場合には赤紫」）。
#   記号の文字も色名の頭文字なので M（Magenta）。
# - 黄は使わない（白い文字を黄の四角に乗せると「黄と白」の組になる）。
# - **黒い箱が青い線に接する所（横瀬）は「青と黒」に当たる**。ガイドラインの文は図色と地色（文字と地）の
#   組の話で、この箱の中は白抜きなので守れている。ただし境目の白い細線（縁取り）はまだ描けない。
#
# ## 描かなかったもの（理由）
# - 線と箱の白い縁取り：参考 2-2-5「色と色の境界には白または黒の細線」。道具がまだ縁取りを持たない。
# - 駅番号：2014 年の発表は路線記号だけ。この図も記号までにした。
# - 新幹線・他社線：作風の説明に要らない。
#
# ## 架空であること
# 路線・駅・色・記号はすべて架空。実在の事業者の図をなぞったものではなく、社名・ロゴも入れていない。
# 線は水平・垂直・45° だけ（日本の路線図の決まり）。駅の間隔は実際の距離ではない。
# palette の鍵は路線記号そのもの（G・O・B・M）—— 鍵が図の中に文字で出る。
