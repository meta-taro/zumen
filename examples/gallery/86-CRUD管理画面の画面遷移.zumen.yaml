version: 1
kind: placement
title: CRUD 管理画面の画面遷移（一覧 → 作成 / 編集 / 削除確認）
# 管理画面の型。**一覧が中心**で、そこから作成・編集・削除へ出て、必ず戻る。
# 破線＝操作の結果。削除は**確認を挟んでからでないと消えない**。
#
# **戻り先が全部「一覧」なのが、この型の肝。** 作成した直後に詳細へ飛ばすと、
# 続けて 10 件登録する人が毎回戻る操作をすることになる。
# 管理画面を使うのは**同じ作業を何十回も繰り返す人**なので、
# 1 回あたり 1 操作の差が、そのまま作業時間の差になる。
#
# **確認を挟むのは削除だけ。** 作成・編集は取り消せるが、削除は取り消せない ——
# 取り消せる操作にまで確認を出すと、人は確認を読まずに押すようになる。
