#
# だから「あ」と「1」は**同じ形**で、前に**数符**があるかどうかで決まる。
# 母音は ①②④ だけで作り、子音はそこへ点を足す（か行は ⑥ を足すだけ）。
#
# 漢字が無いので、**語で区切る「ますあけ」**が要る ——
# 区切らないと「ここで／はきもの」と「ここでは／きもの」のどちらにも読める。
