version: 1
wrap: true
title: 店舗の在庫と発注
# **在庫の図は、モノの流れと数字の流れを分けて描く。**
# 仕入先 → 配送待ち → 店舗在庫 はモノ（太線）。販売実績 → 在庫 → 発注の判断 は数字（細線）。
# **止まる理由が違う**ので、同じ線で描くと切り分けられない。
#
# ## 棚卸しが要るのは、数字がずれるから
#
# レジを通らない減り方（破損・万引き・廃棄）があるので、
# **帳簿の在庫と実物は必ずずれる。** 棚卸しは、ずれを実物側へ合わせにいく工程。
#
# ## 発注の判断は店舗に残す
#
# 需要予測は本部が出すが、決めるのは店舗。
# **図で決定点がどこにあるかを示す**のは、責任の所在を書くことでもある。
pins:
  hachu:
    appearance: primary
groups:
  - id: mise
    label: 店舗
  - id: honbu
    label: 本部
  - id: torihiki
    label: 取引先
nodes:
  - id: pos
    type: generic
    label: レジ
    technology: POS
    group: mise
  - id: zaiko
    type: database
    label: 店舗在庫
    group: mise
  - id: hachu
    type: cluster
    label: 発注の判断
    technology: 基準を下回ったら
    group: mise
  - id: tanaoroshi
    type: generic
    label: 棚卸し
    technology: 月 1・実数で帳簿を補正
    group: mise
  - id: honbuzaiko
    type: database
    label: 全店在庫
    group: honbu
  - id: yosoku
    type: generic
    label: 需要予測
    group: honbu
  - id: shiire
    type: generic
    label: 仕入先
    technology: 発注を受ける
    group: torihiki
  - id: butsuryu
    type: queue
    label: 配送待ち
    technology: 店舗へ入荷
    group: torihiki
edges:
  - from: pos
    to: zaiko
    label: 販売実績
  - from: tanaoroshi
    to: zaiko
  - from: zaiko
    to: honbuzaiko
  - from: honbuzaiko
    to: hachu
  - from: yosoku
    to: hachu
    label: 推奨数
  - from: hachu
    to: shiire
  # **モノの流れは太線**（仕入先 → 配送待ち → 店舗在庫）。ほかの細線は数字の流れ
  - from: shiire
    to: butsuryu
    weight: thick
  # 入荷は配送待ち → 店舗在庫。輪（在庫 → 発注 → 仕入先 → 配送 → 在庫）を自動配置が切るときに
  # 線が交わるので、辺は店舗在庫の側から書き、矢じりを店舗在庫（from）に付ける。
  # 「発注」「入荷」の文字は長い線の別の所に付いて読み違えるので、箱の副題に書いた
  - from: zaiko
    to: butsuryu
    weight: thick
    ends: { from: arrow, to: none }
