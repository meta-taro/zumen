# **緊急自動車の決まり。どれが法令で、どれが法令ではないか。**
# 子どもは「消防車は赤、パトカーは白黒、救急車は白」を同じ種類の決まりだと思っている。
# 実際は**決まっている場所が違う。** この図は、それを 1 枚で分ける。
#
# ## 法令で決まっていること（細目告示 第 231 条）
# - 警光灯は**前方 300m から点灯が確認できる赤色**（1 号）
# - サイレンは**前方 20m で 90dB 以上 120dB 以下**。測るマイクは車両中心線上・前端から 20m・**地上 1m**、
#   C 特性、エンジンを止めて測る（2 号）
# - 車体の色は**消防自動車が朱色、その他の緊急自動車は白色**（3 号）。**大部分**がその色なら適合（4 号）
# - **警察自動車は、白色の決まりから外れている**（3 号ただし書き）。
#   だから**パトカーの白黒の塗り分けは、保安基準の決まりではない。** 覆面の車が走れるのもこのため。
#   白黒を何が決めているか（警察の内部の定めか）は、一次資料で**確かめていない**ので図には書かない。
# - 告示は**色の名前（朱色・白色）しか書いていない。** 色の値は決めていないので、図の朱色は近似の色。
#
# ## 走るとき・譲るとき（道路交通法・施行令）
# - 緊急の用務で走るときは**サイレンを鳴らし、かつ赤色の警光灯をつける**（施行令 14 条）。
#   ただし警察用自動車が速度違反を取り締まるときは、サイレンを鳴らさないことがある
# - 一般道路の最高速度は **80km/h**（施行令 12 条 3 項）
# - 交差点やその付近では、ほかの車は**交差点を避け、道路の左側に寄って一時停止**（道交法 40 条 1 項）。
#   それ以外の場所では**左に寄って進路を譲る**（同 2 項）
# - **黄色の灯火**は道路維持作業用自動車のもの（施行令 14 条の 3）。緊急自動車ではない
# - 「鐘」は、消防用自動車**以外**の消防用車両が「サイレン又は鐘」を鳴らす決まり（施行令 14 条の 4）。
#   消防自動車が帰りに鐘だけを鳴らすのは**慣行**（メーカーの説明。地域によって鳴らさない）
#
# ## なぜ消防車は赤いのか
# メーカーは「輸入した消防車が赤色だったので、保安基準を決めるときに朱色にしたのが一般的な理由のようです」と書く。
# **「ようです」なので、理由としては描かない。** 図に書くのは、どこで決まっているかだけ。
#
# ## 描かなかったもの
# - **公的機関の章（旭日章・消防章）、車体の文字、実在の車の外観** —— 本物に見えるものを作らない。車は箱で描いた
# - 警光灯の**数と取り付け位置** —— 告示は色と見える距離だけを決めている
# - サイレンの**音の形（ウー・ピーポー）** —— 告示は音量だけを決めている
#
# 出典（2026-10-06 に読んだ）：細目告示 第 231 条（国土交通省の条文 PDF。第 153 条・第 75 条も同文）、
# 保安基準 第 49 条、道路交通法 第 39〜40 条、同施行令 第 12〜14 条の 4（e-Gov）、モリタ FAQ。
