<g data-name="t"><text x="390" y="57" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">半袖シャツ　S サイズ　工業用パターン（縫い代つき）</text></g>
<g data-name="n0"><text x="40" y="415" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・地の目線は布の縦地と平行に置く。斜めに置くと、洗ったあとに捻れる</text></g>
<g data-name="n1"><text x="40" y="437" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・「わ」の辺は折山。切り開かない（後ろ身頃は 1 枚で左右がつながる）</text></g>
<g data-name="n2"><text x="40" y="459" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・合印は縫い代の端から 3 mm の切り込み。深く入れると縫い代から出る</text></g>
<g data-name="n3"><text x="40" y="481" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">・工業用は縫い代つき。生地にチャコで出来上がり線を書かない</text></g>
