title: 小学校の回路図（直列つなぎと並列つなぎ）
# **回路は「わ」。** かん電池の＋から出て、ぐるっと回って−へもどる道が
# 1 本つながっていないと、豆電球は光らない。
#
# 記号は 3 つで足りる —— **かん電池**（長いほうが＋きょく）、**豆電球**（丸の中にバツ）、
# **スイッチ**（切れている形）。3 年で「電気の通り道」、4 年で「電流のはたらき」
# として直列つなぎと並列つなぎを習う。
#
# **ちがいは明るさだけではない。** 豆電球を 1 こ外したとき、
# 直列なら両方消え、並列ならもう 1 こは光ったままになる。
#
# 記号は小学校の教科書の書き方（`symbol: cell`）。
# JIS の `battery` は長短 2 組なので、2 こ並べると紙の上では 4 こに見える。
