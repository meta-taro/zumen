version: 1
kind: placement
arrows: true
title: 閉塞と信号現示（ATS-P の速度照査パターンつき）
# **1 つの閉塞区間に入れる列車は 1 本だけ。** それが閉塞の意味。
#
# ## 現示は、先行列車から逆算して落ちていく
#
# 先行列車が居る閉塞の手前が**停止（赤 1）**、
# その手前が**注意（黄 1）**、さらに手前が**減速（青 1 ＋ 黄 1）**、
# その先が**進行（青 1）**。
#
# **警戒（黄 2）**は、閉塞が短いときや分岐の手前に入る。
#
# ## ATS-P はパターンで見る
#
# 停止信号の手前に**速度の上限の曲線**を引き、
# **超えるとブレーキがかかる。** 運転士が気づかなくても止まる。
# 見るのは停止信号だけでなく、曲線・分岐器・勾配の制限も同じ。
#
# 速度の目安は事業者と区間で違う。**現示の並び方は共通。**
