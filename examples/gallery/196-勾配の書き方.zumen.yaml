    label: "屋根は「寸」で書きます —— 水平 10 に対して垂直がいくつか。4 寸勾配なら 4/10 で、角度にすると 21.8° です。"
    marker: none
    align: left
    at: { x: 150, y: 1242 }
    size: { w: 1000, h: 18 }
  - id: n3
    label: "スロープは「分数」です。1/12 は 4.8°。高さ 750mm を上がるには、長さが 9,000mm 要ります。"
    marker: none
    align: left
    at: { x: 150, y: 1264 }
    size: { w: 1000, h: 18 }
  - id: n4
    label: "道路はパーセント、鉄道はパーミル（‰）。同じ 35‰ は 3.5% で 2.0° です。"
    marker: none
    align: left
    at: { x: 150, y: 1286 }
    size: { w: 1000, h: 18 }
  - id: n5
    label: "建築基準法施行令 26 条はスロープを 1/8 以下と定め、バリアフリー法は 1/12 以下を求めています。"
    marker: none
    align: left
    at: { x: 150, y: 1308 }
    size: { w: 1000, h: 18 }
  - id: n6
    label: "10 寸勾配は 45° で、「矩（かね）勾配」と読みます。"
    marker: none
    align: left
    at: { x: 150, y: 1330 }
    size: { w: 1000, h: 18 }
  - id: n7
    label: "数値は代表的な値です。用途と法令で変わります。"
    marker: none
    align: left
    at: { x: 150, y: 1352 }
    size: { w: 1000, h: 18 }
