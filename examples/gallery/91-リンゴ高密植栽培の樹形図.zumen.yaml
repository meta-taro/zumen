title: リンゴ 高密植栽培の樹形図（トールスピンドル・樹高 3.2m／樹間 0.9m／列間 3.0m）
# 1 px = 10 mm。**高さと間隔に意味がある図**なので、縮尺を持たせてある。
#
# ## 高密植は「小さい樹を密に植える」ではない
#
# **密に植えることで小さい樹をつくる。** 順序が逆だと、数年で枝が交差して光が入らない。
# 10a あたり 300〜410 本、列間 3.0〜3.5m、樹間 0.8〜1.0m、樹高 3.0〜3.5m。
#
# ## 側枝は下へ誘引する
#
# 上向きの枝は伸び続けて実が付かない。**下垂させると伸びが止まり、花芽が付く。**
# **角度が記法そのもの** —— この図で枝が下を向いているのは、絵の都合ではない。
#
# ## 側枝の更新
#
# **主幹の 1/3 を超えた側枝は切る。** 太らせると主幹と競合して樹形が崩れる。
# 切り方は 2 つあり、図の上で区別する。
#
# - **切り返し**（枝の途中で切る）… 切った先から強い枝が出る
# - **間引き**（枝の基部から切る）… 新しい枝は出ない。**更新はこちら**
