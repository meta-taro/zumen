title: トラックの積載計画図（軸重の配分／架空の 3 軸車）
scale: { mm: 20 }
# **軸重は、荷の重さではなく「重さ × 軸からの距離」で決まる。**
#
# ## 同じ重さでも、置き場所で判定が変わる
#
# 前へ寄せすぎると**前軸が超える。**
# 後ろへ寄せすぎると**後軸が超え、前輪が浮く**（ハンドルが効かなくなる）。
#
# **重い荷ほど軸の近くへ置く。**
#
# ## 空車の重心も計算に入れる
#
# 荷だけでは合わない。**空車重量とその重心**を先に置いてから、荷を足す。
#
# ## 一般的制限値
#
# 総重量 20 t、軸重 10 t、輪荷重 5 t、長さ 12 m、幅 2.5 m、
# 高さ 3.8 m（指定道路は 4.1 m）。**1 つでも超えたら特殊車両**で、通行許可が要る。
