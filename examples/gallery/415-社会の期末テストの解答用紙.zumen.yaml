# **社会の解答用紙は、地図と年表の上で答える。** 記号・漢字・並べかえ・字数の指定が、問いごとに違う。
#
# 決まり（長野県 令和 7 年度 後期選抜 社会、取得 2026-11-05）——
# 漢字で書くよう指示された問いは漢字で。指示が無ければ、漢字の部分をひらがなで書いてもよい。
# 字数を指定された答えは、句読点・カギ括弧も 1 字に数える。並べかえは古い順に左から記号を書く（欄は → でつなぐ）。
# 複数の小問をあわせて配点するものは、すべて正しいときだけ正答。
# 様式・地図の形・問いはすべて架空。実在の地図の輪郭はなぞっていない。
