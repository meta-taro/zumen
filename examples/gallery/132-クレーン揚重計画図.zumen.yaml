version: 1
kind: placement
arrows: false
title: クレーン揚重計画図（架空の 50 t 級ラフター・作業半径 10 m）
# **吊れるかどうかは、荷の重さだけでは決まらない。**
# 同じクレーンでも、**腕を伸ばすほど吊れなくなる。**
# だから揚重計画では、**作業半径とブーム長の組**で定格総荷重を引く。
#
# ## 定格総荷重に何が入っているか
#
# **フックと玉掛けワイヤの質量を含む。** ブームから下が全部入る。
# だから「定格総荷重 17.0 t」の位置で吊り具が 0.8 t なら、
# **荷は 16.2 t まで**。ここを取り違えると、表の数字だけ見て吊れると思う。
#
# ## 表の読み方
#
# **縦が作業半径、横がブーム長。** 作業半径は**ブームのたわみを含んだ値**で、
# 空荷のときの半径ではない。値はすべて**アウトリガー最大張出し**のとき。
#
# **太線（この図では斜線）で囲まれた所は「強度域」。**
# ブームや本体の強度で決まっていて、**超えるとブームが壊れる。**
# それ以外は**安定度**で決まっていて、**超えると転倒する。**
# **壊れ方が違うので、同じ「超過」でも意味が違う。**
#
# ## 仮置場も据付位置も、使う半径の内側に置く（2026-09-29 専門家レビューで直した）
#
# 以前は仮置場が半径約 14.5 m、据付位置が約 16.7 m にあった。表では 14 m で 10.8 t、
# 18 m で 7.2 t —— **総重量 12.8 t は吊れない（過負荷）**。計算は「半径 10.0 m」で
# 合格にしていたので、図と計算が食い違っていた。**計算に使う半径は、吊り上げから据付までの
# 最大の作業半径。** 仮置場・据付位置を半径 9.5〜9.8 m に寄せ、左から右へ旋回する計画にした。
# 最大の値 50.0 t は「50 t 級」と合わせた（以前は 55.1 t で級を超えていた）。
# 強度域の斜線は、表の左上（短いブーム・小さい半径）にまとまる。「—」のセルには付けない。
#
# 定格荷重は「負荷させることができる最大の荷重（＝定格総荷重）から、フック等のつり具の重量を
# 控除した荷重」（クレーン等安全規則 第 1 条）。過負荷の禁止は同 第 69 条（移動式クレーン）。
# https://laws.e-gov.go.jp/law/347M50002000034/ （取得 2026-09-29）
#
# 平面の車体とアウトリガーも縮尺どおりにした。以前は車体幅 6 m、張出しが左右 19 m に
# 描かれていて、ラベルの「左右 6.2 m」と縮尺が合っていなかった（50 t 級の全幅は 3 m 弱）。
#
# 1 px ＝ 100 mm。機種・数値はすべて架空。
