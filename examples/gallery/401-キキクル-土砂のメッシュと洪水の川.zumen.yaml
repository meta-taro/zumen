# **キキクル（危険度分布）は、どこで危険が高まっているかを地図に塗る。** 土砂はメッシュに、洪水は川の流路に。
#
# 決まり（気象庁「土砂キキクル」「洪水キキクル」「大雨キキクル」「浸水キキクル」、取得 2026-10-20）——
#
# - 土砂キキクル：1km 四方のメッシュ、10 分ごとに更新。60 分雨量と土壌雨量指数の実況と 6 時間先までの予測で 5 段階
#   - 注意（黄）＝実況か 6 時間先までが注意報の基準以上（警戒レベル 2 相当）
#   - 警戒（赤）＝3 時間先が危険警報の基準以上（3 相当）
#   - 危険（紫）＝実況か 2 時間先までが危険警報の基準以上（4 相当）
#   - 災害切迫（黒）＝実況が特別警報の基準以上（5 相当）。過去 30 分の最大を表示
# - **平坦で土砂災害が起きえない所・人が住まない所には警報・危険警報の基準が無く、赤・紫・黒にならない**（黄まで）
# - 高齢者等は遅くとも赤、一般の人は遅くとも紫で避難を始める。**黒を待たない**
# - 2026 年 5 月の新しい防災気象情報で、「周辺 3km 四方の最大」を当該メッシュの危険度とする扱いを廃止した
# - 洪水キキクル：中小河川（水位周知河川・その他河川）の流路に沿って 5 段階。3 時間先までの流域雨量指数。
#   紫・赤は上流から下流へ移る傾向があり、上流も見る。上流の人の住まない所でも紫・赤・黄は出す。
#   洪水予報河川（大きな川）は指定河川洪水予報と水害リスクラインで見る
# - 大雨キキクル（2026 年 5 月から）は、浸水キキクルと洪水キキクルのうち危険度の高いほうを出す
# - 色（気象庁のキキクルの地図タイルの色表を 2026-10-20 に読んだ値。内閣府の警戒レベル 5 色と同じ）：
#   黒 12,0,12／紫 170,0,170／赤 255,40,0／黄 242,231,0。2022 年 6 月 30 日に黒を足し、うす紫と濃い紫を紫にまとめた
#   （気象庁の配色指針 2020 年 7 月版にある「極めて危険」「非常に危険」の値は、それより前のもの）
#
# ## 筋書き（架空）
#
# 南が平地、北の端が人の住まない奥山、その間が谷に集落のある山地。南西から北東へ線状の強い雨。
# 土砂のメッシュは、雨の強さで段階を決め、**平地と奥山は黄で止めた** —— 同じ雨でも、破線を越えると色が変わらなくなる。
# 川の危険度は、上流で降った雨が流れ下りながら薄れる簡単な式で決めた（B 川は中流から下流が紫、C 川は上流が赤）。
# 町・川・雨は架空。**実在の場所・大雨とは関係ない。**
#
# ## 描き方
#
# メッシュは同じ段階どうしをつないで輪にし、黄から順に塗った（全マスで色違い 0 を確かめてある。見本 399 と同じ作り方）。
# 洪水の川は、同じ段階の続く区間を幅のある帯にして塗った（黄の線は紙の上で細いと読めないため、線ではなく面にした）。
# 地形の境（平地・奥山）は、メッシュの縁に沿った破線。
# 黒（12,0,12）は暗い画面の地とほとんど同じなので、黒のメッシュだけ縁を一段太くした（色の無いマスと読み違えないように）。
#
# ## 描かなかったもの
#
# - 浸水キキクル（1km メッシュ、1 時間先まで）と、2 つを合わせた大雨キキクル —— 平地の危険の見方として説明にだけ書いた
# - 洪水キキクルの「今後の情報等に留意」の川の色（値を一次資料で確かめていない。この図では地図の川の色のまま）
# - 洪水予報河川の湛水型内水氾濫のハッチ、水害リスクライン
# - 土砂災害警戒区域（避難の判断はメッシュと区域の重なりで行う。区域の線は持っていない）
# - 雨雲の動き（レーダー）・今後の雨
