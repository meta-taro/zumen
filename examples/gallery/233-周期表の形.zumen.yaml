version: 1
kind: placement
arrows: true
title: 周期表の形は、電子配置そのもの
# **ブロックの幅 2・6・10・14 は、軌道の定員。**
#
# 軌道の数は 2ℓ ＋ 1、入る電子はその 2 倍（上向きと下向き）——
# だから列の幅はこの 4 つの数にしかならない。
# 各周期の元素数 2・8・8・18・18・32・32 も、同じ足し算。
#
# **族は価電子の数。** 同じ族が似た性質なのは、いちばん外の電子の数が同じだから。
#
# **ランタノイドとアクチノイドを下に出すのは、入り切らないから** ——
# あの「離れ小島」は紙の都合で、電子の並びとしては 3 族に 14 列ぶん挟まっている。
