# 字の大きさが固定なので、様式を 1.25 倍で描いて A3 へ縮めて収める（紙の上で字は約 2.5mm。元の様式の小さい字とほぼ同じ）。
# 出典：
#   法務省民事局長通達「戸籍届書の標準様式の全部改正について」令和 8 年 2 月 26 日 法務省民一第 394 号（別紙 1〜35。令和 8 年 4 月 1 日施行、
#   従前の様式の用紙も当分の間使える）別紙 2。内閣府 地方分権改革の提案募集の資料に収録
#   https://www.cao.go.jp/bunken-suishin/teianbosyu/doc/r07/tb_r7fu_08moj_106_1.pdf（取得 2026-11-10）
#   法務省「婚姻届」—— 成年の証人 2 名の署名が要る（押印は任意）https://www.moj.go.jp/ONLINE/FAMILYREGISTER/5-2.html
