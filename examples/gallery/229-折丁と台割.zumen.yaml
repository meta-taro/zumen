version: 1
kind: placement
arrows: true
title: 折丁と台割 —— 背標は階段に並ぶ
# **本は、ページを 1 枚ずつ重ねたものではない。**
# 全紙 1 枚に 16 ページを刷って、折って、束ねたもの。
# だから**総ページ数は折丁の倍数**になる（192 ＝ 16 × 12）。
#
# **背標は、重ねたとき階段に並ぶ。** 折ごとに印の位置を少しずつ下げてあるので、
# **1 折でも入れ違うと段が崩れる** —— 本を開かなくても、背を見るだけで分かる。
#
# **検査を絵にした仕掛け。** 数えるのではなく、形が合っているかを見る。
