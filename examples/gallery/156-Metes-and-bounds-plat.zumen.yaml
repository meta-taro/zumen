title: "Metes and bounds plat (fictional)"
scale: { in: 12 }
north: up
# **A deed does not draw the land. It describes a walk.**
#
# Start at the point of beginning, take each call in turn - a bearing and a
# distance - and the last one has to bring you back. The drawing is the check
# on the words: **if the calls do not close, the description is broken.**
#
# A bearing is never over 90 degrees. It is read from north or from south,
# turned toward east or west, so the quadrant letter carries the rest:
# N 89°45'00" E is "face north, turn 89 degrees 45 minutes toward east".
#
# This parcel closes to 0.04 ft in 892.90 ft (1 : 20,143) because it was
# computed rather than walked. **A field traverse never closes at zero** - the
# ratio is how a survey says how well it closed.
#
# 1 px = 1 ft. Bearings, distances and monuments are fictional.
