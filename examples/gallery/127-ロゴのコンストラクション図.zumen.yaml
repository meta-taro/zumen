title: ロゴのコンストラクション図（コンパスと定規だけで作る／架空のマーク）
# **この図に描いてある形は、すべてコンパスと定規だけで作れる。**
# 分度器も物差しの目盛りも使わない —— 使うのは「円を描く」と「2 点を結ぶ」の 2 つだけ。
#
# ## なぜロゴを作図するのか
#
# ブランドの手引書には、ロゴの**コンストラクション図（作図図）**が載る。
# 「どう見えるか」ではなく「**どう作られているか**」を渡すためで、
# 作図図があれば、拡大しても刷り直しても同じ形が再現できる。
# 黄金比のグリッドは、その定番のひとつ。
#
# ## 黄金比は、目分量ではなく作図で出る
#
# φ ＝（1 ＋ √5）/ 2。**√5 は直角三角形から出る** —— 辺が 1 と 1/2 なら斜辺は √5 / 2。
# だから定規とコンパスだけで、線分を黄金比に分けられる（手順 1〜6）。
#
# ## 破線の円は「コンパスの跡」
#
# 実線がマークの形、**破線はそれを出すために回したコンパス**。
# 作図図では跡を消さない —— 消すと、どう作ったかが読めなくなる。
#
# 座標は 1 px に丸めてある。**比の出どころは下の表にある。**
# 架空のマークで、実在の商標を写したものではない。
views:
  - id: build
    title: 手順　線分を黄金比に分ける
    at: { x: 60, y: 210 }
    size: { w: 660, h: 280 }
  - id: mark
    title: 組み立て　φ の階段と黄金角
    at: { x: 790, y: 210 }
    size: { w: 400, h: 280 }
