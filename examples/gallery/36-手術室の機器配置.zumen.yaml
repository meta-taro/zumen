version: 1
kind: placement
title: 手術室 機器配置図（OR-3）
# **手術室の配置図は、清潔と不潔を分けるための図。**
# 室圧 ＋15Pa は**中の空気を外へ押し出す**ためで、
# 廊下の埃が入らないようにしている。前室があるのは、その圧を保つため。
#
# ## 層流吹出の真下が、いちばん清潔
#
# 天井から下へまっすぐ流す（層流）ので、**手術台はその真下に置く。**
# 機器を吹出の下へ置くと、気流が乱れて清潔域が崩れる。
#
# ## 動かせるものと、動かせないもの
#
# 医療ガスと電気は壁・天井から来るので**位置が固定**される。
# 麻酔器と器械台は動かせる。図で分けて描くのは、そこが手術の型で変わるから。
#
# ## 機器は部屋ではない
#
# 手術室は 1 室（7.2m × 6.6m ≒ 48m²）。前室と手洗いコーナーはその外に付く。
# 麻酔器は患者の頭側、器械台は足側、医療ガスは天井のペンダント、
# 非接地配線の絶縁監視盤（ISP）は壁付け。手術室の電源は非接地配線方式（JIS T 1022:2018「病院電気設備の安全基準」。
# 絶縁変圧器の二次側を接地せず、対地インピーダンス 50kΩ 以下で表示灯と音で警報）。
# 1 px = 25 mm
# 出典：JIS T 1022:2018 本文（kikakurui.com、取得 2026-10-02）
