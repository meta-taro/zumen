title: 生け花の構成図（生花正風体の三主枝／池坊）
# **長さが比で決まる図。** 花器の大きさが変われば、全部変わる。
#
# ## 三主枝
#
# **真（しん）・副（そえ）・体（たい）** の三つの役枝で組む。
# 古来、万物の基礎と考えられてきた**三才（天・地・人）**になぞらえたもので、
# 飾りではなく**構造**。
#
# - **真** —— 花器の **2.5〜3.5 倍**。作品の芯。奥へ
# - **副** —— 真の **2/3**。真の曲がりに沿い**後方**へ（奥行きを出す）
# - **体** —— 真の **1/3**。**前方に低く**
#
# ## 2 つの図が要る
#
# **上から見ると不等辺三角形**、**手前から見ると奥側に真**。
# 正面図だけでは奥行きが決まらないので、**平面図と組で描く。**
#
# ## 生ける順
#
# **真 → 副 → 体・控。** 順番を変えると、比で決まる寸法が決まらない。
#
# ## 花留め
#
# 生花は花留を使って草木を自立させる様式（華道家元池坊「生花（しょうか）」https://www.ikenobo.jp/ikebanaikenobo/shoka/ 、
# 真・副・体が三才になぞらえた三つの役枝であること、正風体が明治に規範として示されたことも同じ頁。取得 2026-10-04）。
# 花留の種類（又木・一文字などの「こみ」）は池坊の教本で確かめていないので図では名前を出さない。
# 剣山は明治に入って広まった道具とされる（ja.wikipedia「花留め」。二次資料）。
# 長さの比（真＝花器の 2.5〜3.5 倍、副＝真の 2/3、体＝真の 1/3）は一般の解説の目安で、池坊の教本の数値は確かめていない。
