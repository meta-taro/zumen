version: 1
kind: placement
arrows: false
title: 歯周精密検査チャート（6 点法・初診時／架空の症例）
# 歯科医院で 1 歯 6 点を測って記録する用紙。専用ソフトか紙の様式で作られている。
# 上が上顎（18〜28）、下が下顎（48〜38）。歯番は FDI 方式。
# 各歯の 2 段は頬側と舌側で、1 段に近心・中央・遠心の 3 点。
# **塗った升が BOP（プロービング時の出血）** —— 色ではなく塗りで示す（DESIGN.md §7）。
# 欠損歯は升に × を入れる。動揺度は 0〜3、根分岐部は Ⅰ〜Ⅲ。
