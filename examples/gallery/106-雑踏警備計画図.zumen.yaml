title: 雑踏警備計画図（花火大会・駅から会場まで／400 × 200m）
# 1 px = 500 mm。**人の流れの図。** 見本 93（保安距離）の、人の側。
#
# ## 狭い場所へ、両方向から流し込まない
#
# 2001 年の明石花火大会歩道橋事故は、**狭い歩道橋に両方向の流れが入った**ことが
# 原因のひとつだった。この計画では**往路と復路を分けて一方通行**にする。
#
# ## 数で決める
#
# 歩道橋は幅 6m。一方通行で 1.0 m/s、密度 2 人/m² なら **12 人/秒 ＝ 720 人/分**。
# 駅から出てくるのは列車 1 本 1,000 人 ÷ 5 分 ＝ **200 人/分**。
# **流せる量 > 入ってくる量**なので溜まらない。
# 逆になったら、**手前で止める**（列車を待たせる）。
#
# ## 密度が意味を持つ
#
# 6〜7 人/m² で、人は自分の意思で動けなくなり、**群衆が流体のように振る舞う。**
#
# 場所は架空。
