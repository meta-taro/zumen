version: 1
kind: placement
arrows: true
title: 換気扇の風量と静圧（カタログの数字は、ダクト無しの値）
# **カタログの風量は、ダクトを付けない状態の数字**（自由吐出）。
# 実際に出るのは、**ファンの曲線（P-Q 曲線）とダクトの抵抗曲線が交わる点。**
#
# **抵抗は風量の 2 乗で効く**（P ＝ k Q²）。同じ 600 m³/h のファンでも、
# 短く太い配管なら 489（82%）、ふつうで 380（63%）、
# **長く曲がった配管では 256（43%）**しか出ない。
# **曲がり 1 つが直管 2〜3m 分**なので、太くするより曲がりを減らすほうが効く。
#
# 要る風量は部屋の大きさから出る —— 24 時間換気は **0.5 回/h**
# （2 時間で 1 回入れ替え）。床 50m² × 高さ 2.4m なら 60 m³/h。
#
# **プロペラは静圧に弱い**ので外壁に直付け、**シロッコは静圧に強い**のでダクトを引ける。
#
# ※ ①のファン特性は模式（自由吐出 600 m³/h、無風量時 200Pa）。
