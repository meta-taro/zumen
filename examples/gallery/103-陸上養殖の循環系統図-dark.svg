<g data-name="o2"><text x="253" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">酸素供給</text><text x="253" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">溶存酸素 6 mg/L 以上</text></g>
<g data-name="pump"><text x="487" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">循環ポンプ</text><text x="487" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">系のぜんぶを回す</text></g>
