<g data-name="denit"><text x="1342" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">脱窒槽（貧酸素）</text><text x="1342" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">NO3⁻ → N2 ガス・側流</text></g>
<g data-name="co2"><text x="214" y="471" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">脱炭酸塔</text><text x="214" y="489" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">CO2 を抜く（pH が下がるため）</text></g>
<g data-name="ph"><text x="493" y="471" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">pH・アルカリ度調整</text><text x="493" y="489" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">重曹を足す。pH 7.0〜8.0</text></g>
<g data-name="uv"><text x="807" y="471" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">紫外線殺菌</text><text x="807" y="489" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">病原体を減らす</text></g>
<g data-name="heat"><text x="1102" y="458" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">熱交換</text><text x="1102" y="476" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">水温を一定に保つ</text></g>
<g data-name="o2"><text x="253" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">酸素供給</text><text x="253" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">溶存酸素 6 mg/L 以上</text></g>
<g data-name="pump"><text x="487" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">循環ポンプ</text><text x="487" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">系のぜんぶを回す</text></g>
<g data-name="make"><text x="214" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">補給水</text><text x="214" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">蒸発と汚泥で抜けた分（5%/日以下）</text></g>
<g data-name="sludge"><text x="1572" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">汚泥処理</text><text x="1572" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">系の外へ出す</text></g>

