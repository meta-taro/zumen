<g data-name="sludge"><text x="1450" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">汚泥処理</text><text x="1450" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">系の外へ出す</text></g>

