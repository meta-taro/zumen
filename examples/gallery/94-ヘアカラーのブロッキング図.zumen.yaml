version: 1
kind: placement
arrows: false
title: ヘアカラー ブロッキングと塗布順（リタッチ・全頭 6 ブロック）
# 美容室で使う指示図。**書く位置が頭の位置**そのもの（歯式・査定図と同じ型）。
#
# ## 順番が中身
#
# **染まりにくい所から塗る。** ネープ（襟足）は髪が硬く体温が届きにくいので
# いちばん遅い。顔まわりと頭頂は体温で早く進むので、いちばん最後。
# **全部を同じ仕上がりにするために、塗る時間をずらす。**
#
# ## 根元と既染部は別の薬
#
# 根元（新生毛）は 6%、既染部は 3% を最後の 10 分だけ。
# **既染部に 6% を長く置くと、色が抜けて赤くなる。**
#
# ## スライスは横
#
# 斜めに取ると、次の列との境目が線になって出る。1 枚 5〜10 mm。
