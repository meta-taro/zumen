version: 1
kind: placement
arrows: true
title: 継手と仕口（追掛大栓継ぎ・金輪継ぎ・番付／寸法は設計）
scale: { mm: 0.7 }
# **継手は材を長手に継ぎ、仕口は角度をもって組む。**
#
# どちらも**繊維どうしを噛み合わせて**力を伝える。だから**引かれるほど締まる**。
# 追掛大栓継ぎは、継手のなかで**いちばん引っ張りに強い** ——
# 水平力で引っ張りが働く外周部の梁などに使う。込み栓は**2 本打ちが基本**
# （4 本打っても耐力は変わらない）。1200 年ごろに原型、1400 年ごろに今の形。
#
# 金輪継ぎは**車知栓**（くさび）を打ち込んで締める。土台・柱の根継ぎ・梁に使う。
#
# **番付**は柱の位置の呼び方。横が「いろは」、縦が「一二三」で、交点を「ろ二」と呼ぶ。
# 材が何百本もあるので、名前が無いと**どこの材か言えない**。
#
# 寸法の割合（継手の長さ ＝ 材せいの 2.5 倍、目違い ＝ 1/6）はこの図の設計。
