<g data-name="b164"><text x="886" y="179" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">apex of home to the far corner</text></g>
<g data-name="b186"><text x="886" y="201" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">60'-6&quot;</text></g>
