<g data-name="b230"><text x="886" y="245" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">18'-0&quot; circle, 10 in high</text></g>
<g data-name="b252"><text x="886" y="267" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">127'-3 3/8&quot;</text></g>
