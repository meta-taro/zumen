<g data-name="n1"><text x="60" y="683" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">The infield is the same at every level above little league; the outfield is where parks differ.</text></g>
<g data-name="n2"><text x="60" y="705" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">Every distance starts at the apex of home plate, which is why the apex is the origin of the layout.</text></g>
<g data-name="n3"><text x="60" y="727" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">The mound is a circle and a height at once: 18 ft across, 10 in above the plate.</text></g>
<g data-name="n4"><text x="60" y="749" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">Field and figures follow the published dimensions; the drawing is schematic.</text></g>
<g data-name="h120"><text x="890" y="135" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">INFIELD  (MLB / NCAA / high school)</text></g>
<g data-name="h288"><text x="890" y="303" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">OUTFIELD  (MLB minimum)</text></g>
