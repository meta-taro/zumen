    retrieved: 2026-11-10
  - name: "厚生労働省「履歴書の様式例の作成について」令和 3 年 4 月 16 日 労働政策審議会安定分科会資料"
    url: https://www.mhlw.go.jp/content/11601000/000769679.pdf
    retrieved: 2026-11-10
# **刷って手で書く様式。** 罫線と字の位置は、A3 版の PDF から拾って mm に直した（1pt = 25.4/72 mm。紙の余白 10mm の内側が原点）。
# 決まり（同資料）—— JIS 規格の履歴書の様式例が削除されたため、公正な採用選考の参考として厚生労働省が定めた。
# 性別は「男・女」の選択ではなく任意記載（未記載も可）。「配偶者」「扶養家族数」「配偶者の扶養義務」「通勤時間」の欄は設けない。
# 法的拘束力は無い（使うかは企業の判断）。別の様式を使うなら、就職差別につながる項目を含めないよう留意する。
# 写真の大きさ（縦・横）の数字は、元の様式でも空欄。
