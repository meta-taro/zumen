<g data-name="sand"><text x="242" y="578" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">砂場</text></g>
<g data-name="n1"><text x="90" y="773" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">遊具のまわりには安全領域を取ります。落下高さが 600mm を超えるなら 1,800mm、以下なら 1,500mm です。</text></g>
<g data-name="n2"><text x="90" y="795" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">測るのは遊具の外形から全方向へ。すべり台の出口は勢いがあるので、もっと広く取ります。</text></g>
<g data-name="n3"><text x="90" y="817" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">安全領域どうしは重なってかまいません。 ただし遊具そのものが、他の遊具の安全領域に入ってはいけません。</text></g>
<g data-name="n4"><text x="90" y="839" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">この図では、遊具がほかの安全領域に入っていないことを機械で確かめています。</text></g>
<g data-name="n5"><text x="90" y="861" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">安全領域の中は、コンクリートやアスファルトにできません。砂・ウッドチップ・ゴムなどにします。</text></g>
<g data-name="n6"><text x="90" y="883" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">公園の形・配置は架空です。</text></g>
<g data-name="h80"><text x="1060" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">安全領域（落下高さで決まる）</text></g>
<g data-name="h226"><text x="1060" y="241" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">この図の遊具</text></g>
<g data-name="h372"><text x="1060" y="387" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">重なってよいもの・いけないもの</text></g>
<g data-name="h496"><text x="1060" y="511" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f0f13">開口の寸法（挟まり・すり抜け）</text></g>
<g data-name="b102"><text x="996" y="117" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">安全領域 1,500mm</text></g>
<g data-name="b124"><text x="996" y="139" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">安全領域 1,800mm</text></g>
<g data-name="b146"><text x="996" y="161" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">幼児用は 1,200 / 1,500mm</text></g>
<g data-name="b168"><text x="996" y="183" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">勢いがあるので 2,000mm ほど</text></g>
<g data-name="b190"><text x="996" y="205" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">遊具の外形から全方向へ</text></g>
<g data-name="b248"><text x="996" y="263" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">落下高さ 1500mm → 安全領域 1800mm</text></g>
<g data-name="b270"><text x="996" y="285" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">落下高さ 1600mm → 安全領域 1800mm</text></g>
<g data-name="b292"><text x="996" y="307" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">落下高さ 1200mm → 安全領域 1800mm</text></g>
<g data-name="b314"><text x="996" y="329" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">落下高さ無し（安全領域は要らない）</text></g>
<g data-name="b336"><text x="996" y="351" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">遊具もベンチも、安全領域の外にある</text></g>
<g data-name="b394"><text x="996" y="409" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">重なってよい</text></g>
<g data-name="b416"><text x="996" y="431" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">入ってはいけない</text></g>
<g data-name="b438"><text x="996" y="453" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">コンクリート不可。砂・ゴムなど</text></g>
<g data-name="b460"><text x="996" y="475" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">幼児用 2,000mm／児童用 3,000mm</text></g>
<g data-name="b518"><text x="996" y="533" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">100×157mm の器具が入ってはいけない</text></g>
<g data-name="b540"><text x="996" y="555" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">Φ230mm の器具が通り抜けられること</text></g>
<g data-name="b562"><text x="996" y="577" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">Φ8〜25mm の穴・隙間を作らない</text></g>
<g data-name="b584"><text x="996" y="599" text-anchor="start" font-family="sans-serif" font-size="12" fill="#f4f4f6">100mm 未満</text></g>
<g data-name="swing"><text x="518" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">ブランコ</text><text x="518" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a0a0ab">落下高さ 1600mm</text></g>
<g data-name="slide"><text x="258" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">すべり台</text><text x="258" y="341" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a0a0ab">落下高さ 1500mm</text></g>
<g data-name="bar"><text x="538" y="578" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">鉄棒</text><text x="538" y="593" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a0a0ab">落下高さ 1200mm</text></g>
<g data-name="a102"><text x="910" y="117" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">落下高さ 600mm 以下</text></g>
<g data-name="a124"><text x="910" y="139" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">600mm を超える</text></g>
<g data-name="a146"><text x="910" y="161" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">年齢制限エリア</text></g>
<g data-name="a168"><text x="910" y="183" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">すべり台の出口</text></g>
<g data-name="a190"><text x="910" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">どこから測るか</text></g>
<g data-name="a248"><text x="910" y="263" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">すべり台</text></g>
<g data-name="a270"><text x="910" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">ブランコ</text></g>
<g data-name="a292"><text x="910" y="307" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">鉄棒</text></g>
<g data-name="a314"><text x="910" y="329" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">砂場</text></g>
<g data-name="a336"><text x="910" y="351" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">確かめた</text></g>
<g data-name="a394"><text x="910" y="409" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">安全領域どうし</text></g>
<g data-name="a416"><text x="910" y="431" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">遊具と他の安全領域</text></g>
<g data-name="a438"><text x="910" y="453" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">保護面</text></g>
<g data-name="a460"><text x="910" y="475" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">落下高さの上限</text></g>
<g data-name="a518"><text x="910" y="533" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">胴が入らない</text></g>
<g data-name="a540"><text x="910" y="555" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">頭が抜ける</text></g>
<g data-name="a562"><text x="910" y="577" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">指が挟まらない</text></g>
<g data-name="a584"><text x="910" y="599" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f4f4f6">柵の隙間</text></g>
