title: 梅田の乗換関係図（同じ「梅田」に 7 つの駅／徒歩の所要）
# 大阪・梅田は **同じ地名なのに駅が 7 つ**あり、しかも駅名が事業者ごとに違う。
# 路線図では「乗換駅」の 1 点に見えるが、実際は地下街を歩く。
# **この図の中身は「どれとどれが、何分でつながるか」** ——
# 線の長さではなく、線に書いた分数が意味を持つ。
#
# 破線は改札を出て地下街を歩く区間。数字は改札から改札までの目安。
# 駅名・路線・事業者は事実。図は zumen で描いたもので、どの事業者の図の写しでもない。
