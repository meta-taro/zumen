version: 1
wrap: true
title: 記事ができるまで
# **紙と Web で、終点が違う。**
# 同じ原稿から、紙面下版と CMS の 2 つへ分かれる。
# **分かれたあとは締切も直し方も別**なので、1 本の線で描くと読めなくなる。
#
# ## 校正は戻る工程
#
# 校正から原稿へ戻る線がある。**戻る回数が決まっていない工程**は、
# そこで日程が伸びる。図に戻り線を描くのは、そこを数えるため。
#
# ## 写真は原稿と別に走る
#
# 現地取材から写真と原稿が同時に出て、校正で合流する。
# **並んで走る所を並べて描く**と、片方が遅れたときに何が止まるかが分かる。
