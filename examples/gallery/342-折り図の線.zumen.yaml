title: 折り図（線の形が、そのまま指示）
# **折り図には言葉がほとんど書いていない。線の形が指示そのものだから。**
#
# ## 同じ場所の線でも、結果が逆になる
#
# **谷折り線は破線（― ― ― ― ―）、山折り線は一点鎖線（― ・ ― ・ ―）。**
# 紙の同じ位置に引いても、**破線なら手前から向こうへ、一点鎖線なら向こうから手前へ**折る。
# 折ったあと端から見ると、**谷は V、山は Λ**になる。
#
# **切る線は ✂ の印。**
#
# ## だから言葉が要らない
#
# この記号体系は **1940〜50 年代に吉澤章が発展させ、
# その後サミュエル・ランドレットらが補完した**（吉澤・ランドレット系）。
# **線の形だけで、どちらへ折るかが世界中に通じる。**
#
# ## 基本形
#
# 折り紙には、**途中で止めた形に名前がついている**ものがある ——
# **鶴の基本形**（折り鶴を作る途中。**4 つのとがった「カド」**を持つ）、
# **あやめの基本形**、**さかなの基本形**、**とびらの基本形。**
#
# **完成形ではなく、途中の形に名前がある** —— そこから何種類にも分かれるから。
#
# 一点鎖線は zumen の `line: chain`（中心線・対称軸と同じ線種）。
# 型紙の側は見本 176・177・179、面付けは見本 190。
