# 同じ回路でも、どちらの記号体系で描くかで読む人が変わる。
#
# **回路図は配置図ではない。** 部品の位置は基板の上の位置と関係なく、
# **つながりだけが正しい** —— 線の長さにも意味は無い。
# 実物のどこに何があるかは、別に実装図（部品配置図）が要る。
#
# トランジスタとオペアンプは足に名前（B/C/E、＋/−）が要るので、この図には入れていない。
# **記号だけ描いて足を書かないと、向きが読めない図になる。**
