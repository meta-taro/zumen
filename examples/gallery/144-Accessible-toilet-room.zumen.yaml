    size: { w: 50, h: 18 }
  - id: llav
    label: "LAV"
    marker: none
    align: left
    at: { x: 356, y: 343 }
    size: { w: 60, h: 18 }
  - id: lclear
    label: "60 x 56 clear"
    marker: none
    align: left
