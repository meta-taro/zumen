version: 1
kind: placement
arrows: false
title: "Accessible single-user toilet room (fictional)"
scale: { in: 0.25 }
wall: { in: 2, outer: 3 }
grid:
  x:
    - { id: A, at: 60 }
    - { id: B, at: 444 }
  y:
    - { id: 1, at: 60 }
    - { id: 2, at: 396 }
# **The drawing is made of clearances, not of fixtures.**
#
# What makes this room work is the empty space: a 60 in turning circle, a
# 60 x 56 in clear floor space at the water closet, and 30 x 48 in at the
# lavatory. **The fixtures are what is left over.**
#
# Dimensions follow the 2010 ADA Standards (604 / 609 / 305 / 304).
# The room and the fixtures are fictional.
nodes:
  - id: rm
    label: ""
    at: { x: 60, y: 60 }
    size: { w: 384, h: 336 }
    openings:
      # Hinge at the top end, swinging in. The pull side keeps 18 in beyond
      # the latch (y 312) and the swing stays clear of the WC clearance (x 290).
      - { kind: door, side: right, at: 0.3214, width: 144 }
  # The water closet sits with its tank on the LEFT wall (the rear wall);
  # the TOP wall is the side wall. 604.3.1: 60 in from the side wall,
  # 56 in from the rear wall.
  - id: clear
    label: ""
    line: dashed
    hatch: lines
    at: { x: 66, y: 66 }
    size: { w: 224, h: 240 }
  - id: wc
    label: ""
    marker: ellipse
    at: { x: 82, y: 94 }
    size: { w: 120, h: 88 }
  # 604.5.1: side bar 42 in long, 12 in max from the rear wall,
  # reaching 54 in min from the rear wall (x 114 to 282).
  - id: gbSide
    label: ""
    hatch: solid
    at: { x: 114, y: 66 }
    size: { w: 168, h: 5 }
  # 604.5.2: rear bar 36 in long, 12 in to the side-wall side of the
  # centreline (y 138) and 24 in to the open side (y 90 to 234).
  - id: gbRear
    label: ""
    hatch: solid
    at: { x: 66, y: 90 }
    size: { w: 5, h: 144 }
  - id: lav
    label: ""
    hatch: dots
    at: { x: 330, y: 314 }
    size: { w: 96, h: 76 }
  # 606.2: forward approach, 30 in wide x 48 in deep, reaching under the
  # lavatory as knee and toe clearance.
  - id: lavClear
    label: ""
    line: dashed
    hatch: lines
    at: { x: 318, y: 198 }
    size: { w: 120, h: 192 }
  - id: turn
    label: ""
    marker: none
    radius: 120
    at: { x: 258, y: 264 }
    size: { w: 4, h: 4 }
  - id: m1
    label: "Water closet centerline 16-18 in from the side wall (604.2)"
    marker: none
    align: left
    at: { x: 508, y: 62 }
    size: { w: 520, h: 18 }
  - id: m2
    label: "Clear floor space 60 in x 56 in, any approach (604.3.1)"
    marker: none
    align: left
    at: { x: 508, y: 90 }
    size: { w: 520, h: 18 }
  - id: m3
    label: "Side grab bar 42 in min (604.5.1)"
    marker: none
    align: left
    at: { x: 508, y: 118 }
    size: { w: 520, h: 18 }
  - id: m4
    label: "Rear grab bar 36 in min (604.5.2)"
    marker: none
    align: left
    at: { x: 508, y: 146 }
    size: { w: 520, h: 18 }
  - id: m5
    label: "Grab bars 33-36 in above the floor (609.4)"
    marker: none
    align: left
    at: { x: 508, y: 174 }
    size: { w: 520, h: 18 }
  - id: m6
    label: "Lavatory rim 34 in max, knee 27 in (606.3)"
    marker: none
    align: left
    at: { x: 508, y: 202 }
    size: { w: 520, h: 18 }
  - id: m7
    label: "Clear floor at the lavatory 30 in x 48 in (305.3)"
    marker: none
