title: エアコンの冷媒回路（四方弁で冷房と暖房が入れ替わる）
# **冷房と暖房で、室内機と室外機の役目が入れ替わる。入れ替えるのは弁ひとつ。**
# 圧縮機も膨張弁も熱交換器も、同じものが同じ場所にある。
#
# 冷房 —— 室内機が**蒸発器**（熱を吸う）、室外機が**凝縮器**（熱を出す）。
# 暖房 —— そっくり逆。四方弁のコイルに通電して、高圧の行き先を室内機へ向ける。
#
# **暖房中は、ときどき冷房している。** 室外機は蒸発器なので 0℃ を下回り、
# 外気の水分が霜になる。落とすには**四方弁を冷房側へ戻して**高温の冷媒を室外機へ送る
# ——室内の風が止まり、室外機から湯気が出るのはこのとき。
#
# 冷媒は冷蔵庫と別（R410A ＝ GWP 2,090、R32 ＝ 675）。
# **R600a（3）まで下げられないのは、必要な量が数 kg と桁違いだから。**
#
# **APF は定格の効率ではない**（JIS C 9612）。
# 1 年に要る冷暖房能力の総和 ÷ 期間消費電力量。
