# 編成図は **1 列に並べる**。折り返すと連結が逆走して見える。
# 上の菱形がパンタグラフ（M 車）、下の帯が設備。
# 左右の矢印が編成の向き —— 実物の編成表も必ず方向を書く。
#
# **4M6T は、動く車 4 両・動かない車 6 両。** 加速と勾配はこの比で決まり、
# 定員 1,468 名は座席と立席の合計（実物の編成表と同じ数え方）。
#
# **号車番号と向きが揃っていないと、ホームの乗車位置が作れない。**
# 編成が方向転換する路線では、同じ「1 号車」が日によって逆の端に来る ——
# だから図には**必ず向きを書く。**
