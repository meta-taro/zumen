# **The truck decides the aisle, and the aisle decides the building.**
#
# Aisle width is not a preference: head length + load length + 12 in to
# manoeuvre + 6 in of pallet overhang. Narrow it and you gain pallet positions
# per square foot —— and you pay for a more expensive truck.
#
# **日本語の見本 34（倉庫のロケーション）と対。** あちらは番地の付け方、
# こちらは寸法の決まり方。
#
# Building, racks and equipment are fictional.
