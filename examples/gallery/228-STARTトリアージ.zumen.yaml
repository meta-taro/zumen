title: START 法（一次トリアージ）
# **医療者でなくてもできるように作られている。**
# 見るのは**歩行・呼吸・循環・意識の 4 つだけ**で、1 人 30 秒〜1 分。
#
# **赤に行く道が 3 本ある** —— 呼吸数 10〜29 回/分の外、橈骨動脈が触れない
# （脈 120/分 以上）、簡単な指示に従えない。**どれか 1 つで赤。**
#
# **この場でしてよいのは 2 つだけ** —— 用手気道確保と、活動性出血の止血。
# 止まると、後ろの人が見てもらえなくなる。
#
# **4 区分は順番であって、見捨てることではない。** 状態は変わるので、何度もやり直す。
