title: ハブ・スイッチ・アクセスポイント（どこまで届くか）
# **同じ 4 台をつないで、A が B 宛てに 1 つ送る。** 違いはそこに全部出る。
#
# ## リピータハブ —— 全部へ出す
#
# レイヤ 1（物理層）の装置で、**受けたポート以外の全ポートへそのまま出す。**
# C も D も受け取ってから、自分宛てでないので捨てる。
# **衝突ドメインは 1 つ**なので、同時に送れるのは 1 台だけ（半二重・CSMA/CD）。
#
# ## スイッチングハブ —— 1 つのポートだけへ出す
#
# レイヤ 2（データリンク層）の装置で、**MAC アドレスの表を持っている。**
#
# 表は最初から埋まっているわけではない。**送られてきたフレームの送り元を見て覚える。**
# 宛先が分からないうちは全ポートへ出し（フラッディング）、
# 相手が返事をした時点で相手のポートも分かる。
#
# **衝突ドメインがポートごとに切れる**ので、全二重にできる ——
# 1 つの衝突ドメインに送信機と受信機が 1 つずつしかなければ、衝突は起こらない。
#
# ## アクセスポイント —— 媒体そのものを分けられない
#
# 電波は**共有の媒体**なので、届く範囲の全員に届く。
# AP を足しても衝突ドメインは切れない。だから半二重で、**送る前に毎回待つ**（CSMA/CA）。
#
# **有線と無線で構えが逆になるのは、無線に信頼できる衝突検出の手段が無いから。**
# 有線は「送りながら衝突を見つけて即やめる」、無線は「送る前に毎回待つ」。
#
# **隠れ端末** —— A から見える C と、A から見えない D が同時に送ると、
# キャリアセンスが効かない。802.11 は RTS/CTS でこれを避ける。
#
# 結線の色は見本 324、ラックと 1U は見本 235、PoE は見本 236。
