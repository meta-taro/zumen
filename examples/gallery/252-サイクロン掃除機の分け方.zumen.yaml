version: 1
kind: placement
arrows: true
title: サイクロン掃除機の分け方（遠心力は v² ÷ r）
# **接線から入れて、中心から抜く。** 壁ぎわを回る空気は外へ振られ、
# 中心は逆に上へ登る。重い粒ほど外へ行くので、
# 中心から抜く空気には軽い粒しか残らない。
#
# **遠心力は a ＝ v² ÷ r。** 同じ速さなら、**径を 1/10 にすると G は 10 倍。**
# 速さを 2 倍にすると 4 倍。接線速度 40m/s で、
# 径 200mm なら約 1,600G、径 20mm なら約 16,000G。
#
# **ところが細くすると、通せる空気が減る**（断面積は r² に比例）。
# だから**細いコーンを並列に何本も並べて**、本数で流量を取り戻す。
#
# 紙パック式とは詰まり方が違う —— 紙パックは溜まるほど目が詰まる。
# **ただし「フィルタが無い」のではない。分離の主役がフィルタではないだけ**で、
# モーターの前後には入っていて、手入れを怠れば吸う力は落ちる。
