# **マイソク —— 間取りと、法で決まった 22 項目を 1 枚に。**
#
# 賃貸の募集図面。不動産会社の店頭・ポータル・FAX で回る紙で、様式がほぼ決まっている。
#
# | | |
# |---|---|
# | 上 | 家賃の帯（賃料・管理費・敷金・礼金）。借りる人が最初に見る |
# | 中 | 間取り（帖数・略号 UB／CL／BL／冷）と設備の一覧 |
# | 下 | 物件概要 —— **表示規約が「必ず書け」と決めた項目** |
# | 最下 | 仲介する会社の帯。**ここだけ差し替えて、各社が同じ紙を配る**（だから「帯替え」と呼ぶ） |
#
# 物件概要の 22 項目は、不動産の表示に関する公正競争規約 施行規則の**別表 9**
# （中古賃貸マンション・貸家・中古賃貸アパート等）に並ぶ必要な表示事項。
# 徒歩の分数は**道路距離 80m につき 1 分、1 分未満は 1 分**（同規則 第 9 条）—— 600m は 7.5 分なので 8 分。
#
# 出どころ —— 不動産公正取引協議会「不動産の表示に関する公正競争規約・同施行規則」別表 9、第 9 条（9）。
# **物件・会社・免許番号・金額はすべて架空**（○○ は伏せ字。実在の会社の体裁をとらない）。
