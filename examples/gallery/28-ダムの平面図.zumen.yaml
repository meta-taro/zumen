version: 1
kind: placement
title: 重力式コンクリートダム 平面図（堤高 55m・堤頂長 200m）
# **ダムの平面図で主役なのは、水をためる所ではなく「流す所」。**
# 洪水吐（こうずいばき）は、**設計を超える水が来たときに逃がす口。**
# ここが詰まると、水は堤体を越えてダムそのものを壊す。
#
# ## 減勢工は、落ちた水の力を殺す
#
# 55m 落ちた水はそのままでは川底を掘る。
# **勢いを殺す場所を下流側に作る**のは、ダムを守るためでもある。
#
# ## 取水塔は、深さを選ぶため
#
# 貯水池は深さで水温も濁りも違う。
# **どの高さから取るかを選べる**ようにしてあるので、塔の形になっている。
# 1 px = 500 mm
