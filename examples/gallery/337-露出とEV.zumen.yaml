version: 1
kind: placement
arrows: true
title: 露出（同じ明るさに、何通りもある）
# **明るさを決めているのは、絞りとシャッターの組み合わせではなく、その和。**
#
# ## 1 段とは
#
# **F 値が √2 倍になるか、露光時間が半分になると、届く光の量が半分になる。**
# そのとき **EV が 1 大きくなる。**
#
# F 値の系列が 1.4・2・2.8・4・5.6・8・11・16 と並んでいるのは、
# **1 つ進むごとに √2 倍**になるから。
# シャッター速度が 1/30・1/60・1/125 …と並ぶのは、**1 つ進むごとに半分**になるから。
# **どちらも「1 段」で同じ量**なので、片方を 1 段動かしたらもう片方を逆に 1 段動かせば、
# 明るさは変わらない。
#
# ## 相反則
#
# **F2.8 と 1/500、F4 と 1/250、F5.6 と 1/125 —— どれも 12EV。**
# 表の中で、**同じ EV の組み合わせは斜めに並ぶ。**
#
# **EV ＝ AV ＋ TV**（AV は絞り値、TV は露光時間の段数）。
# **EV 0 は「F1・1 秒」**と決めてある。
#
# ## 同じ EV でも、写るものは同じではない
#
# **絞り値が大きいほど被写界深度は深く**、**シャッター速度が遅いほどブレは大きい。**
# 明るさが同じでも絵は変わるので、**どの組み合わせを選ぶかが撮り方**になる。
#
# ## 表の数は、計算で確かめた
#
# **AV ＝ 2 log2 F**、**TV ＝ log2（1／t）**。
# F 値 8 つと速度 8 つを実際に計算すると、**どれも整数から 0.1 以内**に収まる
# （F1.4 は 0.97、1/60 は 5.91、1/15 は 3.91 —— 系列の数字が丸めてあるため）。
# 出典の例（F2.8–1/500・F4–1/250・F5.6–1/125）も、3 つとも 12 になる。
#
# 光の側の図は見本 264（配光曲線）、レンズの作図は見本 191。
