<g data-name="r1"><text x="150" y="843" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">報告の経路は 2 本あります（①）。ふだんは 現場 → 市町村 → 都道府県 → 消防庁 ですが、</text></g>
<g data-name="r2"><text x="150" y="867" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">直接即報基準に当たるものは、県と国へ同時に出します。 中継を待つと、そのぶん遅れるからです。</text></g>
<g data-name="r3"><text x="150" y="891" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">第一報は覚知から 30 分以内が目安。 分かっていることだけ出し、あとは続報で足します。</text></g>
<g data-name="r4"><text x="150" y="915" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">「まとまってから」にすると、いつまでも出せません。 早く粗く出して、直していくほうが速い。</text></g>
<g data-name="r5"><text x="150" y="939" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">指揮は 1 本（②）。1 人が 2 か所から指示を受けると、どちらを先にするかを現場が決めることになります。</text></g>
<g data-name="r6"><text x="150" y="963" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">情報は 1 か所。ばらばらに持っていると、同じ現場へ 2 隊出します。重複は、足りないのと同じだけ害になります。</text></g>
<g data-name="r7"><text x="150" y="987" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">編成は自治体ごとに違います。 図にできるのは「1 本と 1 か所」という形だけで、班の名前は各自治体の計画を見ます。</text></g>
<g data-name="shi"><text x="290" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">市町村</text><text x="290" y="389" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">災害対策本部</text></g>
<g data-name="ken"><text x="290" y="495" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">都道府県</text><text x="290" y="509" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">災害対策本部</text></g>
<g data-name="t1"><text x="150" y="214" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">① ふだんは県へ。大きいものは国へも同時に</text></g>
<g data-name="genba"><text x="290" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">現場（消防・住民・施設）</text></g>
<g data-name="kuni"><text x="290" y="616" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">消防庁</text></g>
<g data-name="n1"><text x="150" y="669" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">直接即報基準に当たるものは、県と国へ同時に出す。</text></g>
<g data-name="n2"><text x="150" y="691" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">中継を待つと、そのぶん遅れるため。</text></g>
<g data-name="n3"><text x="150" y="719" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">第一報は、覚知から 30 分以内が目安。</text></g>
<g data-name="n4"><text x="150" y="741" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">分かっていることだけ出し、あとは続報で足す。</text></g>
<g data-name="n5"><text x="150" y="763" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">「まとまってから」にすると、いつまでも出せない。</text></g>
<g data-name="t2"><text x="760" y="214" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">② 指揮は 1 本、情報は 1 か所（編成は自治体ごと。これは例）</text></g>
<g data-name="cho"><text x="1000" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">本部長（市町村長）</text></g>
<g data-name="m1"><text x="760" y="483" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">1 人が 2 か所から指示を受けない（指揮 1 本）。</text></g>
<g data-name="m2"><text x="760" y="505" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">受けると、どちらを先にするかを現場が決めることになる。</text></g>
<g data-name="m4"><text x="760" y="549" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">情報は情報班にすべて集める（情報 1 か所）。</text></g>
<g data-name="m5"><text x="760" y="571" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">ばらばらに持っていると、同じ現場へ 2 隊出す。</text></g>
<g data-name="m7"><text x="760" y="615" text-anchor="start" font-family="sans-serif" font-size="12" fill="#1c1c22">決めるのは本部長 1 人。 班は案を出して、実行する。</text></g>
<g data-name="fuku"><text x="1000" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">副本部長</text></g>
<g data-name="b0"><text x="799" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">総務班</text></g>
<g data-name="b1"><text x="879" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">情報班</text></g>
<g data-name="b2"><text x="959" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">避難班</text></g>
<g data-name="b3"><text x="1039" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">救護班</text></g>
<g data-name="b4"><text x="1119" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">物資班</text></g>
<g data-name="b5"><text x="1199" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c1c22">施設班</text></g>

