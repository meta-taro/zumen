# **家の形は、敷地の形ではなく「斜めの線」で決まる。**
#
# 道路斜線の起点は、**自分の敷地ではなく「道路の反対側の境界」**。
# 北側斜線は、**北隣の日当たりを守る** —— 街で見る「北側だけ斜めに切った屋根」はこれ。
# 隣地斜線は 20m（住居系）まではまっすぐ立てられる。
#
# 低層住居専用と田園住居には隣地斜線が無く、代わりに**絶対高さ 10 か 12m**で頭を押さえる。
