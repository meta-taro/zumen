title: ドラム式洗濯機の構造（1G 未満と 335G を切り替える）
# **同じドラムで、1G 未満と 335G を切り替えている。**
#
# **洗いは 1G を超えてはいけない。** 超えると衣類が壁に貼りつき、
# 落ちて叩きつける動き（たたき洗い）が消える。ドラム径 600mm なら **55rpm が境**。
# **脱水の 1,000rpm は 335G** —— 水が布から 335 倍の重さで引き剥がされる。
#
# だから**1kg の偏りが、335kgf の回る力**になる。
# ドラムは機械に固定できない —— **ばねで吊り、ダンパで受け、おもりで重くする。**
# ドラム式が重いのはこのため（洗濯乾燥機の平均は 77.7kg ／ 縦型 50.2kg）。
#
# **脱水前にいつまでも回っているのは、偏りを測り直している。**
# 収まらないときに「偏り」と出して止まる。
#
# **ヒートポンプ乾燥は、空気を外へ出さない。**
# 冷やして水を落とし、温め直して回す。外へ捨てるのは水だけ。
