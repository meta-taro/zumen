title: 歯車のかみ合い（決めているのは直径ではなく、モジュール）
# **歯の大きさを決めるのはモジュール m で、直径ではない。** 直径はその結果。
#
# ## 寸法は、モジュールと歯数だけで出る
#
# **基準円直径 d ＝ m × z**、**歯先円直径 da ＝ m（z ＋ 2）**、
# **歯底円直径 df ＝ m（z − 2.5）**、そして**中心距離 a ＝ m（z1 ＋ z2）／ 2。**
#
# この図は m ＝ 3、z ＝ 20 と 30。
# d は 60mm と 90mm、da は 66mm と 96mm、df は 52.5mm と 82.5mm、**a は 75mm。**
#
# **軸の位置は、歯車を選んだ時点で決まっている。**
#
# ## かみ合う条件は 2 つだけ
#
# **モジュールが同じ**で、**圧力角が同じ**（20 度）。
# 歯数が違っても、直径が違っても、この 2 つが揃えばかみ合う。
# 逆に、**どちらかが違えば、どんなに寸法を合わせてもかみ合わない。**
#
# ## 回転比は歯数だけで読める
#
# 歯数の比と基準円直径の比は等しいので、**回転比は歯数の比の逆数。**
# 20 と 30 なら **1.5 : 1** —— 小さいほうが 1.5 回まわる間に、大きいほうが 1 回。
#
# **歯形は模式**（インボリュート曲線は描いていない）。
# 破線が基準円で、**2 つの基準円が接する所がかみ合い点。**
#
# はめあいは見本 243、ねじや継手の側は見本 180。
