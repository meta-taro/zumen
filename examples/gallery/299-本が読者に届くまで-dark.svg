<g data-name="net"><text x="104" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">ネット書店</text><text x="104" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">直取引が増えている</text></g>
<g data-name="dokusha"><text x="131" y="472" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">読者</text><text x="131" y="490" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">定価で買う</text></g>
<g data-name="henpin"><text x="343" y="478" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">返品</text><text x="343" y="496" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">取次を通って出版社へ戻る</text></g>

</svg>