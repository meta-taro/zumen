<g data-name="toritsugi"><text x="311" y="208" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f4f4f6">取次</text><text x="311" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0ab">問屋であり、金融でもある</text></g>
