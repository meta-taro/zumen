version: 1
kind: placement
arrows: true
title: 革靴の型紙（木型からの展開・架空の設計）
# **立体をそのまま平面に写す。** 木型にテープを貼り、センター線を引き、
# 切り替えの線をテープの上に描いて、剥がして紙に貼る —— それが型紙の原型。
#
# 出来上がり線の**外側**に、縫い代・折り込み代・**吊り込み代**を足す。
# 吊り込み代は底へ巻き込む分で、いちばん大きく取る（足りないと木型に吊り込めない）。
#
# **1 回では決まらない。** 平面へ落とす → 木型に被せる → 直す、を繰り返す。
# 寸法（縫い代 8・折り込み代 4・吊り込み代 15mm）は、この図の設計。
