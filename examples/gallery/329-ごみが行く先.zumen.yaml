# **焼却は「消す」工程ではない。かさを減らす工程。**
# 残った灰は最終処分場へ行く —— **この図に「消える」という行き先は 1 つも無い。**
#
# ## 誰が処理するかは、法律で分かれている
#
# 廃棄物処理法がいう廃棄物は、
# **ごみ、粗大ごみ、燃え殻、汚泥、ふん尿、廃油、廃酸、廃アルカリ、動物の死体その他の汚物又は不要物。**
#
# そのうち**産業廃棄物**は「**事業活動に伴って生じた廃棄物のうち、
# 燃え殻、汚泥、廃油、廃酸、廃アルカリ、廃プラスチック類その他政令で定める廃棄物**」で、
# **出した事業者が自分で処理する責任を負う。**
# それ以外が**一般廃棄物**で、家庭から出るものは**市町村が集めて処理する。**
# 事業所から出ても産業廃棄物に当たらないもの（オフィスの紙くずなど）は**事業系一般廃棄物**で、
# これも出した事業者が処理の責任を負う（廃棄物処理法 3 条）。
#
# **同じ紙くずでも、オフィスから出れば事業系一般廃棄物、製紙・印刷・建設工事など
# 政令で決めた業種から出れば産業廃棄物**になる（同法施行令 2 条 1 号）——
# 物の種類だけでなく、**どの事業から出たか**で分かれている。
#
# ## 一連の取り扱い
#
# 法が目的（1 条）に並べているのは**分別・保管・収集・運搬・再生・処分**。
# **再生（資源化）が、処分と並んで最初から入っている。**
# 焼却は条文の並びには無く、処分（中間処理）の 1 つとして行われる。
#
# ## 日本は焼却の国
#
# 市町村のごみ焼却施設は **1,004 か所**（令和 5 年度）。
# そのうち**発電設備を持つのは 411 か所（40.9%）。**
# 出典：環境省「一般廃棄物の排出及び処理状況等（令和 5 年度）について」
# https://www.env.go.jp/recycle/waste_tech/ippan/r5/data/env_press.pdf （2026-10-02 照合）。
# 一連の取り扱いは廃棄物処理法 1 条、廃棄物の定義・産業廃棄物の範囲は同 2 条、処理の責任は同 3 条・6 条の 2・11 条
# （e-Gov 法令検索の本文で照合、2026-10-04）。
# 焼却灰・飛灰の一部はセメント原料化・溶融スラグ化で資源化される（同資料の資源化量の内訳）。
#
# 下水の側は見本 321、水道は見本 306、食品のたどり方は見本 277。
