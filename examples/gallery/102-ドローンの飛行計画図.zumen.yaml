title: ドローン飛行計画図（太陽光発電所の点検・特定飛行に当たらない＝カテゴリー I）
# 1 px = 300 mm。**飛ばす範囲と、人を入れない範囲の図。**
#
# ## まず「特定飛行」かどうか、次に「立入管理措置」
#
# 航空法のカテゴリーは、機体の性能ではなく飛ばし方で決まる。
# 特定飛行（150m 以上・空港周辺・DID の空域、夜間・目視外・30m 未満・催し・危険物・投下の方法）に
# 当たらなければカテゴリー I で、許可・承認は要らない。この点検は 60m・DID 外・日中・目視内・
# 30m 以上なので**カテゴリー I**。特定飛行になったとき、飛行経路の下に
# **人が入らないようにできているか（立入管理措置）**で II と III が分かれる。
# ロープ・看板・入口の補助者は、ここでは義務ではないが自主的に取っている。
# 出典：国土交通省「無人航空機の飛行許可・承認手続」https://www.mlit.go.jp/koku/koku_fr10_000042.html
# ／ DID からの工業専用地域の除外は国土交通省告示第 435 号（2026-07-01 適用）（取得 2026-10-02）。
#
# ## 30m は第三者からの距離
#
# **第三者と、第三者の物件**から 30m。関係者は第三者ではない。
# この図では公道側に 30m の帯を取って、そこへは入れない。
#
# ## 降ろす場所を 2 つ持つ
#
# 離発着点と**緊急着陸地点**は別に取る。帰れなくなったときに降ろす場所がいる。
#
# 場所は架空。**法令は改正されるので、飛ばす前に必ず最新を確認すること。**
