version: 1
kind: placement
arrows: false
north: up
scale: { mm: 50 }
title: 避難所レイアウト（体育館 30 × 20m・48 名・スフィア基準）
# 1 px = 50 mm。**面積と間隔が図の中身**なので、縮尺を持たせてある。
#
# ## 「入れる人数」ではなく「居られる人数」
#
# スフィア基準は 1 人あたり **3.5 m² 以上**。詰めれば倍は入るが、
# **詰めた避難所では健康被害が出る**（内閣府の運営ガイドラインが参照している国際基準）。
#
# ## 動線を分ける
#
# 受付・検温 → 一般スペース／発熱者ゾーン。
# **発熱者と濃厚接触者は、通路も階段も分ける。**
# 一般スペースを通らせない位置に置くこと。
#
# ## 数の根拠
#
# トイレは **20 人に 1 基、男女比 1 : 3**。水は **1 人 1 日 15 L**、
# 蛇口 1 つにつき 250 人まで。通路は **1〜2m 以上**。
#
# 施設名は架空。
