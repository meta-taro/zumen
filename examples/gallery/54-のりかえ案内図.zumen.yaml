title: 架空電鉄 本線 のりかえ案内（K01 港町 — K09 海浜公園）
# 1 本の路線をまっすぐ伸ばして、駅・駅ナンバリング・のりかえを 1 枚に並べた図。
# 駅名は縦組み（write: down）—— 駅の間隔を詰めても隣の名前とぶつからない。
# ふりがなは右の列、字を 1 つずつ積む。ラテン文字を書けば寝る。
#
# 色は路線の名前そのもの（DESIGN.md §7 の例外・src/palette.ts）。
# 色だけに頼らせない —— 駅ナンバリングの K と、のりかえの線名が文字で出ている。
