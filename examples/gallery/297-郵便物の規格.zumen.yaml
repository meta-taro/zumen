version: 1
kind: placement
arrows: true
scale: { mm: 1.5 }
title: 郵便物の規格（「定形」は封筒の名前ではなく、4 つの条件の呼び名）
# **定形郵便物は、4 つの条件を全部満たしたもの。**
# **長辺 14〜23.5cm・短辺 9〜12cm・厚さ 1cm 以下・重さ 50g 以下**で **110 円**。
# **どれか 1 つでも外れたら定形外**になり、料金の表そのものが変わる。
#
# **下限は、はがきと共通の 14 × 9cm。**
# 定形のいちばん小さい大きさは、はがきのいちばん小さい大きさと同じ。
#
# **厚さ 1cm が、機械を通るかどうかの線。**
# 定形外は**規格内**（長辺 34cm・短辺 25cm・厚さ 1cm・重さ 1kg 以下。**140〜750 円**）と
# **規格外**（長辺 60cm・厚さ 3cm・重さ 4kg 以下。**260〜1,750 円**）に分かれ、
# **同じ重さでも厚さが 1cm を超えるだけで、高いほうの表に移る。**
#
# **はがきには下限の重さがある。**
# 長辺 14〜15.4cm・短辺 9〜10.7cm・**重さ 2〜6g** で **85 円** ——
# 2g より軽いと薄すぎて機械で扱えない。
# **上限だけでなく下限が書いてある**のは、郵便の規格では珍しい。
#
# 料金は 2024 年 10 月の改定後の額。
