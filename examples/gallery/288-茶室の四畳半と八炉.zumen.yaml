scale: { mm: 5 }
title: 茶室の四畳半と八炉（畳が部屋を決める）
# **四畳半は 9 尺 4 寸 5 分（約 2,865mm）の正方形。**
# 畳 4 枚が半畳を囲んで風車に回る形で、これ以上でも以下でもない。
# 畳 1 枚は**京間で 6 尺 3 寸 × 3 尺 1 寸 5 分**（約 1,910 × 955mm）。
#
# **畳が部屋を決める。** 柱間を 6 尺 5 寸と定め、柱を 4 寸とすると、
# 2 間（12 尺 6 寸）に 2 枚敷ける畳の長辺が **6 尺 3 寸**になる ——
# 部屋の大きさから畳を割り付けるのではなく、**畳の寸法が先にある。**
#
# **畳の名前は、場所ではなく役目。**
# 点前畳（道具畳）・貴人畳・客畳・炉畳・踏込畳・通い畳 ——
# 同じ 1 枚が、点前畳であり炉畳でもある。**誰が何をするかで呼び分ける。**
#
# **炉をどこへ切るかで、点前が変わる。**
# 点前畳の中に切るのが**入炉**（向切・隅炉）、外に切るのが**出炉**（四畳半切・台目切）。
# これに**本勝手**（客が亭主の右手側）と**逆勝手**（左手側）があり、
# 4 通り × 2 で**八炉の法**という。
#
# **逆勝手は、同じ点前の鏡写しではない。** 湯を汲む手・体の向き・道具の置き場所が
# 炉との位置関係で決まるので、左右が入れ替わると**手順そのものが変わる。**
#
# **炉は 1 尺 4 寸角**（約 424mm）、炉縁の高さは 2 寸 2 分（約 67mm）。
# にじり口は幅 2 尺〜2 尺 1 寸、高さ 2 尺 2 寸〜2 尺 3 寸 ——
# 刀を差したままでは入れない大きさで、**くぐるために頭を下げる。**
