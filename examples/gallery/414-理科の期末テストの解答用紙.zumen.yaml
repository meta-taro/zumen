# **理科の解答用紙は、点で打つグラフと、記号で書く回路図がある。** どちらも線そのものが答え。
#
# 決まり（取得 2026-11-05）——
# グラフ：横軸に変化させた量、縦軸に変化した量、見出しと単位。測定値は ●、折れ線にせず近くを通る直線（宮城県）。
# 単位は〔 〕（神奈川県）。回路図：電流計は直列、電圧計は並列（神奈川県の正しい選択肢と同じつなぎ方）。
# グラフの直線は I ＝ 0.1 V。原点 (0, 0) と (6 V, 0.6 A) を通る。測定値はどれも直線から 0.01 A 以内。
