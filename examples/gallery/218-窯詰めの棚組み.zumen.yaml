title: 窯詰めの棚組みと、素焼き・本焼きの詰め方
scale: { mm: 1 }
# **棚板 1 枚に支柱 3 本。** 3 点はかならず 1 つの平面に乗る（4 点は乗らないことがある）。
# 支柱は上下で同じ位置に通す —— 1 本の柱のように見えるのが正しい。
#
# **素焼きと本焼きでは、詰め方が逆。** 違いは釉薬 1 つで、
# **溶けた釉薬は接着剤になる** —— 触れた所でくっつき、棚板に垂れれば取れない。
