version: 1
kind: placement
arrows: true
title: ダーツボードの割り付け（WDF の寸法）
scale: { mm: 1 }
# **数字はでたらめに並んでいない。**
#
# 時計回りに 20・1・18・4・13・6・10・15・2・17・3・19・7・16・8・11・14・9・12・5。
# **高い数字のとなりは、低い数字**になっている —— 20 の両どなりは 1 と 5、
# 19 の両どなりは 3 と 7。**狙って外すと損をするように並べてある。**
#
# 環は 2 つだけ。**内側がトリプル（3 倍）、外側がダブル（2 倍）**で、
# 幅はどちらも内のり 8 mm。真ん中は外ブル 25 と内ブル 50。
#
# だから 1 投の最高は **トリプル 20 ＝ 60**、3 本で **180**、
# 1 回で上がれる最高は **170**（トリプル 20・トリプル 20・内ブル）。
#
# 1 px ＝ 1 mm。寸法は WDF の規則（盤 451 mm、中心からダブルの外まで 170 mm、
# トリプルの内まで 107 mm、内ブル 12.7 mm、外ブル 31.75 mm）。
