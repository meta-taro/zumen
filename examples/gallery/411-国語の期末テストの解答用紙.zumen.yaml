title: 国語の期末テストの解答用紙（縦書きで、右から左へ。記述は原稿用紙のマス目）
sources:
  - name: "Z会作文クラブ「原稿用紙の使い方」（段落は 1 マス下げる・句読点は 1 マスに 1 つで右上・行頭に書かず最後のマスに一緒か欄外・小さい字も 1 マス・会話の終わりの。と」は 1 マスに一緒）"
    url: https://service.zkai.co.jp/el/course/sakubun_club/sakubun-kakikata/genkouyoushi.html
    retrieved: 2026-11-05
  - name: "ベネッセ教育情報「作文の書き方のコツは？原稿用紙の使い方のルール」（会話文は行を変えて書くことが多い・書き方は教科書によって違うので学校の指導に従う）"
    url: https://benesse.jp/kyouiku/202303/20230331-1.html
    retrieved: 2026-11-05
# **国語の解答用紙は、縦書きで右から左へ進む。** ほかの 4 教科と逆向き。
#
# 決まり（Z会・ベネッセ、取得 2026-11-05）——
# 段落の書き出しは 1 マスあける。句読点は 1 マスに 1 つ、マスの右上。行頭には書かない（行末なら最後のマスに一緒か欄外）。
# 小さい「っ」も 1 マス。会話は行を変えて「」で、終わりの。と」は 1 マスに一緒。
# 用紙は架空。どの学校・出版社の様式の写しでもない。記述の例文も、この図のために書いたもの。
