title: 滑走路の番号とマーキング（番号は方位そのもの）
sources:
  - name: "国土交通省航空局「陸上空港の施設の設置基準と解説」（令和 6 年 4 月一部改正）3.12.3・3.12.4"
    url: "https://www.mlit.go.jp/koku/content/001736131.pdf"
    retrieved: 2026-10-02
# **滑走路の番号は名前ではなく、方位である。**
# **磁北から右回りに測った方位角を 1／10 した数（四捨五入）** —— 01 から 36 まで。
#
# ## 両端で 18 違う
#
# 同じ 1 本の滑走路を逆から使えば、方位は 180 度違う。
# だから**番号は必ず 18 違い**、「**16/34**」のように両方を書く。
# この図の滑走路は磁方位 160 度なので、こちらから進入すれば **16**、
# 反対からなら 340 度で **34**。
#
# ## 平行滑走路は L・C・R
#
# 同じ方位の滑走路が並ぶときは、**進入の向きから見て左から
# L（Left）・C（Center）・R（Right）** を付ける。
#
# ## 番号は永久ではない
#
# **磁北は動く。** 方位がずれれば番号も変わるので、**塗り替える。**
# 地図の記号と違い、**地面に書いてある数字のほうが動く。**
#
# ## 標識（名前は航空局の設置基準のもの）
#
# 滑走路進入端標識（滑走路の向きに沿った縦縞の束。本数は幅で決まり、30m なら 8 本）・
# 指示標識（滑走路番号）・滑走路中心線標識・目標点標識（進入端から 150m 以上）。
# **過走帯標識は黄色の山形模様**（山の先は滑走路を向く）、
# **移設滑走路進入端標識（ずらした進入端）は中心線上の矢印**で示す。
# 接地帯標識（進入端から 150〜922.5m の縦縞）はこの図では省いた。
#
# 出典：国土交通省航空局「陸上空港の施設の設置基準と解説」（令和 6 年 4 月一部改正）
# 3.12.3 滑走路標識・3.12.4 過走帯標識 https://www.mlit.go.jp/koku/content/001736131.pdf
# （取得 2026-10-02）。指示標識の数字は方位の 1／10 を四捨五入し、1 桁なら頭に 0 を付ける。
#
# 長さの比は模式。 道路の平面線形は見本 61、地図記号は見本 165。
