title: 舞台転換図（3 場面・小劇場／架空）
# **仕込図は「1 つの絵」だが、転換図は「絵と絵のあいだ」を描く。**
#
# 舞台の平面図は場面の数だけ要る。要るのはそれだけではなく、
# **場面と場面のあいだに何が起きるか** —— 誰が、何を、どこから、どこへ、何秒で。
# それが無いと、図はきれいでも本番で動けない。
#
# ## 向き
#
# **図は客席から見た向き。** 下が舞台前端（プロセ）、上がホリゾント。
# **上手（かみて）は客席から見て右、下手（しもて）は左。**
#
# ## 尺貫法
#
# 舞台の寸法は尺貫法で言う。建築の部材がその寸法で作られているため。
#
# | | |
# |---|---|
# | 1 間 | 6 尺 ＝ 1,818 mm |
# | 1 尺 | 10 寸 ＝ 303 mm |
# | 1 寸 | 30.3 mm |
#
# **平台はサブロク**（3 尺 × 6 尺 ＝ 909 × 1,818）、**厚さ 4 寸**。
# 箱馬を **3 寸に置けば高さ 7 寸**、**1 尺に置けば 1 尺 4 寸** ——
# 平台の 4 寸が足されるので、ひな段の段差はこの組み合わせで決まる。
#
# ## 秒がいちばん硬い
#
# **暗転の尺は先に決まっている**（そこで流す音楽やアナウンスの長さ）。
# 人と道具は増やせるが、秒は増やせない。**入らない段取りは、場面の側を変える。**
#
# 1 px ＝ 70 mm。寸法・演目・段取りはすべて架空。
