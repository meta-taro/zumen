# **数学の解答用紙は、答えだけの欄と、求め方を書く欄が分かれている。** 作図とグラフは、線そのものが答え。
#
# 決まり（取得 2026-11-05）——
# 根号の中は最も小さい自然数、分数は約分、円周率は π（神奈川県）。作図に使った線は消さない（青森県）。
# （解）（作図）（説明）（証明）の欄には求め方を書く（福井県）。単位は欄に刷る（長野県・三重県の解答用紙）。
# 証明の欄は 8〜10 行書ける高さにした（三重県は用紙の右半分の大半。2026-11-10）。
# 作図：A・B を中心に同じ半径（AB の半分より長い）で弧をかき、2 つの交点 P・Q を結ぶ。弧は交点を通る。
# グラフ：y = (1/2)x + 1。(0, 1) と (2, 2) の格子点を通る。
