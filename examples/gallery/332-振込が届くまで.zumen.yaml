title: 振込が届くまで（1 億円で、道が分かれる）
# **お金と通知は、同じ速さでは動かない。** しかも**1 億円を境に、どちらが先かが入れ替わる。**
#
# ## 1 億円未満 —— 通知が先、お金はあと
#
# 全銀システムは 1 件ずつ資金を動かさず、**その日の分をネッティング（相殺）して差額だけ**を
# 日本銀行へ通知する。**為替通知のほうは先に被仕向銀行へ届く**ので、
# 受取人の口座にはすぐ入る。
# **銀行どうしの資金決済は、その日の午後 4 時 15 分**に、
# 全銀ネットの当座預金口座と加盟金融機関の当座預金口座の間で行われる。
#
# ## 1 億円以上 —— お金が先、通知はあと（給与・賞与の振込を除く）
#
# **1 件ずつ資金決済してから、被仕向銀行へ為替通知を送る。**
# 決済は**流動性節約機能付 RTGS（即時グロス決済）。**
# 大きい金額では、通知だけ先に流して差額決済を待つ形を取らない。
#
# ## 動いている時間
#
# **コアタイムは平日の午前 8 時 30 分〜午後 3 時 30 分。**
# 平日夜間と土日祝日は**モアタイムシステム**が受け持つ（参加は銀行ごとの任意）。
# 2018 年の稼動時に参加したのは **504 行。**
#
# ## 止まると何が起きるか
#
# 2023 年 10 月 10・11 日の障害では、影響を受けた銀行から送る振込が**約 255 万件**
# （10 日 150 万件・11 日 105 万件）あり、うち約 87 万件はその日のうちに処理できなかった。
# **1 か所で全部の銀行がつながっている**ということは、そういうことでもある。
#
# 全銀センターは**東京と大阪の 2 か所**にあり、各センターのコンピュータはマルチホスト構成。
#
# 出典：全銀ネット「2025 年 全銀ネットに関する情報開示」
# https://www.zengin-net.jp/company/pdf/fmidisclosure.pdf ／
# 同「システム障害に係る対応状況について」別紙（2023 年 10 月 18 日）
# https://www.zengin-net.jp/announcement/pdf/announcement_20231018_2_besshi.pdf （2026-10-02 照合）。
#
# 硬貨そのものは見本 300、紙幣の識別マークは見本 199。
