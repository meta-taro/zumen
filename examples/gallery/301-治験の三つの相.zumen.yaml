title: 治験の三つの相（人数ではなく、「誰に試すか」で分かれている）
# **治験の相は、人数で分かれているのではない。**
# **誰に試すか**で分かれていて、その順番に意味がある。
#
# **第 I 相 —— 自由意思に基づき志願した健常成人。**
# 病気の人ではなく、**健康な人**に試す。見るのは効くかどうかではなく、
# **薬物動態**（体の中でどう動き、どう消えるか）と**安全性**。
# 効き目を確かめる段ではないので、患者に負担をかける理由が無い。
#
# **第 II 相 —— 比較的軽度な、少数例の患者。**
# ここで初めて患者に試す。有効性・安全性・薬物動態の検討 ——
# **軽い人から始める**のは、効かなかったときの損が小さいから。
#
# **第 III 相 —— 上市後に実際にその化合物を使うであろう患者。**
# **数百例以上の規模**になることもあり、**多施設共同**で行う。
# ここで初めて「効く」ことを**検証**する（それまでは検討）。
#
# **検討と検証は、違う言葉として使い分けられている。**
# 第 I 相・第 II 相は「検討」、第 III 相が「検証」。
# **試す相手が実際の使い手に近づくほど、言葉が強くなる。**
#
# **人数は結果であって、条件ではない。**
# 「実際に使う患者」を集めれば数百例になるだけで、
# **先に人数を決めて相を分けているのではない。**
