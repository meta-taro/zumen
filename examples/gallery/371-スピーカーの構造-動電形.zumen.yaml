  - id: t1
    label: "磁束の道：磁石の上（N）→ トッププレート → ギャップを横切って → ポール → バックプレート → 磁石の下（S）。"
    marker: none
    align: left
    at: { x: 60, y: 716 }
    size: { w: 900, h: 18 }
  - id: t2
    label: "ギャップの中で磁束は外から中心へ向く。そこを流れる電流は円周の向き。力はその両方に直角で、軸の向き（前後）になる。"
    marker: none
    align: left
    at: { x: 60, y: 742 }
    size: { w: 900, h: 18 }
  - id: t3
