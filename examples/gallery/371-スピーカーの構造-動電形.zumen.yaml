version: 1
kind: placement
arrows: true
title: スピーカーの構造（動電形 —— 磁石とコイルとコーン）
sources:
  - name: "JIS C 5532:2014 音響システム用スピーカ（附属書 C.1.1 動電（可動線輪）形スピーカ・28 設計データ）"
# **音は、コイルが磁石から受ける力で出ている。**
#
# いちばん多いスピーカーは動電形（ダイナミック）。JIS C 5532:2014 は
# 「静磁界中におかれた導体に流した電流によって生じる力で振動板を駆動するスピーカ」と定めている。
#
# ## 何のための図か
#
# 部品の名前と、**どれが動いてどれが止まっているか**、そして**どの向きに力がかかるか**を 1 枚で言う。
# 断面で描くのは、磁気回路が中にあって外からは見えないから。
#
# ## 描いたもの
#
# - ① 外形 30cm ほどの外磁形（リング状のフェライト磁石を鉄の板で挟む形）を、軸で切った断面。1px ＝ 0.4mm
# - ② ギャップの拡大。1px ＝ 0.1mm。コイルの線の断面に ⊗（電流が紙の奥へ）を描いた
# - 力の向き：B（ギャップの中で外から中心へ）と I（紙の奥へ）から、F ＝ I L × B は上（前）を向く。
#   磁石の上を N として描いた。逆に着磁すれば向きは逆になるが、「電流と力が比例する」ことは変わらない
#
# 寸法（コイル高 14mm・プレート厚 10mm・ギャップ 2mm など）は説明のための**例**で、特定の製品ではない。
# JIS C 5532:2014 の「設計データ」は、エアギャップの磁束密度・総磁束・ボイスコイルの巻数と長さ・
# ギャップの幅・ボイスコイルの最大振幅（Xp-p）を挙げる —— 図の部品はこの項目と対応している。
#
# ## 照らした決まり
#
# - 断面の模様：鉄（プレート・ポール）は斜線、磁石は点で分けた（材料が違う）
# - 部品の番号は右半分にだけ振った。左は同じ形（軸対称）
# - 部品名のうち「ダンパー」「ダストキャップ」「錦糸線」は業界の慣用名で、JIS C 5532:2014 の本文では確かめていない
#
# ## 描かなかったもの
#
# - 箱（エンクロージャ）—— JIS C 5532:2014 附属書 C.3 の別の話
# - ネオジム磁石の内磁形・ホーン（コンプレッションドライバー）—— 形が違う。1 枚に混ぜない
# - 周波数特性・インピーダンス —— 測る話で、構造の図ではない
#
# PA の配置は見本 101・370、マイクの指向性は見本 327、イコライザーは見本 372。
