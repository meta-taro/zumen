    label: "レ形・J 形は、片方の材だけを削ります（⑤）。どちらを削るかを言うために、矢を折って指します（4.6.3）。"
    marker: none
    align: left
    at: { x: 150, y: 1312 }
    size: { w: 1090, h: 18 }
  - id: r6
    label: "交点の丸は全周、交点の旗は現場（①）。図面に描き切れない施工の条件を、記号 1 つで運んでいます。"
    marker: none
    align: left
    at: { x: 150, y: 1336 }
    size: { w: 1090, h: 18 }
  - id: r7
    label: "尾は、規格や施工法を書く欄です。 記号で言えないことは、ここへ文字で書きます。"
    marker: none
    align: left
    at: { x: 150, y: 1360 }
    size: { w: 1090, h: 18 }
