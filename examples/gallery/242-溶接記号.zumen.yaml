version: 1
kind: placement
arrows: true
title: 溶接記号（JIS Z 3021:2016）
# **基線の上下が、どちらの面を溶接するかを言う。**
# 下が**矢の側**、上が**その反対側**。上下ともに書けば両側。
# だから記号は、**矢をどこへ当てたかと組でしか読めない。**
#
# 寸法は基本記号の**左が断面、右が長さ**。
# `a6　3×50（150）` なら、のど厚 6mm・個数 3・長さ 50・中心間隔 150。
#
# **のど厚 a と脚長 z は別の寸法**（3.16 / 3.17）。等脚なら a ＝ z ÷ √2 ≒ 0.7z。
# 「a6」と「z6」では大きさが 1.4 倍違う。
#
# レ形・J 形は片方の材だけを削るので、**矢を折って、削る材を指す**（4.6.3）。
# 矢と基線の交点の丸が全周溶接、旗が現場溶接。
