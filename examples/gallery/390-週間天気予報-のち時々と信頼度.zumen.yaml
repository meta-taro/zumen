  - id: n0
    label: 週間天気予報は、地点を縦、日を横に並べた表です。横に読めば 1 週間の移り変わり、縦に読めば同じ日の東西の差が分かります。
    marker: none
    align: left
    at: { x: 0, y: 664 }
    size: { w: 1100, h: 18 }
  - id: n1
    label: 1 つのマークで言えない日は、2 つで言います。斜めの線で分けたら「のち」（左から右へ変わる）、右下の小さいマークは「時々」です。
    marker: none
    align: left
    at: { x: 0, y: 686 }
    size: { w: 1100, h: 18 }
  - id: n2
    label: 雨や雪は、降る時間が短くても優先してマークに出します。傘が付いていたら、傘を持つかを考える日です。
    marker: none
    align: left
    at: { x: 0, y: 708 }
    size: { w: 1100, h: 18 }
  - id: n3
    label: 信頼度は 3 日目以降の「降るか降らないか」の当たりやすさです。C の日は、翌日の発表で変わりやすいので見直してください。
    marker: none
    align: left
    at: { x: 0, y: 730 }
    size: { w: 1100, h: 18 }
  - id: n4
    label: 1 日目に最低気温が無いのは、発表のときには朝の最低がもう過ぎているからです。
    marker: none
    align: left
    at: { x: 0, y: 752 }
    size: { w: 1100, h: 18 }
  - id: n5
    label: 地点の天気と気温は架空です。様式は気象庁の決まり（予報用語・信頼度・配色）に合わせ、テレビ局の様式は写していません。
    marker: none
    align: left
    at: { x: 0, y: 774 }
    size: { w: 1100, h: 18 }
