# **週間天気予報は、地点 × 日の表。** 横に読めば 1 週間の移り変わり、縦に読めば同じ日の東西の差。
#
# 1 マスに載るのは、天気マーク・降水確率（10% 単位）・最高気温・最低気温。
# **最高は赤、最低は青の札**にして、数字の色ではなく札の色で分ける（zumen は文字を染めない）。
#
# **マーク 1 つで言えない日は 2 つで言う。**
# - のち … 予報期間の前と後で天気が違う。左から右へ、斜めの線で分ける
# - 時々 … 途切れ途切れで、合計が期間の 1/2 未満。右下に小さく添える
# - 雨や雪は、短くても優先してマークに出す
#
# **信頼度（A・B・C）は 3 日目から。** 降水の有無の適中率 A 88%・B 73%・C 58%、
# 翌日の発表で変わる率 A 1%・B 6%・C 16%（気象庁）。1・2 日目は空欄。
#
# マークの色は気象庁の配色指針（天気分布予報の晴れ・くもり・雨）。
# 太陽は 16 角の星、雲は 3 つのこぶ、雨は傘 —— どれも閉じた辺（`hatch: solid` ＋ `hatch_color`）で描いた。
# 地点の天気と気温は架空。テレビ局・民間気象会社の様式（色・字体・ロゴ）は写していない。
palette:
  晴れ: "#ffaa00"
  くもり: "#aaaaaa"
  雨: "#0041ff"
  最高: "#ff2800"
  最低: "#0041ff"
