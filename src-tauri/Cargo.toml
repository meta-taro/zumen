[package]
name = "zumen"
version = "0.0.0"
description = "AI が描き、人が直し、また AI が理解できる構成図エディタ"
authors = ["meta-taro"]
license = "MIT"
repository = "https://github.com/meta-taro/zumen"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 開く・保存のダイアログ（Tauri 公式・MIT/Apache-2.0）。
# **姉妹アプリと同じものに揃える**（DESIGN.md / D12）。
tauri-plugin-dialog = "2"

[profile.release]
# 図を描くだけのアプリなので、大きさより素直さを採る。
codegen-units = 1
lto = true
strip = true
