name: oss-privacy-check

# OSS 公開リポの個人情報混入チェック
# 実名・個人メールが commit history に入ると、後から消すには history 書き換えと
# force push が要る＝実質不可逆。push / PR の時点で機械的に止める。

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
  # 全履歴を一度に検査する口（公開へ切り替える前に使う）。
  #
  # **push ごとの検査は、その push の範囲しか見ない。**
  # 初回 push は比較の基準が無く commit 検査がスキップされるので、
  # 最初のあたりが未検査のまま残りうる。
  #
  # ここを手で回せば、全履歴（メール・公開しない道・会話の印）をまとめて見られる。
  workflow_dispatch:
    inputs:
      full_history:
        description: 最初の commit から全部を検査する
        type: boolean
        default: true

# **追い越された run は止める。**
#
# 同じブランチへ続けて push すると、**古い commit の run が走り切る。**
# 見るのはいちばん新しい 1 本だけなのに、**緑が揃わないように見える**
# （2026-09-24。毎回すべての検査が緑になるのを待っていた）。
#
# `pages` は前からこうしてある（配るのは常に最新の 1 つなので）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commit 範囲を検査するため全履歴が要る
          fetch-depth: 0

      - name: 個人情報混入チェック
        # 禁止語（実名・社内の呼び名）は CI では見ない。一覧を secret で配らない方針（2026-10-01）。
        # 禁止語で止めるのは手元の pre-push（.githooks/pre-push と .private-deny-words）。ここはメールと道と印を見る。
        env:
          OSS_ALLOWED_AUTHOR_EMAIL_REGEX: ${{ vars.OSS_ALLOWED_AUTHOR_EMAIL_REGEX }}
          OSS_ALLOWED_EMAIL_DOMAINS: ${{ vars.OSS_ALLOWED_EMAIL_DOMAINS }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_history }}
        run: |
          if [ "$FULL" = "true" ]; then
            # 最初の commit を基準にして、全 commit の author と message を見る。
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -1)"
            HEAD_SHA=HEAD
            # **差分ではなく中身そのもの**も見る。
            # 差分検査は最初の commit の中身を含まないので、そこだけ素通りする。
            export OSS_SCAN_ALL_FILES=1
            echo "全履歴と、追跡中の全ファイルを検査します"
          fi
          bash .github/scripts/oss-privacy-check.sh "$BASE_SHA" "$HEAD_SHA"

      - name: 公開しないもの（開発の記録・会話・社内の呼び名）が入っていないか
        # 道（.claude/ など）と印（会話の記録）は一覧が要らないので、ここで必ず効く。禁止語は手元の pre-push が見る
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          range=""
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            # 初回 push：比べる先が無いので、全 commit のメッセージを見る
            range="$HEAD_SHA"
          fi
          bash .github/scripts/private-notes-check.sh "$HEAD_SHA" "$range"
