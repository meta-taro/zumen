  <h1>楽器・音響</h1>

    <li><a href="../../g/210/"><img src="../../gallery/210-%E6%A5%BD%E8%AD%9C%E3%81%AE%E5%AF%B8%E6%B3%95.svg" alt="楽譜の寸法（五線の間隔を単位にした符頭・符尾・連桁・調号）" loading="lazy"><span>楽譜（五線の間隔が、すべての寸法の単位）</span></a></li>
