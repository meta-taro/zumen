<!--
  zumen のアプリアイコン。

  **配色は人が決めた**（2026-09-07）。ダークグレーの地にワインレッド。
  形は「構成図そのもの」— 1 つから 2 つへ分かれる木で、
  **分かれた先の片方だけがワイン**。

  ワインを 1 点にだけ使うのは、図の中の作法（DESIGN.md §2.2
  「アクセントは説明の主役 1 点にだけ」）と同じ。

  16px まで縮めて読めることを確認して選んである。
  差し替えるときは、この SVG を直してから
  `pnpm icon` を走らせること（PNG を直接いじらない）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#23232b"/>
  <path d="M 256 176 L 256 256 M 160 256 L 352 256 M 160 256 L 160 320 M 352 256 L 352 320"
        fill="none" stroke="#d8d8e0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="176" y="80"  width="160" height="104" rx="20" fill="#d8d8e0"/>
  <rect x="88"  y="320" width="144" height="112" rx="20" fill="#d8d8e0"/>
  <rect x="280" y="320" width="144" height="112" rx="20" fill="#a32b48"/>
</svg>
